cstrong>Retroviruses (HIV):\u003c/strong> (+)ssRNA → Reverse transcriptase → dsDNA → integrase → integrates into host chromosome (provirus) → persists for life. Antiretroviral targets: reverse transcriptase (NRTIs, NNRTIs), protease (PIs), integrase (INSTIs), CCR5 (maraviroc), fusion (enfuvirtide).\u003c/div>\n        "},{"title":"Antiviral Drug Targets","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Target\u003c/th>\u003cth>Drugs\u003c/th>\u003cth>Virus\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Viral DNA polymerase\u003c/td>\u003ctd>Acyclovir, ganciclovir, foscarnet\u003c/td>\u003ctd>HSV, CMV (herpesviruses)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Reverse transcriptase\u003c/td>\u003ctd>Zidovudine (AZT), tenofovir (NRTIs); efavirenz (NNRTIs)\u003c/td>\u003ctd>HIV, HBV\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Protease\u003c/td>\u003ctd>Lopinavir, atazanavir, ritonavir (PIs)\u003c/td>\u003ctd>HIV, HCV\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Integrase\u003c/td>\u003ctd>Raltegravir, dolutegravir, bictegravir (INSTIs)\u003c/td>\u003ctd>HIV\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Neuraminidase\u003c/td>\u003ctd>Oseltamivir (Tamiflu), zanamivir\u003c/td>\u003ctd>Influenza A & B\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>RNA polymerase\u003c/td>\u003ctd>Remdesivir, sofosbuvir\u003c/td>\u003ctd>SARS-CoV-2, HCV\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>CCR5 co-receptor\u003c/td>\u003ctd>Maraviroc\u003c/td>\u003ctd>HIV (CCR5-tropic)\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box warning\">\u003cstrong>Acyclovir mechanism:\u003c/strong> Pro-drug activated by viral thymidine kinase (TK) in HSV-infected cells → acyclovir-MP → chain terminator for viral DNA polymerase. NOT activated in normal cells → selective toxicity. TK-deficient HSV mutants → acyclovir resistance.\u003c/div>\n        "}],"keyTerms":[{"term":"Capsid","def":"Protein coat surrounding viral genome; made of capsomers. Provides protection and facilitates cell entry."},{"term":"Tropism","def":"Specificity of a virus for particular host cells/tissues based on receptor-ligand interactions."},{"term":"Provirus","def":"Viral DNA integrated into host chromosome (HIV, retroviruses). Persists through cell division."},{"term":"Reverse transcriptase","def":"Enzyme converting RNA → DNA; unique to retroviruses (HIV). Key antiviral target."},{"term":"Neuraminidase","def":"Influenza surface enzyme cleaving sialic acid; allows virus release from infected cells. Inhibited by oseltamivir."}]},"fungi":{"tag":"Chapter 5 · Microbiology","title":"Fungi & Fungal Diseases","overview":"Fungi are eukaryotes — antifungal targets must differ from human cell targets. Ergosterol (not cholesterol) in fungal membranes is the main drug target.","sections":[{"title":"Fungal Cell Structure","content":"\n          \u003cp>Key differences from human cells that are exploited by antifungals:\u003c/p>\n          \u003cul>\n            \u003cli>\u003cstrong>Ergosterol\u003c/strong> in cell membrane (humans have cholesterol) → target of polyenes and azoles\u003c/li>\n            \u003cli>\u003cstrong>Chitin\u003c/strong> cell wall (humans lack cell walls) → target of echinocandins (inhibit β-glucan synthesis)\u003c/li>\n            \u003cli>Unique enzymes in folate pathway, etc.\u003c/li>\n          \u003c/ul>\n          \u003ch4>Morphological Forms\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Yeasts:\u003c/strong> Single-celled, oval, reproduce by budding (e.g., Candida, Cryptococcus)\u003c/li>\n            \u003cli>\u003cstrong>Molds (filamentous):\u003c/strong> Multicellular hyphae forming mycelium (e.g., Aspergillus, Rhizopus, dermatophytes)\u003c/li>\n            \u003cli>\u003cstrong>Dimorphic fungi:\u003c/strong> Mold at room temperature, yeast at body temperature (37°C). Mnemonic: \"Dimorphic fungi are MOLDs in the cold and YEAST in the bEAST (body).\" Examples: Histoplasma, Blastomyces, Coccidioides, Paracoccidioides, Sporothrix.\u003c/li>\n          \u003c/ul>\n        "},{"title":"Clinically Important Fungi","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Fungus\u003c/th>\u003cth>Type\u003c/th>\u003cth>Disease\u003c/th>\u003cth>Populations at Risk\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Candida albicans\u003c/td>\u003ctd>Yeast (dimorphic)\u003c/td>\u003ctd>Oral thrush, vaginal candidiasis, invasive candidiasis\u003c/td>\u003ctd>Immunocompromised, diabetics, broad-spectrum antibiotic users, IV catheter\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Aspergillus fumigatus\u003c/td>\u003ctd>Mold\u003c/td>\u003ctd>Invasive aspergillosis, allergic bronchopulmonary aspergillosis (ABPA)\u003c/td>\u003ctd>Neutropenic patients, transplant recipients\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Cryptococcus neoformans\u003c/td>\u003ctd>Yeast (encapsulated)\u003c/td>\u003ctd>Cryptococcal meningitis\u003c/td>\u003ctd>HIV/AIDS (CD4 \u003c 100), immunocompromised\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Pneumocystis jirovecii\u003c/td>\u003ctd>Yeast-like (not typical)\u003c/td>\u003ctd>PCP pneumonia (CD4 \u003c 200)\u003c/td>\u003ctd>HIV/AIDS — most common AIDS-defining illness\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Histoplasma capsulatum\u003c/td>\u003ctd>Dimorphic\u003c/td>\u003ctd>Histoplasmosis (flu-like to disseminated)\u003c/td>\u003ctd>Ohio/Mississippi River valleys; bat/bird droppings\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Dermatophytes\u003c/td>\u003ctd>Mold\u003c/td>\u003ctd>Tinea pedis (athlete's foot), tinea capitis, tinea corporis (ringworm)\u003c/td>\u003ctd>General population\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Mucor/Rhizopus\u003c/td>\u003ctd>Mold\u003c/td>\u003ctd>Mucormycosis (angioinvasive, often fatal)\u003c/td>\u003ctd>Diabetics (especially DKA), neutropenic, iron overload, deferoxamine use\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "},{"title":"Antifungal Drugs & Mechanisms","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Drug Class\u003c/th>\u003cth>Examples\u003c/th>\u003cth>Mechanism\u003c/th>\u003cth>Use\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Polyenes\u003c/td>\u003ctd>Amphotericin B, nystatin\u003c/td>\u003ctd>Bind ergosterol → pores in membrane → ion leakage → cell death\u003c/td>\u003ctd>Ampho B: severe systemic (IV); Nystatin: topical/oral candida only\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Azoles\u003c/td>\u003ctd>Fluconazole, itraconazole, voriconazole, posaconazole\u003c/td>\u003ctd>Inhibit CYP51 (14α-demethylase) → block ergosterol synthesis → membrane dysfunction\u003c/td>\u003ctd>Most common systemic antifungals; fluconazole for candida/crypto; voriconazole for Aspergillus\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Echinocandins\u003c/td>\u003ctd>Caspofungin, micafungin, anidulafungin\u003c/td>\u003ctd>Inhibit β-glucan synthase → weak cell wall → osmotic lysis\u003c/td>\u003ctd>Invasive candidiasis, Aspergillus; safe, few drug interactions\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Allylamines\u003c/td>\u003ctd>Terbinafine\u003c/td>\u003ctd>Inhibit squalene epoxidase → ↓ ergosterol + ↑ toxic squalene accumulation\u003c/td>\u003ctd>Dermatophyte infections (onychomycosis, tinea pedis)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Pyrimidine analogs\u003c/td>\u003ctd>Flucytosine (5-FC)\u003c/td>\u003ctd>Converted to 5-FU in fungal cells → inhibits thymidylate synthase and RNA\u003c/td>\u003ctd>Combined with Ampho B for cryptococcal meningitis\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box key\">\u003cstrong>Amphotericin B toxicity:\u003c/strong> \"Ampho-terrible\" — nephrotoxic (dosing limited by kidney damage), infusion-related reactions (fever, chills, rigors), electrolyte disturbances (hypokalemia, hypomagnesemia). Liposomal formulations reduce nephrotoxicity.\u003c/div>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>PCP treatment:\u003c/strong> Trimethoprim-sulfamethoxazole (TMP-SMX) is first-line for Pneumocystis jirovecii pneumonia. P. jirovecii has unique dihydropteroate synthase → TMP-SMX targets folate synthesis selectively.\u003c/div>\n        "}],"keyTerms":[{"term":"Ergosterol","def":"Sterol in fungal cell membranes (equivalent of cholesterol in humans). Target of polyenes and azoles."},{"term":"Dimorphic fungi","def":"Fungi existing as mold at room temperature and yeast at body temperature (37°C)."},{"term":"Echinocandin","def":"Antifungal class inhibiting β-glucan synthesis (fungal cell wall); examples: caspofungin, micafungin."},{"term":"Tinea","def":"Superficial dermatophyte infection; named by body site: tinea pedis (foot), capitis (scalp), corporis (body)."},{"term":"Invasive aspergillosis","def":"Life-threatening mold infection in neutropenic patients; treated with voriconazole (first-line)."}]},"antimicrobials":{"tag":"Chapter 6 · Microbiology","title":"Antimicrobial Mechanisms & Resistance","overview":"The most high-yield microbiology topic for pharmacy. Every antibiotic class, its target, mechanism, and resistance must be memorized. Antibiotic resistance is a global health crisis.","sections":[{"title":"Antibiotic Classification by Mechanism","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Mechanism\u003c/th>\u003cth>Antibiotic Class\u003c/th>\u003cth>Examples\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Cell wall synthesis inhibition\u003c/td>\u003ctd>β-lactams\u003cbr>Glycopeptides\u003cbr>Fosfomycin\u003cbr>Bacitracin\u003c/td>\u003ctd>Penicillins, cephalosporins, carbapenems, monobactams\u003cbr>Vancomycin, teicoplanin\u003cbr>Fosfomycin\u003cbr>Bacitracin\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Cell membrane disruption\u003c/td>\u003ctd>Polymyxins\u003cbr>Daptomycin\u003c/td>\u003ctd>Polymyxin B, colistin\u003cbr>Daptomycin (Gram+ only)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Protein synthesis (30S)\u003c/td>\u003ctd>Aminoglycosides\u003cbr>Tetracyclines\u003c/td>\u003ctd>Gentamicin, tobramycin, amikacin\u003cbr>Doxycycline, tetracycline, tigecycline\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Protein synthesis (50S)\u003c/td>\u003ctd>Macrolides\u003cbr>Clindamycin\u003cbr>Chloramphenicol\u003cbr>Linezolid\u003c/td>\u003ctd>Erythromycin, azithromycin\u003cbr>Clindamycin\u003cbr>Chloramphenicol\u003cbr>Linezolid, tedizolid\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>DNA replication inhibition\u003c/td>\u003ctd>Fluoroquinolones\u003cbr>Metronidazole\u003c/td>\u003ctd>Ciprofloxacin, levofloxacin\u003cbr>Metronidazole\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>RNA synthesis inhibition\u003c/td>\u003ctd>Rifamycins\u003c/td>\u003ctd>Rifampicin (rifampin)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Folate synthesis inhibition\u003c/td>\u003ctd>Sulfonamides + DHFR inhibitors\u003c/td>\u003ctd>Sulfamethoxazole + Trimethoprim (TMP-SMX, co-trimoxazole)\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "},{"title":"β-Lactam Antibiotics — Detailed","content":"\n          \u003cp>β-Lactams are the largest and most commonly used antibiotic class. All contain a β-lactam ring that inhibits PBP (transpeptidase).\u003c/p>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Class\u003c/th>\u003cth>Examples\u003c/th>\u003cth>Spectrum\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Natural penicillins\u003c/td>\u003ctd>Penicillin G (IV), Penicillin V (oral)\u003c/td>\u003ctd>Streptococci, syphilis (Treponema), Clostridium\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Antistaphylococcal penicillins\u003c/td>\u003ctd>Nafcillin, oxacillin, dicloxacillin\u003c/td>\u003ctd>MSSA (penicillinase-resistant)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Aminopenicillins\u003c/td>\u003ctd>Ampicillin, amoxicillin\u003c/td>\u003ctd>Broader Gram(−) coverage (UTIs, ENT)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>β-lactam / β-lactamase inhibitor\u003c/td>\u003ctd>Amoxicillin-clavulanate, piperacillin-tazobactam\u003c/td>\u003ctd>Extended spectrum including β-lactamase-producing organisms\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Cephalosporins (1st gen)\u003c/td>\u003ctd>Cefazolin (IV), cephalexin (oral)\u003c/td>\u003ctd>MSSA, strep; surgical prophylaxis\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Cephalosporins (2nd gen)\u003c/td>\u003ctd>Cefuroxime, cefaclor\u003c/td>\u003ctd>Extended Gram(−); H. flu, Moraxella\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Cephalosporins (3rd gen)\u003c/td>\u003ctd>Ceftriaxone, cefotaxime, ceftazidime\u003c/td>\u003ctd>Broad Gram(−); meningitis; ceftazidime covers Pseudomonas\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Cephalosporins (4th gen)\u003c/td>\u003ctd>Cefepime\u003c/td>\u003ctd>Pseudomonas + broader Gram(−)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Carbapenems\u003c/td>\u003ctd>Meropenem, imipenem-cilastatin, ertapenem\u003c/td>\u003ctd>Broadest spectrum β-lactams; ESBL-producing organisms; NOT MRSA\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Monobactams\u003c/td>\u003ctd>Aztreonam\u003c/td>\u003ctd>Gram(−) only (including Pseudomonas); safe in penicillin allergy\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "},{"title":"Antibiotic Resistance Mechanisms","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Mechanism\u003c/th>\u003cth>How It Works\u003c/th>\u003cth>Examples\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Enzymatic inactivation\u003c/td>\u003ctd>Enzymes destroy the antibiotic\u003c/td>\u003ctd>β-Lactamases inactivate penicillins; aminoglycoside-modifying enzymes\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Target modification\u003c/td>\u003ctd>Drug target is altered so drug can't bind\u003c/td>\u003ctd>MRSA: altered PBP2a (mecA gene) → β-lactams can't bind; VRE: altered D-Ala-D-Ala to D-Ala-D-Lac → vancomycin can't bind; ribosome methylation → macrolide resistance\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Efflux pumps\u003c/td>\u003ctd>Active transport of antibiotic out of cell before it can act\u003c/td>\u003ctd>Tetracycline efflux; Pseudomonas multi-drug efflux pumps (MexAB-OprM)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Reduced permeability\u003c/td>\u003ctd>Decreased outer membrane porins → less antibiotic entry\u003c/td>\u003ctd>Porin mutations in Gram(−) bacteria → carbapenem resistance\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Bypass pathway\u003c/td>\u003ctd>Use alternative pathway that antibiotic doesn't affect\u003c/td>\u003ctd>Sulfonamide resistance: bacteria acquire DHPS gene from sulfa-resistant organism or produce more PABA\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003ch4>Transfer of Resistance Genes\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Conjugation:\u003c/strong> Direct cell-to-cell transfer via sex pilus → plasmid transfer (most clinically important)\u003c/li>\n            \u003cli>\u003cstrong>Transformation:\u003c/strong> Uptake of naked DNA from environment\u003c/li>\n            \u003cli>\u003cstrong>Transduction:\u003c/strong> Bacteriophage-mediated DNA transfer\u003c/li>\n            \u003cli>\u003cstrong>Transposons:\u003c/strong> Mobile DNA elements \"jumping\" within or between chromosomes/plasmids\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"info-box warning\">\u003cstrong>MRSA (Methicillin-resistant S. aureus):\u003c/strong> Has mecA gene encoding PBP2a → reduced affinity for ALL β-lactams (penicillins, cephalosporins, carbapenems). Treatment: Vancomycin (IV), linezolid, daptomycin (not for lungs), ceftaroline (5th gen cephalosporin active against MRSA).\u003c/div>\n        "},{"title":"Vancomycin — Key Drug","content":"\n          \u003cp>Vancomycin is a glycopeptide antibiotic — the \"last resort\" for Gram-positive infections, especially MRSA. It inhibits cell wall synthesis by binding D-Ala-D-Ala terminus of peptidoglycan precursors → prevents transglycosylation → no cell wall cross-linking.\u003c/p>\n          \u003cul>\n            \u003cli>\u003cstrong>Spectrum:\u003c/strong> Gram-positive only (too large to cross Gram-negative outer membrane)\u003c/li>\n            \u003cli>\u003cstrong>Clinical use:\u003c/strong> MRSA, C. diff (oral), endocarditis, meningitis (with ceftriaxone)\u003c/li>\n            \u003cli>\u003cstrong>Monitoring:\u003c/strong> Trough levels (AUC/MIC monitoring) to optimize dosing and prevent toxicity\u003c/li>\n            \u003cli>\u003cstrong>Toxicities:\u003c/strong> Nephrotoxicity, ototoxicity, Red Man Syndrome (not allergy — infusion-related histamine release; prevented by slow infusion rate)\u003c/li>\n          \u003c/ul>\n        "}],"keyTerms":[{"term":"β-Lactamase","def":"Enzyme produced by bacteria that hydrolyzes the β-lactam ring, inactivating penicillins and cephalosporins."},{"term":"MRSA","def":"Methicillin-resistant Staphylococcus aureus; has mecA gene (altered PBP2a) → resistant to all β-lactams."},{"term":"PBP (Penicillin-binding protein)","def":"Transpeptidase enzyme responsible for cross-linking peptidoglycan; target of β-lactam antibiotics."},{"term":"Efflux pump","def":"Active transport protein that pumps antibiotics out of bacterial cells → resistance."},{"term":"Bacteriostatic vs bactericidal","def":"Bacteriostatic inhibits growth; bactericidal kills bacteria. Clinical significance: use bactericidal for immunocompromised patients and serious infections (endocarditis, meningitis)."}]},"sterilization":{"tag":"Chapter 7 · Microbiology","title":"Sterilization & Disinfection","overview":"Controlling microbial contamination is critical in pharmaceutical manufacturing, hospital infection control, and preparation of sterile dosage forms.","sections":[{"title":"Key Terminology","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Term\u003c/th>\u003cth>Definition\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Sterilization\u003c/td>\u003ctd>Complete destruction of ALL microorganisms including spores\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Disinfection\u003c/td>\u003ctd>Elimination of most pathogens (not necessarily spores) from inanimate surfaces\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Antisepsis\u003c/td>\u003ctd>Reduction of microorganisms on living tissue (skin)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Sanitization\u003c/td>\u003ctd>Reduction of microbial load to safe public health levels\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Bacteriostasis\u003c/td>\u003ctd>Inhibition of bacterial growth (reversible)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Bactericidal\u003c/td>\u003ctd>Killing of bacteria (irreversible)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Sporicide\u003c/td>\u003ctd>Kills spores\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Aseptic technique\u003c/td>\u003ctd>Procedures preventing contamination during preparation/handling\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "},{"title":"Physical Methods of Sterilization","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Method\u003c/th>\u003cth>Conditions\u003c/th>\u003cth>Application\u003c/th>\u003cth>Kills Spores?\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Autoclave (Moist heat)\u003c/td>\u003ctd>121°C, 15 psi steam, 15–20 min\u003c/td>\u003ctd>GOLD STANDARD; surgical instruments, media, pharmacy equipment\u003c/td>\u003ctd>Yes ✓\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Dry heat oven\u003c/td>\u003ctd>160–170°C, 2 hours\u003c/td>\u003ctd>Glassware, powders that can't tolerate moisture; depyrogenation (removes endotoxin)\u003c/td>\u003ctd>Yes ✓\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Boiling (wet heat)\u003c/td>\u003ctd>100°C, 10–30 min\u003c/td>\u003ctd>Kills vegetative cells; NOT spores\u003c/td>\u003ctd>No ✗\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Filtration\u003c/td>\u003ctd>0.22 μm membrane filters\u003c/td>\u003ctd>Heat-labile solutions (IV drugs, biologics); viruses may pass through\u003c/td>\u003ctd>Yes for bacteria; No for viruses\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>UV radiation\u003c/td>\u003ctd>254 nm wavelength\u003c/td>\u003ctd>Air/surface disinfection in clean rooms, labs, hospitals\u003c/td>\u003ctd>Partial; limited penetration\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Ionizing radiation\u003c/td>\u003ctd>Gamma rays, electron beam\u003c/td>\u003ctd>Industrial sterilization of medical devices, sutures, single-use items\u003c/td>\u003ctd>Yes ✓\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "},{"title":"Chemical Methods","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Chemical\u003c/th>\u003cth>Mechanism\u003c/th>\u003cth>Use\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Ethylene oxide (EtO)\u003c/td>\u003ctd>Alkylating agent; inactivates proteins & DNA\u003c/td>\u003ctd>Sterilization of heat-sensitive medical devices (endoscopes, catheters)\u003c/td>\u003ctd>Carcinogen; requires aeration post-sterilization\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Glutaraldehyde\u003c/td>\u003ctd>Cross-links proteins\u003c/td>\u003ctd>High-level disinfection of endoscopes\u003c/td>\u003ctd>Sporicide at 2% for 10 hours\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Hydrogen peroxide (H₂O₂)\u003c/td>\u003ctd>Oxidizing agent; free radicals damage membranes and DNA\u003c/td>\u003ctd>Wound care, contact lens sterilization, vaporized H₂O₂ for room decontamination\u003c/td>\u003ctd>3% for wounds; 30% for sterilization\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Chlorine compounds\u003c/td>\u003ctd>Oxidizing agent; cell membrane and protein damage\u003c/td>\u003ctd>Water purification, hospital surface disinfection (1:10 bleach for C. diff spores)\u003c/td>\u003ctd>10% bleach (5,000 ppm) kills C. diff spores\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Alcohols (70–90%)\u003c/td>\u003ctd>Protein denaturation; membrane disruption\u003c/td>\u003ctd>Skin antisepsis, surface disinfection\u003c/td>\u003ctd>Optimal at 70%; 100% alcohol less effective; NOT sporicidal; NOT effective against C. diff\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Iodine/Iodophors (povidone-iodine)\u003c/td>\u003ctd>Oxidation; protein inactivation\u003c/td>\u003ctd>Skin antiseptic (surgical prep, wound care)\u003c/td>\u003ctd>Broad spectrum; may cause skin irritation\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Quaternary ammonium compounds (QAC)\u003c/td>\u003ctd>Disrupts cell membranes\u003c/td>\u003ctd>Surface disinfection in hospitals, food industry\u003c/td>\u003ctd>Inactivated by organic matter; NOT effective against TB\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Formaldehyde\u003c/td>\u003ctd>Alkylating agent\u003c/td>\u003ctd>Inactivation of vaccines; laboratory preservative\u003c/td>\u003ctd>Carcinogen; formalin = 37% formaldehyde solution\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box key\">\u003cstrong>C. diff spore control:\u003c/strong> Alcohol-based hand rubs do NOT kill C. diff spores. Must use soap and water (physical removal) or 10% bleach (sporicidal). This is a crucial infection control point in hospitals.\u003c/div>\n        "},{"title":"Sterility Testing & Pyrogen Testing","content":"\n          \u003ch4>Sterility Testing (USP &lt;71&gt;)\u003c/h4>\n          \u003cp>Regulatory requirement for sterile pharmaceutical products (injectables, ophthalmic drops, implants). Tests for any viable microorganism.\u003c/p>\n          \u003ch4>Pyrogen/Endotoxin Testing\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>LAL test (Limulus Amebocyte Lysate):\u003c/strong> Horseshoe crab blood extract clots in presence of LPS (endotoxin). Preferred method.\u003c/li>\n            \u003cli>\u003cstrong>Rabbit pyrogen test:\u003c/strong> Fever response in rabbits; older method, less sensitive.\u003c/li>\n            \u003cli>Pyrogens cause fever when injected IV → strict limits for all parenteral products.\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>GMP (Good Manufacturing Practice):\u003c/strong> Pharmaceutical manufacturing must comply with GMP regulations (FDA/USP). Clean rooms are classified by particle count and microbial limits. Aseptic processing of injectables requires ISO Class 5 (laminar airflow) environment.\u003c/div>\n        "}],"keyTerms":[{"term":"Autoclave","def":"Pressurized steam sterilization: 121°C, 15 psi, 15–20 min. Gold standard; kills all microorganisms including spores."},{"term":"Pyrogen","def":"Fever-inducing substance; usually LPS from Gram-negative bacteria. Must be absent from IV drugs (tested by LAL test)."},{"term":"Aseptic technique","def":"Procedures designed to prevent microbial contamination during drug preparation."},{"term":"GMP","def":"Good Manufacturing Practice — regulatory standards for pharmaceutical manufacturing quality."},{"term":"LAL test","def":"Limulus Amebocyte Lysate test — sensitive detection of bacterial endotoxins; standard for parenteral drug release."}]}},"pq":[{"id":"micro-1","topic":"Overview","question":"Which organism is acellular and lacks its own ribosomes?","options":["Bacteria","Fungi","Viruses","Protozoa"],"answer":2,"explanation":"Viruses are acellular — they have no cell structure, no ribosomes, no metabolic machinery. They are obligate intracellular parasites that hijack host cell ribosomes to translate viral proteins."},{"id":"micro-2","topic":"Overview","question":"Clostridium difficile (C. diff) colitis commonly occurs after antibiotic use because:","options":["C. diff becomes more virulent with antibiotics","Antibiotics kill normal gut flora → C. diff spores germinate and proliferate unopposed","Antibiotics stimulate C. diff toxin production","Patients become immunocompromised from antibiotics"],"answer":1,"explanation":"Normal gut flora provide colonization resistance. Broad-spectrum antibiotics kill commensal bacteria → disruption of microbiota → C. diff spores germinate and grow without competition → toxin A and B production → pseudomembranous colitis."},{"id":"micro-3","topic":"Overview","question":"Prions are:","options":["RNA viruses with no protein coat","Misfolded proteins that can cause normal proteins to also misfold","Small bacteria without cell walls","Damaged DNA with no associated protein"],"answer":1,"explanation":"Prions are infectious misfolded proteins (PrPsc). They convert normal cellular prion protein (PrPc) to the misfolded pathogenic form through direct contact. No nucleic acid involved. Cause fatal spongiform encephalopathies: CJD, kuru, BSE. Resistant to most sterilization methods except autoclaving at 134°C or NaOH treatment."},{"id":"micro-4","topic":"Bacterial Structure","question":"Gram-positive bacteria appear purple after Gram staining because:","options":["Their thin peptidoglycan layer is easily washed by the decolorizer","Their thick peptidoglycan layer traps the crystal violet-iodine complex after decolorization","They produce a purple pigment naturally","They absorb more of the safranin counterstain"],"answer":1,"explanation":"Gram-positive bacteria have a thick peptidoglycan layer (20–80 nm). During decolorization with acetone-alcohol, the thick peptidoglycan traps the crystal violet-iodine complex inside, preventing it from being washed away → purple color retained. Gram-negative bacteria have thin peptidoglycan + outer membrane — the decolorizer disrupts the outer membrane → complex escapes → then stains pink with safranin."},{"id":"micro-5","topic":"Bacterial Structure","question":"Which of the following is UNIQUE to Gram-negative bacteria?","options":["Peptidoglycan cell wall","Ribosomes","Outer membrane with LPS","Cell membrane (plasma membrane)"],"answer":2,"explanation":"The outer membrane containing lipopolysaccharide (LPS) is unique to Gram-negative bacteria. Both types have peptidoglycan (though in different amounts), ribosomes, and a plasma membrane."},{"id":"micro-6","topic":"Bacterial Structure","question":"A patient goes into septic shock after a Gram-negative bacterial infection. The main mediator of this response is:","options":["Exotoxins secreted by bacteria","Lipopolysaccharide (LPS/endotoxin) released from Gram-negative cell walls","Gram-positive teichoic acids","Bacterial flagella"],"answer":1,"explanation":"LPS (endotoxin) from Gram-negative outer membrane triggers the innate immune response. Macrophages detect LPS via TLR4 → massive cytokine release (TNF-α, IL-1, IL-6) → septic shock (vasodilation, hypotension, multi-organ failure). All parenteral drugs must be tested for LPS contamination (LAL test)."},{"id":"micro-7","topic":"Bacterial Structure","question":"MRSA is resistant to β-lactam antibiotics because of which mechanism?","options":["Increased efflux of β-lactams","Production of β-lactamase that destroys the antibiotic","Altered PBP2a (mecA gene product) with low affinity for β-lactams","Reduced outer membrane permeability"],"answer":2,"explanation":"MRSA carries the mecA gene (on mobile genetic element SCCmec), which encodes PBP2a — an alternative transpeptidase with very low affinity for all β-lactam antibiotics. β-Lactams cannot bind PBP2a → no inhibition → cell wall synthesis continues → resistance. Treatment: vancomycin, linezolid, daptomycin, ceftaroline."},{"id":"micro-8","topic":"Bacterial Structure","question":"Which bacterial structure is responsible for antibiotic resistance gene transfer between bacteria?","options":["Capsule","Plasmid (transferred by conjugation)","Flagella","Endospore"],"answer":1,"explanation":"R-plasmids carry antibiotic resistance genes and are transferred between bacteria primarily by conjugation (sex pilus contact) — even between different species. This is the most clinically important mechanism of resistance spread, explaining rapid emergence of multidrug-resistant organisms."},{"id":"micro-9","topic":"Bacterial Structure","question":"Mycoplasma pneumoniae causes \"walking pneumonia\" and is NOT affected by penicillin. Why?","options":["It has a very thick peptidoglycan layer","It has no cell wall → no penicillin target","It produces penicillinase","It has altered PBPs"],"answer":1,"explanation":"Mycoplasma lacks a cell wall entirely — there is no peptidoglycan. β-Lactam antibiotics target PBPs involved in peptidoglycan synthesis. No cell wall = no target = no effect. Treat with macrolides (azithromycin), tetracyclines (doxycycline), or fluoroquinolones instead."},{"id":"micro-10","topic":"Bacterial Growth","question":"β-Lactam antibiotics are most effective against bacteria in which growth phase?","options":["Lag phase","Log (exponential) phase","Stationary phase","Death phase"],"answer":1,"explanation":"β-Lactams inhibit cell wall synthesis during active cell division. Bacteria in the log phase are actively dividing, synthesizing new cell wall → most susceptible. Stationary-phase bacteria (not actively dividing) and dormant persister cells are much less affected → incomplete killing can lead to relapse."},{"id":"micro-11","topic":"Bacterial Growth","question":"Which spore-forming bacterium releases a toxin that causes flaccid paralysis?","options":["Clostridium tetani","Clostridium botulinum","Bacillus anthracis","Clostridium perfringens"],"answer":1,"explanation":"Clostridium botulinum produces botulinum toxin — the most potent biologic toxin. It cleaves SNARE proteins (VAMP/synaptobrevin) at neuromuscular junctions → prevents acetylcholine vesicle release → flaccid paralysis (versus C. tetani toxin which blocks inhibitory glycine/GABA → spastic paralysis)."},{"id":"micro-12","topic":"Bacterial Growth","question":"The minimum temperature for autoclave sterilization that kills bacterial spores is:","options":["100°C at normal pressure","121°C at 15 psi steam pressure","180°C dry heat","37°C overnight"],"answer":1,"explanation":"121°C at 15 psi saturated steam for 15–20 minutes is the standard autoclave sterilization condition. Boiling (100°C) kills vegetative cells but NOT spores. Dry heat at 160–170°C for 2 hours also sterilizes. The higher temperature achieved under pressure allows killing of highly resistant spores."},{"id":"micro-13","topic":"Viruses","question":"HIV is a retrovirus. Its unique step in replication involves:","options":["Using RNA polymerase to replicate RNA genome","Reverse transcribing RNA into DNA using reverse transcriptase","Lysing the host cell upon release","Using host tRNA directly as genome"],"answer":1,"explanation":"HIV has an RNA genome that is reverse transcribed into DNA by reverse transcriptase (RT) — a uniquely viral enzyme not present in human cells. The DNA is then integrated into the host chromosome by integrase (provirus). NRTIs and NNRTIs target RT; integrase inhibitors target integrase."},{"id":"micro-14","topic":"Viruses","question":"Oseltamivir (Tamiflu) is used to treat influenza. Its mechanism of action is:","options":["Blocking hemagglutinin from attaching to respiratory epithelium","Inhibiting viral neuraminidase → prevents new virus particles from being released","Inhibiting viral RNA polymerase","Blocking M2 ion channel (like amantadine)"],"answer":1,"explanation":"Oseltamivir inhibits neuraminidase, the enzyme influenza uses to cleave sialic acid residues and release new virions from the host cell surface. Without neuraminidase, newly made virions remain clumped together → cannot spread. Must be given within 48 hours of symptom onset for maximum benefit."},{"id":"micro-15","topic":"Viruses","question":"Non-enveloped viruses (e.g., norovirus, hepatitis A) are HARDER to inactivate than enveloped viruses because:","options":["They are larger and harder to destroy","They lack a lipid envelope → alcohol-based sanitizers are less effective; more stable in environment","They replicate faster","They infect more cell types"],"answer":1,"explanation":"Enveloped viruses are easily destroyed by lipid solvents (alcohol, detergents) that disrupt the lipid envelope. Non-enveloped (naked) viruses have no lipid envelope → resist alcohols and drying → persist longer on surfaces → harder to disinfect → more likely to spread by fomites and fecal-oral route (HAV, poliovirus, rotavirus, norovirus)."},{"id":"micro-16","topic":"Viruses","question":"Acyclovir is selectively toxic to HSV-infected cells because:","options":["It is only taken up by HSV virions, not human cells","It is activated (phosphorylated) by viral thymidine kinase in infected cells → selectively inhibits viral DNA polymerase","Human cells lack thymidine kinase","It directly binds HSV capsid proteins"],"answer":1,"explanation":"Acyclovir is a pro-drug. In HSV-infected cells, viral thymidine kinase (TK) phosphorylates acyclovir → acyclovir monophosphate → further phosphorylated to triphosphate by cellular kinases → inhibits viral DNA polymerase (acts as chain terminator). Human TK has very poor affinity → minimal activation in uninfected cells → selective toxicity."},{"id":"micro-17","topic":"Viruses","question":"SARS-CoV-2 enters host cells through which receptor?","options":["CD4","Sialic acid","ACE2 (angiotensin-converting enzyme 2)","CXCR4"],"answer":2,"explanation":"SARS-CoV-2 spike protein binds ACE2 receptor on host cells (especially lung type II pneumocytes, intestinal epithelium, cardiac pericytes). ACE2 is also expressed in kidneys, heart, and brain → explains multi-organ complications. Remdesivir (RNA polymerase inhibitor) and mRNA vaccines (encoding spike protein) target this virus."},{"id":"micro-18","topic":"Fungi","question":"Which antifungal targets ergosterol directly (binds ergosterol and forms pores in fungal membrane)?","options":["Fluconazole","Amphotericin B","Caspofungin","Terbinafine"],"answer":1,"explanation":"Amphotericin B (a polyene) directly binds ergosterol in the fungal cell membrane → forms channels/pores → ion leakage → cell death. This is fungicidal. Fluconazole INHIBITS ergosterol synthesis (azole). Caspofungin targets cell wall. Terbinafine inhibits earlier in ergosterol synthesis pathway."},{"id":"micro-19","topic":"Fungi","question":"Candida albicans oral thrush commonly develops in HIV patients with CD4 count below:","options":["500 cells/μL","350 cells/μL","200 cells/μL","100 cells/μL"],"answer":2,"explanation":"Oropharyngeal candidiasis (thrush) typically occurs when CD4 \u003c 200 cells/μL. Esophageal candidiasis is an AIDS-defining illness (CD4 \u003c 100). PCP pneumonia also occurs at CD4 \u003c 200. Cryptococcal meningitis and CMV retinitis occur at CD4 \u003c 100."},{"id":"micro-20","topic":"Fungi","question":"The mechanism of azole antifungals (fluconazole, itraconazole) is:","options":["Directly binding and disrupting ergosterol in membranes","Inhibiting lanosterol 14α-demethylase (CYP51) → blocking ergosterol synthesis","Inhibiting β-glucan synthesis in fungal cell wall","Inhibiting squalene epoxidase"],"answer":1,"explanation":"Azoles inhibit lanosterol 14α-demethylase (CYP51) — a fungal cytochrome P450 enzyme. This blocks conversion of lanosterol → ergosterol → accumulation of toxic methylated sterols + ergosterol depletion → membrane dysfunction → fungistatic. Important drug interactions: azoles also inhibit human CYP450 enzymes (CYP3A4, 2C9) → affect many drug levels."},{"id":"micro-21","topic":"Fungi","question":"Which antifungal is first-line for invasive Aspergillus infections?","options":["Fluconazole","Amphotericin B","Voriconazole","Caspofungin"],"answer":2,"explanation":"Voriconazole is first-line treatment for invasive aspergillosis (IDSA guidelines). Aspergillus species are resistant to fluconazole. Voriconazole is an extended-spectrum azole with excellent Aspergillus activity. Alternative: isavuconazole, or amphotericin B if azoles cannot be used."},{"id":"micro-22","topic":"Antimicrobials","question":"Which class of antibiotics targets the 50S ribosomal subunit to block translocation?","options":["Aminoglycosides","Tetracyclines","Macrolides (erythromycin)","Fluoroquinolones"],"answer":2,"explanation":"Macrolides (erythromycin, azithromycin, clarithromycin) and clindamycin bind to the 23S rRNA of the 50S ribosomal subunit → block translocation and peptide chain elongation → bacteriostatic. Aminoglycosides and tetracyclines target 30S. Fluoroquinolones target DNA gyrase/topoisomerase IV."},{"id":"micro-23","topic":"Antimicrobials","question":"Trimethoprim-sulfamethoxazole (TMP-SMX) works by inhibiting which pathway?","options":["Cell wall synthesis","Folate synthesis (two sequential steps)","Protein synthesis","DNA replication"],"answer":1,"explanation":"Sulfonamides inhibit dihydropteroate synthase (DHPS) → prevent PABA from being incorporated into dihydropteroate. Trimethoprim inhibits dihydrofolate reductase (DHFR) → prevents DHF → THF conversion. Sequential blockade of folate synthesis = synergistic effect → thymidine and purine depletion → cell death. Effective against many bacteria, PCP, Toxoplasma."},{"id":"micro-24","topic":"Antimicrobials","question":"Rifampicin (rifampin) is used for tuberculosis. Its mechanism is:","options":["Inhibiting bacterial cell wall synthesis","Inhibiting bacterial RNA polymerase β-subunit → blocks transcription","Inhibiting bacterial 30S ribosome","Inhibiting dihydropteroate synthase"],"answer":1,"explanation":"Rifampicin inhibits the β-subunit of bacterial RNA polymerase (encoded by rpoB gene) → blocks transcription initiation. Used for TB (always as part of combination therapy to prevent resistance), leprosy (with dapsone), meningococcal prophylaxis, MRSA decolonization. Major drug interaction: induces CYP450 enzymes → reduces levels of many drugs (warfarin, OCP, HIV drugs)."},{"id":"micro-25","topic":"Antimicrobials","question":"Which antibiotic is used orally for C. difficile colitis?","options":["Vancomycin IV","Metronidazole IV","Vancomycin oral or fidaxomicin oral","Ciprofloxacin oral"],"answer":2,"explanation":"Oral vancomycin is preferred for C. diff colitis because it reaches high concentrations in the gut without systemic absorption. Fidaxomicin (oral) is preferred for severe or recurrent cases. IV vancomycin does NOT reach the gut lumen — ineffective for C. diff. Oral metronidazole may be used for mild initial episodes if cost is a concern."},{"id":"micro-26","topic":"Antimicrobials","question":"VRE (Vancomycin-Resistant Enterococcus) is resistant to vancomycin because:","options":["It produces vancomycinase enzyme","D-Ala-D-Ala is changed to D-Ala-D-Lac → vancomycin cannot bind cell wall precursor","Altered 30S ribosome","Efflux pumps remove vancomycin"],"answer":1,"explanation":"VRE (vanA/vanB genes) modifies the cell wall peptidoglycan precursor terminus from D-Ala-D-Ala to D-Ala-D-Lac. Vancomycin normally binds D-Ala-D-Ala with high affinity. The single substitution of Ala → Lac reduces vancomycin binding ~1000-fold → resistance. Treatment: linezolid, daptomycin, or newer glycopeptides (oritavancin)."},{"id":"micro-27","topic":"Antimicrobials","question":"Aminoglycosides (gentamicin, tobramycin) cause toxicity primarily affecting:","options":["Liver and gallbladder","Kidney (nephrotoxicity) and ears (ototoxicity)","Bone marrow suppression","Peripheral neuropathy"],"answer":1,"explanation":"Aminoglycosides concentrate in renal cortex (proximal tubule cells) → nephrotoxicity (tubular necrosis, ↑creatinine); and in cochlea/vestibular apparatus → ototoxicity (irreversible hearing loss, vestibular damage). Risk factors: age, pre-existing renal disease, concurrent nephrotoxins (NSAIDs, contrast, cisplatin). TDM: peak (efficacy) and trough (toxicity) monitoring required."},{"id":"micro-28","topic":"Sterilization","question":"A pharmacist is preparing IV injections. Which is the most appropriate method for sterilizing a heat-labile protein drug?","options":["Autoclave at 121°C","0.22 μm membrane filtration","Dry heat oven at 160°C","UV radiation"],"answer":1,"explanation":"0.22 μm membrane filtration (sterile filtration) removes bacteria without heat — essential for heat-labile drugs (proteins, peptides, vitamins, some antibiotics). Viruses are not removed by 0.22 μm filters (require 0.02 μm nanofilters). Autoclave and dry heat would denature proteins."},{"id":"micro-29","topic":"Sterilization","question":"Why is 70% ethanol MORE effective as a disinfectant than 100% ethanol?","options":["70% ethanol contains additives that enhance antimicrobial activity","Water is needed for protein denaturation — 100% alcohol dehydrates surface proteins, slowing penetration","70% ethanol is less flammable","100% ethanol is too toxic to microorganisms"],"answer":1,"explanation":"70% ethanol (with 30% water) is optimal because: (1) water is needed for protein denaturation — it facilitates alcohol penetration into cells; (2) 100% alcohol rapidly dehydrates the cell surface, creating a protein coagulation barrier that actually limits penetration. Pure alcohol also evaporates too quickly for adequate contact time."},{"id":"micro-30","topic":"Sterilization","question":"Which disinfectant is sporicidal and required to kill C. diff spores on hospital surfaces?","options":["70% alcohol","Quaternary ammonium compounds (quats)","10% sodium hypochlorite (bleach)","Chlorhexidine"],"answer":2,"explanation":"C. diff spores are resistant to alcohol, quats, and most routine disinfectants. Sodium hypochlorite (10% bleach = 5000 ppm) is required for effective C. diff spore killing on surfaces. This is why C. diff patients require contact precautions AND routine surface disinfection with bleach. Hand washing with soap and water (physical removal) is needed because alcohol hand rubs don't kill spores."},{"id":"micro-31","topic":"Sterilization","question":"The LAL (Limulus Amebocyte Lysate) test is used to detect:","options":["Bacterial cell count in drugs","Fungal contamination","LPS (endotoxin/pyrogen) in injectable pharmaceuticals","Sterility of solid dosage forms"],"answer":2,"explanation":"The LAL test uses lysate from horseshoe crab (Limulus polyphemus) amebocytes, which clot in the presence of LPS (Gram-negative endotoxin). This test detects nanogram quantities of endotoxin. Required for all injectable pharmaceutical products to ensure pyrogenicity is within USP limits. Results in \u003c1 hour versus rabbit pyrogen test which takes hours."},{"id":"micro-32","topic":"Sterilization","question":"Ethylene oxide (EtO) sterilization is preferred for which type of medical products?","options":["Glass syringes","Surgical instruments tolerating high heat","Heat-sensitive devices like endoscopes and catheters","Oral solid dosage forms"],"answer":2,"explanation":"EtO is a gas-phase alkylating agent that sterilizes at low temperatures (~50–60°C). Used for heat-sensitive medical devices (endoscopes, plastic catheters, cardiac stents, surgical kits). Disadvantages: carcinogenic, explosive, requires aeration post-sterilization, slow process (several hours + aeration time)."},{"id":"micro-33","topic":"Bacterial Structure","question":"A patient with pneumococcal meningitis is started on penicillin G. Which mechanism makes penicillin effective against Streptococcus pneumoniae?","options":["Binding to the 30S ribosome and blocking protein synthesis","Inhibiting cell wall synthesis by binding PBPs and blocking peptidoglycan cross-linking","Disrupting the outer membrane and causing ion leakage","Inhibiting DNA gyrase"],"answer":1,"explanation":"Penicillin G binds penicillin-binding proteins (PBPs/transpeptidases) in the S. pneumoniae cell wall → inhibits peptidoglycan cross-linking → osmotic pressure causes cell wall rupture → bactericidal. However, penicillin-resistant S. pneumoniae (PRSP) has altered PBPs with reduced penicillin affinity."},{"id":"micro-34","topic":"Overview","question":"Fungi differ from bacteria in which key way that affects antifungal drug design?","options":["Fungi lack DNA","Fungi are prokaryotes; bacteria are eukaryotes","Fungi are eukaryotes sharing similarities with human cells; targeted drugs must exploit unique fungal structures (ergosterol, chitin, fungal enzymes)","Fungi grow only at room temperature"],"answer":2,"explanation":"Fungi are eukaryotes — this means they share many cellular targets with human cells (80S ribosomes, similar enzymes). Antifungals must target fungal-specific structures: ergosterol (polyenes, azoles), chitin/glucan cell wall (echinocandins), fungal-specific enzymes. This limits the number of safe, selective antifungal targets compared to antibacterial drugs."},{"id":"micro-35","topic":"Antimicrobials","question":"A patient taking rifampicin for TB also takes warfarin for atrial fibrillation. You would expect warfarin blood levels to:","options":["Increase → higher bleeding risk","Decrease → lower anticoagulation effect","Remain unchanged","Double due to additive effects"],"answer":1,"explanation":"Rifampicin is a potent inducer of hepatic CYP450 enzymes (CYP3A4, CYP2C9). Warfarin is metabolized by CYP2C9 (S-warfarin) and CYP3A4. Rifampicin increases metabolism → lower warfarin levels → subtherapeutic anticoagulation → risk of thromboembolism. Warfarin dose must be increased and INR monitored closely."},{"id":"micro-36","topic":"Bacterial Growth","question":"Which antibiotic class is classified as BACTERICIDAL?","options":["Tetracyclines","Macrolides","Chloramphenicol","Fluoroquinolones"],"answer":3,"explanation":"Fluoroquinolones (ciprofloxacin, levofloxacin) are bactericidal — they inhibit DNA gyrase and topoisomerase IV → double-strand DNA breaks → cell death. Tetracyclines, macrolides, and chloramphenicol are bacteriostatic — they inhibit protein synthesis but don't directly kill the cell."},{"id":"micro-37","topic":"Viruses","question":"mRNA vaccines (e.g., Pfizer BNT162b2) against COVID-19 work by:","options":["Introducing live attenuated SARS-CoV-2","Delivering mRNA encoding spike protein → host cells produce spike → immune response generates antibodies","Introducing inactivated spike protein directly","Delivering DNA that permanently changes host genome"],"answer":1,"explanation":"mRNA vaccines deliver lipid nanoparticle-encapsulated mRNA encoding SARS-CoV-2 spike protein. Host ribosomes translate spike protein → immune system recognizes it → generates antibodies and T cells without exposure to actual virus. mRNA does NOT enter the nucleus and is NOT reverse-transcribed into DNA. Degraded after ~days."},{"id":"micro-38","topic":"Fungi","question":"\"Dimorphic fungi are molds in the cold and yeast in the beast.\" This refers to:","options":["Temperature changes from environment to host body temperature cause a morphological change","Antifungal resistance temperature dependence","Laboratory storage conditions","Growth rate at different temperatures"],"answer":0,"explanation":"Dimorphic fungi switch between mold form (at room temperature, environmental state) and yeast form (at body temperature 37°C, when infecting a mammalian host). Examples: Histoplasma capsulatum, Blastomyces dermatitidis, Coccidioides immitis, Paracoccidioides brasiliensis, Sporothrix schenckii. The HBCPS mnemonic: \"Histo, Blasto, Cocci, Para, Sporo\"."},{"id":"micro-39","topic":"Antimicrobials","question":"Which antibiotic CANNOT be used for patients with penicillin allergy (anaphylaxis type)?","options":["Azithromycin","Ciprofloxacin","Ceftriaxone (use with caution — cross-reactivity ~1–2%)","Vancomycin"],"answer":2,"explanation":"Cross-reactivity between penicillins and cephalosporins is low (~1–2%, mostly via similar R1 side chains). In patients with severe penicillin allergy (anaphylaxis), cephalosporins should be used with caution or avoided (particularly those sharing similar R1 side chains). Azithromycin, ciprofloxacin, and vancomycin are structurally unrelated to penicillins and are safe alternatives."},{"id":"micro-40","topic":"Sterilization","question":"Dry heat sterilization at 180°C for 30 minutes is specifically used to:","options":["Sterilize heat-labile liquids","Sterilize glass materials and depyrogenate (destroy endotoxins)","Kill C. diff spores on hospital floors","Sterilize plastic syringes"],"answer":1,"explanation":"Dry heat is used for materials that can tolerate high temperatures AND moisture cannot be used (e.g., glassware, powders, oils). It also DEPYROGENATES — destroys endotoxins (LPS) at temperatures above 250°C (or 180°C for 30 min). Autoclave (moist heat) does NOT depyrogenate. Dry heat is slower than autoclave and requires higher temperatures."}],"eq":[{"id":"micro-1","topic":"Overview","question":"Which organism is acellular and lacks its own ribosomes?","options":["Bacteria","Fungi","Viruses","Protozoa"],"answer":2,"explanation":"Viruses are acellular — they have no cell structure, no ribosomes, no metabolic machinery. They are obligate intracellular parasites that hijack host cell ribosomes to translate viral proteins."},{"id":"micro-2","topic":"Overview","question":"Clostridium difficile (C. diff) colitis commonly occurs after antibiotic use because:","options":["C. diff becomes more virulent with antibiotics","Antibiotics kill normal gut flora → C. diff spores germinate and proliferate unopposed","Antibiotics stimulate C. diff toxin production","Patients become immunocompromised from antibiotics"],"answer":1,"explanation":"Normal gut flora provide colonization resistance. Broad-spectrum antibiotics kill commensal bacteria → disruption of microbiota → C. diff spores germinate and grow without competition → toxin A and B production → pseudomembranous colitis."},{"id":"micro-3","topic":"Overview","question":"Prions are:","options":["RNA viruses with no protein coat","Misfolded proteins that can cause normal proteins to also misfold","Small bacteria without cell walls","Damaged DNA with no associated protein"],"answer":1,"explanation":"Prions are infectious misfolded proteins (PrPsc). They convert normal cellular prion protein (PrPc) to the misfolded pathogenic form through direct contact. No nucleic acid involved. Cause fatal spongiform encephalopathies: CJD, kuru, BSE. Resistant to most sterilization methods except autoclaving at 134°C or NaOH treatment."},{"id":"micro-4","topic":"Bacterial Structure","question":"Gram-positive bacteria appear purple after Gram staining because:","options":["Their thin peptidoglycan layer is easily washed by the decolorizer","Their thick peptidoglycan layer traps the crystal violet-iodine complex after decolorization","They produce a purple pigment naturally","They absorb more of the safranin counterstain"],"answer":1,"explanation":"Gram-positive bacteria have a thick peptidoglycan layer (20–80 nm). During decolorization with acetone-alcohol, the thick peptidoglycan traps the crystal violet-iodine complex inside, preventing it from being washed away → purple color retained. Gram-negative bacteria have thin peptidoglycan + outer membrane — the decolorizer disrupts the outer membrane → complex escapes → then stains pink with safranin."},{"id":"micro-5","topic":"Bacterial Structure","question":"Which of the following is UNIQUE to Gram-negative bacteria?","options":["Peptidoglycan cell wall","Ribosomes","Outer membrane with LPS","Cell membrane (plasma membrane)"],"answer":2,"explanation":"The outer membrane containing lipopolysaccharide (LPS) is unique to Gram-negative bacteria. Both types have peptidoglycan (though in different amounts), ribosomes, and a plasma membrane."},{"id":"micro-6","topic":"Bacterial Structure","question":"A patient goes into septic shock after a Gram-negative bacterial infection. The main mediator of this response is:","options":["Exotoxins secreted by bacteria","Lipopolysaccharide (LPS/endotoxin) released from Gram-negative cell walls","Gram-positive teichoic acids","Bacterial flagella"],"answer":1,"explanation":"LPS (endotoxin) from Gram-negative outer membrane triggers the innate immune response. Macrophages detect LPS via TLR4 → massive cytokine release (TNF-α, IL-1, IL-6) → septic shock (vasodilation, hypotension, multi-organ failure). All parenteral drugs must be tested for LPS contamination (LAL test)."},{"id":"micro-7","topic":"Bacterial Structure","question":"MRSA is resistant to β-lactam antibiotics because of which mechanism?","options":["Increased efflux of β-lactams","Production of β-lactamase that destroys the antibiotic","Altered PBP2a (mecA gene product) with low affinity for β-lactams","Reduced outer membrane permeability"],"answer":2,"explanation":"MRSA carries the mecA gene (on mobile genetic element SCCmec), which encodes PBP2a — an alternative transpeptidase with very low affinity for all β-lactam antibiotics. β-Lactams cannot bind PBP2a → no inhibition → cell wall synthesis continues → resistance. Treatment: vancomycin, linezolid, daptomycin, ceftaroline."},{"id":"micro-8","topic":"Bacterial Structure","question":"Which bacterial structure is responsible for antibiotic resistance gene transfer between bacteria?","options":["Capsule","Plasmid (transferred by conjugation)","Flagella","Endospore"],"answer":1,"explanation":"R-plasmids carry antibiotic resistance genes and are transferred between bacteria primarily by conjugation (sex pilus contact) — even between different species. This is the most clinically important mechanism of resistance spread, explaining rapid emergence of multidrug-resistant organisms."},{"id":"micro-9","topic":"Bacterial Structure","question":"Mycoplasma pneumoniae causes \"walking pneumonia\" and is NOT affected by penicillin. Why?","options":["It has a very thick peptidoglycan layer","It has no cell wall → no penicillin target","It produces penicillinase","It has altered PBPs"],"answer":1,"explanation":"Mycoplasma lacks a cell wall entirely — there is no peptidoglycan. β-Lactam antibiotics target PBPs involved in peptidoglycan synthesis. No cell wall = no target = no effect. Treat with macrolides (azithromycin), tetracyclines (doxycycline), or fluoroquinolones instead."},{"id":"micro-10","topic":"Bacterial Growth","question":"β-Lactam antibiotics are most effective against bacteria in which growth phase?","options":["Lag phase","Log (exponential) phase","Stationary phase","Death phase"],"answer":1,"explanation":"β-Lactams inhibit cell wall synthesis during active cell division. Bacteria in the log phase are actively dividing, synthesizing new cell wall → most susceptible. Stationary-phase bacteria (not actively dividing) and dormant persister cells are much less affected → incomplete killing can lead to relapse."},{"id":"micro-11","topic":"Bacterial Growth","question":"Which spore-forming bacterium releases a toxin that causes flaccid paralysis?","options":["Clostridium tetani","Clostridium botulinum","Bacillus anthracis","Clostridium perfringens"],"answer":1,"explanation":"Clostridium botulinum produces botulinum toxin — the most potent biologic toxin. It cleaves SNARE proteins (VAMP/synaptobrevin) at neuromuscular junctions → prevents acetylcholine vesicle release → flaccid paralysis (versus C. tetani toxin which blocks inhibitory glycine/GABA → spastic paralysis)."},{"id":"micro-12","topic":"Bacterial Growth","question":"The minimum temperature for autoclave sterilization that kills bacterial spores is:","options":["100°C at normal pressure","121°C at 15 psi steam pressure","180°C dry heat","37°C overnight"],"answer":1,"explanation":"121°C at 15 psi saturated steam for 15–20 minutes is the standard autoclave sterilization condition. Boiling (100°C) kills vegetative cells but NOT spores. Dry heat at 160–170°C for 2 hours also sterilizes. The higher temperature achieved under pressure allows killing of highly resistant spores."},{"id":"micro-13","topic":"Viruses","question":"HIV is a retrovirus. Its unique step in replication involves:","options":["Using RNA polymerase to replicate RNA genome","Reverse transcribing RNA into DNA using reverse transcriptase","Lysing the host cell upon release","Using host tRNA directly as genome"],"answer":1,"explanation":"HIV has an RNA genome that is reverse transcribed into DNA by reverse transcriptase (RT) — a uniquely viral enzyme not present in human cells. The DNA is then integrated into the host chromosome by integrase (provirus). NRTIs and NNRTIs target RT; integrase inhibitors target integrase."},{"id":"micro-14","topic":"Viruses","question":"Oseltamivir (Tamiflu) is used to treat influenza. Its mechanism of action is:","options":["Blocking hemagglutinin from attaching to respiratory epithelium","Inhibiting viral neuraminidase → prevents new virus particles from being released","Inhibiting viral RNA polymerase","Blocking M2 ion channel (like amantadine)"],"answer":1,"explanation":"Oseltamivir inhibits neuraminidase, the enzyme influenza uses to cleave sialic acid residues and release new virions from the host cell surface. Without neuraminidase, newly made virions remain clumped together → cannot spread. Must be given within 48 hours of symptom onset for maximum benefit."},{"id":"micro-15","topic":"Viruses","question":"Non-enveloped viruses (e.g., norovirus, hepatitis A) are HARDER to inactivate than enveloped viruses because:","options":["They are larger and harder to destroy","They lack a lipid envelope → alcohol-based sanitizers are less effective; more stable in environment","They replicate faster","They infect more cell types"],"answer":1,"explanation":"Enveloped viruses are easily destroyed by lipid solvents (alcohol, detergents) that disrupt the lipid envelope. Non-enveloped (naked) viruses have no lipid envelope → resist alcohols and drying → persist longer on surfaces → harder to disinfect → more likely to spread by fomites and fecal-oral route (HAV, poliovirus, rotavirus, norovirus)."},{"id":"micro-16","topic":"Viruses","question":"Acyclovir is selectively toxic to HSV-infected cells because:","options":["It is only taken up by HSV virions, not human cells","It is activated (phosphorylated) by viral thymidine kinase in infected cells → selectively inhibits viral DNA polymerase","Human cells lack thymidine kinase","It directly binds HSV capsid proteins"],"answer":1,"explanation":"Acyclovir is a pro-drug. In HSV-infected cells, viral thymidine kinase (TK) phosphorylates acyclovir → acyclovir monophosphate → further phosphorylated to triphosphate by cellular kinases → inhibits viral DNA polymerase (acts as chain terminator). Human TK has very poor affinity → minimal activation in uninfected cells → selective toxicity."},{"id":"micro-17","topic":"Viruses","question":"SARS-CoV-2 enters host cells through which receptor?","options":["CD4","Sialic acid","ACE2 (angiotensin-converting enzyme 2)","CXCR4"],"answer":2,"explanation":"SARS-CoV-2 spike protein binds ACE2 receptor on host cells (especially lung type II pneumocytes, intestinal epithelium, cardiac pericytes). ACE2 is also expressed in kidneys, heart, and brain → explains multi-organ complications. Remdesivir (RNA polymerase inhibitor) and mRNA vaccines (encoding spike protein) target this virus."},{"id":"micro-18","topic":"Fungi","question":"Which antifungal targets ergosterol directly (binds ergosterol and forms pores in fungal membrane)?","options":["Fluconazole","Amphotericin B","Caspofungin","Terbinafine"],"answer":1,"explanation":"Amphotericin B (a polyene) directly binds ergosterol in the fungal cell membrane → forms channels/pores → ion leakage → cell death. This is fungicidal. Fluconazole INHIBITS ergosterol synthesis (azole). Caspofungin targets cell wall. Terbinafine inhibits earlier in ergosterol synthesis pathway."},{"id":"micro-19","topic":"Fungi","question":"Candida albicans oral thrush commonly develops in HIV patients with CD4 count below:","options":["500 cells/μL","350 cells/μL","200 cells/μL","100 cells/μL"],"answer":2,"explanation":"Oropharyngeal candidiasis (thrush) typically occurs when CD4 \u003c 200 cells/μL. Esophageal candidiasis is an AIDS-defining illness (CD4 \u003c 100). PCP pneumonia also occurs at CD4 \u003c 200. Cryptococcal meningitis and CMV retinitis occur at CD4 \u003c 100."},{"id":"micro-20","topic":"Fungi","question":"The mechanism of azole antifungals (fluconazole, itraconazole) is:","options":["Directly binding and disrupting ergosterol in membranes","Inhibiting lanosterol 14α-demethylase (CYP51) → blocking ergosterol synthesis","Inhibiting β-glucan synthesis in fungal cell wall","Inhibiting squalene epoxidase"],"answer":1,"explanation":"Azoles inhibit lanosterol 14α-demethylase (CYP51) — a fungal cytochrome P450 enzyme. This blocks conversion of lanosterol → ergosterol → accumulation of toxic methylated sterols + ergosterol depletion → membrane dysfunction → fungistatic. Important drug interactions: azoles also inhibit human CYP450 enzymes (CYP3A4, 2C9) → affect many drug levels."},{"id":"micro-21","topic":"Fungi","question":"Which antifungal is first-line NA polymerase (encoded by rpoB gene) → blocks transcription initiation. Used for TB (always as part of combination therapy to prevent resistance), leprosy (with dapsone), meningococcal prophylaxis, MRSA decolonization. Major drug interaction: induces CYP450 enzymes → reduces levels of many drugs (warfarin, OCP, HIV drugs)."},{"id":"micro-25","topic":"Antimicrobials","question":"Which antibiotic is used orally for C. difficile colitis?","options":["Vancomycin IV","Metronidazole IV","Vancomycin oral or fidaxomicin oral","Ciprofloxacin oral"],"answer":2,"explanation":"Oral vancomycin is preferred for C. diff colitis because it reaches high concentrations in the gut without systemic absorption. Fidaxomicin (oral) is preferred for severe or recurrent cases. IV vancomycin does NOT reach the gut lumen — ineffective for C. diff. Oral metronidazole may be used for mild initial episodes if cost is a concern."},{"id":"micro-26","topic":"Antimicrobials","question":"VRE (Vancomycin-Resistant Enterococcus) is resistant to vancomycin because:","options":["It produces vancomycinase enzyme","D-Ala-D-Ala is changed to D-Ala-D-Lac → vancomycin cannot bind cell wall precursor","Altered 30S ribosome","Efflux pumps remove vancomycin"],"answer":1,"explanation":"VRE (vanA/vanB genes) modifies the cell wall peptidoglycan precursor terminus from D-Ala-D-Ala to D-Ala-D-Lac. Vancomycin normally binds D-Ala-D-Ala with high affinity. The single substitution of Ala → Lac reduces vancomycin binding ~1000-fold → resistance. Treatment: linezolid, daptomycin, or newer glycopeptides (oritavancin)."},{"id":"micro-27","topic":"Antimicrobials","question":"Aminoglycosides (gentamicin, tobramycin) cause toxicity primarily affecting:","options":["Liver and gallbladder","Kidney (nephrotoxicity) and ears (ototoxicity)","Bone marrow suppression","Peripheral neuropathy"],"answer":1,"explanation":"Aminoglycosides concentrate in renal cortex (proximal tubule cells) → nephrotoxicity (tubular necrosis, ↑creatinine); and in cochlea/vestibular apparatus → ototoxicity (irreversible hearing loss, vestibular damage). Risk factors: age, pre-existing renal disease, concurrent nephrotoxins (NSAIDs, contrast, cisplatin). TDM: peak (efficacy) and trough (toxicity) monitoring required."},{"id":"micro-28","topic":"Sterilization","question":"A pharmacist is preparing IV injections. Which is the most appropriate method for sterilizing a heat-labile protein drug?","options":["Autoclave at 121°C","0.22 μm membrane filtration","Dry heat oven at 160°C","UV radiation"],"answer":1,"explanation":"0.22 μm membrane filtration (sterile filtration) removes bacteria without heat — essential for heat-labile drugs (proteins, peptides, vitamins, some antibiotics). Viruses are not removed by 0.22 μm filters (require 0.02 μm nanofilters). Autoclave and dry heat would denature proteins."},{"id":"micro-29","topic":"Sterilization","question":"Why is 70% ethanol MORE effective as a disinfectant than 100% ethanol?","options":["70% ethanol contains additives that enhance antimicrobial activity","Water is needed for protein denaturation — 100% alcohol dehydrates surface proteins, slowing penetration","70% ethanol is less flammable","100% ethanol is too toxic to microorganisms"],"answer":1,"explanation":"70% ethanol (with 30% water) is optimal because: (1) water is needed for protein denaturation — it facilitates alcohol penetration into cells; (2) 100% alcohol rapidly dehydrates the cell surface, creating a protein coagulation barrier that actually limits penetration. Pure alcohol also evaporates too quickly for adequate contact time."},{"id":"micro-30","topic":"Sterilization","question":"Which disinfectant is sporicidal and required to kill C. diff spores on hospital surfaces?","options":["70% alcohol","Quaternary ammonium compounds (quats)","10% sodium hypochlorite (bleach)","Chlorhexidine"],"answer":2,"explanation":"C. diff spores are resistant to alcohol, quats, and most routine disinfectants. Sodium hypochlorite (10% bleach = 5000 ppm) is required for effective C. diff spore killing on surfaces. This is why C. diff patients require contact precautions AND routine surface disinfection with bleach. Hand washing with soap and water (physical removal) is needed because alcohol hand rubs don't kill spores."},{"id":"micro-31","topic":"Sterilization","question":"The LAL (Limulus Amebocyte Lysate) test is used to detect:","options":["Bacterial cell count in drugs","Fungal contamination","LPS (endotoxin/pyrogen) in injectable pharmaceuticals","Sterility of solid dosage forms"],"answer":2,"explanation":"The LAL test uses lysate from horseshoe crab (Limulus polyphemus) amebocytes, which clot in the presence of LPS (Gram-negative endotoxin). This test detects nanogram quantities of endotoxin. Required for all injectable pharmaceutical products to ensure pyrogenicity is within USP limits. Results in \u003c1 hour versus rabbit pyrogen test which takes hours."},{"id":"micro-32","topic":"Sterilization","question":"Ethylene oxide (EtO) sterilization is preferred for which type of medical products?","options":["Glass syringes","Surgical instruments tolerating high heat","Heat-sensitive devices like endoscopes and catheters","Oral solid dosage forms"],"answer":2,"explanation":"EtO is a gas-phase alkylating agent that sterilizes at low temperatures (~50–60°C). Used for heat-sensitive medical devices (endoscopes, plastic catheters, cardiac stents, surgical kits). Disadvantages: carcinogenic, explosive, requires aeration post-sterilization, slow process (several hours + aeration time)."},{"id":"micro-33","topic":"Bacterial Structure","question":"A patient with pneumococcal meningitis is started on penicillin G. Which mechanism makes penicillin effective against Streptococcus pneumoniae?","options":["Binding to the 30S ribosome and blocking protein synthesis","Inhibiting cell wall synthesis by binding PBPs and blocking peptidoglycan cross-linking","Disrupting the outer membrane and causing ion leakage","Inhibiting DNA gyrase"],"answer":1,"explanation":"Penicillin G binds penicillin-binding proteins (PBPs/transpeptidases) in the S. pneumoniae cell wall → inhibits peptidoglycan cross-linking → osmotic pressure causes cell wall rupture → bactericidal. However, penicillin-resistant S. pneumoniae (PRSP) has altered PBPs with reduced penicillin affinity."},{"id":"micro-34","topic":"Overview","question":"Fungi differ from bacteria in which key way that affects antifungal drug design?","options":["Fungi lack DNA","Fungi are prokaryotes; bacteria are eukaryotes","Fungi are eukaryotes sharing similarities with human cells; targeted drugs must exploit unique fungal structures (ergosterol, chitin, fungal enzymes)","Fungi grow only at room temperature"],"answer":2,"explanation":"Fungi are eukaryotes — this means they share many cellular targets with human cells (80S ribosomes, similar enzymes). Antifungals must target fungal-specific structures: ergosterol (polyenes, azoles), chitin/glucan cell wall (echinocandins), fungal-specific enzymes. This limits the number of safe, selective antifungal targets compared to antibacterial drugs."},{"id":"micro-35","topic":"Antimicrobials","question":"A patient taking rifampicin for TB also takes warfarin for atrial fibrillation. You would expect warfarin blood levels to:","options":["Increase → higher bleeding risk","Decrease → lower anticoagulation effect","Remain unchanged","Double due to additive effects"],"answer":1,"explanation":"Rifampicin is a potent inducer of hepatic CYP450 enzymes (CYP3A4, CYP2C9). Warfarin is metabolized by CYP2C9 (S-warfarin) and CYP3A4. Rifampicin increases metabolism → lower warfarin levels → subtherapeutic anticoagulation → risk of thromboembolism. Warfarin dose must be increased and INR monitored closely."},{"id":"micro-36","topic":"Bacterial Growth","question":"Which antibiotic class is classified as BACTERICIDAL?","options":["Tetracyclines","Macrolides","Chloramphenicol","Fluoroquinolones"],"answer":3,"explanation":"Fluoroquinolones (ciprofloxacin, levofloxacin) are bactericidal — they inhibit DNA gyrase and topoisomerase IV → double-strand DNA breaks → cell death. Tetracyclines, macrolides, and chloramphenicol are bacteriostatic — they inhibit protein synthesis but don't directly kill the cell."},{"id":"micro-37","topic":"Viruses","question":"mRNA vaccines (e.g., Pfizer BNT162b2) against COVID-19 work by:","options":["Introducing live attenuated SARS-CoV-2","Delivering mRNA encoding spike protein → host cells produce spike → immune response generates antibodies","Introducing inactivated spike protein directly","Delivering DNA that permanently changes host genome"],"answer":1,"explanation":"mRNA vaccines deliver lipid nanoparticle-encapsulated mRNA encoding SARS-CoV-2 spike protein. Host ribosomes translate spike protein → immune system recognizes it → generates antibodies and T cells without exposure to actual virus. mRNA does NOT enter the nucleus and is NOT reverse-transcribed into DNA. Degraded after ~days."},{"id":"micro-38","topic":"Fungi","question":"\"Dimorphic fungi are molds in the cold and yeast in the beast.\" This refers to:","options":["Temperature changes from environment to host body temperature cause a morphological change","Antifungal resistance temperature dependence","Laboratory storage conditions","Growth rate at different temperatures"],"answer":0,"explanation":"Dimorphic fungi switch between mold form (at room temperature, environmental state) and yeast form (at body temperature 37°C, when infecting a mammalian host). Examples: Histoplasma capsulatum, Blastomyces dermatitidis, Coccidioides immitis, Paracoccidioides brasiliensis, Sporothrix schenckii. The HBCPS mnemonic: \"Histo, Blasto, Cocci, Para, Sporo\"."},{"id":"micro-39","topic":"Antimicrobials","question":"Which antibiotic CANNOT be used for patients with penicillin allergy (anaphylaxis type)?","options":["Azithromycin","Ciprofloxacin","Ceftriaxone (use with caution — cross-reactivity ~1–2%)","Vancomycin"],"answer":2,"explanation":"Cross-reactivity between penicillins and cephalosporins is low (~1–2%, mostly via similar R1 side chains). In patients with severe penicillin allergy (anaphylaxis), cephalosporins should be used with caution or avoided (particularly those sharing similar R1 side chains). Azithromycin, ciprofloxacin, and vancomycin are structurally unrelated to penicillins and are safe alternatives."},{"id":"micro-40","topic":"Sterilization","question":"Dry heat sterilization at 180°C for 30 minutes is specifically used to:","options":["Sterilize heat-labile liquids","Sterilize glass materials and depyrogenate (destroy endotoxins)","Kill C. diff spores on hospital floors","Sterilize plastic syringes"],"answer":1,"explanation":"Dry heat is used for materials that can tolerate high temperatures AND moisture cannot be used (e.g., glassware, powders, oils). It also DEPYROGENATES — destroys endotoxins (LPS) at temperatures above 250°C (or 180°C for 30 min). Autoclave (moist heat) does NOT depyrogenate. Dry heat is slower than autoclave and requires higher temperatures."}]},{"meta":{"id":"anatomy","title":"Anatomy 1","code":"311241","icon":"🫀","color":"#784212","credits":"4 credits (3 lecture + 3 lab)","semester":"Semester 2, Year 1","description":"Human body systems, organ structure, and drug absorption sites. Essential for understanding pharmacokinetics, route of administration, and drug action.","chapters":[{"id":"terminology","title":"Anatomical Terminology & Body Planes"},{"id":"integumentary","title":"Integumentary System"},{"id":"skeletal","title":"Skeletal System"},{"id":"muscular","title":"Muscular System"},{"id":"nervous","title":"Nervous System"},{"id":"cardiovascular","title":"Cardiovascular System"},{"id":"respiratory","title":"Respiratory System"},{"id":"digestive","title":"Digestive System"},{"id":"renal","title":"Renal & Urinary System"}]},"chapters":{"terminology":{"tag":"Chapter 1 · Anatomy","title":"Anatomical Terminology & Body Planes","overview":"Standardized anatomical language allows precise communication about body structures. Understanding anatomical position, planes, and directional terms is the foundation of anatomy.","sections":[{"title":"Anatomical Position","content":"\n          \u003cp>The standard anatomical position: body upright, facing forward, feet flat on floor, arms at sides with palms facing forward (supinated). ALL directional terms are relative to this position regardless of actual body orientation.\u003c/p>\n        "},{"title":"Directional Terms","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Term\u003c/th>\u003cth>Opposite\u003c/th>\u003cth>Definition\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Superior (cranial)\u003c/td>\u003ctd>Inferior (caudal)\u003c/td>\u003ctd>Toward head / Away from head\u003c/td>\u003ctd>The heart is superior to the stomach\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Anterior (ventral)\u003c/td>\u003ctd>Posterior (dorsal)\u003c/td>\u003ctd>Toward front / Toward back\u003c/td>\u003ctd>The sternum is anterior to the heart\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Medial\u003c/td>\u003ctd>Lateral\u003c/td>\u003ctd>Toward midline / Away from midline\u003c/td>\u003ctd>The nose is medial to the eyes\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Proximal\u003c/td>\u003ctd>Distal\u003c/td>\u003ctd>Closer to point of attachment / Further from point of attachment\u003c/td>\u003ctd>The elbow is proximal to the wrist\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Superficial (external)\u003c/td>\u003ctd>Deep (internal)\u003c/td>\u003ctd>Toward surface / Away from surface\u003c/td>\u003ctd>Skin is superficial to muscle\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Ipsilateral\u003c/td>\u003ctd>Contralateral\u003c/td>\u003ctd>Same side / Opposite side\u003c/td>\u003ctd>Ipsilateral arm and leg on right side\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "},{"title":"Body Planes & Sections","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Plane\u003c/th>\u003cth>Also Called\u003c/th>\u003cth>Division\u003c/th>\u003cth>Pharmacology Link\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Sagittal\u003c/td>\u003ctd>Median (if midsagittal)\u003c/td>\u003ctd>Left and right portions\u003c/td>\u003ctd>Used in neuroimaging for drug distribution to brain hemispheres\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Frontal\u003c/td>\u003ctd>Coronal\u003c/td>\u003ctd>Anterior and posterior portions\u003c/td>\u003ctd>CT/MRI imaging for drug localization\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Transverse\u003c/td>\u003ctd>Horizontal, Axial\u003c/td>\u003ctd>Superior and inferior portions\u003c/td>\u003ctd>CT imaging; oral drug absorption at different GI levels\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003ch4>Body Cavities\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Dorsal cavity:\u003c/strong> Cranial cavity (brain) + Vertebral/spinal canal (spinal cord)\u003c/li>\n            \u003cli>\u003cstrong>Ventral cavity:\u003c/strong>\n              \u003cul>\n                \u003cli>Thoracic cavity: Pleural cavities (lungs) + Mediastinum (heart, great vessels)\u003c/li>\n                \u003cli>Abdominopelvic cavity: Abdominal (liver, stomach, intestines, kidneys) + Pelvic (bladder, reproductive organs, rectum)\u003c/li>\n              \u003c/ul>\n            \u003c/li>\n          \u003c/ul>\n        "}],"keyTerms":[{"term":"Anatomical position","def":"Reference position: body erect, facing forward, arms at sides, palms forward."},{"term":"Sagittal plane","def":"Vertical plane dividing body into left and right portions."},{"term":"Transverse pla
