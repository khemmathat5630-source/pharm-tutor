d on the NUMBER of solute particles, not their identity.\u003c/p>\n          \u003cul>\n            \u003cli>\u003cstrong>Vapor pressure lowering:\u003c/strong> ΔP = X_solute × P°_solvent (Raoult's Law)\u003c/li>\n            \u003cli>\u003cstrong>Boiling point elevation:\u003c/strong> ΔT_b = i × K_b × m\u003c/li>\n            \u003cli>\u003cstrong>Freezing point depression:\u003c/strong> ΔT_f = i × K_f × m\u003c/li>\n            \u003cli>\u003cstrong>Osmotic pressure:\u003c/strong> π = MRT (i factor for electrolytes)\u003c/li>\n          \u003c/ul>\n          \u003cp>\u003cstrong>Van't Hoff factor (i):\u003c/strong> Number of particles produced per formula unit. NaCl: i = 2 (Na⁺ + Cl⁻). MgCl₂: i = 3.\u003c/p>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>Tonicity and IV fluids:\u003c/strong> Osmolarity of plasma ≈ 285–295 mOsm/L. Isotonic solutions (0.9% NaCl, 5% dextrose) match plasma osmolarity. IV fluids with very different tonicity cause hemolysis (hypotonic) or crenation (hypertonic).\u003c/div>\n        "},{"title":"Solubility Factors","content":"\n          \u003cul>\n            \u003cli>\u003cstrong>\"Like dissolves like\":\u003c/strong> Polar solutes in polar solvents; nonpolar in nonpolar\u003c/li>\n            \u003cli>\u003cstrong>Temperature:\u003c/strong> Solid solubility usually ↑ with temperature; gas solubility ↓ with temperature\u003c/li>\n            \u003cli>\u003cstrong>Pressure:\u003c/strong> Gas solubility ∝ pressure (Henry's Law); solid/liquid solubility unaffected by pressure\u003c/li>\n            \u003cli>\u003cstrong>Particle size:\u003c/strong> Smaller particles dissolve faster (more surface area)\u003c/li>\n            \u003cli>\u003cstrong>pH:\u003c/strong> Affects ionization of weak acid/base drugs → affects solubility\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"info-box key\">\u003cstrong>Pharmaceutical solubility:\u003c/strong> Most drugs are weak acids or bases. Weak acids more soluble at high pH (ionized). Weak bases more soluble at low pH. Used to adjust drug solubility in formulation (e.g., using HCl salt of amine drugs).\u003c/div>\n        "}],"keyTerms":[{"term":"Molarity (M)","def":"Moles of solute per liter of solution. Most common unit in pharmacy."},{"term":"Osmolarity","def":"Total concentration of all solute particles in solution; measured in mOsm/L."},{"term":"Colligative property","def":"Property (boiling point, freezing point, osmotic pressure) that depends only on solute particle number, not identity."},{"term":"Van't Hoff factor (i)","def":"Number of particles produced per formula unit of solute upon dissolution."},{"term":"Raoult's Law","def":"Vapor pressure of solution = mole fraction of solvent × vapor pressure of pure solvent."}]}},"pq":[{"id":"c1-1","topic":"Atomic Structure","question":"How many electrons can the 3d subshell hold?","options":["2","6","10","14"],"answer":2,"explanation":"d orbitals (l=2) have 5 orbitals (mₗ = −2,−1,0,+1,+2). Each orbital holds 2 electrons. 5 × 2 = 10 electrons maximum in d subshell."},{"id":"c1-2","topic":"Atomic Structure","question":"Electronegativity INCREASES moving:","options":["Down a group and left across a period","Down a group and right across a period","Up a group and left across a period","Up a group and right across a period"],"answer":3,"explanation":"Electronegativity increases going UP a group (fewer shells, nucleus attracts e⁻ more strongly) and RIGHT across a period (more protons, same shell, stronger nuclear attraction). Fluorine (top right) has the highest electronegativity (4.0)."},{"id":"c1-3","topic":"Atomic Structure","question":"An element has atomic number 17 and mass number 35. How many neutrons does it have?","options":["17","18","35","52"],"answer":1,"explanation":"Neutrons = Mass number − Atomic number = 35 − 17 = 18. This is chlorine-35 (³⁵Cl). Chlorine also has a ³⁷Cl isotope with 20 neutrons."},{"id":"c1-4","topic":"Atomic Structure","question":"According to Hund's Rule, electrons in degenerate orbitals:","options":["Pair up in the first orbital before filling others","Each enter a separate orbital with parallel spins before pairing","Fill in order of increasing energy","Cannot occupy the same orbital"],"answer":1,"explanation":"Hund's rule: maximize unpaired electrons — one electron enters each degenerate orbital with the same spin before any pairing occurs. This minimizes electron repulsion and produces a more stable configuration."},{"id":"c1-5","topic":"Bonding","question":"Water (H₂O) has a bent molecular geometry. What is the approximate H-O-H bond angle?","options":["180°","120°","109.5°","104.5°"],"answer":3,"explanation":"H₂O has 4 electron pairs around oxygen (2 bonding + 2 lone pairs). Lone pairs exert greater repulsion than bonding pairs, compressing the H-O-H angle from ideal tetrahedral 109.5° to ~104.5°."},{"id":"c1-6","topic":"Bonding","question":"Which of the following IMFs is responsible for the unusually high boiling point of water compared to H₂S?","options":["London dispersion forces","Dipole-dipole interactions","Hydrogen bonding","Ion-dipole forces"],"answer":2,"explanation":"Water forms extensive hydrogen bonds (O-H···O) due to the highly electronegative oxygen and hydrogen bonded directly to it. H₂S has only weak dipole-dipole forces. Hydrogen bonding is much stronger, giving water its anomalously high boiling point (100°C vs H₂S at −60°C)."},{"id":"c1-7","topic":"Bonding","question":"CO₂ has polar C=O bonds but is a nonpolar molecule because:","options":["Carbon has equal electronegativity to oxygen","The linear geometry causes dipole moments to cancel","It has no lone pairs on carbon","It is a gas at room temperature"],"answer":1,"explanation":"CO₂ is linear (O=C=O). The two C=O bond dipoles point in exactly opposite directions and cancel each other exactly → net dipole moment = 0 → nonpolar molecule. This is why CO₂ is poorly soluble in water despite having polar bonds."},{"id":"c1-8","topic":"Bonding","question":"A drug molecule with high log P value (e.g., log P = 5) would be expected to:","options":["Have high water solubility","Cross biological membranes easily by passive diffusion","Be poorly absorbed from the gastrointestinal tract","Have no protein binding"],"answer":1,"explanation":"High log P = highly lipophilic = dissolves preferentially in octanol (lipid) over water. Lipophilic drugs passively diffuse through lipid membranes. However, very high log P (>5) may also cause poor solubility (Lipinski's Rule of Five: log P ≤ 5 for oral drugs)."},{"id":"c1-9","topic":"Thermodynamics","question":"Which combination of ΔH and ΔS always results in a spontaneous reaction at ANY temperature?","options":["ΔH > 0, ΔS > 0","ΔH \u003c 0, ΔS \u003c 0","ΔH \u003c 0, ΔS > 0","ΔH > 0, ΔS \u003c 0"],"answer":2,"explanation":"ΔG = ΔH − TΔS. When ΔH \u003c 0 (exothermic) AND ΔS > 0 (increasing disorder): ΔG = negative − T(positive) = always negative → always spontaneous at any temperature. This is the most favorable thermodynamic situation."},{"id":"c1-10","topic":"Thermodynamics","question":"The heat of combustion of glucose (C₆H₁₂O₆) is −2803 kJ/mol. This value is negative because:","options":["The reaction requires energy input","Energy is released to the surroundings (exothermic)","Entropy decreases","Products have higher enthalpy than reactants"],"answer":1,"explanation":"Negative ΔH indicates an exothermic reaction — heat is released to the surroundings. Combustion/oxidation of organic molecules releases energy. Our bodies use this energy (via cellular respiration) to drive metabolism. ΔH = H_products − H_reactants \u003c 0 means products are at lower energy."},{"id":"c1-11","topic":"Thermodynamics","question":"A reaction has ΔG° = −35 kJ/mol. Using ΔG° = −RT ln K, the equilibrium constant K is:","options":["Much less than 1","Equal to 1","Much greater than 1","Equal to 35"],"answer":2,"explanation":"ΔG° = −RT ln K → ln K = −ΔG°/(RT). With ΔG° = −35,000 J/mol and RT ≈ 2478 J/mol (at 25°C): ln K = 35000/2478 ≈ 14.1 → K = e^14.1 ≈ 1.3 × 10⁶ >> 1. Large negative ΔG° → large K → products strongly favored."},{"id":"c1-12","topic":"Equilibrium","question":"For the reaction N₂(g) + 3H₂(g) ⇌ 2NH₃(g), increasing pressure will:","options":["Shift equilibrium toward reactants (left)","Shift equilibrium toward products (right)","Have no effect on equilibrium position","Increase the equilibrium constant K"],"answer":1,"explanation":"Increasing pressure shifts equilibrium toward the side with FEWER moles of gas. Reactant side: 1 + 3 = 4 mol gas. Product side: 2 mol gas. So equilibrium shifts right (toward NH₃ products). Note: pressure does not change K."},{"id":"c1-13","topic":"Equilibrium","question":"For a reaction at equilibrium, Q \u003c K means:","options":["The reaction must proceed in reverse","The reaction must proceed forward to reach equilibrium","The system is already at equilibrium","More reactant must be added"],"answer":1,"explanation":"Q \u003c K means the ratio of products to reactants is less than at equilibrium. The system needs to increase products → reaction proceeds forward (right) to reach equilibrium where Q = K."},{"id":"c1-14","topic":"Equilibrium","question":"The Ksp of AgCl is 1.8 × 10⁻¹⁰. What is the molar solubility of AgCl in pure water?","options":["1.8 × 10⁻¹⁰ M","1.34 × 10⁻⁵ M","3.6 × 10⁻¹⁰ M","9 × 10⁻⁵ M"],"answer":1,"explanation":"AgCl ⇌ Ag⁺ + Cl⁻; Ksp = [Ag⁺][Cl⁻] = s² = 1.8 × 10⁻¹⁰. Solving: s = √(1.8 × 10⁻¹⁰) = 1.34 × 10⁻⁵ M. This is the molar solubility of AgCl in pure water."},{"id":"c1-15","topic":"Equilibrium","question":"Adding a catalyst to a reaction at equilibrium will:","options":["Shift equilibrium toward products","Shift equilibrium toward reactants","Increase the rate of both forward and reverse reactions equally","Increase K"],"answer":2,"explanation":"Catalysts lower activation energy for BOTH forward and reverse reactions equally → both rates increase equally → equilibrium position (K) is unchanged. Catalysts help reach equilibrium faster but do not change the equilibrium constant or position."},{"id":"c1-16","topic":"Acid-Base","question":"Calculate the pH of a 0.01 M HCl solution (strong acid).","options":["1","2","7","12"],"answer":1,"explanation":"HCl is a strong acid and completely dissociates: [H⁺] = 0.01 M = 10⁻². pH = −log(10⁻²) = 2."},{"id":"c1-17","topic":"Acid-Base","question":"Aspirin has a pKa of 3.5. In blood (pH 7.4), aspirin exists predominantly as:","options":["Un-ionized (neutral form, HA)","Ionized (conjugate base, A⁻)","Equal amounts of HA and A⁻","Completely protonated"],"answer":1,"explanation":"Using H-H equation: pH = pKa + log([A⁻]/[HA]) → 7.4 = 3.5 + log([A⁻]/[HA]) → log([A⁻]/[HA]) = 3.9 → [A⁻]/[HA] = 7943:1. Aspirin is predominantly ionized (A⁻) in blood. Un-ionized form is present but very small fraction."},{"id":"c1-18","topic":"Acid-Base","question":"A buffer solution contains equal concentrations of acetic acid (pKa 4.74) and acetate. What is the pH of this buffer?","options":["2.37","4.74","7.0","9.48"],"answer":1,"explanation":"H-H equation: pH = pKa + log([A⁻]/[HA]). When [A⁻] = [HA]: log(1) = 0. Therefore pH = pKa = 4.74. Buffer capacity is maximal when pH = pKa."},{"id":"c1-19","topic":"Acid-Base","question":"Which of the following is the STRONGEST acid?","options":["HF (pKa = 3.2)","CH₃COOH (pKa = 4.74)","H₂CO₃ (pKa = 6.35)","H₃PO₄ (pKa = 2.15)"],"answer":3,"explanation":"Stronger acid = lower pKa. H₃PO₄ has pKa = 2.15, which is the lowest → strongest acid. Remember: pKa = −log Ka, so lower pKa = larger Ka = more dissociation = stronger acid."},{"id":"c1-20","topic":"Acid-Base","question":"A patient with aspirin overdose is treated with sodium bicarbonate (NaHCO₃). The goal is to:","options":["Neutralize aspirin directly in the stomach","Alkalinize urine to increase aspirin ionization and renal excretion","Decrease blood pH to reduce aspirin toxicity","Increase protein binding of aspirin"],"answer":1,"explanation":"Sodium bicarbonate alkalinizes the urine. At high urine pH, aspirin (weak acid, pKa 3.5) is mostly ionized (A⁻). Ionized drugs cannot cross membranes → aspirin is trapped in urine → cannot be reabsorbed → increased excretion. This is \"ion trapping\" — a clinical application of H-H equation."},{"id":"c1-21","topic":"Gas Laws","question":"A gas has volume 5.0 L at 1.0 atm. What is its volume at 2.0 atm (constant temperature)?","options":["10.0 L","5.0 L","2.5 L","1.0 L"],"answer":2,"explanation":"Boyle's Law: P₁V₁ = P₂V₂ → (1.0)(5.0) = (2.0)(V₂) → V₂ = 2.5 L. Pressure and volume are inversely proportional at constant temperature."},{"id":"c1-22","topic":"Gas Laws","question":"How many moles of gas are in a 10.0 L container at 25°C and 2.0 atm? (R = 0.08206 L·atm/mol·K)","options":["0.41 mol","0.82 mol","4.89 mol","16.3 mol"],"answer":1,"explanation":"PV = nRT → n = PV/RT = (2.0 × 10.0) / (0.08206 × 298) = 20.0 / 24.45 ≈ 0.82 mol. Always convert T to Kelvin: 25 + 273 = 298 K."},{"id":"c1-23","topic":"Gas Laws","question":"Dalton's Law of Partial Pressures states that:","options":["Equal volumes of gases at same T and P contain equal numbers of molecules","Total pressure = sum of individual partial pressures","Gas pressure is inversely proportional to volume","Gas volume is directly proportional to temperature"],"answer":1,"explanation":"Dalton's Law: P_total = P₁ + P₂ + P₃ + ... Each gas exerts pressure independently. Avogadro's Law states equal volumes at same T and P contain equal molecules. Boyle's Law = PV constant. Charles's Law = V/T constant."},{"id":"c1-24","topic":"Solutions","question":"Which colligative property is most relevant for understanding IV fluid tonicity?","options":["Vapor pressure lowering","Boiling point elevation","Osmotic pressure","Freezing point depression"],"answer":2,"explanation":"Osmotic pressure directly determines tonicity — the tendency of water to move across semipermeable membranes (like red blood cell membranes). Isotonic IV solutions match blood osmotic pressure (~285 mOsm/L) to prevent hemolysis or crenation."},{"id":"c1-25","topic":"Solutions","question":"NaCl dissociates into 2 particles (Na⁺ + Cl⁻) in solution. What is the osmolarity of a 0.9% (0.154 M) NaCl solution?","options":["0.154 mOsm/L","154 mOsm/L","308 mOsm/L","462 mOsm/L"],"answer":2,"explanation":"Osmolarity = Molarity × i (Van't Hoff factor). For NaCl: i = 2. Osmolarity = 0.154 mol/L × 2 = 0.308 mol/L = 308 mOsm/L. This matches plasma osmolarity (~285–295 mOsm/L) → isotonic saline is approximately isotonic."},{"id":"c1-26","topic":"Solutions","question":"The concentration of a drug solution is 500 mg in 250 mL. Express this as mg/mL and as % w/v.","options":["1 mg/mL, 0.1% w/v","2 mg/mL, 0.2% w/v","5 mg/mL, 0.5% w/v","10 mg/mL, 1.0% w/v"],"answer":1,"explanation":"500 mg / 250 mL = 2 mg/mL. For % w/v: (g solute / 100 mL solution) × 100 = (0.5 g / 250 mL) × 100 mL = 0.5/2.5 = 0.2% w/v. Alternatively: 2 mg/mL × (1 g/1000 mg) × 100 mL = 0.2% w/v."},{"id":"c1-27","topic":"Acid-Base","question":"The bicarbonate buffer in blood has pKa = 6.1. At physiological pH 7.4, the ratio [HCO₃⁻]/[H₂CO₃] is:","options":["About 1:1","About 20:1","About 1:20","About 100:1"],"answer":1,"explanation":"H-H: pH = pKa + log([HCO₃⁻]/[H₂CO₃]) → 7.4 = 6.1 + log(ratio) → log(ratio) = 1.3 → ratio = 10^1.3 ≈ 20:1. Blood has ~20× more bicarbonate than carbonic acid. Despite pKa not being at 7.4, bicarbonate is effective because CO₂ is continuously regulated by breathing."},{"id":"c1-28","topic":"Thermodynamics","question":"Drug hydrolysis in aqueous solution (degradation) typically has ΔG \u003c 0. This means:","options":["The drug will spontaneously reform from degradation products","The drug spontaneously degrades — degradation is thermodynamically favorable","Degradation requires heat input","Degradation won't occur at room temperature"],"answer":1,"explanation":"ΔG \u003c 0 means the reaction is spontaneous — degradation will proceed without energy input. This is a major challenge in pharmaceutical formulation. Solutions include refrigeration (ΔG less negative at lower T for many reactions), anhydrous formulations, pH optimization, and antioxidants."},{"id":"c1-29","topic":"Bonding","question":"Which molecule has the STRONGEST intermolecular forces?","options":["CH₄ (nonpolar, MW = 16)","NH₃ (H-bonding, MW = 17)","HCl (dipole, MW = 36.5)","Ar (noble gas, MW = 40)"],"answer":1,"explanation":"NH₃ forms hydrogen bonds (N has lone pair + N-H bonds) — much stronger than London dispersion (CH₄, Ar) or dipole-dipole (HCl). NH₃ boiling point = −33°C; CH₄ = −161°C; Ar = −186°C. NH₃'s higher boiling point reflects stronger IMFs."},{"id":"c1-30","topic":"Equilibrium","question":"For an exothermic reaction at equilibrium, INCREASING temperature will:","options":["Increase K and shift toward products","Decrease K and shift toward reactants","Have no effect on K","Increase pressure and shift toward products"],"answer":1,"explanation":"For exothermic reactions (ΔH \u003c 0), heat is a \"product.\" Increasing temperature adds heat → equilibrium shifts LEFT (toward reactants) to consume excess heat → K DECREASES. This is important in pharmaceutical chemistry: many hydrolysis reactions are exothermic → refrigeration decreases degradation rate AND reduces equilibrium extent."},{"id":"c1-31","topic":"Acid-Base","question":"A morphine solution (weak base, pKa of conjugate acid BH⁺ = 8.0) is at pH 7.4. What percentage is in the un-ionized free base form (B)?","options":["~80% ionized (BH⁺)","~80% un-ionized (B)","~50% ionized","~20% ionized"],"answer":0,"explanation":"For a base: pH = pKa + log([B]/[BH⁺]) → 7.4 = 8.0 + log([B]/[BH⁺]) → log([B]/[BH⁺]) = −0.6 → [B]/[BH⁺] = 0.25. So BH⁺:B = 4:1, meaning ~80% is ionized (BH⁺) and ~20% is un-ionized (B) at pH 7.4. Only the un-ionized form (B) crosses membranes."},{"id":"c1-32","topic":"Solutions","question":"Why do gases become LESS soluble in water as temperature increases?","options":["Gases condense at higher temperatures","Dissolution of gases is exothermic; higher T shifts equilibrium toward undissolved gas","Water evaporates and removes gas","Higher T increases gas kinetic energy only"],"answer":1,"explanation":"Gas dissolution is exothermic (ΔH \u003c 0). By Le Châtelier's Principle, increasing temperature (adding heat) shifts equilibrium toward LESS dissolution (undissolved gas). This explains why O₂ solubility decreases in warm water (fish die in hot water) and why carbonated beverages go flat faster when warm."},{"id":"c1-33","topic":"Atomic Structure","question":"Radioactive ¹⁴C (carbon-14) is used in drug metabolism studies because:","options":["It has different chemical properties than ¹²C","It can be detected by radiation counters even in tiny amounts","It reacts faster than normal carbon","It is non-radioactive and safe"],"answer":1,"explanation":"¹⁴C is a radioactive isotope with same chemical properties as ¹²C (same Z=6, same bonding) but emits beta radiation → detectable at very low concentrations. Used to trace drug metabolic pathways by labeling drug with ¹⁴C and tracking radioactivity in urine, feces, expired CO₂, etc."},{"id":"c1-34","topic":"Thermodynamics","question":"What does Hess's Law allow us to calculate?","options":["Activation energy of a reaction","ΔH for a reaction using heats of formation or other reaction enthalpies","The rate constant of a reaction","The equilibrium constant K"],"answer":1,"explanation":"Hess's Law states that ΔH for a reaction is the sum of ΔH for each step in the reaction pathway, regardless of the actual mechanism. This allows calculation of ΔH°rxn = Σ ΔH°f(products) − Σ ΔH°f(reactants) using tabulated standard enthalpies of formation."},{"id":"c1-35","topic":"Bonding","question":"Drug-receptor binding often involves multiple types of interactions. Which interaction is MOST specific and directional?","options":["London dispersion forces","Ionic interactions","Hydrogen bonds","Van der Waals contacts"],"answer":2,"explanation":"Hydrogen bonds are highly directional (optimal angle ~180°, distance ~2.5–3.5 Å) AND specific (require appropriate donor: N-H, O-H; and acceptor: lone pair on N, O). This directionality makes H-bonds critical for drug selectivity at binding sites. Ionic bonds are strong but less directional; London forces are weak and non-directional."},{"id":"c1-36","topic":"Gas Laws","question":"At STP (0°C, 1 atm), 1 mole of ideal gas occupies:","options":["11.2 L","22.4 L","24.5 L","2.24 L"],"answer":1,"explanation":"At STP (Standard Temperature and Pressure: 0°C = 273.15 K, 1 atm), 1 mol ideal gas occupies 22.4 L. Note: at 25°C (298 K) and 1 atm (SATP), 1 mol occupies 24.5 L. Use 22.4 L for STP calculations."},{"id":"c1-37","topic":"Acid-Base","question":"An IV solution containing both calcium gluconate and sodium bicarbonate would be problematic because:","options":["The mixture would become too acidic","CaCO₃ would precipitate (Ksp very low)","The solution would become too basic","Calcium would react with sodium"],"answer":1,"explanation":"Ca²⁺ + CO₃²⁻ → CaCO₃ precipitates because Ksp of CaCO₃ is very small (3.3 × 10⁻⁹). In a mixture, Q > Ksp → precipitation occurs. CaCO₃ particles could cause phlebitis or emboli. This is a classic example of IV incompatibility based on solubility equilibria."},{"id":"c1-38","topic":"Equilibrium","question":"Le Châtelier's Principle explains why removing a product from a reaction causes the reaction to:","options":["Slow down and eventually stop","Shift toward the products (forward direction)","Shift toward the reactants (reverse direction)","Reach a new equilibrium with the same K"],"answer":1,"explanation":"Removing a product (decreasing its concentration) makes Q \u003c K → system shifts forward (right) to replenish the removed product and restore Q = K. The equilibrium constant K itself doesn't change (only changes with temperature)."},{"id":"c1-39","topic":"Solutions","question":"The van't Hoff factor (i) for MgCl₂ in dilute aqueous solution is approximately:","options":["1","2","3","4"],"answer":2,"explanation":"MgCl₂ → Mg²⁺ + 2Cl⁻. Produces 3 particles per formula unit → i = 3. This means MgCl₂ has a 3× greater effect on colligative properties than an equivalent concentration of a nonelectrolyte."},{"id":"c1-40","topic":"Thermodynamics","question":"The melting of ice at 0°C, 1 atm is a spontaneous process (ΔG = 0 at melting point). At 37°C, ice would melt with:","options":["ΔG > 0","ΔG = 0","ΔG \u003c 0","ΔG depends only on ΔH"],"answer":2,"explanation":"At 37°C (above melting point), ice melting is spontaneous → ΔG \u003c 0. ΔG = ΔH − TΔS. Melting has ΔH > 0 (endothermic) but also ΔS > 0 (liquid more disordered than solid). At temperatures above 0°C, the TΔS term dominates → ΔG becomes negative → spontaneous melting."},{"id":"c1-41","topic":"Bonding","question":"Which of the following compounds would be expected to have the HIGHEST boiling point?","options":["Propane (C₃H₈, MW=44)","Propanol (C₃H₇OH, MW=60)","Dimethyl ether (CH₃OCH₃, MW=46)","Propanone/acetone (CH₃COCH₃, MW=58)"],"answer":1,"explanation":"Propanol has an O-H group → forms hydrogen bonds (strongest IMF). H-bonds require much more energy to break than the dipole-dipole forces in dimethyl ether/acetone or London forces in propane. Boiling points: propane −42°C, dimethyl ether −24°C, acetone 56°C, propanol 97°C."},{"id":"c1-42","topic":"Acid-Base","question":"If blood pH falls from 7.4 to 7.1 (acidosis), what happens to drug distribution of a weak acid (pKa = 5)?","options":["More drug enters cells (less ionized in blood)","Distribution unchanged — only pH determines ionization","The ratio of ionized to un-ionized drug changes, potentially increasing free drug in blood","Drug becomes completely un-ionized"],"answer":2,"explanation":"Even at pH 7.1, a weak acid with pKa 5 is still ~99.4% ionized (highly ionized). The small change in pH slightly decreases ionization → tiny increase in un-ionized form → could increase free drug and membrane permeability. In acidosis, weak acid drugs may show slightly altered distribution."},{"id":"c1-43","topic":"Gas Laws","question":"Nitrous oxide (N₂O) is stored as a liquid in cylinders at room temperature. As the cylinder empties, the pressure gauge reads full until almost all liquid is gone. This is explained by:","options":["Dalton's Law","Charles's Law","The liquid-gas equilibrium (vapor pressure remains constant while liquid remains)","Boyle's Law"],"answer":2,"explanation":"As long as liquid N₂O is present, the gas phase is in equilibrium with the liquid at a fixed vapor pressure (at constant temperature). The pressure gauge reads the vapor pressure, which stays constant until the last drop of liquid evaporates. This is why N₂O cylinders give no warning before running out — unlike O₂ (stored as gas only)."},{"id":"c1-44","topic":"Atomic Structure","question":"Transition metals (d-block) are often used in drug design because they can:","options":["Form ionic bonds only","Exist in multiple oxidation states and coordinate to ligands (chelation)","Act as strong acids","React only with water"],"answer":1,"explanation":"Transition metals have multiple oxidation states and can coordinate to Lewis base ligands via coordinate (dative) bonds. This is the basis of cisplatin (platinum-based cancer drug) and many metal chelation therapies. Examples: cisplatin (Pt), carboplatin (Pt), bleomycin (Fe), deferoxamine (chelates Fe³⁺ in iron overload)."},{"id":"c1-45","topic":"Solutions","question":"A patient receives 1 L of hypotonic saline (0.45% NaCl) IV instead of normal saline (0.9% NaCl). The immediate risk is:","options":["Crenation of red blood cells","Hemolysis of red blood cells","Hypertension from sodium overload","Crystallization in veins"],"answer":1,"explanation":"0.45% NaCl is hypotonic (osmolarity ~154 mOsm/L vs blood ~290 mOsm/L). Water moves by osmosis INTO red blood cells (from low solute → high solute inside cells) → RBCs swell → hemolysis (lysis). Large IV doses of hypotonic fluids cause hemolysis, hyponatremia, and cerebral edema."},{"id":"c1-46","topic":"Acid-Base","question":"A buffer with pKa = 7.0 is most effective at resisting pH changes at pH:","options":["5.0","7.0","9.0","7.4"],"answer":1,"explanation":"Buffer capacity is maximum when pH = pKa (equal concentrations of acid and conjugate base). At pH 7.0 = pKa, the buffer has equal amounts of weak acid and conjugate base, giving maximum ability to absorb both added acid and added base."},{"id":"c1-47","topic":"Thermodynamics","question":"At 25°C, if ΔG° = 0 for a reaction, then K =","options":["0","1","100","Infinite"],"answer":1,"explanation":"ΔG° = −RT ln K. If ΔG° = 0: 0 = −RT ln K → ln K = 0 → K = e⁰ = 1. When K = 1, products and reactants are present in equal concentrations at equilibrium."},{"id":"c1-48","topic":"Equilibrium","question":"Antacids containing Al(OH)₃ neutralize stomach acid (HCl). This is a(n) _______ reaction that shifts equilibrium by _______.","options":["Endothermic; adding product","Acid-base; removing H⁺ (product neutralization)","Redox; oxidizing HCl","Precipitation; forming Al₂Cl₃"],"answer":1,"explanation":"Al(OH)₃ + 3HCl → AlCl₃ + 3H₂O. This is an acid-base neutralization. By removing H⁺ (neutralizing it), the equilibrium of stomach acid production shifts. Additionally, the driving force is the formation of water (very stable product, K >> 1). This is the principle behind antacid therapy."},{"id":"c1-49","topic":"Gas Laws","question":"Henry's Law is most relevant for which pharmaceutical application?","options":["Tablet dissolution testing","Inhalation anesthetic uptake in blood","Oral drug absorption","Protein binding of drugs"],"answer":1,"explanation":"Henry's Law states amount of gas dissolved ∝ partial pressure. This directly governs how inhalation anesthetics (e.g., halothane, sevoflurane) dissolve in blood — their blood:gas partition coefficient determines speed of onset and recovery from anesthesia. Also relevant to O₂/CO₂ transport and decompression sickness."},{"id":"c1-50","topic":"Bonding","question":"Penicillin's β-lactam ring is reactive and undergoes hydrolysis. The ring's instability is related to:","options":["Its high molecular weight","Ring strain in the 4-membered β-lactam ring increasing reactivity","London dispersion forces","Low electronegativity of nitrogen"],"answer":1,"explanation":"The β-lactam ring is a 4-membered cyclic amide. 4-membered rings have severe angle strain (bond angles ~90° vs ideal amide 120°). This strain makes the C-N bond highly susceptible to nucleophilic attack by bacterial transpeptidase (and also to hydrolysis → inactivation). β-lactamase enzymes exploit this ring strain to hydrolyze and inactivate penicillins."}],"eq":[{"id":"c1-1","topic":"Atomic Structure","question":"How many electrons can the 3d subshell hold?","options":["2","6","10","14"],"answer":2,"explanation":"d orbitals (l=2) have 5 orbitals (mₗ = −2,−1,0,+1,+2). Each orbital holds 2 electrons. 5 × 2 = 10 electrons maximum in d subshell."},{"id":"c1-2","topic":"Atomic Structure","question":"Electronegativity INCREASES moving:","options":["Down a group and left across a period","Down a group and right across a period","Up a group and left across a period","Up a group and right across a period"],"answer":3,"explanation":"Electronegativity increases going UP a group (fewer shells, nucleus attracts e⁻ more strongly) and RIGHT across a period (more protons, same shell, stronger nuclear attraction). Fluorine (top right) has the highest electronegativity (4.0)."},{"id":"c1-3","topic":"Atomic Structure","question":"An element has atomic number 17 and mass number 35. How many neutrons does it have?","options":["17","18","35","52"],"answer":1,"explanation":"Neutrons = Mass number − Atomic number = 35 − 17 = 18. This is chlorine-35 (³⁵Cl). Chlorine also has a ³⁷Cl isotope with 20 neutrons."},{"id":"c1-4","topic":"Atomic Structure","question":"According to Hund's Rule, electrons in degenerate orbitals:","options":["Pair up in the first orbital before filling others","Each enter a separate orbital with parallel spins before pairing","Fill in order of increasing energy","Cannot occupy the same orbital"],"answer":1,"explanation":"Hund's rule: maximize unpaired electrons — one electron enters each degenerate orbital with the same spin before any pairing occurs. This minimizes electron repulsion and produces a more stable configuration."},{"id":"c1-5","topic":"Bonding","question":"Water (H₂O) has a bent molecular geometry. What is the approximate H-O-H bond angle?","options":["180°","120°","109.5°","104.5°"],"answer":3,"explanation":"H₂O has 4 electron pairs around oxygen (2 bonding + 2 lone pairs). Lone pairs exert greater repulsion than bonding pairs, compressing the H-O-H angle from ideal tetrahedral 109.5° to ~104.5°."},{"id":"c1-6","topic":"Bonding","question":"Which of the following IMFs is responsible for the unusually high boiling point of water compared to H₂S?","options":["London dispersion forces","Dipole-dipole interactions","Hydrogen bonding","Ion-dipole forces"],"answer":2,"explanation":"Water forms extensive hydrogen bonds (O-H···O) due to the highly electronegative oxygen and hydrogen bonded directly to it. H₂S has only weak dipole-dipole forces. Hydrogen bonding is much stronger, giving water its anomalously high boiling point (100°C vs H₂S at −60°C)."},{"id":"c1-7","topic":"Bonding","question":"CO₂ has polar C=O bonds but is a nonpolar molecule because:","options":["Carbon has equal electronegativity to oxygen","The linear geometry causes dipole moments to cancel","It has no lone pairs on carbon","It is a gas at room temperature"],"answer":1,"explanation":"CO₂ is linear (O=C=O). The two C=O bond dipoles point in exactly opposite directions and cancel each other exactly → net dipole moment = 0 → nonpolar molecule. This is why CO₂ is poorly soluble in water despite having polar bonds."},{"id":"c1-8","topic":"Bonding","question":"A drug molecule with high log P value (e.g., log P = 5) would be expected to:","options":["Have high water solubility","Cross biological membranes easily by passive diffusion","Be poorly absorbed from the gastrointestinal tract","Have no protein binding"],"answer":1,"explanation":"High log P = highly lipophilic = dissolves preferentially in octanol (lipid) over water. Lipophilic drugs passively diffuse through lipid membranes. However, very high log P (>5) may also cause poor solubility (Lipinski's Rule of Five: log P ≤ 5 for oral drugs)."},{"id":"c1-9","topic":"Thermodynamics","question":"Which combination of ΔH and ΔS always results in a spontaneous reaction at ANY temperature?","options":["ΔH > 0, ΔS > 0","ΔH \u003c 0, ΔS \u003c 0","ΔH \u003c 0, ΔS > 0","ΔH > 0, ΔS \u003c 0"],"answer":2,"explanation":"ΔG = ΔH − TΔS. When ΔH \u003c 0 (exothermic) AND ΔS > 0 (increasing disorder): ΔG = negative − T(positive) = always negative → always spontaneous at any temperature. This is the most favorable thermodynamic situation."},{"id":"c1-10","topic":"Thermodynamics","question":"The heat of combustion of glucose (C₆H₁₂O₆) is −2803 kJ/mol. This value is negative because:","options":["The reaction requires energy input","Energy is released to the surroundings (exothermic)","Entropy decreases","Products have higher enthalpy than reactants"],"answer":1,"explanation":"Negative ΔH indicates an exothermic reaction — heat is released to the surroundings. Combustion/oxidation of organic molecules releases energy. Our bodies use this energy (via cellular respiration) to drive metabolism. ΔH = H_products − H_reactants \u003c 0 means products are at lower energy."},{"id":"c1-11","topic":"Thermodynamics","question":"A reaction has ΔG° = −35 kJ/mol. Using ΔG° = −RT ln K, the equilibrium constant K is:","options":["Much less than 1","Equal to 1","Much greater than 1","Equal to 35"],"answer":2,"explanation":"ΔG° = −RT ln K → ln K = −ΔG°/(RT). With ΔG° = −35,000 J/mol and RT ≈ 2478 J/mol (at 25°C): ln K = 35000/2478 ≈ 14.1 → K = e^14.1 ≈ 1.3 × 10⁶ >> 1. Large negative ΔG° → large K → products strongly favored."},{"id":"c1-12","topic":"Equilibrium","question":"For the reaction N₂(g) + 3H₂(g) ⇌ 2NH₃(g), increasing pressure will:","options":["Shift equilibrium toward reactants (left)","Shift equilibrium toward products (right)","Have no effect on equilibrium position","Increase the equilibrium constant K"],"answer":1,"explanation":"Increasing pressure shifts equilibrium toward the side with FEWER moles of gas. Reactant side: 1 + 3 = 4 mol gas. Product side: 2 mol gas. So equilibrium shifts right (toward NH₃ products). Note: pressure does not change K."},{"id":"c1-13","topic":"Equilibrium","question":"For a reaction at equilibrium, Q \u003c K means:","options":["The reaction must proceed in reverse","The reaction must proceed forward to reach equilibrium","The system is already at equilibrium","More reactant must be added"],"answer":1,"explanation":"Q \u003c K means the ratio of products to reactants is less than at equilibrium. The system needs to increase products → reaction proceeds forward (right) to reach equilibrium where Q = K."},{"id":"c1-14","topic":"Equilibrium","question":"The Ksp of AgCl is 1.8 × 10⁻¹⁰. What is the molar solubility of AgCl in pure water?","options":["1.8 × 10⁻¹⁰ M","1.34 × 10⁻⁵ M","3.6 × 10⁻¹⁰ M","9 × 10⁻⁵ M"],"answer":1,"explanation":"AgCl ⇌ Ag⁺ + Cl⁻; Ksp = [Ag⁺][Cl⁻] = s² = 1.8 × 10⁻¹⁰. Solving: s = √(1.8 × 10⁻¹⁰) = 1.34 × 10⁻⁵ M. This is the molar solubility of AgCl in pure water."},{"id":"c1-15","topic":"Equilibrium","question":"Adding a catalyst to a reaction at equilibrium will:","options":["Shift equilibrium toward products","Shift equilibrium toward reactants","Increase the rate of both forward and reverse reactions equally","Increase K"],"answer":2,"explanation":"Catalysts lower activation energy for BOTH forward and reverse reactions equally → both rates increase equally → equilibrium position (K) is unchanged. Catalysts help reach equilibrium faster but do not change the equilibrium constant or position."},{"id":"c1-16","topic":"Acid-Base","question":"Calculate the pH of a 0.01 M HCl solution (strong acid).","options":["1","2","7","12"],"answer":1,"explanation":"HCl is a strong acid and completely dissociates: [H⁺] = 0.01 M = 10⁻². pH = −log(10⁻²) = 2."},{"id":"c1-17","topic":"Acid-Base","question":"Aspirin has a pKa of 3.5. In blood (pH 7.4), aspirin exists predominantly as:","options":["Un-ionized (neutral form, HA)","Ionized (conjugate base, A⁻)","Equal amounts of HA and A⁻","Completely protonated"],"answer":1,"explanation":"Using H-H equation: pH = pKa + log([A⁻]/[HA]) → 7.4 = 3.5 + log([A⁻]/[HA]) → log([A⁻]/[HA]) = 3.9 → [A⁻]/[HA] = 7943:1. Aspirin is predominantly ionized (A⁻) in blood. Un-ionized form is present but very small fraction."},{"id":"c1-18","topic":"Acid-Base","question":"A buffer solution contains equal concentrations of acetic acid (pKa 4.74) and acetate. What is the pH of this buffer?","options":["2.37","4.74","7.0","9.48"],"answer":1,"explanation":"H-H equation: pH = pKa + log([A⁻]/[HA]). When [A⁻] = [HA]: log(1) = 0. Therefore pH = pKa = 4.74. Buffer capacity is maximal when pH = pKa."},{"id":"c1-19","topic":"Acid-Base","question":"Which of the following is the STRONGEST acid?","options":["HF (pKa = 3.2)","CH₃COOH (pKa = 4.74)","H₂CO₃ (pKa = 6.35)","H₃PO₄ (pKa = 2.15)"],"answer":3,"explanation":"Stronger acid = lower pKa. H₃PO₄ has pKa = 2.15, which is the lowest → strongest acid. Remember: pKa = −log Ka, so lower pKa = larger Ka = more dissociation = stronger acid."},{"id":"c1-20","topic":"Acid-Base","question":"A patient with aspirin overdose is treated with sodium bicarbonate (NaHCO₃). The goal is to:","options":["Neutralize aspirin directly in the stomach","Alkalinize urine to increase aspirin ionization and renal excretion","Decrease blood pH to reduce aspirin toxicity","Increase protein binding of aspirin"],"answer":1,"explanation":"Sodium bicarbonate alkalinizes the urine. At high urine pH, aspirin (weak acid, pKa 3.5) is mostly ionized (A⁻). Ionized drugs cannot cross membranes → aspirin is trapped in urine → cannot be reabsorbed → increased excretion. This is \"ion trapping\" — a clinical application of H-H equation."},{"id":"c1-21","topic":"Gas Laws","question":"A gas has volume 5.0 L at 1.0 atm. What is its volume at 2.0 atm (constant temperature)?","options":["10.0 L","5.0 L","2.5 L","1.0 L"],"answer":2,"explanation":"Boyle's Law: P₁V₁ = P₂V₂ → (1.0)(5.0) = (2.0)(V₂) → V₂ = 2.5 L. Pressure and volume are inversely proportional at constant temperature."},{"id":"c1-22","topic":"Gas Laws","question":"How many moles of gas are in a 10.0 L container at 25°C and 2.0 atm? (R = 0.08206 L·atm/mol·K)","options":["0.41 mol","0.82 mol","4.89 mol","16.3 mol"],"answer":1,"explanation":"PV = nRT → n = PV/RT = (2.0 × 10.0) / (0.08206 × 298) = 20.0 / 24.45 ≈ 0.82 mol. Always convert T to Kelvin: 25 + 273 = 298 K."},{"id":"c1-23","topic":"Gas Laws","question":"Dalton's Law of Partial Pressures states that:","options":["Equal volumes of gases at same T and P contain equal numbers of molecules","Total pressure = sum of individual partial pressures","Gas pressure is inversely proportional to volume","Gas volume is directly proportional to temperature"],"answer":1,"explanation":"Dalton's Law: P_total = P₁ + P₂ + P₃ + ... Each gas exerts pressure independently. Avogadro's Law states equal volumes at same T and P contain equal molecules. Boyle's Law = PV constant. Charles's Law = V/T constant."},{"id":"c1-24","topic":"Solutions","question":"Which colligative property is most relevant for understanding IV fluid tonicity?","options":["Vapor pressure lowering","Boiling point elevation","Osmotic pressure","Freezing point depression"],"answer":2,"explanation":"Osmotic pressure directly determines tonicity — the tendency of water to move across semipermeable membranes (like red blood cell membranes). Isotonic IV solutions match blood osmotic pressure (~285 mOsm/L) to prevent hemolysis or crenation."},{"id":"c1-25","topic":"Solutions","question":"NaCl dissociates into 2 particles (Na⁺ + Cl⁻) in solution. What is the osmolarity of a 0.9% (0.154 M) NaCl solution?","options":["0.154 mOsm/L","154 mOsm/L","308 mOsm/L","462 mOsm/L"],"answer":2,"explanation":"Osmolarity = Molarity × i (Van't Hoff factor). For NaCl: i = 2. Osmolarity = 0.154 mol/L × 2 = 0.308 mol/L = 308 mOsm/L. This matches plasma osmolarity (~285–295 mOsm/L) → isotonic saline is approximately isotonic."},{"id":"c1-26","topic":"Solutions","question":"The concentration of a drug solution is 500 mg in 250 mL. Express this as mg/mL and as % w/v.","options":["1 mg/mL, 0.1% w/v","2 mg/mL, 0.2% w/v","5 mg/mL, 0.5% w/v","10 mg/mL, 1.0% w/v"],"answer":1,"explanation":"500 mg / 250 mL = 2 mg/mL. For % w/v: (g solute / 100 mL solution) × 100 = (0.5 g / 250 mL) × 100 mL = 0.5/2.5 = 0.2% w/v. Alternatively: 2 mg/mL × (1 g/1000 mg) × 100 mL = 0.2% w/v."},{"id":"c1-27","topic":"Acid-Base","question":"The bicarbonate buffer in blood has pKa = 6.1. At physiological pH 7.4, the ratio [HCO₃⁻]/[H₂CO₃] is:","options":["About 1:1","About 20:1","About 1:20","About 100:1"],"answer":1,"explanation":"H-H: pH = pKa + log([HCO₃⁻]/[H₂CO₃]) → 7.4 = 6.1 + log(ratio) → log(ratio) = 1.3 → ratio = 10^1.3 ≈ 20:1. Blood has ~20× more bicarbonate than carbonic acid. Despite pKa not being at 7.4, bicarbonate is effective because CO₂ is continuously regulated by breathing."},{"id":"c1-28","topic":"Thermodynamics","question":"Drug hydrolysis in aqueous solution (degradation) typically has ΔG \u003c 0. This means:","options":["The drug will spontaneously reform from degradation products","The drug spontaneously degrades — degradation is thermodynamically favorable","Degradation requires heat input","Degradation won't occur at room temperature"],"answer":1,"explanation":"ΔG \u003c 0 means the reaction is spontaneous — degradation will proceed without energy input. This is a major challenge in pharmaceutical formulation. Solutions include refrigeration (ΔG less negative at lower T for many reactions), anhydrous formulations, pH optimization, and antioxidants."},{"id":"c1-29","topic":"Bonding","question":"Which molecule has the STRONGEST intermolecular forces?","options":["CH₄ (nonpolar, MW = 16)","NH₃ (H-bonding, MW = 17)","HCl (dipole, MW = 36.5)","Ar (noble gas, MW = 40)"],"answer":1,"explanation":"NH₃ forms hydrogen bonds (N has lone pair + N-H bonds) — much stronger than London dispersion (CH₄, Ar) or dipole-dipole (HCl). NH₃ boiling point = −33°C; CH₄ = −161°C; Ar = −186°C. NH₃'s higher boiling point reflects stronger IMFs."},{"id":"c1-30","topic":"Equilibrium","question":"For an exothermic reaction at equilibrium, INCREASING temperature will:","options":["Increase K and shift toward products","Decrease K and shift toward reactants","Have no effect on K","Increase pressure and shift toward products"],"answer":1,"explanation":"For exothermic reactions (ΔH \u003c 0), heat is a \"product.\" Increasing temperature adds heat → equilibrium shifts LEFT (toward reactants) to consume excess heat → K DECREASES. This is important in pharmaceutical chemistry: many hydrolysis reactions are exothermic → refrigeration decreases degradation rate AND reduces equilibrium extent."},{"id":"c1-31","topic":"Acid-Base","question":"A morphine solution (weak base, pKa of conjugate acid BH⁺ = 8.0) is at pH 7.4. What percentage is in the un-ionized free base form (B)?","options":["~80% ionized (BH⁺)","~80% un-ionized (B)","~50% ionized","~20% ionized"],"answer":0,"explanation":"For a base: pH = pKa + log([B]/[BH⁺]) → 7.4 = 8.0 + log([B]/[BH⁺]) → log([B]/[BH⁺]) = −0.6 → [B]/[BH⁺] = 0.25. So BH⁺:B = 4:1, meaning ~80% is ionized (BH⁺) and ~20% is un-ionized (B) at pH 7.4. Only the un-ionized form (B) crosses membranes."},{"id":"c1-32","topic":"Solutions","question":"Why do gases become LESS soluble in water as temperature increases?","options":["Gases condense at higher temperatures","Dissolution of gases is exothermic; higher T shifts equilibrium toward undissolved gas","Water evaporates and removes gas","Higher T increases gas kinetic energy only"],"answer":1,"explanation":"Gas dissolution is exothermic (ΔH \u003c 0). By Le Châtelier's Principle, increasing temperature (adding heat) shifts equilibrium toward LESS dissolution (undissolved gas). This explains why O₂ solubility decreases in warm water (fish die in hot water) and why carbonated beverages go flat faster when warm."},{"id":"c1-33","topic":"Atomic Structure","question":"Radioactive ¹⁴C (carbon-14) is used in drug metabolism studies because:","options":["It has different chemical properties than ¹²C","It can be detected by radiation counters even in tiny amounts","It reacts faster than normal carbon","It is non-radioactive and safe"],"answer":1,"explanation":"¹⁴C is a radioactive isotope with same chemical properties as ¹²C (same Z=6, same bonding) but emits beta radiation → detectable at very low concentrations. Used to trace drug metabolic pathways by labeling drug with ¹⁴C and tracking radioactivity in urine, feces, expired CO₂, etc."},{"id":"c1-34","topic":"Thermodynamics","question":"What does Hess's Law allow us to calculate?","options":["Activation energy of a reaction","ΔH for a reaction using heats of formation or other reaction enthalpies","The rate constant of a reaction","The equilibrium constant K"],"answer":1,"explanation":"Hess's Law states that ΔH for a reaction is the sum of ΔH for each step in the reaction pathway, regardless of the actual mechanism. This allows calculation of ΔH°rxn = Σ ΔH°f(products) − Σ ΔH°f(reactants) using tabulated standard enthalpies of formation."},{"id":"c1-35","topic":"Bonding","question":"Drug-receptor binding often involves multiple types of interactions. Which interaction is MOST specific and directional?","options":["London dispersion forces","Ionic interactions","Hydrogen bonds","Van der Waals contacts"],"answer":2,"explanation":"Hydrogen bonds are highly directional (optimal angle ~180°, distance ~2.5–3.5 Å) AND specific (require appropriate donor: N-H, O-H; and acceptor: lone pair on N, O). This directionality makes H-bonds critical for drug selectivity at binding sites. Ionic bonds are strong but less directional; London forces are weak and non-directional."},{"id":"c1-36","topic":"Gas Laws","question":"At STP (0°C, 1 atm), 1 mole of ideal gas occupies:","options":["11.2 L","22.4 L","24.5 L","2.24 L"],"answer":1,"explanation":"At STP (Standard Temperature and Pressure: 0°C = 273.15 K, 1 atm), 1 mol ideal gas occupies 22.4 L. Note: at 25°C (298 K) and 1 atm (SATP), 1 mol occupies 24.5 L. Use 22.4 L for STP calculations."},{"id":"c1-37","topic":"Acid-Base","question":"An IV solution containing both calcium gluconate and sodium bicarbonate would be problematic because:","options":["The mixture would become too acidic","CaCO₃ would precipitate (Ksp very low)","The solution would become too basic","Calcium would react with sodium"],"answer":1,"explanation":"Ca²⁺ + CO₃²⁻ → CaCO₃ precipitates because Ksp of CaCO₃ is very small (3.3 × 10⁻⁹). In a mixture, Q > Ksp → precipitation occurs. CaCO₃ particles could cause phlebitis or emboli. This is a classic example of IV incompatibility based on solubility equilibria."},{"id":"c1-38","topic":"Equilibrium","question":"Le Châtelier's Principle explains why removing a product from a reaction causes the reaction to:","options":["Slow down and eventually stop","Shift toward the products (forward direction)","Shift toward the reactants (reverse direction)","Reach a new equilibrium with the same K"],"answer":1,"explanation":"Removing a product (decreasing its concentration) makes Q \u003c K → system shifts forward (right) to replenish the removed product and restore Q = K. The equilibrium constant K itself doesn't change (only changes with temperature)."},{"id":"c1-39","topic":"Solutions","question":"The van't Hoff factor (i) for MgCl₂ in dilute aqueous solution is approximately:","options":["1","2","3","4"],"answer":2,"explanation":"MgCl₂ → Mg²⁺ + 2Cl⁻. Produces 3 particles per formula unit → i = 3. This means MgCl₂ has a 3× greater effect on colligative properties than an equivalent concentration of a nonelectrolyte."},{"id":"c1-40","topic":"Thermodynamics","question":"The melting of ice at 0°C, 1 atm is a spontaneous process (ΔG = 0 at melting point). At 37°C, ice would melt with:","options":["ΔG > 0","ΔG = 0","ΔG \u003c 0","ΔG depends only on ΔH"],"answer":2,"explanation":"At 37°C (above melting point), ice melting is spontaneous → ΔG \u003c 0. ΔG = ΔH − TΔS. Melting has ΔH > 0 (endothermic) but also ΔS > 0 (liquid more disordered than solid). At temperatures above 0°C, the TΔS term dominates → ΔG becomes negative → spontaneous melting."},{"id":"c1-41","topic":"Bonding","question":"Which of the following compounds would be expected to have the HIGHEST boiling point?","options":["Propane (C₃H₈, MW=44)","Propanol (C₃H₇OH, MW=60)","Dimethyl ether (CH₃OCH₃, MW=46)","Propanone/acetone (CH₃COCH₃, MW=58)"],"answer":1,"explanation":"Propanol has an O-H group → forms hydrogen bonds (strongest IMF). H-bonds require much more energy to break than the dipole-dipole forces in dimethyl ether/acetone or London forces in propane. Boiling points: propane −42°C, dimethyl ether −24°C, acetone 56°C, propanol 97°C."},{"id":"c1-42","topic":"Acid-Base","question":"If blood pH falls from 7.4 to 7.1 (acidosis), what happens to drug distribution of a weak acid (pKa = 5)?","options":["More drug enters cells (less ionized in blood)","Distribution unchanged — only pH determines ionization","The ratio of ionized to un-ionized drug changes, potentially increasing free drug in blood","Drug becomes completely un-ionized"],"answer":2,"explanation":"Even at pH 7.1, a weak acid with pKa 5 is still ~99.4% ionized (highly ionized). The small change in pH slightly decreases ionization → tiny increase in un-ionized form → could increase free drug and membrane permeability. In acidosis, weak acid drugs may show slightly altered distribution."},{"id":"c1-43","topic":"Gas Laws","question":"Nitrous oxide (N₂O) is stored as a liquid in cylinders at room temperature. As the cylinder empties, the pressure gauge reads full until almost all liquid is gone. This is explained by:","options":["Dalton's Law","Charles's Law","The liquid-gas equilibrium (vapor pressure remains constant while liquid remains)","Boyle's Law"],"answer":2,"explanation":"As long as liquid N₂O is present, the gas phase is in equilibrium with the liquid at a fixed vapor pressure (at constant temperature). The pressure gauge reads the vapor pressure, which stays constant until the last drop of liquid evaporates. This is why N₂O cylinders give no warning before running out — unlike O₂ (stored as gas only)."},{"id":"c1-44","topic":"Atomic Structure","question":"Transition metals (d-block) are often used in drug design because they can:","options":["Form ionic bonds only","Exist in multiple oxidation states and coordinate to ligands (chelation)","Act as strong acids","React only with water"],"answer":1,"explanation":"Transition metals have multiple oxidation states and can coordinate to Lewis base ligands via coordinate (dative) bonds. This is the basis of cisplatin (platinum-based cancer drug) and many metal chelation therapies. Examples: cisplatin (Pt), carboplatin (Pt), bleomycin (Fe), deferoxamine (chelates Fe³⁺ in iron overload)."},{"id":"c1-45","topic":"Solutions","question":"A patient receives 1 L of hypotonic saline (0.45% NaCl) IV instead of normal saline (0.9% NaCl). The immediate risk is:","options":["Crenation of red blood cells","Hemolysis of red blood cells","Hypertension from sodium overload","Crystallization in veins"],"answer":1,"explanation":"0.45% NaCl is hypotonic (osmolarity ~154 mOsm/L vs blood ~290 mOsm/L). Water moves by osmosis INTO red blood cells (from low solute → high solute inside cells) → RBCs swell → hemolysis (lysis). Large IV doses of hypotonic fluids cause hemolysis, hyponatremia, and cerebral edema."},{"id":"c1-46","topic":"Acid-Base","question":"A buffer with pKa = 7.0 is most effective at resisting pH changes at pH:","options":["5.0","7.0","9.0","7.4"],"answer":1,"explanation":"Buffer capacity is maximum when pH = pKa (equal concentrations of acid and conjugate base). At pH 7.0 = pKa, the buffer has equal amounts of weak acid and conjugate base, giving maximum ability to absorb both added acid and added base."},{"id":"c1-47","topic":"Thermodynamics","question":"At 25°C, if ΔG° = 0 for a reaction, then K =","options":["0","1","100","Infinite"],"answer":1,"explanation":"ΔG° = −RT ln K. If ΔG° = 0: 0 = −RT ln K → ln K = 0 → K = e⁰ = 1. When K = 1, products and reactants are present in equal concentrations at equilibrium."},{"id":"c1-48","topic":"Equilibrium","question":"Antacids containing Al(OH)₃ neutralize stomach acid (HCl). This is a(n) _______ reaction that shifts equilibrium by _______.","options":["Endothermic; adding product","Acid-base; removing H⁺ (product neutralization)","Redox; oxidizing HCl","Precipitation; forming Al₂Cl₃"],"answer":1,"explanation":"Al(OH)₃ + 3HCl → AlCl₃ + 3H₂O. This is an acid-base neutralization. By removing H⁺ (neutralizing it), the equilibrium of stomach acid production shifts. Additionally, the driving force is the formation of water (very stable product, K >> 1). This is the principle behind antacid therapy."},{"id":"c1-49","topic":"Gas Laws","question":"Henry's Law is most relevant for which pharmaceutical application?","options":["Tablet dissolution testing","Inhalation anesthetic uptake in blood","Oral drug absorption","Protein binding of drugs"],"answer":1,"explanation":"Henry's Law states amount of gas dissolved ∝ partial pressure. This directly governs how inhalation anesthetics (e.g., halothane, sevoflurane) dissolve in blood — their blood:gas partition coefficient determines speed of onset and recovery from anesthesia. Also relevant to O₂/CO₂ transport and decompression sickness."},{"id":"c1-50","topic":"Bonding","question":"Penicillin's β-lactam ring is reactive and undergoes hydrolysis. The ring's instability is related to:","options":["Its high molecular weight","Ring strain in the 4-membered β-lactam ring increasing reactivity","London dispersion forces","Low electronegativity of nitrogen"],"answer":1,"explanation":"The β-lactam ring is a 4-membered cyclic amide. 4-membered rings have severe angle strain (bond angles ~90° vs ideal amide 120°). This strain makes the C-N bond highly susceptible to nucleophilic attack by bacterial transpeptidase (and also to hydrolysis → inactivation). β-lactamase enzymes exploit this ring strain to hydrolyze and inactivate penicillins."}]},{"meta":{"id":"chemistry2","title":"Organic Chemistry","code":"203175 / 203176","icon":"🧪","color":"#6c3483","credits":"4 credits (3 lecture + 1 lab)","semester":"Semester 2, Year 1","description":"IUPAC nomenclature, functional groups, stereochemistry, reaction mechanisms, and classes of organic compounds. Directly relevant to drug structure and design.","chapters":[{"id":"nomenclature","title":"IUPAC Nomenclature & Functional Groups"},{"id":"alkanes","title":"Alkanes, Alkenes & Alkynes"},{"id":"stereochemistry","title":"Stereochemistry & Chirality"},{"id":"aromatic","title":"Aromatic Compounds"},{"id":"carbonyl","title":"Alcohols, Ethers & Carbonyl Compounds"},{"id":"amines","title":"Amines & Amino Acids"},{"id":"mechanisms","title":"Reaction Mechanisms: SN1/SN2/E1/E2"},{"id":"spectroscopy","title":"Introduction to Spectroscopy"}]},"chapters":{"nomenclature":{"tag":"Chapter 1 · Organic Chem","title":"IUPAC Nomenclature & Functional Groups","overview":"Systematic naming of organic compounds and identification of functional groups are the alphabet of organic chemistry. Most drug names can be decoded using IUPAC rules.","sections":[{"title":"Functional Groups Overview","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Functional Group\u003c/th>\u003cth>Structure\u003c/th>\u003cth>Suffix\u003c/th>\u003cth>Drug Example\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Alkane\u003c/td>\u003ctd>C-C only\u003c/td>\u003ctd>-ane\u003c/td>\u003ctd>Petroleum-based excipients\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Alkene\u003c/td>\u003ctd>C=C\u003c/td>\u003ctd>-ene\u003c/td>\u003ctd>Retinol (vitamin A)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Alkyne\u003c/td>\u003ctd>C≡C\u003c/td>\u003ctd>-yne\u003c/td>\u003ctd>Ethynyl estradiol (OCP)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Alcohol\u003c/td>\u003ctd>-OH\u003c/td>\u003ctd>-ol\u003c/td>\u003ctd>Ethanol, propranolol\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Ether\u003c/td>\u003ctd>R-O-R\u003c/td>\u003ctd>-oxy-\u003c/td>\u003ctd>Diethyl ether (anesthetic)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Aldehyde\u003c/td>\u003ctd>-CHO\u003c/td>\u003ctd>-al\u003c/td>\u003ctd>Formaldehyde (preservative)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Ketone\u003c/td>\u003ctd>R-CO-R\u003c/td>\u003ctd>-one\u003c/td>\u003ctd>Acetone (ketosis)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Carboxylic acid\u003c/td>\u003ctd>-COOH\u003c/td>\u003ctd>-oic acid\u003c/td>\u003ctd>Aspirin (acetylsalicylic acid)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Ester\u003c/td>\u003ctd>-COO-\u003c/td>\u003ctd>-oate\u003c/td>\u003ctd>Aspirin (ester linkage), prodrugs\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Amide\u003c/td>\u003ctd>-CONH-\u003c/td>\u003ctd>-amide\u003c/td>\u003ctd>Paracetamol (acetamide), penicillin (β-lactam)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Amine\u003c/td>\u003ctd>R-NH₂/R-NHR/R-NR₂\u003c/td>\u003ctd>-amine or -amino\u003c/td>\u003ctd>Amphetamine, dopamine\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Thiol\u003c/td>\u003ctd>-SH\u003c/td>\u003ctd>-thiol\u003c/td>\u003ctd>Cysteine, captopril (SH group)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Phosphate\u003c/td>\u003ctd>-OPO₃²⁻\u003c/td>\u003ctd>—\u003c/td>\u003ctd>ATP, nucleotides, phospholipids\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box key\">\u003cstrong>Drug design:\u003c/strong> Adding or removing functional groups changes a drug's polarity, solubility, metabolism, and receptor interaction. E.g., adding -OH groups (hydroxylation by CYP450) increases polarity for renal excretion — Phase I metabolism.\u003c/div>\n        "},{"title":"IUPAC Naming Rules — Alkanes","content":"\n          \u003col style=\"font-size:14px;line-height:1.9;padding-left:18px;\">\n            \u003cli>\u003cstrong>Find the longest chain\u003c/strong> containing the highest-priority functional group → parent name\u003c/li>\n            \u003cli>\u003cstrong>Number the chain\u003c/strong> from the end closest to the first substituent\u003c/li>\n            \u003cli>\u003cstrong>Name substituents\u003c/strong> as prefixes (methyl-, ethyl-, chloro-, bromo-, hydroxy-, amino-, oxo-)\u003c/li>\n            \u003cli>\u003cstrong>Assign locants\u003c/strong> to substituents using the lowest set of numbers\u003c/li>\n            \u003cli>\u003cstrong>Alphabetize substituents\u003c/strong> (ignoring di-, tri-, etc.)\u003c/li>\n            \u003cli>\u003cstrong>Add suffix\u003c/strong> based on principal functional group\u003c/li>\n          \u003c/ol>\n          \u003ch4>Parent Chain Names\u003c/h4>\n          \u003cdiv class=\"key-terms\">\n            \u003cdiv class=\"key-term\">\u003cstrong>1C\u003c/strong>: meth-\u003c/div>\n            \u003cdiv class=\"key-term\">\u003cstrong>2C\u003c/strong>: eth-\u003c/div>\n            \u003cdiv class=\"key-term\">\u003cstrong>3C\u003c/strong>: prop-\u003c/div>\n            \u003cdiv class=\"key-term\">\u003cstrong>4C\u003c/strong>: but-\u003c/div>\n            \u003cdiv class=\"key-term\">\u003cstrong>5C\u003c/strong>: pent-\u003c/div>\n            \u003cdiv class=\"key-term\">\u003cstrong>6C\u003c/strong>: hex-\u003c/div>\n            \u003cdiv class=\"key-term\">\u003cstrong>7C\u003c/strong>: hept-\u003c/div>\n            \u003cdiv class=\"key-term\">\u003cstrong>8C\u003c/strong>: oct-\u003c/div>\n            \u003cdiv class=\"key-term\">\u003cstrong>9C\u003c/strong>: non-\u003c/div>\n            \u003cdiv class=\"key-term\">\u003cstrong>10C\u003c/strong>: dec-\u003c/div>\n          \u003c/div>\n          \u003cp>\u003cstrong>Example:\u003c/strong> 2-methylpropan-1-ol (isobutanol) — 3C chain (propan), OH at C1 (-ol), methyl at C2\u003c/p>\n        "},{"title":"Priority Rules for Functional Groups","content":"\n          \u003cp>When multiple functional groups are present, the highest priority group determines the parent suffix:\u003c/p>\n          \u003cp>Carboxylic acid > Ester > Amide > Aldehyde > Ketone > Alcohol > Amine > Alkene > Alkyne > Alkane\u003c/p>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>Aspirin (acetylsalicylic acid):\u003c/strong> Has a carboxylic acid (-COOH) and an ester (-COO-). The acid is the principal group → named as an acid. The ester is a substituent → acetyl- (acetic acid ester). Full name: 2-(acetyloxy)benzoic acid.\u003c/div>\n        "}],"keyTerms":[{"term":"Functional group","def":"Specific atom or group of atoms that determines chemical properties of an organic molecule."},{"term":"Homolog","def":"Member of a series differing only by –CH₂– units; similar properties."},{"term":"Isomers","def":"Compounds with the same molecular formula but different structures. Types: constitutional, stereoisomers (enantiomers, diastereomers)."},{"term":"IUPAC","def":"International Union of Pure and Applied Chemistry — sets systematic naming rules for organic compounds."},{"term":"Heteroatom","def":"Non-carbon atom in an organic molecule (N, O, S, P, halogens). Often at drug binding sites."}]},"alkanes":{"tag":"Chapter 2 · Organic Chem","title":"Alkanes, Alkenes & Alkynes","overview":"Hydrocarbons form the carbon skeleton of most organic molecules. Understanding their properties predicts drug lipophilicity, metabolic stability, and reactivity.","sections":[{"title":"Alkanes — Saturated Hydrocarbons","content":"\n          \u003cp>Alkanes contain only C-C single bonds (sp³ hybridization). General formula: CₙH₂ₙ₊₂\u003c/p>\n          \u003ch4>Physical Properties\u003c/h4>\n          \u003cul>\n            \u003cli>Nonpolar → insoluble in water, soluble in organic solvents\u003c/li>\n            \u003cli>Boiling point increases with chain length (more London dispersion forces)\u003c/li>\n            \u003cli>Branching decreases boiling point (less surface area → weaker LDF)\u003c/li>\n          \u003c/ul>\n          \u003ch4>Conformations (Newman Projections)\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Staggered:\u003c/strong> Anti (180° — most stable) and gauche (60°)\u003c/li>\n            \u003cli>\u003cstrong>Eclipsed:\u003c/strong> Less stable due to torsional strain\u003c/li>\n          \u003c/ul>\n          \u003ch4>Cycloalkanes\u003c/h4>\n          \u003cul>\n            \u003cli>Cyclohexane: chair conformation (most stable) vs. boat (strained)\u003c/li>\n            \u003cli>Equatorial positions preferred for large substituents in chair conformation\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>Drug metabolism of alkanes:\u003c/strong> CYP450 enzymes hydroxylate alkyl chains (-CH₃ → -CH₂OH) during Phase I metabolism → more polar → more easily excreted.\u003c/div>\n        "},{"title":"Alkenes — Unsaturated (C=C)","content":"\n          \u003cp>Alkenes contain at least one C=C double bond (sp² hybridization). General formula: CₙH₂ₙ\u003c/p>\n          \u003ch4>Geometric (Cis/Trans) Isomerism\u003c/h4>\n          \u003cp>Rotation around C=C is restricted. When each carbon has two DIFFERENT substituents → cis/trans isomers:\u003c/p>\n          \u003cul>\n            \u003cli>\u003cstrong>Cis (Z):\u003c/strong> Same groups on same side of double bond\u003c/li>\n            \u003cli>\u003cstrong>Trans (E):\u003c/strong> Same groups on opposite sides\u003c/li>\n          \u003c/ul>\n          \u003cp>\u003cstrong>E/Z system:\u003c/strong> Assign priority by atomic number (Cahn-Ingold-Prelog rules). Z = zusammen (together); E = entgegen (opposite).\u003c/p>\n          \u003ch4>Addition Reactions\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Hydrogenation:\u003c/strong> C=C + H₂ → C-C (catalyst: Pt, Pd, Ni) → saturates fats\u003c/li>\n            \u003cli>\u003cstrong>Halogenation:\u003c/strong> C=C + Br₂ → dihalide (anti addition; Br₂ test for unsaturation)\u003c/li>\n            \u003cli>\u003cstrong>Hydrohalogenation:\u003c/strong> C=C + HX → follows Markovnikov's rule → H adds to less substituted carbon (more H), X adds to more substituted carbon\u003c/li>\n            \u003cli>\u003cstrong>Hydration:\u003c/strong> C=C + H₂O → alcohol (acid catalyst; Markovnikov product)\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"info-box key\">\u003cstrong>Trans fats:\u003c/strong> Partial hydrogenation of vegetable oils creates trans double bonds (unnatural) → increased LDL, decreased HDL → cardiovascular risk. Banned/restricted in many countries.\u003c/div>\n        "},{"title":"Alkynes — Triple Bond (C≡C)","content":"\n          \u003cp>Alkynes have C≡C triple bonds (sp hybridization, linear geometry). General formula: CₙH₂ₙ₋₂\u003c/p>\n          \u003cul>\n            \u003cli>Terminal alkynes (C≡C-H): weakly acidic (pKa ~25) due to sp carbon's high s-character\u003c/li>\n            \u003cli>React by addition reactions like alkenes\u003c/li>\n            \u003cli>\u003cstrong>Pharmaceutical example:\u003c/strong> Ethynyl estradiol (ethinylestradiol) in oral contraceptives — has C≡C (ethynyl) group at C17 of estradiol → prevents metabolism → oral bioavailability\u003c/li>\n          \u003c/ul>\n        "}],"keyTerms":[{"term":"sp³ hybridization","def":"Four equivalent orbitals; tetrahedral geometry; 109.5° angles. Alkanes and saturated carbons."},{"term":"sp² hybridization","def":"Three equivalent orbitals; trigonal planar geometry; 120° angles. Alkenes, carbonyls, aromatics."},{"term":"Markovnikov's rule","def":"In addition to asymmetric alkenes, the electrophile (H) adds to the carbon with MORE hydrogens."},{"term":"Geometric isomers","def":"E/Z (or cis/trans) isomers due to restricted rotation around C=C double bond."},{"term":"Conformational isomers","def":"Different spatial arrangements from rotation around single bonds (staggered vs. eclipsed)."}]},"stereochemistry":{"tag":"Chapter 3 · Organic Chem","title":"Stereochemistry & Chirality","overview":"Stereochemistry is arguably the most important concept in medicinal chemistry. A drug's 3D shape determines receptor binding — enantiomers can have dramatically different activities, toxicities, and metabolism.","sections":[{"title":"Chirality & Stereocenters","content":"\n          \u003cp>A \u003cstrong>chiral center (stereocenter)\u003c/strong> is a carbon with four different substituents. A molecule with a chiral center can exist as two non-superimposable mirror images = \u003cstrong>enantiomers\u003c/strong>.\u003c/p>\n          \u003ch4>Properties of Enantiomers\u003c/h4>\n          \u003cul>\n            \u003cli>Identical physical properties (melting point, boiling point, solubility) EXCEPT optical rotation\u003c/li>\n            \u003cli>One rotates plane-polarized light clockwise: (+) or (d) — dextrorotatory\u003c/li>\n            \u003cli>The other rotates counterclockwise: (−) or (l) — levorotatory\u003c/li>\n            \u003cli>Racemic mixture (racemate): 50:50 mixture of enantiomers → no optical rotation\u003c/li>\n            \u003cli>Biological systems distinguish enantiomers (receptors, enzymes, transporters are chiral)\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"info-box warning\">\u003cstrong>Thalidomide:\u003c/strong> Given as racemate for morning sickness (1950s). The (R)-enantiomer was sedative/antiemetic (therapeutic). The (S)-enantiomer caused severe teratogenicity (limb malformation — phocomelia). Even if pure R-enantiomer administered, it racemizes in vivo to S. Led to mandatory chiral characterization of drugs.\u003c/div>\n        "},{"title":"R/S Configuration (CIP Rules)","content":"\n          \u003cp>Assign absolute configuration using Cahn-Ingold-Prelog (CIP) rules:\u003c/p>\n          \u003col style=\"font-size:14px;line-height:1.9;padding-left:18px;\">\n            \u003cli>Identify the 4 substituents on the chiral center\u003c/li>\n            \u003cli>Assign priority 1 (highest) to 4 (lowest) by \u003cstrong>atomic number\u003c/strong> of directly attached atoms (higher Z = higher priority). If tied, compare next atoms outward.\u003c/li>\n            \u003cli>Orient the molecule with priority 4 (lowest) pointing AWAY from you (behind)\u003c/li>\n            \u003cli>Read priorities 1→2→3: \u003cstrong>Clockwise = R (Rectus)\u003c/strong>; \u003cstrong>Counterclockwise = S (Sinister)\u003c/strong>\u003c/li>\n          \u003c/ol>\n          \u003cp>\u003cstrong>Priority order example:\u003c/strong> I > Br > Cl > F > O > N > C > H\u003c/p>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>Tip:\u003c/strong> If the #4 group is pointing TOWARD you (wedge), reverse R/S assignment from what you see.\u003c/div>\n        "},{"title":"Types of Stereoisomers","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Definition\u003c/th>\u003cth>Drug Example\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Enantiomers\u003c/td>\u003ctd>Non-superimposable mirror images; one chiral center; same connectivity\u003c/td>\u003ctd>(R)-ibuprofen (inactive) and (S)-ibuprofen (active anti-inflammatory). Racemic ibuprofen is used clinically — (R) converts to (S) in vivo\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Diastereomers\u003c/td>\u003ctd>Stereoisomers that are NOT mirror images; ≥2 stereocenters; different physical properties\u003c/td>\u003ctd>Ephedrine vs. pseudoephedrine (diastereomers, different pharmacology)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Meso compound\u003c/td>\u003ctd>Has chiral centers but is achiral overall due to internal plane of symmetry\u003c/td>\u003ctd>Meso-tartaric acid\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Atropisomers\u003c/td>\u003ctd>Stereoisomers from restricted rotation around single bond (axis chirality)\u003c/td>\u003ctd>Binaphthyl compounds; some kinase inhibitors\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003ch4>Maximum Stereoisomers\u003c/h4>\n          \u003cdiv class=\"formula-block\">Maximum stereoisomers = 2ⁿ (where n = number of chiral centers)\u003c/div>\n          \u003cp>Two chiral centers → max 4 stereoisomers (2 pairs of enantiomers = 2 diastereomers)\u003c/p>\n          \u003cdiv class=\"info-box key\">\u003cstrong>Enantiopure drugs (chiral switches):\u003c/strong> Omeprazole (racemate) → esomeprazole (S-enantiomer, \"Nexium\") — marketed as improved PPI. Cetirizine (racemate) → levocetirizine (R-enantiomer). Ofloxacin → levofloxacin (L-enantiomer, more potent antibacterial).\u003c/div>\n        "}],"keyTerms":[{"term":"Chiral center","def":"Carbon bearing four different substituents; source of chirality."},{"term":"Enantiomers","def":"Non-superimposable mirror-image molecules; rotate plane-polarized light equally but in opposite directions."},{"term":"Diastereomers","def":"Stereoisomers that are NOT mirror images of each other; have different physical properties."},{"term":"Racemic mixture","def":"Equal mixture of both enantiomers; no net optical rotation."},{"term":"R/S configuration","def":"Absolute configuration assigned by CIP rules (priority by atomic number). R = clockwise; S = counterclockwise."}]},"aromatic":{"tag":"Chapter 4 · Organic Chem","title":"Aromatic Compounds","overview":"Aromatic rings are ubiquitous in drugs — ~70% of FDA-approved drugs contain an aromatic ring. Aromaticity confers stability and unique reactivity.","sections":[{"title":"Criteria for Aromaticity (Hückel's Rule)","content":"\n          \u003cp>A compound is aromatic if it meets ALL criteria:\u003c/p>\n          \u003col style=\"font-size:14px;line-height:1.9;padding-left:18px;\">\n            \u003cli>Cyclic structure\u003c/li>\n            \u003cli>Fully conjugated (every ring atom has a p orbital)\u003c/li>\n            \u003cli>Planar\u003c/li>\n            \u003cli>\u003cstrong>4n + 2 π electrons\u003c/strong> (Hückel's rule, n = 0, 1, 2, ...)\u003c/li>\n          \u003c/ol>\n          \u003cul>\n            \u003cli>Benzene: 6 π electrons (n=1) — aromatic ✓\u003c/li>\n            \u003cli>Naphthalene: 10 π electrons (n=2) — aromatic ✓\u003c/li>\n            \u003cli>Cyclobutadiene: 4 π electrons — antiaromatic ✗ (4n rule)\u003c/li>\n            \u003cli>Pyridine: 6 π electrons, N contributes one lone pair to conjugation — aromatic ✓\u003c/li>\n            \u003cli>Pyrrole: N lone pair is part of aromatic system — aromatic ✓ (6 π electrons)\u003c/li>\n          \u003c/ul>\n        "},{"title":"Electrophilic Aromatic Substitution (EAS)","content":"\n          \u003cp>Main reaction of aromatic compounds. Benzene reacts with electrophiles via substitution (not addition), preserving aromaticity.\u003c/p>\n          \u003ch4>Common EAS Reactions\u003c/h4>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Reaction\u003c/th>\u003cth>Reagents\u003c/th>\u003cth>Product\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Halogenation\u003c/td>\u003ctd>Cl₂ or Br₂ + Lewis acid catalyst (FeCl₃, FeBr₃)\u003c/td>\u003ctd>Aryl halide (chlorobenzene, bromobenzene)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Nitration\u003c/td>\u003ctd>HNO₃ + H₂SO₄ (concentrated)\u003c/td>\u003ctd>Nitrobenzene\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Sulfonation\u003c/td>\u003ctd>SO₃ + H₂SO₄ (fuming)\u003c/td>\u003ctd>Benzenesulfonic acid (sulfa drugs)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Friedel-Crafts alkylation\u003c/td>\u003ctd>R-Cl + AlCl₃\u003c/td>\u003ctd>Alkylbenzene (ibuprofen synthesis)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Friedel-Crafts acylation\u003c/td>\u003ctd>RCOCl + AlCl₃\u003c/td>\u003ctd>Aryl ketone (important in drug synthesis)\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003ch4>Directing Effects of Substituents\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Ortho/para directors (activating):\u003c/strong> Electron-donating groups (−OH, −NH₂, −OR, −alkyl) → facilitate EAS → direct new substituent to ortho and para positions\u003c/li>\n            \u003cli>\u003cstrong>Meta directors (deactivating):\u003c/strong> Electron-withdrawing groups (−NO₂, −COOH, −CHO, −COR, −CN, −SO₃H) → slow EAS → direct to meta position\u003c/li>\n            \u003cli>\u003cstrong>Halogens:\u003c/strong> Ortho/para directors but deactivating (unusual combination)\u003c/li>\n          \u003c/ul>\n        "},{"title":"Heterocyclic Aromatics in Drug Structures","content":"\n          \u003cp>Many drugs contain heterocyclic aromatic rings:\u003c/p>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Ring\u003c/th>\u003cth>Heteroatom\u003c/th>\u003cth>Drug Examples\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Pyridine\u003c/td>\u003ctd>N (sp²)\u003c/td>\u003ctd>Isoniazid (TB), nicotine, pyridoxine (B₆)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Pyrimidine\u003c/td>\u003ctd>2N\u003c/td>\u003ctd>Thymine, cytosine, uracil (nucleobases); sulfonamides; barbiturates\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Purine (fused)\u003c/td>\u003ctd>N\u003c/td>\u003ctd>Adenine, guanine; caffeine (methylxanthine); allopurinol\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Imidazole\u003c/td>\u003ctd>2N\u003c/td>\u003ctd>Histidine residue in enzymes; omeprazole, metronidazole, clotrimazole\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Thiophene\u003c/td>\u003ctd>S\u003c/td>\u003ctd>Clopidogrel (antiplatelet), ticlopidine\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Indole\u003c/td>\u003ctd>N (fused)\u003c/td>\u003ctd>Tryptophan, serotonin, indomethacin, sumatriptan\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Benzimidazole\u003c/td>\u003ctd>N\u003c/td>\u003ctd>Omeprazole (PPI), mebendazole (anthelmintic)\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "}],"keyTerms":[{"term":"Aromaticity","def":"Special stability of cyclic, planar, fully conjugated systems with 4n+2 π electrons (Hückel's rule)."},{"term":"EAS","def":"Electrophilic aromatic substitution — main reaction mechanism of aromatic compounds. Substitution preserves aromaticity."},{"term":"Ortho/para director","def":"Substituent that directs incoming electrophile to ortho (1,2-) and para (1,4-) positions; usually electron-donating groups."},{"term":"Resonance","def":"Delocalization of electrons over multiple atoms/bonds; explains aromaticity and stability of carboxylate anions, amides, etc."},{"term":"Phenol","def":"Benzene ring with -OH substituent (more acidic than aliphatic alcohols); found in many drugs (morphine, paracetamol, thyroxine)."}]},"carbonyl":{"tag":"Chapter 5 · Organic Chem","title":"Alcohols, Ethers & Carbonyl Compounds","overview":"Carbonyl-containing functional groups (aldehydes, ketones, carboxylic acids, esters, amides) are the most important in biological chemistry and drug structure.","sections":[{"title":"Alcohols","content":"\n          \u003cp>Alcohols (-OH) are classified as primary (1°), secondary (2°), or tertiary (3°) based on how many carbons are attached to the carbon bearing OH.\u003c/p>\n          \u003ch4>Oxidation States\u003c/h4>\n          \u003cdiv class=\"formula-block\">1° alcohol → Aldehyde → Carboxylic acid\u003cbr>2° alcohol → Ketone\u003cbr>3° alcohol → Cannot be oxidized (no H on the C-OH carbon)\u003c/div>\n          \u003ch4>Biologically Important Reactions\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Alcohol metabolism:\u003c/strong> Ethanol → acetaldehyde (alcohol dehydrogenase) → acetic acid (aldehyde dehydrogenase) → acetyl-CoA\u003c/li>\n            \u003cli>\u003cstrong>Disulfiram (Antabuse):\u003c/strong> Inhibits aldehyde dehydrogenase → acetaldehyde accumulates → flushing, nausea, vomiting → aversion therapy for alcoholism\u003c/li>\n          \u003c/ul>\n        "},{"title":"Carboxylic Acids & Derivatives","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Compound\u003c/th>\u003cth>Structure\u003c/th>\u003cth>Reactivity\u003c/th>\u003cth>Pharmaceutical Example\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Carboxylic acid\u003c/td>\u003ctd>-COOH\u003c/td>\u003ctd>Moderate electrophile; forms H-bonds; pKa ~4–5\u003c/td>\u003ctd>Aspirin, ibuprofen, furosemide\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Ester\u003c/td>\u003ctd>-COO-\u003c/td>\u003ctd>Hydrolyzed by water (acid/base/enzyme) → alcohol + acid; prodrug strategy\u003c/td>\u003ctd>Aspirin (ester hydrolysis in vivo), enalapril (prodrug ester)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Amide\u003c/td>\u003ctd>-CONH-\u003c/td>\u003ctd>Most stable; resonance stabilization; slow hydrolysis; H-bond donor AND acceptor\u003c/td>\u003ctd>Paracetamol (amide), penicillin (β-lactam amide), lidocaine\u003c/td>\u003c/tr>\n              \u00
