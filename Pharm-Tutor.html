ne","def":"Horizontal plane dividing body into superior and inferior portions. Used in CT/MRI imaging."},{"term":"Peritoneum","def":"Serous membrane lining the abdominal cavity; peritoneal dialysis used as renal replacement therapy."},{"term":"Retroperitoneal","def":"Behind the peritoneum; kidneys, pancreas, aorta, IVC are retroperitoneal."}]},"integumentary":{"tag":"Chapter 2 · Anatomy","title":"Integumentary System","overview":"The skin is the largest organ and an important route for topical and transdermal drug delivery. Its layers determine drug penetration rate.","sections":[{"title":"Skin Layers","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Layer\u003c/th>\u003cth>Sublayers (Epidermis) or Description\u003c/th>\u003cth>Key Features\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Epidermis\u003c/td>\u003ctd>Stratum corneum (outermost), Stratum granulosum, Stratum spinosum, Stratum basale (innermost → mitosis)\u003c/td>\u003ctd>No blood vessels; barrier function; contains keratinocytes, melanocytes, Langerhans cells; stratified squamous keratinizing epithelium\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Dermis\u003c/td>\u003ctd>Papillary dermis (loose CT) + Reticular dermis (dense irregular CT)\u003c/td>\u003ctd>Blood vessels, lymphatics, nerves, sweat glands, hair follicles; collagen and elastin fibers; rich vascularization allows IV drug absorption via dermal vessels\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Hypodermis (subcutis)\u003c/td>\u003ctd>Subcutaneous fat and connective tissue\u003c/td>\u003ctd>Lipid reservoir; site of subcutaneous (SC) injections; lipophilic drug depot; cushioning\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box key\">\u003cstrong>Stratum corneum as drug barrier:\u003c/strong> The stratum corneum (SC) is the primary barrier to transdermal drug delivery — composed of dead corneocytes embedded in lipid lamellae. Drug must penetrate SC by: transcellular (through cells), intercellular (through lipid bilayers), or via follicular route. Hydration of SC increases permeability (why occlusive dressings enhance drug penetration).\u003c/div>\n        "},{"title":"Skin Appendages & Special Cells","content":"\n          \u003cul>\n            \u003cli>\u003cstrong>Eccrine sweat glands:\u003c/strong> Distributed over entire body; produce watery sweat; thermoregulation; drug excretion possible (minor)\u003c/li>\n            \u003cli>\u003cstrong>Apocrine sweat glands:\u003c/strong> Axillae, groin; produce viscous secretion; emotional sweating\u003c/li>\n            \u003cli>\u003cstrong>Sebaceous glands:\u003c/strong> Associated with hair follicles; secrete sebum (oil); blocked → acne; sebum helps maintain skin barrier\u003c/li>\n            \u003cli>\u003cstrong>Melanocytes:\u003c/strong> In stratum basale; produce melanin (photoprotection); target of melanoma (treat with immunotherapy — pembrolizumab, nivolumab; targeted therapy — BRAF/MEK inhibitors for BRAF-mutant melanoma)\u003c/li>\n            \u003cli>\u003cstrong>Langerhans cells:\u003c/strong> Dendritic cells in epidermis; antigen-presenting cells; initiate immune response to contact allergens and transdermal drugs\u003c/li>\n          \u003c/ul>\n        "},{"title":"Transdermal Drug Delivery","content":"\n          \u003cp>Advantages of transdermal route: avoids first-pass metabolism, sustained release, easy removal, good for drugs with short t½ and narrow therapeutic index.\u003c/p>\n          \u003ch4>Transdermal Drug Examples\u003c/h4>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Drug\u003c/th>\u003cth>Indication\u003c/th>\u003cth>Patch duration\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Nitroglycerin\u003c/td>\u003ctd>Angina prophylaxis\u003c/td>\u003ctd>24 hours\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Fentanyl\u003c/td>\u003ctd>Chronic severe pain\u003c/td>\u003ctd>72 hours\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Nicotine\u003c/td>\u003ctd>Smoking cessation\u003c/td>\u003ctd>24 hours\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Estradiol\u003c/td>\u003ctd>Menopausal HRT\u003c/td>\u003ctd>3–7 days\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Clonidine\u003c/td>\u003ctd>Hypertension\u003c/td>\u003ctd>7 days\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Scopolamine\u003c/td>\u003ctd>Motion sickness\u003c/td>\u003ctd>72 hours\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Rotigotine\u003c/td>\u003ctd>Parkinson's disease\u003c/td>\u003ctd>24 hours\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>Requirements for transdermal drugs:\u003c/strong> Potent (low dose needed), low MW (&lt;500 Da), adequate lipophilicity, no skin irritation, not too hydrophilic (won't cross SC) or too lipophilic (won't leave SC into dermis). Log P between 1–3 is optimal.\u003c/div>\n        "}],"keyTerms":[{"term":"Stratum corneum","def":"Outermost skin layer; dead corneocytes in lipid; primary barrier to transdermal drug delivery."},{"term":"Keratinocyte","def":"Predominant epidermal cell; produces keratin protein; undergoes keratinization during maturation."},{"term":"Melanocyte","def":"Melanin-producing cells in stratum basale; melanin absorbs UV radiation. Malignant transformation → melanoma."},{"term":"Transdermal patch","def":"Drug delivery system that maintains drug contact with skin for sustained systemic absorption; avoids first-pass."},{"term":"Subcutaneous injection","def":"Injection into hypodermis (fatty layer); good for insulin, heparin, vaccines, biologics."}]},"skeletal":{"tag":"Chapter 3 · Anatomy","title":"Skeletal System","overview":"The skeleton provides structural support and produces blood cells. Drugs affecting bone metabolism are increasingly important as populations age.","sections":[{"title":"Bone Classification & Structure","content":"\n          \u003ch4>Bone Types by Shape\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Long bones:\u003c/strong> Longer than wide (femur, humerus, tibia); contain medullary cavity (red/yellow bone marrow)\u003c/li>\n            \u003cli>\u003cstrong>Short bones:\u003c/strong> Cube-shaped (carpal, tarsal bones)\u003c/li>\n            \u003cli>\u003cstrong>Flat bones:\u003c/strong> Protect organs and large muscle attachment (skull, ribs, sternum, scapula)\u003c/li>\n            \u003cli>\u003cstrong>Irregular bones:\u003c/strong> Complex shapes (vertebrae, facial bones)\u003c/li>\n            \u003cli>\u003cstrong>Sesamoid bones:\u003c/strong> Embedded in tendons (patella)\u003c/li>\n          \u003c/ul>\n          \u003ch4>Long Bone Structure\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Diaphysis:\u003c/strong> Shaft; compact (cortical) bone\u003c/li>\n            \u003cli>\u003cstrong>Epiphyses:\u003c/strong> Ends; cancellous (trabecular/spongy) bone with red marrow\u003c/li>\n            \u003cli>\u003cstrong>Epiphyseal plate (growth plate):\u003c/strong> Cartilage; site of longitudinal growth; ossifies at puberty. Fluoroquinolones can damage growth plates in children → use avoided &lt;18 years.\u003c/li>\n            \u003cli>\u003cstrong>Periosteum:\u003c/strong> Outer fibrous covering; contains osteoblasts and nerves\u003c/li>\n            \u003cli>\u003cstrong>Endosteum:\u003c/strong> Lines inner marrow cavity; contains osteoblasts\u003c/li>\n          \u003c/ul>\n        "},{"title":"Bone Cells & Remodeling","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Cell\u003c/th>\u003cth>Origin\u003c/th>\u003cth>Function\u003c/th>\u003cth>Drug Target\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Osteoblasts\u003c/td>\u003ctd>Mesenchymal stem cells\u003c/td>\u003ctd>Bone FORMATION; synthesize osteoid (collagen matrix); mineralize with calcium hydroxyapatite\u003c/td>\u003ctd>PTH analogs (teriparatide) stimulate osteoblasts → anabolic effect in osteoporosis\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Osteocytes\u003c/td>\u003ctd>Trapped osteoblasts\u003c/td>\u003ctd>Sense mechanical stress; regulate remodeling via sclerostin; maintain mineralized matrix\u003c/td>\u003ctd>Romosozumab (anti-sclerostin Ab) stimulates bone formation\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Osteoclasts\u003c/td>\u003ctd>Monocyte/macrophage lineage (hematopoietic)\u003c/td>\u003ctd>Bone RESORPTION; secrete acid (H⁺) and enzymes (cathepsin K) to dissolve bone mineral and matrix\u003c/td>\u003ctd>Bisphosphonates inhibit osteoclasts (alendronate, risedronate); denosumab (anti-RANKL) inhibits osteoclast differentiation\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box warning\">\u003cstrong>Bisphosphonates (alendronate, risedronate, zoledronic acid):\u003c/strong> Incorporated into bone mineral → ingested by osteoclasts → inhibit farnesyl pyrophosphate synthase → impair osteoclast function → decreased bone resorption. Take oral bisphosphonates in morning, sitting upright, 30 min before food with full glass of water → prevent esophageal irritation. Osteonecrosis of jaw is a rare complication with IV bisphosphonates.\u003c/div>\n        "},{"title":"Joints","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Movement\u003c/th>\u003cth>Examples\u003c/th>\u003cth>Clinical Relevance\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Fibrous (synarthrosis)\u003c/td>\u003ctd>Immovable\u003c/td>\u003ctd>Skull sutures, tooth sockets (gomphosis)\u003c/td>\u003ctd>Trauma assessment\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Cartilaginous (amphiarthrosis)\u003c/td>\u003ctd>Slightly movable\u003c/td>\u003ctd>Intervertebral discs, pubic symphysis\u003c/td>\u003ctd>Disc herniation (L4-L5, L5-S1 most common)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Synovial (diarthrosis)\u003c/td>\u003ctd>Freely movable\u003c/td>\u003ctd>Shoulder, hip, knee, elbow\u003c/td>\u003ctd>Target of NSAIDs, corticosteroids for arthritis; joint replacement surgery\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003ch4>Synovial Joint Components\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Hyaline cartilage:\u003c/strong> Covers articular surfaces; absorbs shock; avascular (nutrients by diffusion)\u003c/li>\n            \u003cli>\u003cstrong>Synovial fluid:\u003c/strong> Produced by synovial membrane; viscous lubricant; contains hyaluronic acid\u003c/li>\n            \u003cli>\u003cstrong>Bursa:\u003c/strong> Fluid-filled sac reducing friction; bursitis → corticosteroid injection\u003c/li>\n          \u003c/ul>\n        "}],"keyTerms":[{"term":"Osteoblast","def":"Bone-forming cell; synthesizes collagen matrix and mineralizes bone. Stimulated by PTH analogs."},{"term":"Osteoclast","def":"Bone-resorbing cell; multinucleated; inhibited by bisphosphonates and denosumab."},{"term":"Bisphosphonates","def":"Anti-resorptive drugs (alendronate, zoledronic acid); inhibit farnesyl pyrophosphate synthase in osteoclasts; used in osteoporosis."},{"term":"Epiphyseal plate","def":"Cartilaginous growth plate in children; site of longitudinal bone growth. Closed at puberty."},{"term":"Red bone marrow","def":"Site of hematopoiesis (blood cell production) in flat bones and proximal long bone epiphyses."}]},"nervous":{"tag":"Chapter 5 · Anatomy","title":"Nervous System","overview":"The nervous system is the target of a vast number of drugs — analgesics, anesthetics, antiepileptics, antidepressants, antipsychotics, anxiolytics, and more. Understanding its anatomy explains drug effects.","sections":[{"title":"Central vs. Peripheral Nervous System","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Division\u003c/th>\u003cth>Components\u003c/th>\u003cth>Key Drug Targets\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>CNS\u003c/td>\u003ctd>Brain (cerebrum, cerebellum, brainstem) + Spinal cord\u003c/td>\u003ctd>Opioids, anesthetics, antidepressants, antipsychotics, antiepileptics, Parkinson's drugs, anxiolytics\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>PNS — Somatic\u003c/td>\u003ctd>Sensory (afferent) neurons + Motor (efferent) neurons to skeletal muscle\u003c/td>\u003ctd>Local anesthetics (block sensory nerves); neuromuscular blockers (block NMJ)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>PNS — Autonomic\u003c/td>\u003ctd>Sympathetic (adrenergic) + Parasympathetic (cholinergic)\u003c/td>\u003ctd>Adrenergic drugs (epinephrine, β-blockers, α-blockers); cholinergic drugs (pilocarpine, atropine, neostigmine)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Enteric nervous system\u003c/td>\u003ctd>\"Second brain\" — intrinsic GI innervation\u003c/td>\u003ctd>Prokinetics (metoclopramide, erythromycin); loperamide; 5-HT₃ antagonists\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "},{"title":"Brain Anatomy & Function","content":"\n          \u003ch4>Cerebral Lobes\u003c/h4>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Lobe\u003c/th>\u003cth>Functions\u003c/th>\u003cth>Relevant Conditions\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Frontal lobe\u003c/td>\u003ctd>Motor cortex, executive function, personality, Broca's area (speech production)\u003c/td>\u003ctd>Prefrontal cortex target of antipsychotics (D₂ blockade); frontal lobe seizures\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Parietal lobe\u003c/td>\u003ctd>Somatosensory cortex (touch, pain, temperature), spatial orientation\u003c/td>\u003ctd>Analgesic drug targets in sensory cortex\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Temporal lobe\u003c/td>\u003ctd>Auditory cortex, memory (hippocampus), Wernicke's area (language comprehension)\u003c/td>\u003ctd>Temporal lobe epilepsy (mesial, hippocampal sclerosis); target of anticonvulsants\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Occipital lobe\u003c/td>\u003ctd>Visual cortex\u003c/td>\u003ctd>Visual disturbances with drug toxicity (quinine, vigabatrin)\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003ch4>Subcortical Structures\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Basal ganglia (striatum):\u003c/strong> Motor control; dopamine pathway from substantia nigra → striatum. Loss of dopaminergic neurons → Parkinson's disease → treated with levodopa/carbidopa, dopamine agonists. D₂ receptor blockade by antipsychotics → EPS (extrapyramidal symptoms)\u003c/li>\n            \u003cli>\u003cstrong>Limbic system (amygdala, hippocampus):\u003c/strong> Emotion, memory, fear, addiction. Target of anxiolytics (benzodiazepines act on GABA-A receptors throughout limbic system)\u003c/li>\n            \u003cli>\u003cstrong>Hypothalamus:\u003c/strong> Autonomic control, hormone regulation (GnRH, TRH, CRH), temperature, hunger. Target of many hormonal drugs\u003c/li>\n            \u003cli>\u003cstrong>Cerebellum:\u003c/strong> Coordination, balance. Damage → ataxia (side effect of phenytoin, ethanol)\u003c/li>\n          \u003c/ul>\n        "},{"title":"Blood-Brain Barrier (BBB)","content":"\n          \u003cp>The BBB protects the CNS from pathogens and toxins but limits drug delivery. Formed by:\u003c/p>\n          \u003cul>\n            \u003cli>\u003cstrong>Tight junctions\u003c/strong> between brain capillary endothelial cells (unlike peripheral capillaries)\u003c/li>\n            \u003cli>\u003cstrong>Astrocyte foot processes\u003c/strong> surrounding capillaries\u003c/li>\n            \u003cli>\u003cstrong>Pericytes\u003c/strong>\u003c/li>\n            \u003cli>\u003cstrong>Efflux pumps:\u003c/strong> P-glycoprotein (MDR1) actively pumps drugs OUT of CNS → major obstacle for CNS drug delivery\u003c/li>\n          \u003c/ul>\n          \u003ch4>Drug Penetration into CNS\u003c/h4>\n          \u003cul>\n            \u003cli>Small, lipophilic, uncharged, low molecular weight molecules cross best\u003c/li>\n            \u003cli>Levodopa uses amino acid transporters (LAT1) to cross the BBB (reason why it's used instead of dopamine for Parkinson's — dopamine doesn't cross BBB)\u003c/li>\n            \u003cli>BBB is disrupted in meningitis/encephalitis → allows better penetration of antibiotics\u003c/li>\n            \u003cli>BBB absent in circumventricular organs (chemoreceptor trigger zone → where antiemetics and apomorphine act)\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"info-box warning\">\u003cstrong>CTZ (Chemoreceptor Trigger Zone):\u003c/strong> Located in area postrema of medulla — OUTSIDE the BBB. It monitors blood for toxins, drugs, and metabolites that trigger vomiting. Dopamine (D₂) and serotonin (5-HT₃) receptors here → targeted by antiemetics (metoclopramide, ondansetron). Opioids activate CTZ → opioid-induced nausea/vomiting.\u003c/div>\n        "},{"title":"Autonomic Nervous System","content":"\n          \u003ch4>Sympathetic (\"Fight or Flight\")\u003c/h4>\n          \u003cul>\n            \u003cli>Preganglionic: T1–L2 spinal cord → thoracolumbar outflow\u003c/li>\n            \u003cli>Neurotransmitters: ACh (preganglionic) → Norepinephrine (postganglionic, most organs) or Epinephrine (adrenal medulla)\u003c/li>\n            \u003cli>Effects: ↑HR, ↑BP, bronchodilation, mydriasis, ↓GI motility, ↑blood glucose\u003c/li>\n            \u003cli>Receptors: α₁ (vasoconstriction), α₂ (presynaptic inhibition), β₁ (heart), β₂ (bronchi, uterus), β₃ (fat)\u003c/li>\n          \u003c/ul>\n          \u003ch4>Parasympathetic (\"Rest & Digest\")\u003c/h4>\n          \u003cul>\n            \u003cli>Preganglionic: CN III, VII, IX, X (vagus) and S2–S4 → craniosacral outflow\u003c/li>\n            \u003cli>Neurotransmitter: ACh at all synapses (ganglionic N receptors; end-organ M receptors)\u003c/li>\n            \u003cli>Effects: ↓HR (vagal tone), ↑GI motility, miosis, bronchoconstriction, urination, erection\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>DUMBELS (Cholinergic toxidrome mnemonic):\u003c/strong> Diarrhea, Urination, Miosis, Bradycardia, Emesis, Lacrimation, Salivation/Sweating. Seen in organophosphate poisoning (irreversible AChE inhibition). Treatment: Atropine (blocks muscarinic receptors) + Pralidoxime (regenerates AChE if given early).\u003c/div>\n        "}],"keyTerms":[{"term":"Blood-Brain Barrier (BBB)","def":"Specialized barrier formed by tight junctions in brain endothelium; restricts drug entry into CNS."},{"term":"Neurotransmitter","def":"Chemical messenger released from presynaptic neuron. CNS: glutamate (excitatory), GABA (inhibitory), dopamine, serotonin, acetylcholine."},{"term":"Autonomic NS","def":"Involuntary control of visceral functions; subdivided into sympathetic (NE/E) and parasympathetic (ACh)."},{"term":"CTZ","def":"Chemoreceptor trigger zone in area postrema; outside BBB; detects emetic stimuli including drugs and toxins."},{"term":"Neuromuscular junction (NMJ)","def":"Synapse between motor neuron and skeletal muscle; uses ACh; target of neuromuscular blocking agents."}]},"cardiovascular":{"tag":"Chapter 6 · Anatomy","title":"Cardiovascular System","overview":"The heart and blood vessels deliver drugs to their targets and remove metabolites. Many major drug classes target the cardiovascular system.","sections":[{"title":"Heart Anatomy","content":"\n          \u003ch4>Chambers and Valves\u003c/h4>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Chamber\u003c/th>\u003cth>Function\u003c/th>\u003cth>Key Feature\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Right atrium (RA)\u003c/td>\u003ctd>Receives deoxygenated blood from SVC, IVC, coronary sinus\u003c/td>\u003ctd>SA node in wall → pacemaker\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Right ventricle (RV)\u003c/td>\u003ctd>Pumps blood to pulmonary circulation\u003c/td>\u003ctd>Thin wall (low pressure); tricuspid valve (RA→RV); pulmonary valve (RV→pulmonary artery)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Left atrium (LA)\u003c/td>\u003ctd>Receives oxygenated blood from 4 pulmonary veins\u003c/td>\u003ctd>Mitral valve (LA→LV)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Left ventricle (LV)\u003c/td>\u003ctd>Pumps blood to systemic circulation\u003c/td>\u003ctd>Thickest wall (high pressure); aortic valve (LV→aorta)\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box key\">\u003cstrong>Valve mnemonic:\u003c/strong> \"Tri before Bi\" — Tricuspid valve on the right side, Bicuspid (mitral) on the left. \"APE Man\" — Aortic, Pulmonary on the arteries; Mitral (bicuspid), Tricuspid on the veins (technically AV valves).\u003c/div>\n        "},{"title":"Cardiac Conduction System","content":"\n          \u003cp>The heart has an intrinsic electrical conduction system for coordinated contraction:\u003c/p>\n          \u003col style=\"font-size:14px;line-height:1.9;padding-left:18px;\">\n            \u003cli>\u003cstrong>SA node\u003c/strong> (sinoatrial) — In RA wall; primary pacemaker; 60–100 bpm; innervated by vagus (slows) and sympathetic (accelerates)\u003c/li>\n            \u003cli>\u003cstrong>Interatrial and internodal pathways\u003c/strong> — Conduct impulse through atria\u003c/li>\n            \u003cli>\u003cstrong>AV node\u003c/strong> (atrioventricular) — In floor of RA; delays impulse 0.1 sec → allows ventricular filling; secondary pacemaker (40–60 bpm if SA fails)\u003c/li>\n            \u003cli>\u003cstrong>Bundle of His\u003c/strong> — Through interventricular septum\u003c/li>\n            \u003cli>\u003cstrong>Right and Left bundle branches\u003c/strong>\u003c/li>\n            \u003cli>\u003cstrong>Purkinje fibers\u003c/strong> — Rapidly conduct throughout ventricular myocardium → simultaneous contraction\u003c/li>\n          \u003c/ol>\n          \u003cdiv class=\"info-box warning\">\u003cstrong>Anti-arrhythmic drug targets:\u003c/strong> Na⁺ channels (Class I: lidocaine, flecainide), β-adrenoceptors (Class II: propranolol, metoprolol), K⁺ channels (Class III: amiodarone, sotalol), Ca²⁺ channels (Class IV: verapamil, diltiazem). The SA/AV nodes depend on Ca²⁺ currents → Ca²⁺ channel blockers slow HR and AV conduction.\u003c/div>\n        "},{"title":"Blood Vessels","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Vessel\u003c/th>\u003cth>Wall Structure\u003c/th>\u003cth>Function\u003c/th>\u003cth>Drug Target\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Arteries\u003c/td>\u003ctd>Thick muscular wall (tunica media); elastin\u003c/td>\u003ctd>High pressure distribution; elastic recoil maintains pressure during diastole\u003c/td>\u003ctd>Vasodilators (CCBs, nitrates, ACE inhibitors) reduce arterial resistance\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Arterioles\u003c/td>\u003ctd>Smooth muscle; innervated by sympathetic\u003c/td>\u003ctd>Primary resistance vessels; regulate blood flow distribution and systemic BP\u003c/td>\u003ctd>α₁ blockers (prazosin), ACE inhibitors, ARBs, CCBs lower arteriolar resistance → lower BP\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Capillaries\u003c/td>\u003ctd>Single layer of endothelium (fenestrated in some organs)\u003c/td>\u003ctd>Exchange of gases, nutrients, drugs between blood and tissue\u003c/td>\u003ctd>Drug access to tissues depends on capillary type (fenestrated in liver, kidney → easier access)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Veins\u003c/td>\u003ctd>Thin wall; valves prevent backflow\u003c/td>\u003ctd>Return blood to heart; capacitance vessels (hold 60% of blood volume)\u003c/td>\u003ctd>Nitrates dilate veins → reduce preload → treat angina; diuretics reduce volume\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003ch4>Hepatic Portal System\u003c/h4>\n          \u003cp>Blood from GI tract, spleen, and pancreas drains through the hepatic portal vein to the liver BEFORE reaching systemic circulation. This is responsible for \u003cstrong>first-pass metabolism\u003c/strong> — drugs absorbed from the intestine reach high drug concentrations in the liver → extensive metabolism → reduced bioavailability.\u003c/p>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>Drugs with high first-pass effect:\u003c/strong> Propranolol (bioavailability ~25%), morphine (~25%), lidocaine (~35%), nitroglycerin (~very low — hence sublingual, transdermal, or IV administration to bypass liver).\u003c/div>\n        "}],"keyTerms":[{"term":"SA node","def":"Primary cardiac pacemaker in right atrium wall; generates 60–100 bpm; controlled by autonomic NS."},{"term":"AV node","def":"Delays conduction between atria and ventricles (0.1 sec); secondary pacemaker at 40–60 bpm. Target of digoxin and CCBs (diltiazem, verapamil)."},{"term":"First-pass effect","def":"Hepatic metabolism of oral drugs before reaching systemic circulation via portal vein; reduces bioavailability."},{"term":"Arteriole","def":"Small artery; primary resistance vessel; controls blood distribution; target of antihypertensive drugs."},{"term":"Cardiac output (CO)","def":"CO = Heart Rate × Stroke Volume. Normal ~5 L/min. Inotropes ↑ SV; chronotropes ↑ HR."}]},"respiratory":{"tag":"Chapter 7 · Anatomy","title":"Respiratory System","overview":"The respiratory system is both a route of drug administration (inhaled drugs) and a target (asthma, COPD, pulmonary hypertension treatments).","sections":[{"title":"Structure — Upper vs. Lower Airways","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Region\u003c/th>\u003cth>Structures\u003c/th>\u003cth>Function\u003c/th>\u003cth>Drug Relevance\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Upper airway\u003c/td>\u003ctd>Nose, nasal cavity, pharynx, larynx\u003c/td>\u003ctd>Filter, warm, humidify air; voice production\u003c/td>\u003ctd>Nasal drug delivery (intranasal corticosteroids, desmopressin, sumatriptan); decongestants (pseudoephedrine, oxymetazoline)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Lower airway (conducting)\u003c/td>\u003ctd>Trachea → bronchi → bronchioles (to terminal bronchioles)\u003c/td>\u003ctd>Air conduction; no gas exchange; mucociliary clearance\u003c/td>\u003ctd>Bronchodilators target bronchial smooth muscle (β₂ agonists, anticholinergics); mucus clearance facilitated by mucolytics\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Respiratory zone\u003c/td>\u003ctd>Respiratory bronchioles → alveolar ducts → alveoli\u003c/td>\u003ctd>Gas exchange (O₂/CO₂); surface area ~70–140 m²\u003c/td>\u003ctd>Inhaled drug deposition here; surfactant (natural/artificial for premature infants)\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "},{"title":"Alveoli & Gas Exchange","content":"\n          \u003cp>Alveoli are the functional units of gas exchange. ~500 million alveoli in adult lungs.\u003c/p>\n          \u003ch4>Alveolar Cells\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Type I pneumocytes (95% surface area):\u003c/strong> Thin, simple squamous → gas exchange occurs across them. Target of severe COVID-19 injury.\u003c/li>\n            \u003cli>\u003cstrong>Type II pneumocytes (produce surfactant):\u003c/strong> Secrete pulmonary surfactant (dipalmitoylphosphatidylcholine — DPPC) → reduces alveolar surface tension → prevents atelectasis. Divide to regenerate Type I cells.\u003c/li>\n          \u003c/ul>\n          \u003cp>Surfactant deficiency in premature newborns → Neonatal Respiratory Distress Syndrome (NRDS). Treatment: Exogenous surfactant (beractant, poractant alpha) administered intratracheally. Betamethasone given to mother before preterm delivery → stimulates fetal lung surfactant production.\u003c/p>\n          \u003ch4>Blood-Gas Barrier\u003c/h4>\n          \u003cp>O₂ and CO₂ diffuse across the respiratory membrane: alveolar epithelium + basement membrane + capillary endothelium. Total thickness ~0.5 μm. Fick's Law: rate of diffusion ∝ surface area × partial pressure difference / distance.\u003c/p>\n        "},{"title":"Inhaled Drug Delivery","content":"\n          \u003ch4>Particle Size & Deposition\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>&gt; 10 μm:\u003c/strong> Deposited in upper airway (nose, pharynx) — not useful for asthma\u003c/li>\n            \u003cli>\u003cstrong>5–10 μm:\u003c/strong> Deposited in trachea and main bronchi\u003c/li>\n            \u003cli>\u003cstrong>1–5 μm:\u003c/strong> Optimal for bronchial deposition (best for asthma/COPD therapy)\u003c/li>\n            \u003cli>\u003cstrong>&lt; 1 μm:\u003c/strong> Deposited in alveoli (good for systemic absorption) or exhaled\u003c/li>\n          \u003c/ul>\n          \u003ch4>Inhaler Devices\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>MDI (Metered-dose inhaler):\u003c/strong> Requires coordination; use with spacer to improve deposition; HFA propellant\u003c/li>\n            \u003cli>\u003cstrong>DPI (Dry powder inhaler):\u003c/strong> Breath-actuated; requires inspiratory effort\u003c/li>\n            \u003cli>\u003cstrong>Nebulizer:\u003c/strong> Converts liquid to mist; used in severe asthma, infants, ICU; no coordination required\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"info-box key\">\u003cstrong>Advantages of inhaled route:\u003c/strong> High local drug concentration at target (airway smooth muscle), minimal systemic side effects, rapid onset (β₂ agonists: 3–5 min), avoids first-pass metabolism. Disadvantages: patient technique, oropharyngeal deposition of ICS (→ oral candidiasis with ICS — rinse mouth after use).\u003c/div>\n        "}],"keyTerms":[{"term":"Surfactant","def":"Phospholipid-protein mixture (mainly DPPC) from Type II pneumocytes; reduces alveolar surface tension; prevents collapse. Deficient in premature infants."},{"term":"Mucociliary clearance","def":"Mechanism for removing mucus and particles from airways via cilia. Impaired in cystic fibrosis, smoking, COPD."},{"term":"β₂ agonist","def":"Bronchodilators (salbutamol/albuterol — SABA; salmeterol, formoterol — LABA) that relax bronchial smooth muscle via Gs → cAMP."},{"term":"Anticholinergic (inhaled)","def":"Block M₃ receptors on bronchial smooth muscle → bronchodilation; tiotropium (LAMA), ipratropium (SAMA) for COPD."},{"term":"Inhaled corticosteroids (ICS)","def":"Budesonide, fluticasone — reduce airway inflammation; first-line for persistent asthma; rinse mouth to prevent oral candidiasis."}]},"digestive":{"tag":"Chapter 8 · Anatomy","title":"Digestive System","overview":"The GI tract is the primary route of drug absorption. Understanding its anatomy explains oral drug pharmacokinetics — absorption, first-pass effect, and elimination.","sections":[{"title":"GI Tract Overview","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Organ\u003c/th>\u003cth>pH\u003c/th>\u003cth>Key Enzymes/Secretions\u003c/th>\u003cth>Drug Absorption/Relevance\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Mouth\u003c/td>\u003ctd>6.5–7.0\u003c/td>\u003ctd>Salivary amylase, lingual lipase\u003c/td>\u003ctd>Sublingual absorption (nitroglycerin, buprenorphine) avoids first-pass; buccal tablets (testosterone)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Esophagus\u003c/td>\u003ctd>~6\u003c/td>\u003ctd>No secretion; peristalsis\u003c/td>\u003ctd>Drug-esophageal irritation (bisphosphonates, tetracyclines → esophagitis if not swallowed correctly)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Stomach\u003c/td>\u003ctd>1–3\u003c/td>\u003ctd>HCl, pepsin, intrinsic factor (for B₁₂)\u003c/td>\u003ctd>Drug dissolution; some absorption; parietal cells targeted by PPIs (omeprazole), H₂ blockers (famotidine); acid-labile drugs (ampicillin) taken on empty stomach\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Small intestine\u003c/td>\u003ctd>6–7.5\u003c/td>\u003ctd>Bile, pancreatic enzymes (lipase, amylase, proteases)\u003c/td>\u003ctd>PRIMARY site of oral drug absorption; large SA (~200–400 m²); P-gp and CYP3A4 in enterocytes limit absorption; enterohepatic circulation\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Large intestine\u003c/td>\u003ctd>7–8\u003c/td>\u003ctd>Intestinal bacteria; no significant enzymes\u003c/td>\u003ctd>Water and electrolyte reabsorption; some drug absorption (suppositories, enemas); drug-microbiome interactions\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "},{"title":"Small Intestine — Main Absorption Site","content":"\n          \u003ch4>Anatomical Features Maximizing Absorption\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Plicae circulares (folds of Kerckring):\u003c/strong> Circular folds; 3× surface area increase\u003c/li>\n            \u003cli>\u003cstrong>Villi:\u003c/strong> Finger-like projections; 10× additional surface area increase; each contains a lacteals (lymph vessel for fat-soluble vitamins and lipophilic drugs)\u003c/li>\n            \u003cli>\u003cstrong>Microvilli (brush border):\u003c/strong> On each enterocyte; 600× additional increase → total surface area ~200–400 m²\u003c/li>\n          \u003c/ul>\n          \u003ch4>Drug Transporters in Small Intestine\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>P-glycoprotein (P-gp/MDR1):\u003c/strong> Efflux pump in enterocyte apical membrane; pumps drugs BACK into gut lumen → limits absorption. Substrates: digoxin, vincristine, tacrolimus. Inhibitors increase absorption: grapefruit juice, verapamil, clarithromycin.\u003c/li>\n            \u003cli>\u003cstrong>OATP (Organic anion transporting polypeptide):\u003c/strong> Influx transporter; drug uptake. Inhibited by grapefruit juice for some statins → increased toxicity.\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"info-box warning\">\u003cstrong>Grapefruit juice interactions:\u003c/strong> Contains furanocoumarins that irreversibly inhibit intestinal CYP3A4 AND inhibit OATP transporters. Effect: ↑ bioavailability of CYP3A4 substrates (felodipine, lovastatin, simvastatin, cyclosporine, midazolam) → toxicity. One glass of grapefruit juice can increase drug levels by 3–7× in some cases. Avoid with many drugs.\u003c/div>\n        "},{"title":"Liver — Drug Metabolism Hub","content":"\n          \u003cul>\n            \u003cli>\u003cstrong>Hepatocytes:\u003c/strong> Main functional cells; rich in CYP450 (SER); site of Phase I and II drug metabolism\u003c/li>\n            \u003cli>\u003cstrong>Kupffer cells:\u003c/strong> Liver macrophages; remove pathogens, toxins, and some drugs from portal blood\u003c/li>\n            \u003cli>\u003cstrong>Bile production:\u003c/strong> 0.5–1 L/day bile; contains bile salts, cholesterol, bilirubin, phospholipids; emulsifies fats; some drugs excreted in bile → enterohepatic circulation\u003c/li>\n          \u003c/ul>\n          \u003ch4>Enterohepatic Circulation\u003c/h4>\n          \u003cp>Some drugs excreted in bile (conjugated by glucuronidation) are reactivated in intestine by bacterial β-glucuronidase → reabsorbed → liver → bile → intestine loop. Prolongs drug action. Examples: estrogens in oral contraceptives, morphine, some NSAIDs.\u003c/p>\n          \u003cp>Rifampicin/antibiotics can disrupt enterohepatic circulation of OCP → decreased contraceptive efficacy (mechanism disputed, but clinical interaction is acknowledged).\u003c/p>\n        "}],"keyTerms":[{"term":"Villi","def":"Finger-like projections of small intestinal mucosa; increase surface area for absorption. Each contains blood capillaries and a lacteal."},{"term":"P-glycoprotein (P-gp)","def":"Efflux transporter in intestinal enterocytes; pumps drugs back into gut lumen; limits bioavailability of many drugs."},{"term":"First-pass effect","def":"Hepatic metabolism of orally absorbed drugs before reaching systemic circulation; reduces bioavailability."},{"term":"Enterohepatic circulation","def":"Cycle of drug excretion in bile → intestinal deconjugation → reabsorption → liver. Prolongs drug half-life."},{"term":"Intrinsic factor","def":"Glycoprotein secreted by gastric parietal cells; required for vitamin B₁₂ absorption in terminal ileum. Absent in pernicious anemia."}]},"renal":{"tag":"Chapter 9 · Anatomy","title":"Renal & Urinary System","overview":"The kidneys are the primary organ for drug excretion. Understanding nephron anatomy explains how drugs are eliminated and how renal disease affects drug dosing.","sections":[{"title":"Kidney Gross Anatomy","content":"\n          \u003cul>\n            \u003cli>Bean-shaped organs (11 cm long) in retroperitoneal space at T12–L3\u003c/li>\n            \u003cli>Right kidney slightly lower (displaced by liver)\u003c/li>\n            \u003cli>Renal artery (branches off abdominal aorta) → Renal vein (drains to IVC)\u003c/li>\n            \u003cli>\u003cstrong>Renal cortex:\u003c/strong> Outer region; contains glomeruli and convoluted tubules\u003c/li>\n            \u003cli>\u003cstrong>Renal medulla:\u003c/strong> Inner region; contains renal pyramids (collecting ducts, loops of Henle)\u003c/li>\n            \u003cli>\u003cstrong>Renal pelvis → Ureter → Bladder → Urethra\u003c/strong>\u003c/li>\n          \u003c/ul>\n        "},{"title":"Nephron — Functional Unit","content":"\n          \u003cp>Each kidney has ~1 million nephrons. Blood is filtered and processed through sequential segments:\u003c/p>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Segment\u003c/th>\u003cth>Key Functions\u003c/th>\u003cth>Drug Targets / Clinical Relevance\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Glomerulus + Bowman's capsule\u003c/td>\u003ctd>Filtration: 125 mL/min (GFR); filters small molecules (MW &lt;66,000); excludes proteins, blood cells\u003c/td>\u003ctd>GFR used to assess kidney function and adjust drug doses (eGFR/CrCl); NSAIDs reduce GFR by decreasing prostaglandin-mediated afferent dilation\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Proximal convoluted tubule (PCT)\u003c/td>\u003ctd>Reabsorbs 65–70% of filtered Na⁺, water, glucose, amino acids, HCO₃⁻; secretes organic acids/bases (including many drugs); SGLT2 in lumen\u003c/td>\u003ctd>SGLT2 inhibitors (empagliflozin, dapagliflozin) block glucose reabsorption → glycosuria; OAT/OCT transporters secrete drugs (penicillin, metformin, furosemide); site of aminoglycoside nephrotoxicity\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Loop of Henle (descending/ascending)\u003c/td>\u003ctd>Concentration gradient; thin descending: water permeable; thick ascending: Na⁺/K⁺/2Cl⁻ cotransport (NKCC2); creates medullary hypertonicity\u003c/td>\u003ctd>Loop diuretics (furosemide, bumetanide) inhibit NKCC2 → profound natriuresis and diuresis; can cause hypokalemia, hypomagnesemia, ototoxicity\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Distal convoluted tubule (DCT)\u003c/td>\u003ctd>Na⁺/Cl⁻ reabsorption via NCC; Ca²⁺ reabsorption (PTH-dependent)\u003c/td>\u003ctd>Thiazide diuretics (hydrochlorothiazide, chlorthalidone) inhibit NCC → natriuresis; increase Ca²⁺ reabsorption → used in hypercalciuria/nephrolithiasis; hypokalemia side effect\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Collecting duct\u003c/td>\u003ctd>Aldosterone stimulates Na⁺ reabsorption (via ENaC) and K⁺/H⁺ secretion; ADH (vasopressin) increases water reabsorption (aquaporin-2)\u003c/td>\u003ctd>Aldosterone antagonists (spironolactone, eplerenone) — K⁺-sparing diuretics, heart failure; ADH antagonists (tolvaptan) — hyponatremia/SIADH; amiloride/triamterene block ENaC — K⁺-sparing\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "},{"title":"Renal Drug Excretion","content":"\n          \u003cp>Drugs are eliminated from kidneys by three processes:\u003c/p>\n          \u003col style=\"font-size:14px;line-height:1.9;padding-left:18px;\">\n            \u003cli>\u003cstrong>Glomerular filtration:\u003c/strong> Passive; all unbound drugs &lt;66 kDa filtered\u003c/li>\n            \u003cli>\u003cstrong>Active tubular secretion:\u003c/strong> Energy-requiring transport by OAT (organic anion transporters) and OCT (cation transporters) in PCT; can completely remove drug from blood in one pass; exceeds GFR\u003c/li>\n            \u003cli>\u003cstrong>Tubular reabsorption:\u003c/strong> Passive diffusion back into blood (lipophilic, un-ionized drugs reabsorbed best); altered by urine pH (ion trapping)\u003c/li>\n          \u003c/ol>\n          \u003cdiv class=\"info-box key\">\u003cstrong>Probenecid and penicillin:\u003c/strong> Probenecid blocks OAT-mediated tubular secretion of penicillin → decreases renal elimination → higher and prolonged penicillin levels. Historically used to conserve penicillin; now rarely used but important conceptually. Similar mechanism: probenecid interferes with secretion of methotrexate → methotrexate toxicity.\u003c/div>\n        "}],"keyTerms":[{"term":"GFR (Glomerular filtration rate)","def":"Volume of plasma filtered per minute (~125 mL/min). Used to assess kidney function and dose drugs. eGFR estimated from serum creatinine."},{"term":"Loop diuretics","def":"Furosemide, bumetanide — inhibit NKCC2 in thick ascending loop of Henle → powerful natriuresis. Used in edema, heart failure, hypertension."},{"term":"Thiazide diuretics","def":"HCTZ, chlorthalidone — inhibit NCC in DCT → moderate natriuresis + increase Ca²⁺ reabsorption. First-line antihypertensives."},{"term":"SGLT2 inhibitors","def":"Empagliflozin, dapagliflozin — block glucose reabsorption in PCT → glycosuria → lower blood glucose, BP, and weight. Cardioprotective and nephroprotective."},{"term":"Creatinine clearance (CrCl)","def":"Estimate of GFR using serum creatinine, age, weight, sex. Used to determine drug dose adjustments in renal impairment."}]},"muscular":{"tag":"Chapter 4 · Anatomy","title":"Muscular System","overview":"Skeletal muscle is the target of neuromuscular blockers, and smooth muscle is targeted by many cardiovascular and respiratory drugs.","sections":[{"title":"Types of Muscle Tissue","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Location\u003c/th>\u003cth>Control\u003c/th>\u003cth>Striated?\u003c/th>\u003cth>Drug Targets\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Skeletal (voluntary)\u003c/td>\u003ctd>Attached to bones\u003c/td>\u003ctd>Voluntary (somatic motor neurons)\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Neuromuscular blockers (surgery); muscle relaxants (baclofen, dantrolene); statins (myopathy)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Smooth (involuntary)\u003c/td>\u003ctd>Walls of hollow organs (GI, blood vessels, airways, uterus, bladder)\u003c/td>\u003ctd>Involuntary (ANS, hormones, local factors)\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Bronchodilators, vasodilators, antimuscarinics, oxytocin, tocolytics, prokinetics\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Cardiac\u003c/td>\u003ctd>Heart\u003c/td>\u003ctd>Involuntary (intrinsic pacemaker + ANS modulation)\u003c/td>\u003ctd>Yes (but involuntary)\u003c/td>\u003ctd>Cardiac glycosides (digoxin), antiarrhythmics, β-blockers, CCBs, inotropes\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "},{"title":"Skeletal Muscle Contraction — Neuromuscular Junction","content":"\n          \u003cp>The NMJ is the synapse between a motor neuron and skeletal muscle fiber:\u003c/p>\n          \u003col style=\"font-size:14px;line-height:1.9;padding-left:18px;\">\n            \u003cli>Motor neuron AP arrives → Ca²⁺ influx → ACh released from vesicles\u003c/li>\n            \u003cli>ACh crosses synaptic cleft → binds nicotinic ACh receptors (nAChR) on motor endplate\u003c/li>\n            \u003cli>nAChR opens → Na⁺ influx → endplate potential → muscle AP\u003c/li>\n            \u003cli>Ca²⁺ release from sarcoplasmic reticulum → binds troponin → tropomyosin moves → actin-myosin cross-bridge formation → contraction\u003c/li>\n            \u003cli>AChE hydrolyzes ACh → ACh removed → repolarization\u003c/li>\n          \u003c/ol>\n          \u003ch4>Neuromuscular Blockers (NMBs)\u003c/h4>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Class\u003c/th>\u003cth>Example\u003c/th>\u003cth>Mechanism\u003c/th>\u003cth>Reversal\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Depolarizing\u003c/td>\u003ctd>Succinylcholine (suxamethonium)\u003c/td>\u003ctd>Activates nAChR → persistent depolarization → fasciculations then flaccid paralysis (Phase I block)\u003c/td>\u003ctd>NOT reversible by neostigmine; spontaneous recovery; pseudocholinesterase hydrolyzes\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Non-depolarizing\u003c/td>\u003ctd>Rocuronium, vecuronium, cisatracurium\u003c/td>\u003ctd>Competitive antagonist at nAChR → block ACh binding → flaccid paralysis; no fasciculations\u003c/td>\u003ctd>Reversed by neostigmine (AChE inhibitor) + glycopyrrolate; or sugammadex (encapsulates rocuronium/vecuronium)\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>Succinylcholine contraindications:\u003c/strong> Hyperkalemia (burns, crush injury, denervation, prolonged immobilization) — succinylcholine causes K⁺ release from muscle → cardiac arrest. Also triggers malignant hyperthermia in susceptible patients (RYR1 mutation) → dantrolene treatment.\u003c/div>\n        "}],"keyTerms":[{"term":"Neuromuscular junction (NMJ)","def":"Synapse between alpha motor neuron and skeletal muscle; uses ACh; target of NMBs and AChE inhibitors."},{"term":"Succinylcholine","def":"Depolarizing NMB; rapid onset; used for RSI (rapid sequence intubation). Contraindicated in hyperkalemia."},{"term":"Sugammadex","def":"Reversal agent that encapsulates rocuronium/vecuronium (non-depolarizing NMBs) → immediate reversal regardless of depth of block."},{"term":"Dantrolene","def":"Inhibits ryanodine receptor (RYR1) → prevents Ca²⁺ release from SR → reduces muscle contraction. Treatment for malignant hyperthermia and neuroleptic malignant syndrome."},{"term":"Smooth muscle","def":"Involuntary, non-striated muscle in hollow organs; controlled by ANS, hormones, and local mediators. Target of vasodilators, bronchodilators, and antispasmodics."}]}},"pq":[{"id":"anat-1","topic":"Terminology","question":"The heart is _______ to the lungs.","options":["Lateral","Medial","Superior","Inferior"],"answer":1,"explanation":"The heart is located in the mediastinum, between the two lungs. Medial means toward the midline of the body. The heart is medial to both left and right lungs."},{"id":"anat-2","topic":"Terminology","question":"The kidneys are described as retroperitoneal. This means they are located:","options":["Within the peritoneum","Behind the peritoneum (between peritoneum and posterior abdominal wall)","Superior to the peritoneum","Within the thoracic cavity"],"answer":1,"explanation":"Retroperitoneal structures lie posterior to the parietal peritoneum, between the peritoneum and the posterior abdominal wall. Retroperitoneal organs: kidneys, ureters, adrenal glands, aorta, IVC, pancreas (except tail), duodenum (2nd and 3rd parts), ascending and descending colon. Mnemonic: \"SAD PUCKER\" (Suprarenal/adrenal, Aorta/IVC, Duodenum parts 2-3, Pancreas body/tail, Ureters, Colon ascending/descending, Kidneys, Esophagus, Rectum)."},{"id":"anat-3","topic":"Integumentary","question":"Which layer of the skin is the PRIMARY barrier to transdermal drug absorption?","options":["Stratum basale (germinativum)","Stratum spinosum","Stratum corneum","Dermis"],"answer":2,"explanation":"The stratum corneum (outermost layer) is the main barrier to transdermal drug penetration. It consists of dead, flattened corneocytes embedded in lipid lamellae (mainly ceramides, fatty acids, cholesterol). This \"brick and mortar\" structure limits drug penetration. Hydration (occlusive dressings) increases permeability."},{"id":"anat-4","topic":"Integumentary","question":"A transdermal fentanyl patch provides analgesia for 72 hours. What is the main advantage of this route?","options":["Fastest onset of action compared to IV","Avoids first-pass hepatic metabolism; sustained drug release","No skin irritation","Requires patient cooperation"],"answer":1,"explanation":"Transdermal delivery avoids the first-pass effect (drug absorbed into systemic circulation, not portal vein → liver). Fentanyl is highly lipophilic (log P ~4.0) → excellent skin penetration. The patch provides controlled, sustained release → stable plasma levels → avoiding peaks (toxicity) and troughs (inadequate analgesia) seen with oral dosing."},{"id":"anat-5","topic":"Integumentary","question":"Melanoma is treated with pembrolizumab (anti-PD-1 checkpoint inhibitor). The malignant cell originates from:","options":["Keratinocytes in stratum spinosum","Melanocytes in stratum basale","Langerhans cells","Fibroblasts in the dermis"],"answer":1,"explanation":"Melanoma arises from malignant transformation of melanocytes — pigment-producing cells located in the stratum basale of the epidermis and hair follicles. Most melanomas are BRAF-mutated (BRAFV600E, 50%) → targeted by vemurafenib, dabrafenib. Immunotherapy (pembrolizumab, nivolumab) targets PD-1/PD-L1 checkpoint → effective regardless of BRAF status."},{"id":"anat-6","topic":"Skeletal","question":"Bisphosphonates (alendronate) treat osteoporosis by:","options":["Stimulating osteoblast bone formation","Inhibiting osteoclast bone resorption","Increasing calcium absorption from gut","Stimulating calcitonin release"],"answer":1,"explanation":"Bisphosphonates inhibit osteoclast function. They are incorporated into bone matrix → ingested by osteoclasts → inhibit farnesyl pyrophosphate synthase (in mevalonate pathway) → impair osteoclast cytoskeletal function and induce osteoclast apoptosis → decreased bone resorption → maintained bone density."},{"id":"anat-7","topic":"Skeletal","question":"Fluoroquinolone antibiotics should be used with caution in children because they may damage:","options":["The liver (hepatotoxicity)","Epiphyseal growth plates","The renal glomeruli","CNS development"],"answer":1,"explanation":"Fluoroquinolones can damage articular cartilage and epiphyseal growth plates in children and adolescents in animal studies → generally avoided in patients &lt;18 years (with exceptions: inhalational anthrax, some severe UTIs). Generally use alternatives when available in pediatric patients."},{"id":"anat-8","topic":"Skeletal","question":"Red blood cells are produced in which location?","options":["Liver and spleen (in adults)","Thymus","Red bone marrow (in flat bones and proximal epiphyses of long bones)","Lymph nodes"],"answer":2,"explanation":"Hematopoiesis (blood cell production) occurs in red bone marrow in adults, primarily in flat bones (sternum, ribs, ilium, skull) and proximal epiphyses of femur and humerus. The liver and spleen are hematopoietic in fetal life. Erythropoietin (EPO) from kidney stimulates RBC production → EPO analogs (darbepoetin, epoetin) used in anemia of CKD."},{"id":"anat-9","topic":"Nervous","question":"Dopaminergic neurons in the SUBSTANTIA NIGRA project to the STRIATUM. Degeneration of this pathway causes:","options":["Alzheimer's disease","Multiple sclerosis","Parkinson's disease","Myasthenia gravis"],"answer":2,"explanation":"Parkinson's disease results from degeneration of dopaminergic neurons in substantia nigra pars compacta (SNpc) → loss of dopamine in striatum (caudate nucleus + putamen) → imbalance between dopaminergic (inhibitory) and cholinergic (excitatory) pathways → bradykinesia, resting tremor, rigidity, postural instability. Treatment: Levodopa/carbidopa (dopamine precursor), dopamine agonists, MAO-B inhibitors."},{"id":"anat-10","topic":"Nervous","question":"The blood-brain barrier (BBB) is formed mainly by:","options":["Myelin sheaths around axons","Tight junctions between brain capillary endothelial cells + astrocyte foot processes","The blood-CSF barrier only at the choroid plexus","Microglial cells"],"answer":1,"explanation":"The BBB is formed by: (1) Tight junctions (claudins, occludins) between brain capillary endothelial cells — far more restrictive than peripheral capillaries; (2) Astrocyte foot processes surrounding the capillaries; (3) Pericytes. Additionally, efflux pumps (P-gp, MRP) actively expel drugs. This severely restricts CNS drug penetration and is a major challenge for CNS drug development."},{"id":"anat-11","topic":"Nervous","question":"Ondansetron (Zofran) blocks 5-HT₃ receptors in the chemoreceptor trigger zone (CTZ) to prevent nausea. The CTZ is located:","options":["Behind the BBB in the cerebral cortex","Outside the BBB in the area postrema of the medulla","In the hypothalamus","In the peripheral GI tract only"],"answer":1,"explanation":"The CTZ (area postrema) is located in the floor of the 4th ventricle of the medulla. It is OUTSIDE the BBB → directly exposed to drugs and toxins in blood and CSF. This allows it to detect emetic substances. Antiemetics targeting CTZ (metoclopramide — D₂; ondansetron — 5-HT₃; droperidol — D₂; aprepitant — NK1) need to reach CTZ, which is accessible from blood."},{"id":"anat-12","topic":"Nervous","question":"The parasympathetic nervous system uses acetylcholine as its neurotransmitter. Atropine treats organophosphate poisoning by:","options":["Reactivating acetylcholinesterase","Blocking muscarinic acetylcholine receptors → reducing cholinergic excess","Increasing acetylcholine release","Stimulating adrenergic receptors"],"answer":1,"explanation":"Organophosphates irreversibly inhibit AChE → ACh accumulates → cholinergic toxidrome (DUMBELS). Atropine is a competitive muscarinic (M) receptor antagonist → blocks excess ACh effects: reduces secretions (salivation, bronchorrhea, sweating), reverses bronchoconstriction and bradycardia, causes mydriasis. Atropine does NOT reverse NMJ effects (muscle fasciculations, weakness) — those require pralidoxime to reactivate AChE."},{"id":"anat-13","topic":"Cardiovascular","question":"The SA node is the primary cardiac pacemaker. β-Blockers (metoprolol) slow heart rate by:","options":["Directly blocking the SA node Na⁺ channels","Blocking β₁-adrenergic receptors on SA node → decreased sympathetic stimulation → slower automaticity","Blocking the AV node Ca²⁺ channels","Increasing vagal tone (via muscarinic receptors)"],"answer":1,"explanation":"β₁-adrenergic receptors on SA node respond to sympathetic NE/epinephrine → increase HR (positive chronotropy) and AV conduction (positive dromotropy). β-Blockers competitively block β₁ receptors → reduce sympathetic acceleration → lower resting and exercise HR. Cardioselective β-blockers (metoprolol, atenolol, bisoprolol) preferentially block β₁ vs β₂."},{"id":"anat-14","topic":"Cardiovascular","question":"Sublingual nitroglycerin rapidly relieves angina. It is given sublingually (not orally) because:","options":["It is too unstable for oral use","It is poorly absorbed from the gut","It undergoes extensive first-pass hepatic metabolism when swallowed → oral bioavailability ~1%","It irritates the gastric mucosa"],"answer":2,"explanation":"Nitroglycerin is extensively metabolized by liver during first-pass when swallowed → oral bioavailability ~1% → inadequate plasma levels. Sublingual route: absorbed through sublingual veins → jugular vein → superior vena cava → bypasses portal circulation → systemic levels achieved in 1–2 minutes. Similarly, buccal, transdermal, IV, and intracoronary routes are used to bypass first-pass."},{"id":"anat-15","topic":"Cardiovascular","question":"Digoxin is used in atrial fibrillation to slow ventricular rate. Its main mechanism in AF is:","options":["Blocking Na⁺ channels in SA node","Increasing vagal tone (parasympathetic) → slows AV conduction → fewer atrial impulses reach ventricles","Blocking β-adrenergic receptors in AV node","Decreasing SA node automaticity directly"],"answer":1,"explanation":"Digoxin has two mechanisms in AF: (1) Direct effect: inhibits Na⁺/K⁺ ATPase → slightly reduced AV conduction velocity; (2) Indirect/vagal: stimulates vagal (cholinergic) tone → ↑ ACh at AV node → slows AV conduction → blocks more atrial impulses from reaching ventricles → controls ventricular rate in AF. Effect is predominant via vagal mechanism."},{"id":"anat-16","topic":"Respiratory","question":"Type II pneumocytes (type II alveolar cells) produce surfactant. Deficiency of surfactant in premature infants causes:","options":["Pulmonary embolism","Neonatal respiratory distress syndrome (NRDS) — alveolar collapse","Pneumonia","Pulmonary hypertension"],"answer":1,"explanation":"Surfactant reduces alveolar surface tension (per Laplace's law: pressure = 2T/r — small alveoli without surfactant would collapse). In NRDS (also called hyaline membrane disease), deficient surfactant → high surface tension → alveolar collapse at end-expiration → severe respiratory failure. Treatment: exogenous surfactant (beractant/Survanta, poractant/Curosurf) administered via endotracheal tube; prevention: antenatal betamethasone to mother induces fetal surfactant production."},{"id":"anat-17","topic":"Respiratory","question":"For optimal bronchial drug deposition (asthma inhalers), the optimal aerosol particle size is:","options":["&gt; 10 μm","5–10 μm","1–5 μm","&lt; 0.1 μm"],"answer":2,"explanation":"1–5 μm particles are optimal for bronchial deposition. &gt;10 μm particles impact in the upper airway (nose/throat); 5–10 μm particles in trachea/main bronchi; 1–5 μm reach bronchioles and smaller airways (the therapeutic target in asthma); &lt;1 μm may reach alveoli or be exhaled. Inhaler technique is critical — improper technique increases oropharyngeal deposition."},{"id":"anat-18","topic":"Respiratory","question":"Inhaled corticosteroids (ICS) such as budesonide can cause oral candidiasis. This is prevented by:","options":["Taking ICS with food","Rinsing the mouth and gargling with water after each dose","Using the inhaler more frequently","Taking antifungal medications prophylactically"],"answer":1,"explanation":"ICS deposited in the oropharynx (especially with poor inhaler technique) → local immunosuppression → Candida albicans overgrowth → oral thrush. Prevention: use a spacer (reduces oropharyngeal deposition), rinse mouth and gargle after use, spit water out. Using a DPI (dry powder inhaler) may reduce oropharyngeal deposition compared to pMDI without spacer."},{"id":"anat-19","topic":"Digestive","question":"Proton pump inhibitors (omeprazole) reduce gastric acid by:","options":["Blocking H₂ receptors on parietal cells","Irreversibly inhibiting H⁺/K⁺ ATPase (proton pump) on parietal cell apical membrane","Neutralizing stomach acid directly (like antacids)","Blocking gastrin receptors"],"answer":1,"explanation":"PPIs (omeprazole, pantoprazole, lansoprazole) are pro-drugs activated in the acidic environment of parietal cell canaliculi → sulfenamide → irreversibly binds cysteine residues of H⁺/K⁺ ATPase (proton pump) → blocks the final step of H⁺ secretion regardless of stimulus. Most effective acid suppression. H₂ blockers (famotidine, ranitidine) block H₂ receptors — less potent."},{"id":"anat-20","topic":"Digestive","question":"Grapefruit juice significantly increases plasma levels of many drugs because it:","options":["Increases gastric emptying, improving drug absorption","Inhibits intestinal CYP3A4 AND OATP transporters → reduces first-pass metabolism and increases drug absorption","Increases bile acid secretion to dissolve lipophilic drugs","Alkalinizes intestinal pH, increasing weak acid absorption"],"answer":1,"explanation":"Grapefruit juice contains furanocoumarins (especially bergamottin) that irreversibly inhibit intestinal CYP3A4 and also inhibit OATP uptake transporters. This dramatically reduces first-pass metabolism of CYP3A4 substrates → much higher bioavailability → potential toxicity. Affects: calcium channel blockers (felodipine, amlodipine), statins (lovastatin, simvastatin, atorvastatin), immunosuppressants (cyclosporine, tacrolimus), benzodiazepines (midazolam, triazolam). Avoid grapefruit/Seville orange with these drugs."},{"id":"anat-21","topic":"Digestive","question":"P-glycoprotein (P-gp, MDR1) in intestinal enterocytes reduces drug bioavailability by:","options":["Metabolizing drugs before absorption","Pumping absorbed drug back into the gut lumen (efflux pump)","Preventing drug dissolution in the gut","Binding drugs irreversibly in enterocytes"],"answer":1,"explanation":"P-glycoprotein is an ATP-dependent efflux transporter on the apical (luminal) membrane of intestinal enterocytes. It captures drugs after passive absorption and pumps them back into the intestinal lumen → reduces net drug absorption → reduces bioavailability. Digoxin, vincristine, tacrolimus, some HIV drugs are P-gp substrates. P-gp inhibitors (verapamil, clarithromycin, grapefruit juice) increase bioavailability of substrates."},{"id":"anat-22","topic":"Renal","question":"Furosemide (Lasix) causes diuresis by inhibiting which transporter in the kidney?","options":["SGLT2 in proximal tubule","NCC in distal convoluted tubule","NKCC2 in thick ascending loop of Henle","ENaC in collecting duct"],"answer":2,"explanation":"Furosemide (a loop diuretic) inhibits NKCC2 (Na⁺-K⁺-2Cl⁻ cotransporter) in the thick ascending limb of the loop of Henle → prevents Na⁺, K⁺, Cl⁻ reabsorption → loss in urine → powerful osmotic diuresis. Also prevents establishment of medullary concentration gradient → loss of concentrating ability. Side effects: hypokalemia, hyponatremia, hypomagnesemia, hyperuricemia, ototoxicity (especially with high doses or combination with aminoglycosides)."},{"id":"anat-23","topic":"Renal","question":"A patient with chronic kidney disease (CKD) has reduced GFR. How should renally excreted drugs be dosed?","options":["No dose adjustment needed","Increased doses to compensate for reduced clearance","Reduced dose or extended dosing interval to prevent drug accumulation and toxicity","Switch entirely to hepatic metabolism routes"],"answer":2,"explanation":"Reduced GFR → reduced renal drug clearance → drugs accumulate → toxicity risk. Dose adjustment: reduce dose, extend dosing interval, or both. Critical drugs requiring adjustment: aminoglycosides, vancomycin, β-lactams, metformin (contraindicated if eGFR &lt;30), digoxin, lithium, methotrexate. Creatinine clearance (Cockcroft-Gault equation) used to guide dosing: CrCl = [(140-age) × weight] / (72 × Scr) × 0.85 for females."},{"id":"anat-24","topic":"Renal","question":"Spironolactone is a K⁺-sparing diuretic that works by:","options":["Inhibiting NKCC2 in the loop of Henle","Blocking aldosterone receptors (mineralocorticoid receptor) in collecting duct → decreased Na⁺ reabsorption and K⁺ secretion","Blocking ENaC sodium channels directly","Inhibiting carbonic anhydrase"],"answer":1,"explanation":"Spironolactone is an aldosterone receptor antagonist (mineralocorticoid receptor antagonist). Normally, aldosterone binds MR in principal cells of collecting duct → transcription of ENaC (Na⁺ channels) and Na⁺/K⁺ ATPase → Na⁺ reabsorption, K⁺ secretion. Spironolactone blocks MR → ↓ ENaC expression → less Na⁺ reabsorption + less K⁺ loss → mild diuresis + K⁺ retention. Used in heart failure (reduces mortality), aldosteronism, ascites from cirrhosis."},{"id":"anat-25","topic":"Renal","question":"Probenecid extends the action of penicillin by:","options":["Inhibiting hepatic CYP450 metabolism of penicillin","Inhibiting tubular secretion of penicillin via OAT transporters in proximal tubule","Increasing penicillin absorption from GI tract","Binding penicillin to plasma proteins"],"answer":1,"explanation":"Penicillin is actively secreted by OAT (organic anion transporters) in proximal tubule → rapid renal elimination (short t½). Probenecid inhibits OAT → blocks penicillin secretion → higher plasma levels + longer half-life → prolonged antibacterial effect. Historically used when penicillin was scarce; also used to increase levels of other OAT substrates (cephalosporins, some antivirals like oseltamivir carboxylate)."},{"id":"anat-26","topic":"Muscular","question":"Succinylcholine is contraindicated in burn patients because:","options":["Burns patients need faster-acting agents","It causes massive hyperkalemia in patients with burns, crush injuries, or denervation → cardiac arrest","It prolongs the block in burns patients","Burns patients lack plasma cholinesterase"],"answer":1,"explanation":"Normally, succinylcholine causes small, transient K⁺ release. After burns, crush injury, prolonged immobility, or denervation: there is up-regulation of extrajunctional nAChRs throughout the muscle → succinylcholine activates all these receptors → massive K⁺ efflux → hyperkalemia (K⁺ can rise by 5–10 mEq/L) → fatal arrhythmia. Use rocuronium + sugammadex reversal instead."},{"id":"anat-27","topic":"Cardiovascular","question":"After oral ingestion, aspirin absorbed from the gut travels via the portal vein to the liver before reaching systemic circulation. This is the anatomical basis of:","options":["Bioequivalence","First-pass metabolism","Enterohepatic recirculation","Zero-order kinetics"],"answer":1,"explanation":"The portal vein drains the GI tract → liver. All orally absorbed drugs must pass through the liver first before entering systemic circulation → hepatic enzymes metabolize drugs → reduced bioavailability. This is the \"first-pass effect.\" High first-pass drugs: nitroglycerin (~1%), lidocaine (35%), morphine (25%), propranolol (25%), testosterone (~99%). Routes avoiding first-pass: sublingual, IV, IM, SC, transdermal, rectal (partial)."},{"id":"anat-28","topic":"Nervous","question":"Malignant hyperthermia (MH) triggered by succinylcholine or volatile anesthetics is caused by:","options":["Overactivation of muscarinic receptors","Uncontrolled Ca²⁺ release from sarcoplasmic reticulum (RYR1 mutation) → sustained muscle contraction → hyperthermia","Overactivation of the sympathetic nervous system","Bacterial toxin contamination of the anesthetic"],"answer":1,"explanation":"MH is a pharmacogenetic disorder caused by mutations in the ryanodine receptor 1 (RYR1) gene. Triggering agents (halogenated anesthetics, succinylcholine) → uncontrolled Ca²⁺ release from SR → sustained muscle contraction → hyperthermia, hypercapnia, acidosis, hyperkalemia, rhabdomyolysis → fatal if untreated. Treatment: dantrolene (inhibits RYR1 → blocks Ca²⁺ release) + cooling + bicarbonate. Emergency!"},{"id":"anat-29","topic":"Digestive","question":"Vitamin B₁₂ deficiency leads to pernicious anemia because:","options":["Decreased dietary B₁₂ intake","Absent intrinsic factor (from parietal cells) → B₁₂ cannot be absorbed in terminal ileum","Renal wasting of B₁₂","Excessive B₁₂ destruction by stomach acid"],"answer":1,"explanation":"Vitamin B₁₂ requires binding to intrinsic factor (IF), a glycoprotein secreted by gastric parietal cells, to be absorbed by cubilin receptors in the terminal ileum. Pernicious anemia: autoimmune destruction of parietal cells → ↓ IF → ↓ B₁₂ absorption → macrocytic anemia + subacute combined degeneration of spinal cord (posterior and lateral columns). Treatment: IM or sublingual B₁₂ (hydroxocobalamin or cyanocobalamin) — bypasses need for IF."},{"id":"anat-30","topic":"Renal","question":"Thiazide diuretics INCREASE calcium reabsorption in the DCT. This property makes them useful for:","options":["Treating hypercalcemia","Treating calcium oxalate kidney stones (nephrolithiasis) — reducing urinary Ca²⁺","Treating hyperparathyroidism","Treating hypomagnesemia"],"answer":1,"explanation":"Thiazides (HCTZ, chlorthalidone, indapamide) inhibit NCC in DCT → Na⁺ loss into urine → decreased intracellular Na⁺ → Na⁺/Ca²⁺ exchanger on basolateral membrane becomes more active → more Ca²⁺ removed from cells → more Ca²⁺ reabsorbed from urine. Result: decreased urinary Ca²⁺ (hypocalciuria). Used to prevent recurrent calcium oxalate stones. Contrast with loop diuretics which increase urinary Ca²⁺ excretion."},{"id":"anat-31","topic":"Cardiovascular","question":"Calcium channel blockers (verapamil, diltiazem) are used in supraventricular tachycardia because:","options":["They increase SA node automaticity","They block L-type Ca²⁺ channels in SA/AV node → slow nodal conduction → terminate re-entry circuits and control ventricular rate in AF/flutter","They decrease myocardial contractility exclusively","They block β-adrenergic receptors in the AV node"],"answer":1,"explanation":"The SA and AV nodes depend on slow Ca²⁺ (L-type, phase 0 and 4) currents for depolarization (unlike ventricles which use fast Na⁺ channels). Verapamil and diltiazem (non-dihydropyridine CCBs) block L-type Ca²⁺ channels → slower SA automaticity (decreased HR) + slower AV conduction → useful in AF to control ventricular rate and to terminate AVNRT. Dihydropyridine CCBs (amlodipine, nifedipine) prefer vascular smooth muscle → vasodilators, minimal cardiac effects."},{"id":"anat-32","topic":"Respiratory","question":"β₂ agonists (salbutamol/albuterol) relax airway smooth muscle in asthma by:","options":["Blocking muscarinic M₃ receptors","Activating β₂ adrenergic receptors → Gs → adenylyl cyclase → ↑cAMP → PKA → myosin light chain kinase inhibition → smooth muscle relaxation + bronchodilation","Blocking inflammatory cytokines (like steroids)","Stabilizing mast cells"],"answer":1,"explanation":"β₂ agonists bind β₂ receptors on airway smooth muscle → Gs protein → adenylyl cyclase → ↑cAMP → activates PKA → phosphorylates myosin light chain kinase (MLCK, inactivating it) and opens BK channels → Ca²⁺ sequestration → smooth muscle relaxation → bronchodilation. SABAs (salbutamol) onset 3–5 min; LABAs (salmeterol, formoterol) last 12 hours. LABAs never used alone in asthma without ICS (increases asthma mortality — SMART trial)."},{"id":"anat-33","topic":"Skeletal","question":"Denosumab (Prolia) prevents bone loss by targeting RANKL. What is the mechanism?","options":["Denosumab inhibits osteoblast activity","Denosumab is a monoclonal antibody against RANKL → prevents osteoclast differentiation and activation → reduces bone resorption","Denosumab activates estrogen receptors to increase bone density","Denosumab stimulates parathyroid hormone secretion"],"answer":1,"explanation":"RANKL (receptor activator of NF-κB ligand) is expressed on osteoblasts and stromal cells. It binds RANK on osteoclast precursors → osteoclast differentiation and activation → bone resorption. Denosumab is a human monoclonal antibody (IgG2) that binds and neutralizes RANKL → prevents osteoclast formation → reduces bone resorption → increases bone density. SC injection every 6 months for osteoporosis. Unlike bisphosphonates: no jaw osteonecrosis risk (debated), can be used in renal failure."},{"id":"anat-34","topic":"Nervous","question":"Levodopa (L-DOPA) is used for Parkinson's disease, but dopamine itself is not. Why?","options":["Dopamine is more toxic than levodopa","Levodopa crosses the BBB via amino acid transporters; dopamine cannot cross the BBB","Dopamine is too rapidly metabolized in the plasma","Levodopa binds dopamine receptors more effectively"],"answer":1,"explanation":"Dopamine is hydrophilic (polar amine) → cannot passively cross BBB. Levodopa (L-DOPA) is an amino acid → transported across BBB by large neutral amino acid transporter (LAT1, L-type amino acid transporter). Once inside CNS, aromatic L-amino acid decarboxylase (AADC, DOPA decarboxylase) converts L-DOPA → dopamine. Carbidopa is given with L-DOPA (Sinemet) to inhibit peripheral AADC → reduces peripheral conversion → less side effects (nausea, vomiting) + more L-DOPA reaches brain."},{"id":"anat-35","topic":"Muscular","question":"Vecuronium is a non-depolarizing NMB. It can be reversed by administering:","options":["More succinylcholine","Sugammadex (directly encapsulates vecuronium) OR neostigmine + glycopyrrolate (AChE inhibitor)","Atropine alone","Calcium gluconate"],"answer":1,"explanation":"Non-depolarizing NMBs (vecuronium, rocuronium, cisatracurium) are competitive antagonists at nAChR. Reversal: (1) Neostigmine (AChE inhibitor) → ACh accumulates → outcompetes NMB for nAChR binding; given with glycopyrrolate or atropine to block muscarinic side effects of excess ACh (bradycardia, hypersalivation). (2) Sugammadex: cyclodextrin that encapsulates rocuronium/vecuronium → removes from NMJ → immediate reversal even from deep block."},{"id":"anat-36","topic":"Renal","question":"Metformin is contraindicated in patients with significant renal impairment (eGFR &lt; 30 mL/min/1.73m²) because:","options":["Metformin causes acute kidney injury","Metformin is renally excreted; accumulation in renal failure → lactic acidosis","Metformin reacts with creatinine","Metformin increases urinary glucose excretion, worsening renal function"],"answer":1,"explanation":"Metformin is excreted unchanged by kidneys via OCT2-mediated active tubular secretion. In renal failure → metformin accumulates → inhibits mitochondrial complex I in liver → impaired gluconeogenesis from lactate → lactate accumulates → potentially fatal metformin-associated lactic acidosis (MALA). Generally held when eGFR &lt;30, used with caution eGFR 30-45. Normal renal function metformin is safe and is first-line for T2DM."},{"id":"anat-37","topic":"Digestive","question":"Enterohepatic circulation prolongs the effects of some drugs (e.g., estrogens in OCPs). This cycle involves:","options":["Drug absorbed from gut → portal vein → liver → hepatic artery → gut → reabsorption","Drug conjugated in liver → excreted in bile → enters intestine → bacterial deconjugation → reabsorption → returns to portal vein → liver","Drug filtered in kidney → reabsorbed in tubule → returned to circulation","Drug distributed to adipose tissue → slowly released back into blood"],"answer":1,"explanation":"Enterohepatic circulation: drug glucuronidated/sulfated in liver → excreted in bile → reaches intestinal lumen → gut bacteria β-glucuronidase or sulfatase hydrolyzes conjugate → regenerates active drug → reabsorbed → portal vein → liver → cycle repeats. This extends the effective half-life. Broad-spectrum antibiotics can disrupt this (kill gut bacteria) → reduce enterohepatic recycling of some drugs (estrogens in OCP → potential OCP failure, though debated in current literature)."},{"id":"anat-38","topic":"Cardiovascular","question":"ACE inhibitors (lisinopril, enalapril) lower blood pressure primarily by:","options":["Blocking β₁ receptors in the SA node → lower HR","Inhibiting angiotensin-converting enzyme → decreased Angiotensin II → vasodilation + reduced aldosterone → lower blood volume","Blocking L-type Ca²⁺ channels in vascular smooth muscle","Increasing NO production from endothelium"],"answer":1,"explanation":"ACE (angiotensin-converting enzyme) converts Angiotensin I → Angiotensin II (potent vasoconstrictor) AND degrades bradykinin (vasodilator). ACE inhibitors block this → ↓ Ang II → ↓ vasoconstriction + ↓ aldosterone → ↓ Na⁺/water retention + ↑ bradykinin (→ vasodilation AND the annoying dry cough side effect, also angioedema risk). Used in hypertension, heart failure, CKD with proteinuria, post-MI."},{"id":"anat-39","topic":"Integumentary","question":"A pharmacist recommends a patient use a spacer (valved holding chamber) with their metered-dose inhaler. The main purpose is:","options":["To increase the drug dose per actuation","To reduce oropharyngeal deposition by slowing and settling large particles; allows better lung deposition","To prevent contamination of the inhaler","To make inhaler use easier for all patients"],"answer":1,"explanation":"Without a spacer: MDI releases fast-moving aerosol → most large particles deposit in oropharynx → swallowed → contributes to systemic side effects (ICS → oral/esophageal candidiasis; systemic absorption → adrenal suppression with high doses). With spacer: particles decelerate in spacer → large particles settle out → fine particles reach lungs. Especially important for ICS (reduces oropharyngeal Candida), children, and patients with poor coordination."},{"id":"anat-40","topic":"Renal","question":"SGLT2 inhibitors (empagliflozin, dapagliflozin) reduce cardiovascular mortality in heart failure independent of their glucose-lowering effect. One proposed mechanism involves:","options":["Direct positive inotropic effect","Osmotic diuresis and natriuresis → reduced preload and afterload on heart; anti-fibrotic and anti-inflammatory effects","Blocking β₁ receptors in heart failure","Improving cardiac perfusion by vasodilation"],"answer":1,"explanation":"SGLT2 inhibitors cause: (1) Osmotic diuresis and natriuresis (reduces volume overload → less cardiac preload), (2) Metabolic shift (ketogenesis → more efficient cardiac energy use), (3) Anti-inflammatory and anti-fibrotic effects, (4) Reduce cardiac afterload (vasodilation). Clinical evidence: EMPA-REG OUTCOME, DAPA-HF, EMPEROR-Reduced trials showed 20–30% reduction in cardiovascular death/HF hospitalization — now recommended in HFrEF and HFpEF regardless of diabetes status."},{"id":"anat-41","topic":"Nervous","question":"Benzodiazepines (diazepam, lorazepam) reduce anxiety by enhancing the effect of which neurotransmitter?","options":["Glutamate (NMDA receptor activation)","GABA (via GABA-A receptor, increasing Cl⁻ influx frequency)","Dopamine (D₂ receptor)","Serotonin (5-HT₁A receptor)"],"answer":1,"explanation":"Benzodiazepines bind to the benzodiazepine site on GABA-A receptors (allosteric modulator) → increases the FREQUENCY of Cl⁻ channel opening in response to GABA → hyperpolarization → neuronal inhibition → sedation, anxiolysis, muscle relaxation, anticonvulsant effect. Compare with barbiturates: increase duration of Cl⁻ channel opening (more dangerous — can open even without GABA → respiratory depression). Flumazenil reverses benzodiazepine effect (competitive antagonist at BZD site)."},{"id":"anat-42","topic":"Cardiovascular","question":"A 70-year-old patient with atrial fibrillation is prescribed warfarin for stroke prevention. Warfarin's target is in which organ?","options":["Heart (directly blocks clotting at the SA node)","Liver (inhibits hepatic synthesis of vitamin K-dependent clotting factors II, VII, IX, X)","Kidney (reduces thrombin excretion)","Spleen (inhibits platelet production)"],"answer":1,"explanation":"Warfarin inhibits vitamin K epoxide reductase (VKOR) in the liver → vitamin K cannot be recycled → depletes reduced vitamin K (cofactor for carboxylation of Glu residues in factors II, VII, IX, X, protein C, S, Z) → decreased functional clotting factors → anticoagulation. Factor VII (shortest half-life) depleted first → INR rises first. Takes 2–3 days to reach full e
