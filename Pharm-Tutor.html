t":"\n          \u003ch4>Film Coating\u003c/h4>\n          \u003cp>Thin polymer film applied to tablets. Polymers: HPMC (Opadry), Eudragit (methacrylic acid copolymers), cellulose acetate phthalate (CAP), PVAP, shellac.\u003c/p>\n          \u003cul>\n            \u003cli>Immediate release coating: HPMC, PVA → water-soluble, dissolves in stomach\u003c/li>\n            \u003cli>Enteric coating: Eudragit L (dissolves pH&gt;6), Eudragit S (pH&gt;7), CAP, HPMCP, PVAP → resist gastric acid\u003c/li>\n            \u003cli>Extended-release coating: Ethylcellulose, Eudragit RS/RL → insoluble, controls diffusion through membrane\u003c/li>\n          \u003c/ul>\n          \u003ch4>Sugar Coating\u003c/h4>\n          \u003cp>Classic process; thick sugar layers applied by pan coating. Labor-intensive but excellent taste masking; glossy finish. Being replaced by film coating in modern manufacture.\u003c/p>\n        "},{"title":"Capsules","content":"\n          \u003ch4>Hard Gelatin Capsules (HGC)\u003c/h4>\n          \u003cul>\n            \u003cli>Two-piece shells (cap + body) made of gelatin, HPMC (vegetarian), or starch\u003c/li>\n            \u003cli>Filled with powder, pellets, minitablets, granules, or (some) liquids\u003c/li>\n            \u003cli>Sizes: 000 (largest, 1.37 mL) → 5 (smallest, 0.13 mL); size 0 and 1 most common\u003c/li>\n            \u003cli>Gelatin from bovine/porcine — issues for vegetarians and some religions → HPMC alternative\u003c/li>\n          \u003c/ul>\n          \u003ch4>Soft Gelatin Capsules (SGC, Softgels)\u003c/h4>\n          \u003cul>\n            \u003cli>One-piece sealed capsule; shell is softer (plasticized with glycerin/sorbitol)\u003c/li>\n            \u003cli>Filled with liquid drug (lipophilic solutions, suspensions, or semisolids)\u003c/li>\n            \u003cli>Excellent for: BCS Class II drugs (improves bioavailability via lipid solutions), oils (fish oil, vitamin E), drugs requiring liquid fill (cyclosporine Neoral, nifedipine)\u003c/li>\n            \u003cli>Manufacturing: rotary die process (Accogel, Banner processes)\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"info-box key\">\u003cstrong>Capsule vs tablet:\u003c/strong> Capsules: faster dissolution (gelatin dissolves rapidly), better patient acceptance (easier to swallow), easier to fill for small batches. Tablets: cheaper, more stable, can be enteric-coated, more dose flexibility. Capsules can be reformulated as tablets for generic substitution provided bioequivalence proven.\u003c/div>\n        "}],"keyTerms":[{"term":"Enteric coating","def":"Polymer coating (Eudragit L, CAP) that resists gastric acid but dissolves at intestinal pH. Protects acid-labile drugs; reduces gastric irritation."},{"term":"Extended-release (ER)","def":"Modified-release formulation maintaining drug levels over 8–24 hours. Reduces dosing frequency and peak-trough fluctuations."},{"term":"Capping","def":"Tablet defect where top or bottom of tablet separates due to air entrapment or poor compression. Requires reformulation."},{"term":"ODT (Orally Disintegrating Tablet)","def":"Tablet designed to disintegrate in mouth within 30 seconds with saliva. Useful for dysphagic patients; no water required."},{"term":"HLB system","def":"Hydrophile-lipophile balance — guides emulsifier selection. (Also see Suspensions chapter)"}]},"semisolids":{"tag":"Chapter 8 · Pharmatech","title":"Semisolid Dosage Forms","overview":"Semisolids include ointments, creams, gels, pastes, and suppositories. They are used for topical, transdermal, and rectal/vaginal drug delivery.","sections":[{"title":"Classification of Topical Semisolids","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Base\u003c/th>\u003cth>Water content\u003c/th>\u003cth>Feel\u003c/th>\u003cth>Best for\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Ointment\u003c/td>\u003ctd>Oleaginous (petrolatum, white petrolatum) or W/O emulsion\u003c/td>\u003ctd>None to low\u003c/td>\u003ctd>Greasy, occlusive\u003c/td>\u003ctd>Dry skin, localized effect, chronic conditions (psoriasis, eczema)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Cream\u003c/td>\u003ctd>O/W or W/O emulsion\u003c/td>\u003ctd>High (O/W) or moderate (W/O)\u003c/td>\u003ctd>Non-greasy to slightly greasy\u003c/td>\u003ctd>Cosmetically acceptable; acute/subacute conditions; large areas\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Gel\u003c/td>\u003ctd>Aqueous or hydroalcoholic with gelling agent\u003c/td>\u003ctd>High\u003c/td>\u003ctd>Non-greasy, clear or translucent\u003c/td>\u003ctd>Hairy areas, acne, mucous membranes; feel cool on skin\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Paste\u003c/td>\u003ctd>Ointment base + large amount of powder (20–50%)\u003c/td>\u003ctd>Very low\u003c/td>\u003ctd>Very stiff, non-greasy\u003c/td>\u003ctd>Protective barrier (zinc oxide paste for diaper rash)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Lotion\u003c/td>\u003ctd>O/W emulsion, low viscosity\u003c/td>\u003ctd>High\u003c/td>\u003ctd>Fluid, easy to spread\u003c/td>\u003ctd>Large body areas; hairy areas; quick-drying\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "},{"title":"Ointment Bases","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Class\u003c/th>\u003cth>Composition\u003c/th>\u003cth>Washability\u003c/th>\u003cth>Water absorption\u003c/th>\u003cth>Examples\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Oleaginous (hydrocarbon)\u003c/td>\u003ctd>Petrolatum (white/yellow), mineral oil, paraffin wax\u003c/td>\u003ctd>Not washable\u003c/td>\u003ctd>None\u003c/td>\u003ctd>Vaseline/Petroleum jelly (white petrolatum)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Absorption\u003c/td>\u003ctd>Anhydrous; absorb water to form W/O emulsion; lanolin\u003c/td>\u003ctd>Not washable\u003c/td>\u003ctd>Yes (can absorb)\u003c/td>\u003ctd>Hydrophilic petrolatum USP, lanolin, Aquaphor\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>W/O emulsion\u003c/td>\u003ctd>Water dispersed in oil; Cold cream type\u003c/td>\u003ctd>Difficult\u003c/td>\u003ctd>Contains water already\u003c/td>\u003ctd>Cold cream, rose water ointment\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>O/W emulsion (water-removable)\u003c/td>\u003ctd>Oil dispersed in aqueous phase\u003c/td>\u003ctd>Yes (water-washable)\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Hydrophilic ointment USP, vanishing cream base\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Water-soluble\u003c/td>\u003ctd>PEG ointments (CARBOWAX); no oil or fat\u003c/td>\u003ctd>Yes, completely\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>PEG ointment, macrogol ointment\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>Drug release order (fastest to slowest):\u003c/strong> Water-soluble base &gt; O/W base &gt; W/O base &gt; Oleaginous base. More occlusive bases increase drug penetration by hydrating stratum corneum.\u003c/div>\n        "},{"title":"Suppositories","content":"\n          \u003cp>Suppositories are solid dosage forms for rectal, vaginal (pessary), or urethral insertion. They melt or dissolve at body temperature to release drug.\u003c/p>\n          \u003ch4>Suppository Bases\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Cocoa butter (theobroma oil):\u003c/strong> Natural fat; melting point 30–34°C (just below body temp). Polymorphic — must melt at proper rate. Solidifies when refrigerated. Incompatible with some drugs (phenol, chlroalhydrate).\u003c/li>\n            \u003cli>\u003cstrong>Synthetic triglyceride bases (Witepsol, Suppocire):\u003c/strong> Refined fats; consistent melting point; no polymorphism issues; most common today\u003c/li>\n            \u003cli>\u003cstrong>PEG (polyethylene glycol) bases:\u003c/strong> Dissolve in rectal fluids (not melt) → can be used for drugs that must not melt/degrade. Hygroscopic → may cause rectal irritation if patient is dehydrated. No refrigeration needed.\u003c/li>\n            \u003cli>\u003cstrong>Glycerinated gelatin bases:\u003c/strong> For vaginal use; dissolve slowly; good for local action\u003c/li>\n          \u003c/ul>\n          \u003ch4>Drug Factor (Displacement Value)\u003c/h4>\n          \u003cp>Not all bases are equivalent in terms of drug displacement. Displacement value (DV) = mass of drug that displaces 1 g of base. Used to calculate actual base needed when drug is incorporated.\u003c/p>\n          \u003cdiv class=\"formula-block\">Base needed = (Suppository weight − Drug weight / DV) × Number of suppositories\u003c/div>\n        "}],"keyTerms":[{"term":"Ointment","def":"Semisolid, greasy preparation with oleaginous or emulsion base; high drug contact time; occlusive; best for dry skin conditions."},{"term":"Cream","def":"Semisolid O/W or W/O emulsion; more cosmetically acceptable than ointment; washes off easily (O/W type)."},{"term":"Suppository","def":"Solid dosage form for rectal/vaginal insertion; melts (cocoa butter, Witepsol) or dissolves (PEG) at body temperature; used in nausea, pediatrics, unconscious patients."},{"term":"Cocoa butter","def":"Traditional suppository base; natural fat; melts at 30–34°C. Polymorphic — requires controlled melting/cooling during manufacture."},{"term":"Displacement value (DV)","def":"Amount of drug (g) that displaces 1 g of suppository base. Used to calculate correct amount of base when drug is incorporated."}]},"parenterals":{"tag":"Chapter 9 · Pharmatech","title":"Parenteral Products","overview":"Parenteral formulations are administered by injection, bypassing the GI tract. They require the highest quality standards — sterility, pyrogen-free, and particulate-free.","sections":[{"title":"Requirements for Parenterals","content":"\n          \u003ch4>Critical Quality Attributes\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Sterility:\u003c/strong> Absence of all viable microorganisms. Sterility assurance level (SAL) = 10⁻⁶ (1 in 1 million chance of non-sterile unit)\u003c/li>\n            \u003cli>\u003cstrong>Apyrogenicity (Pyrogen-free):\u003c/strong> No endotoxins or pyrogens that cause fever. LAL test (Limulus Amebocyte Lysate) detects endotoxins from Gram(-) bacteria.\u003c/li>\n            \u003cli>\u003cstrong>Particulate-free:\u003c/strong> No visible or sub-visible particles\u003c/li>\n            \u003cli>\u003cstrong>Isotonicity:\u003c/strong> For IV solutions: should be isotonic (280–310 mOsm/L). Highly hypotonic or hypertonic cause hemolysis or crenation respectively\u003c/li>\n            \u003cli>\u003cstrong>pH:\u003c/strong> Ideally close to physiological pH (7.4). Can deviate if required for drug stability but noted on label\u003c/li>\n            \u003cli>\u003cstrong>Stability:\u003c/strong> Chemical, physical, microbiological stability throughout shelf life\u003c/li>\n          \u003c/ul>\n        "},{"title":"Sterilization Methods","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Method\u003c/th>\u003cth>Process\u003c/th>\u003cth>Best for\u003c/th>\u003cth>Limitations\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Terminal moist heat (Autoclave)\u003c/td>\u003ctd>121°C, 15 psi, 15 min (or equivalent: 134°C, 3 min); steam under pressure kills all vegetative cells + most spores\u003c/td>\u003ctd>Aqueous solutions, surgical instruments, glass containers\u003c/td>\u003ctd>Heat-sensitive drugs, polymers, proteins\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Dry heat oven\u003c/td>\u003ctd>160–170°C for 2–4 hours; also depyrogenates glassware (250°C, 30 min)\u003c/td>\u003ctd>Glassware, metal equipment, oils, powders; depyrogenation\u003c/td>\u003ctd>Heat-sensitive materials; slower than steam\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Filtration (aseptic filtration)\u003c/td>\u003ctd>0.22 μm membrane filter removes all bacteria and fungi (but not pyrogens!)\u003c/td>\u003ctd>Heat-labile solutions (antibiotics, proteins, biologics)\u003c/td>\u003ctd>Does not remove viruses or pyrogens; aseptic technique required post-filtration\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Gamma irradiation\u003c/td>\u003ctd>Cobalt-60 source; 25 kGy dose; damages DNA\u003c/td>\u003ctd>Solid dosage forms, medical devices, packaging\u003c/td>\u003ctd>May cause radiolysis of drugs; discoloration; not for liquids\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Ethylene oxide (EtO)\u003c/td>\u003ctd>Gas; alkylates DNA; 50–60°C, controlled humidity; aeration period required to remove toxic residues\u003c/td>\u003ctd>Heat-sensitive medical devices, plastics, packaging\u003c/td>\u003ctd>Toxic and flammable; residues; carcinogen (IARC Group 1)\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box warning\">\u003cstrong>Pyrogen removal:\u003c/strong> Pyrogens (endotoxins) are NOT removed by 0.22 μm filtration (too small — they are large LPS molecules). Endotoxins are destroyed by dry heat (≥250°C for 30 min) or by adsorption. LAL (limulus amebocyte lysate) test detects endotoxins; replaced the rabbit pyrogen test.\u003c/div>\n        "},{"title":"Large Volume Parenterals (LVP) vs. Small Volume","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Large Volume (LVP)\u003c/th>\u003cth>Small Volume (SVP)\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Volume\u003c/td>\u003ctd>≥100 mL (typically 250–1000 mL)\u003c/td>\u003ctd>&lt;100 mL\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Examples\u003c/td>\u003ctd>0.9% NaCl, Lactated Ringer's, 5% Dextrose, TPN, parenteral nutrition\u003c/td>\u003ctd>Ampoules, vials of reconstituted antibiotics, biologics\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Sterilization\u003c/td>\u003ctd>Terminal sterilization (autoclave) preferred\u003c/td>\u003ctd>Often aseptic filtration (heat-labile)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Preservative\u003c/td>\u003ctd>NO preservative — large volume would give toxic total dose\u003c/td>\u003ctd>May contain preservative in multi-dose vials (benzyl alcohol, parabens)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Quality testing\u003c/td>\u003ctd>Sterility, LAL, particulates, seal integrity, volume\u003c/td>\u003ctd>Same\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003ch4>Common IV Fluids\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Normal saline (NS):\u003c/strong> 0.9% NaCl = 154 mEq/L Na + Cl. Isotonic. First-line resuscitation, hyperkalemia management\u003c/li>\n            \u003cli>\u003cstrong>5% Dextrose (D5W):\u003c/strong> 5g glucose/100mL. Isotonic initially but glucose metabolized → effectively free water. Used for hypoglycemia, hypernatremia treatment\u003c/li>\n            \u003cli>\u003cstrong>Lactated Ringer's (LR):\u003c/strong> Most physiological — contains Na, K, Ca, Cl, lactate. Preferred for large-volume resuscitation (trauma, burns)\u003c/li>\n            \u003cli>\u003cstrong>Total Parenteral Nutrition (TPN):\u003c/strong> Dextrose + amino acids + lipids + electrolytes + vitamins; hypertonic → must be given via central line\u003c/li>\n          \u003c/ul>\n        "}],"keyTerms":[{"term":"SAL (Sterility Assurance Level)","def":"10⁻⁶ probability of a non-sterile unit. Standard required for parenteral products."},{"term":"LAL test","def":"Limulus Amebocyte Lysate — in vitro test for detecting bacterial endotoxins (pyrogens) in parenteral products. Replaces rabbit pyrogen test."},{"term":"Aseptic processing","def":"Manufacturing under conditions (laminar flow, ISO Class 5 cleanroom, sterile components) to prevent microbial contamination when terminal sterilization is not possible."},{"term":"Endotoxin","def":"Lipopolysaccharide (LPS) component of Gram-negative bacterial outer membrane; highly pyrogenic even when bacteria are dead; not removed by 0.22 μm filtration; destroyed by dry heat (250°C)."},{"term":"Terminal sterilization","def":"Sterilization of the final sealed product (autoclave, gamma irradiation). Preferred over aseptic processing as it provides higher sterility assurance."}]},"manufacturing":{"tag":"Chapter 10 · Pharmatech","title":"Manufacturing & Quality Control","overview":"Pharmaceutical manufacturing is regulated by GMP (Good Manufacturing Practice). Quality control ensures each batch meets specifications for identity, strength, purity, and safety.","sections":[{"title":"Good Manufacturing Practice (GMP)","content":"\n          \u003cp>GMP (also called cGMP — current GMP) is a system of regulations ensuring pharmaceutical products are consistently manufactured and controlled to quality standards. Regulated by FDA (21 CFR Parts 210/211), ICH Q7, and Thai FDA (GMP TF.1, based on WHO/ASEAN GMP).\u003c/p>\n          \u003ch4>10 Principles of GMP (simplified)\u003c/h4>\n          \u003col style=\"font-size:14px;line-height:1.9;padding-left:18px;\">\n            \u003cli>Define and document manufacturing process and specifications\u003c/li>\n            \u003cli>Validate critical steps and changes\u003c/li>\n            \u003cli>Provide resources (personnel, premises, equipment)\u003c/li>\n            \u003cli>Train personnel\u003c/li>\n            \u003cli>Use correct materials and properly labeled containers\u003c/li>\n            \u003cli>Operate facilities and equipment appropriately\u003c/li>\n            \u003cli>Investigate and document failures\u003c/li>\n            \u003cli>Maintain complete records\u003c/li>\n            \u003cli>Release batches only after QC approval\u003c/li>\n            \u003cli>Conduct periodic audits\u003c/li>\n          \u003c/ol>\n        "},{"title":"Quality Control Tests by Dosage Form","content":"\n          \u003ch4>Tablet Quality Control Tests\u003c/h4>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Test\u003c/th>\u003cth>Purpose\u003c/th>\u003cth>Specification (typical)\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Appearance\u003c/td>\u003ctd>Visual check for defects, color uniformity\u003c/td>\u003ctd>No chips, cracks, mottling; consistent color\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Hardness/Crushing strength\u003c/td>\u003ctd>Resistance to breakage during handling; also affects dissolution\u003c/td>\u003ctd>4–10 kP (varies by formulation)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Friability\u003c/td>\u003ctd>Resistance to chipping/crumbling during handling\u003c/td>\u003ctd>Weight loss &lt;1% (USP); test at 25 rpm for 4 min or 100 revolutions\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Disintegration\u003c/td>\u003ctd>Time for tablet to break into particles in specified liquid\u003c/td>\u003ctd>Uncoated: &lt;15 min (USP); EC tablets: pass gastric (pH 1.2, 1 hr), fail, then disintegrate in intestinal (pH 6.8); ODT: &lt;30 sec\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Dissolution\u003c/td>\u003ctd>Rate and extent of drug going into solution (simulates in vivo dissolution)\u003c/td>\u003ctd>Typically Q = 80% dissolved in 30–60 min (Q is specified % in product specification)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Weight variation (WV)\u003c/td>\u003ctd>Consistency of tablet weight (indirectly content)\u003c/td>\u003ctd>±5% deviation for tablets &lt;130 mg; ±7.5% for 130–324 mg; ±10% for &gt;324 mg (BP/USP)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Content uniformity (CU)\u003c/td>\u003ctd>Drug content in individual tablets; required for low dose (&lt;25 mg or &lt;25% of tablet weight)\u003c/td>\u003ctd>Each tablet: 85–115% of label claim; AV ≤15 (L1); ≤25 (L2)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Assay (potency)\u003c/td>\u003ctd>Drug content in composite of tablets\u003c/td>\u003ctd>Usually 90–110% of label claim\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003ch4>Dissolution Test Apparatus\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Apparatus 1 (Basket):\u003c/strong> Rotating basket; for capsules, floating tablets, delayed-release\u003c/li>\n            \u003cli>\u003cstrong>Apparatus 2 (Paddle):\u003c/strong> Most common; rotating paddle; for tablets, capsules\u003c/li>\n            \u003cli>\u003cstrong>Apparatus 3 (Reciprocating cylinder):\u003c/strong> Extended-release dosage forms\u003c/li>\n            \u003cli>\u003cstrong>Apparatus 4 (Flow-through cell):\u003c/strong> Poorly soluble drugs, implants\u003c/li>\n          \u003c/ul>\n        "},{"title":"Stability Testing","content":"\n          \u003cp>Stability testing determines shelf life and storage conditions. ICH Q1A guideline.\u003c/p>\n          \u003ch4>ICH Stability Conditions\u003c/h4>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Study Type\u003c/th>\u003cth>Temperature\u003c/th>\u003cth>Humidity\u003c/th>\u003cth>Duration\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Long-term (Zone IV — tropical)\u003c/td>\u003ctd>30°C\u003c/td>\u003ctd>65% RH\u003c/td>\u003ctd>12 months minimum (for shelf life)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Accelerated\u003c/td>\u003ctd>40°C\u003c/td>\u003ctd>75% RH\u003c/td>\u003ctd>6 months\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Intermediate\u003c/td>\u003ctd>30°C\u003c/td>\u003ctd>65% RH\u003c/td>\u003ctd>12 months\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Long-term (Zone I/II)\u003c/td>\u003ctd>25°C\u003c/td>\u003ctd>60% RH\u003c/td>\u003ctd>12 months minimum\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cp>Thailand is ICH Zone IVb → products must pass 30°C/65% RH long-term conditions. If accelerated study shows significant change → cannot extrapolate shelf life → must rely on long-term data.\u003c/p>\n          \u003ch4>Arrhenius Equation (Accelerated Degradation Prediction)\u003c/h4>\n          \u003cdiv class=\"formula-block\">k = A · e\u003csup>−Ea/RT\u003c/sup>\u003c/div>\n          \u003cp>Used to predict rate of degradation at storage temperature from elevated temperature data. Q₁₀ rule: reaction rate doubles for every 10°C increase in temperature.\u003c/p>\n        "}],"keyTerms":[{"term":"GMP","def":"Good Manufacturing Practice — regulatory framework ensuring consistent pharmaceutical manufacturing quality. Mandatory for all licensed manufacturers."},{"term":"Friability","def":"Tablet quality test for resistance to chipping; weight loss must be \u003c1% after 100 revolutions in friability tester."},{"term":"Dissolution test","def":"In vitro test measuring rate and extent of drug release from dosage form; surrogate for in vivo absorption; Apparatus 1 (basket) or 2 (paddle)."},{"term":"Content uniformity","def":"QC test ensuring each unit contains correct amount of drug. Required for tablets \u003c25 mg or \u003c25% label claim."},{"term":"ICH stability zones","def":"International Council for Harmonisation climate zones. Thailand = Zone IVb (30°C/65% RH for long-term stability studies)."}]}},"pq":[{"id":"pt-1","topic":"Routes","question":"Which route of administration provides 100% bioavailability by definition?","options":["Oral (PO)","Intramuscular (IM)","Intravenous (IV)","Transdermal (TD)"],"answer":2,"explanation":"Intravenous (IV) administration delivers drug directly into systemic circulation, bypassing all absorption barriers and first-pass metabolism. Therefore, by definition, bioavailability = 100%. Bioavailability of all other routes is compared to IV as the reference."},{"id":"pt-2","topic":"Routes","question":"Nitroglycerin for acute angina is given sublingually rather than orally because:","options":["Oral nitroglycerin has no pharmacological effect","Oral nitroglycerin has nearly 0% bioavailability due to extensive first-pass hepatic metabolism","Nitroglycerin is destroyed by saliva","Sublingual route gives more sustained release"],"answer":1,"explanation":"Nitroglycerin (GTN) is so extensively metabolized on first-pass through the liver that oral bioavailability is approximately 1%. Sublingual administration allows absorption into sublingual veins → SVC → systemic circulation, completely bypassing the portal circulation and liver. Onset is 1–2 minutes, and the drug begins working immediately."},{"id":"pt-3","topic":"Routes","question":"A BCS Class II drug has:","options":["High solubility, High permeability","High solubility, Low permeability","Low solubility, High permeability","Low solubility, Low permeability"],"answer":2,"explanation":"BCS Class II: Low Solubility, High Permeability. These drugs dissolve slowly (rate-limiting step = dissolution) but once dissolved, permeate the gut wall well. Examples: ibuprofen, carbamazepine, griseofulvin, nifedipine. Formulation strategies focus on improving dissolution: nanosizing, amorphous solid dispersions, hot-melt extrusion, lipid-based formulations."},{"id":"pt-4","topic":"Routes","question":"Depot IM injections (e.g., haloperidol decanoate, medroxyprogesterone acetate IM) are useful because:","options":["They have 100% bioavailability like IV","They provide sustained drug release over weeks to months from the injection site","They avoid first-pass metabolism more than oral","They have faster onset than IV"],"answer":1,"explanation":"Depot formulations (oil-based or microsphere suspensions) form a drug reservoir at the IM injection site → slow absorption into systemic circulation over weeks to months. Benefits: improved compliance (no daily doses), stable drug levels, useful for patients who cannot take oral medications reliably. Examples: fluphenazine decanoate (2–4 weeks), haloperidol decanoate (4 weeks), DMPA (Depo-Provera, 3 months)."},{"id":"pt-5","topic":"Biopharmaceutics","question":"Two generic drug products are declared bioequivalent if the 90% confidence interval of the test/reference ratio for AUC and Cmax falls within:","options":["70–130%","80–125%","90–110%","75–133%"],"answer":1,"explanation":"The regulatory standard for bioequivalence (BE) is that the 90% CI of the geometric mean ratio (test/reference) for AUC∞ and Cmax must fall within 80.00–125.00%. This applies to standard oral drug products. Narrow therapeutic index drugs (warfarin, cyclosporine, digoxin, phenytoin, lithium) typically have tighter acceptance criteria of 90–111%."},{"id":"pt-6","topic":"Biopharmaceutics","question":"Which pharmacokinetic parameter directly reflects the rate of drug absorption after oral dosing?","options":["AUC","Cmax","Tmax","t½"],"answer":2,"explanation":"Tmax (time to maximum concentration) reflects how quickly drug is absorbed. Faster absorption → shorter Tmax → earlier Cmax. While AUC measures total exposure (reflecting F) and Cmax measures peak concentration (reflecting exposure peak), Tmax specifically indicates the rate of the absorption process. Note: Tmax is NOT used as a BE criterion because it is a discrete variable and has high variability."},{"id":"pt-7","topic":"Biopharmaceutics","question":"A drug has a half-life of 6 hours. Approximately how long does it take to reach steady state with multiple dosing?","options":["6 hours","12 hours","30 hours (5 half-lives)","72 hours"],"answer":2,"explanation":"Steady state is reached after approximately 5 half-lives (~97% of steady state). For a drug with t½ = 6 hours: 5 × 6 = 30 hours. Steady state is where the rate of drug input equals rate of elimination → stable plasma concentration range. The same principle applies to drug washout — it takes ~5 half-lives to essentially eliminate all drug from the body."},{"id":"pt-8","topic":"Biopharmaceutics","question":"Morphine has low oral bioavailability (~25%). Which route would maximize bioavailability while being minimally invasive?","options":["Oral","Rectal (suppository)","Sublingual or buccal","Inhalation"],"answer":2,"explanation":"Sublingual buprenorphine (an opioid used in opioid use disorder treatment) bypasses first-pass metabolism → much higher bioavailability than oral. While morphine itself is not commonly given sublingually, the principle applies. Rectal route provides partial bypass (~50% first-pass avoided). For severe pain requiring morphine, IV or SC is preferred. Oral transmucosal fentanyl (Actiq) is an example of buccal opioid delivery with faster absorption and partial first-pass bypass."},{"id":"pt-9","topic":"Preformulation","question":"The Noyes-Whitney equation describes drug dissolution rate. Which modification would MOST effectively increase dissolution rate of a poorly water-soluble drug?","options":["Increase the diffusion layer thickness","Reduce particle size (increase surface area)","Decrease bulk drug concentration in solution","Decrease saturation solubility"],"answer":1,"explanation":"dC/dt = DA(Cs-C)/hV. Increasing surface area (A) by particle size reduction is the most practical and effective strategy. Micronization reduces particle size from ~100 μm to ~1–10 μm → dramatically increases A → faster dissolution. Nanosizing (nanoparticles, 100–1000 nm) provides even greater surface area increase. This is why griseofulvin, spironolactone, and danazol are micronized."},{"id":"pt-10","topic":"Preformulation","question":"The Ritonavir (Norvir) recall of 1998 was caused by:","options":["Manufacturing contamination","Discovery of a new stable polymorph with much lower solubility → capsules failed dissolution testing","Drug-excipient incompatibility with gelatin","Oxidative degradation during storage"],"answer":1,"explanation":"Ritonavir exists in multiple polymorphic forms. A new, more stable polymorph (Form II) spontaneously appeared in manufacturing, converting the original amorphous/Form I ritonavir to the more stable, much less soluble Form II. This caused the soft gelatin capsule formulation to crystallize and fail dissolution testing → the drug precipitated → no therapeutic effect. Abbott had to completely reformulate to Norvir capsules (heat-stable formulation). This case became the seminal example of polymorphism importance in pharmaceutical development."},{"id":"pt-11","topic":"Preformulation","question":"A new drug has pKa = 8.5 and is a weak base. At stomach pH of 1.5, what percentage is ionized?","options":["Nearly 0% ionized","About 50% ionized","Nearly 100% ionized","Cannot be determined from pKa alone"],"answer":2,"explanation":"For a weak base: pH = pKa + log([B]/[BH⁺]). At pH 1.5, pKa 8.5: 1.5 = 8.5 + log([B]/[BH⁺]) → log([B]/[BH⁺]) = -7 → [B]/[BH⁺] = 10⁻⁷ → drug is almost entirely protonated (ionized as BH⁺) in stomach. This means: (1) very water-soluble in stomach (ionized form dissolves well), (2) very poorly absorbed from stomach (ionized form cannot cross membranes well). Most absorption occurs in intestine where pH is higher."},{"id":"pt-12","topic":"Preformulation","question":"Primary amine-containing drugs should NOT be formulated with lactose because:","options":["Lactose increases drug solubility too much","Lactose undergoes Maillard reaction with primary amines → browning, loss of drug potency","Lactose is incompatible with all drugs","Lactose causes tablet hardness to be too high"],"answer":1,"explanation":"The Maillard (browning) reaction occurs between primary or secondary amines and reducing sugars (lactose, glucose). This reaction: discolors tablets (yellow/brown), forms new chemical entities, reduces drug content. Examples: amoxicillin + lactose, gabapentin + lactose, ranitidine + lactose. Solution: use non-reducing fillers (mannitol, microcrystalline cellulose, dicalcium phosphate, DCPD) instead of lactose."},{"id":"pt-13","topic":"Powders","question":"A powder blend has a Carr's Index of 30%. This indicates:","options":["Excellent flow — direct compression is possible","Good flow — minor issues","Very poor flow — granulation required before compression","The powder is too dense"],"answer":2,"explanation":"Carr's Index (CI) = (Tapped density - Bulk density) / Tapped density × 100. Interpretation: \u003c10% = excellent, 11-15% = good, 16-20% = fair, 21-25% = passable, 26-31% = poor, 32-37% = very poor, >38% = extremely poor. CI = 30% indicates poor/very poor flow → granulation (wet or dry) is needed before compression to improve flowability, compressibility, and content uniformity."},{"id":"pt-14","topic":"Powders","question":"Which of the following drugs is MOST likely to require dry granulation rather than wet granulation?","options":["Lactose tablets","Paracetamol tablets","Aspirin (moisture-sensitive) tablets","Metformin tablets"],"answer":2,"explanation":"Aspirin (acetylsalicylic acid) is an ester that undergoes hydrolysis in the presence of moisture → forms acetic acid and salicylic acid. Wet granulation adds water → would cause significant aspirin degradation. Dry granulation (roller compaction or slugging) or direct compression is used for aspirin. Similarly, effervescent tablets cannot be wet granulated (acid + base would react with water during granulation)."},{"id":"pt-15","topic":"Powders","question":"Magnesium stearate is added to tablet formulations at the end of blending and for the minimum time necessary because:","options":["It is chemically unstable and degrades with prolonged mixing","It is hydrophobic — over-mixing coats all particles with a hydrophobic layer, reducing tablet hardness and dissolution rate","It is expensive and should be used sparingly","Over-mixing causes it to react with the drug"],"answer":1,"explanation":"Magnesium stearate (MgSt) is a hydrophobic lubricant that forms a monomolecular film on particle surfaces during blending. Over-mixing → excessive hydrophobic coating → poor wetting in dissolution medium → reduced dissolution rate → potentially reduced bioavailability. Also reduces tablet hardness. Rule: add MgSt last; blend only 2–5 minutes. Sodium stearyl fumarate (Pruv) is a less lubrication-sensitive alternative less affected by over-mixing."},{"id":"pt-16","topic":"Powders","question":"Croscarmellose sodium (CCS), sodium starch glycolate (SSG), and crospovidone are classified as:","options":["Lubricants","Binders","Superdisintegrants","Glidants"],"answer":2,"explanation":"Superdisintegrants: wicking + swelling mechanism → rapidly absorb water and swell → break tablet apart quickly. SSG (Explotab) and CCS (Ac-Di-Sol) swell up to 300× their volume in water. Used at 2–5% concentration (versus 5–20% for traditional disintegrants). These are preferred in ODTs (orally disintegrating tablets) and wherever fast dissolution is required. Compare: lubricants (MgSt, stearic acid), binders (PVP, HPMC), glidants (Aerosil, colloidal SiO₂)."},{"id":"pt-17","topic":"Solutions","question":"An ophthalmic solution should ideally be isotonic with lacrimal fluid. Which concentration of NaCl is isotonic?","options":["0.45% NaCl","0.9% NaCl","3% NaCl","5% NaCl"],"answer":1,"explanation":"0.9% NaCl (normal saline) is isotonic with blood plasma and lacrimal fluid (~308 mOsm/L). Hypotonic solutions cause corneal cell swelling; hypertonic solutions cause shrinkage. Both cause discomfort and potential damage. Ophthalmic preparations must be isotonic (or within acceptable range). The NaCl equivalent method or cryoscopic data (freezing point depression) are used to adjust tonicity of ophthalmic solutions."},{"id":"pt-18","topic":"Solutions","question":"A syrup formulation uses 85% w/v sucrose solution. This high sucrose concentration:","options":["Acts as a preservative by reducing water activity and creating high osmotic pressure","Improves drug dissolution only","Prevents crystallization (graining) only","Is solely for taste masking"],"answer":0,"explanation":"85% w/v sucrose syrup (simple syrup) is self-preserving: the high sucrose concentration creates very high osmotic pressure and very low water activity (aw ≈ 0.80–0.85) → microorganisms cannot survive (need aw >0.90). At lower sucrose concentrations (\u003c65%), the syrup is NOT self-preserving and requires added antimicrobial preservatives (methylparaben + propylparaben, benzalkonium chloride, etc.)."},{"id":"pt-19","topic":"Solutions","question":"Sodium metabisulfite is added to an epinephrine injection formulation. Its function is:","options":["Preservative against microbial contamination","Antioxidant to prevent oxidative degradation of epinephrine","Chelating agent to remove trace metals","Buffering agent to maintain pH"],"answer":1,"explanation":"Epinephrine (adrenaline) is highly susceptible to oxidation — the catechol ring is easily oxidized → forms adrenochrome (pink/brown color). Sodium metabisulfite (Na₂S₂O₅) is an antioxidant: it preferentially oxidizes → sacrificially protects epinephrine. EDTA may also be added as a chelating agent to remove trace metal ions (Cu²⁺, Fe²⁺) that catalyze oxidation. Together they protect epinephrine formulations."},{"id":"pt-20","topic":"Suspensions","question":"Stokes' Law predicts sedimentation rate in a suspension. To minimize sedimentation, which approach is BEST?","options":["Increase particle size","Increase viscosity of the suspension vehicle","Increase the density difference between particle and vehicle","Decrease the surface area of particles"],"answer":1,"explanation":"Stokes' Law: v = d²(ρs - ρl)g / 18η. To reduce sedimentation velocity (v): decrease particle size (d²), reduce density difference (ρs - ρl), or increase viscosity (η). Increasing vehicle viscosity (adding suspending agents: CMC, xanthan gum, HPMC) is the most practical formulation strategy. The square relationship with particle size means halving particle size reduces sedimentation 4×."},{"id":"pt-21","topic":"Suspensions","question":"In an O/W emulsion, the external (continuous) phase is:","options":["Oil","Water","Emulsifier only","Both oil and water equally"],"answer":1,"explanation":"In O/W (oil-in-water) emulsion: oil droplets are dispersed WITHIN a continuous aqueous (water) external phase. This is why O/W creams are water-washable — the outer phase is water, so water easily removes the cream. O/W emulsions feel non-greasy, have good spread on skin, and are cosmetically preferred for most topical applications. W/O emulsions (e.g., cold cream) have oil as the continuous phase → oily, occlusive, water-in-oil."},{"id":"pt-22","topic":"Suspensions","question":"An emulsifier with HLB value of 4 would be most appropriate for forming:","options":["O/W emulsion (oil-in-water)","W/O emulsion (water-in-oil)","Microemulsion","Suspension"],"answer":1,"explanation":"HLB (Hydrophile-Lipophile Balance) system: HLB 1–6 = W/O emulsifiers (lipophilic), HLB 7–9 = wetting agents, HLB 8–18 = O/W emulsifiers (hydrophilic). HLB = 4 → lipophilic emulsifier → stabilizes W/O emulsions (water droplets in oil). Example: Span 80 (sorbitan monooleate) has HLB = 4.3 → W/O emulsifier. Polysorbate 80 (Tween 80) has HLB = 15 → O/W emulsifier."},{"id":"pt-23","topic":"Suspensions","question":"Creaming in an O/W emulsion is:","options":["Irreversible coalescence of oil droplets","Reversible migration of oil droplets to the top (cream layer); no coalescence","Precipitation of drug","Phase inversion from O/W to W/O"],"answer":1,"explanation":"Creaming = separation of emulsion droplets due to density difference (Stokes' Law). In O/W emulsion: oil droplets (less dense than water) rise to top → white cream layer. No coalescence occurs → simply shaking redistributes droplets → emulsion restored. Prevention: homogenization (reduce droplet size), increase viscosity. Coalescence (irreversible droplet merging) and cracking (complete phase separation) are more serious failures."},{"id":"pt-24","topic":"Tablets","question":"An enteric-coated omeprazole capsule resists dissolution in stomach (pH 1–2) but dissolves in the small intestine (pH 6–7). The coating polymer used is likely:","options":["HPMC (hydroxypropyl methylcellulose)","Ethylcellulose","Eudragit L100 (methacrylic acid copolymer, Type A)","PVA (polyvinyl alcohol)"],"answer":2,"explanation":"Eudragit L100 (methacrylic acid-methyl methacrylate copolymer, Type A) is insoluble at pH \u003c6 but dissolves at pH >6. This matches intestinal pH. Omeprazole is acid-labile (destroyed at pH \u003c4) → enteric coating prevents gastric degradation. Other enteric polymers: CAP (cellulose acetate phthalate, dissolves pH >6), HPMCP (HP-55, pH >5.5), PVAP (pH >5), shellac (pH >7). HPMC and PVA dissolve in stomach (used for immediate-release film coats)."},{"id":"pt-25","topic":"Tablets","question":"Tablet capping (separation of tablet cap or base) occurs most commonly due to:","options":["Too much lubricant","Air entrapment during compression or over-compression","Insufficient binder","Too rapid tablet press speed only"],"answer":1,"explanation":"Capping: horizontal splitting at the tablet top or bottom. Main causes: (1) Air entrapment during compression → expansion forces exceed tensile strength; (2) Over-compression → excess elastic recovery; (3) Punch wear/worn dies; (4) Insufficient binder or poor granule strength. Prevention: pre-compression step (tamps granules, expels air), reduce upper punch speed, increase binder, check punch geometry."},{"id":"pt-26","topic":"Tablets","question":"The USP friability test for tablets requires weight loss of less than:","options":["0.1%","0.5%","1.0%","5.0%"],"answer":2,"explanation":"USP \u003c1216> friability test: tablets are tumbled in a rotating drum (25 rpm, 4 min = 100 revolutions); weighed before and after. Weight loss must be ≤1.0% to pass. This simulates handling stresses during packaging, shipping, and dispensing. Tablets failing friability would chip or break during normal handling → unacceptable. Friability is particularly important for uncoated tablets; film-coated tablets typically have lower friability."},{"id":"pt-27","topic":"Tablets","question":"Hard gelatin capsules for vegetarians are replaced by:","options":["HPMC capsules (hydroxypropyl methylcellulose)","Polyethylene capsules","Starch capsules (Pullulan)","Silica capsules"],"answer":0,"explanation":"Gelatin is derived from bovine or porcine collagen → not acceptable for vegans/vegetarians and some religious groups (Muslims for porcine-derived; Hindus for bovine-derived). HPMC (Vcaps, Quali-V) capsules are plant-derived → vegetarian, vegan, halal, kosher. Also used for moisture-sensitive drugs (gelatin absorbs water). Starch (Pullulan) capsules are also available. HPMC capsules have different gelling behavior (gels at high temp rather than low)."},{"id":"pt-28","topic":"Semisolids","question":"A patient with dry, cracked hand eczema needs a highly occlusive moisturizing formulation. The BEST base is:","options":["O/W cream","Water-soluble (PEG) ointment","Oleaginous (petroleum jelly) ointment","Gel"],"answer":2,"explanation":"Oleaginous bases (white petrolatum, petroleum jelly, paraffin) are the most occlusive — they form an impermeable lipid film on skin, prevent transepidermal water loss (TEWL), and allow skin to hydrate itself. Best for dry/cracked skin, chronic eczema, psoriasis. Disadvantages: greasy, cosmetically unacceptable. O/W creams are less occlusive and wash off easily. Gels are water-based and non-occlusive. Water-soluble (PEG) ointments are actually hygroscopic and would not be appropriate for very dry skin."},{"id":"pt-29","topic":"Semisolids","question":"The displacement value (DV) for a drug in a cocoa butter suppository formulation is 1.5. If a suppository contains 0.3 g of drug, the amount of cocoa butter to use is:","options":["1.0 g","2.0 g per suppository (total weight 2.0 g) assuming 2.0 g mold","1.8 g cocoa butter (= 2 g mold - 0.3/1.5)","Equal to the drug weight (0.3 g)"],"answer":2,"explanation":"Displacement calculation: The drug displaces cocoa butter. 0.3 g drug / DV 1.5 = 0.2 g of cocoa butter displaced. If mold capacity = 2.0 g cocoa butter, then cocoa butter needed = 2.0 - 0.2 = 1.8 g. Total suppository weight = 1.8 + 0.3 = 2.1 g but the mold is calibrated for 2.0 g of cocoa butter equivalent."},{"id":"pt-30","topic":"Semisolids","question":"PEG (polyethylene glycol) suppository bases differ from cocoa butter by:","options":["Melting at body temperature like cocoa butter","Dissolving in rectal fluids rather than melting; require bowel moisture to work properly","Being opaque white solids only","Requiring refrigeration at all times"],"answer":1,"explanation":"PEG bases are water-soluble/water-dispersible → they dissolve in rectal fluids rather than melt. Advantages: no refrigeration needed, stable in warm climates, no polymorphism issues. Disadvantages: if the patient is dehydrated or stool is dry, PEG suppositories may not dissolve adequately; hygroscopic PEG can cause rectal irritation/discomfort by drawing water out of mucosa. Cocoa butter melts at 30–34°C (body temp) → releases drug by melting."},{"id":"pt-31","topic":"Parenterals","question":"A large volume parenteral (LVP) solution should NOT contain preservatives because:","options":["Preservatives are too expensive for LVP","The large volume administered would result in a toxic total dose of preservative","Preservatives prevent sterilization","Preservatives react with IV tubing"],"answer":1,"explanation":"Multi-dose vials of SVP (small volume parenterals) use preservatives (e.g., benzyl alcohol 0.9%) because the amount per dose is safe. However, LVPs (500–1000 mL) are given in their entirety — the same concentration of preservative × 1000 mL would deliver a potentially toxic cumulative dose. For example, benzyl alcohol is neurotoxic in neonates at high doses (\"gasping syndrome\"). LVPs are terminally sterilized → preservative not needed for sterility."},{"id":"pt-32","topic":"Parenterals","question":"The LAL (Limulus Amebocyte Lysate) test detects:","options":["Sterility (presence of any microorganism)","Bacterial endotoxins (pyrogens from Gram-negative bacteria)","Particulate matter in parenteral solutions","pH of parenteral solutions"],"answer":1,"explanation":"LAL test: lysate from blood cells (amebocytes) of horseshoe crabs (Limulus polyphemus) clots or forms a turbidity in the presence of endotoxins (LPS from Gram-negative bacteria). Replaces the in vivo rabbit pyrogen test. Fast, sensitive, inexpensive, specific for endotoxins. Three methods: gel-clot, turbidimetric, chromogenic. Endotoxin limit = 0.5 EU/mL for IV products (0.1 EU/mL for intrathecal). Pyrogens are not removed by 0.22 μm filtration — they are smaller than bacteria."},{"id":"pt-33","topic":"Parenterals","question":"Terminal sterilization by autoclave at 121°C for 15 minutes provides what sterility assurance level (SAL)?","options":["10⁻³ (1 in 1000 non-sterile)","10⁻⁶ (1 in 1 million non-sterile)","10⁻⁹","10⁻¹²"],"answer":1,"explanation":"Regulatory requirement for sterile products is SAL = 10⁻⁶ (probability of a non-sterile unit = 1 in 1,000,000). Standard autoclave conditions (121°C, 15 psi, 15 min) achieve this for products with bioburden ≤10 CFU/unit (worst-case spores). The F₀ value (equivalent sterilization time at 121°C) must be calculated and validated. For comparison, non-sterile products: SAL = 10⁻³ is sometimes used for \"reduced bioburden\" products."},{"id":"pt-34","topic":"Parenterals","question":"0.22 μm membrane filtration of a parenteral solution sterilizes by removing bacteria and fungi, but does NOT remove:","options":["Gram-positive bacteria","Gram-negative bacteria","Bacterial endotoxins (LPS) and prions","Fungal spores"],"answer":2,"explanation":"0.22 μm (200 nm) membrane filters remove all bacteria (0.5–5 μm) and fungi (2–10 μm) — including mycoplasma (if 0.1 μm filter used). However: endotoxins (LPS, ~1–50 nm molecular aggregates) pass through; prions (protein, ~30 nm) pass through; viruses (20–300 nm) may pass through (use 0.1 μm or nanofiltration for viruses). Aseptic filtration is preferred for heat-labile drugs (proteins, antibiotics like amphotericin B solutions, many biologics)."},{"id":"pt-35","topic":"Manufacturing","question":"The dissolution Q value for a tablet product is specified as \"Q = 80% in 30 minutes.\" This means:","options":["The tablet must release exactly 80% in 30 min","At least 80% of labeled drug content must dissolve within 30 minutes","No more than 80% should dissolve in 30 minutes (for extended release)","Q is the hardness specification"],"answer":1,"explanation":"Q in dissolution = the minimum amount (% of labeled claim) that must be dissolved in the specified time at the specified conditions. \"Q = 80% in 30 min\" → each tablet tested must dissolve ≥80% of its labeled drug content within 30 minutes. USP Stage 1 acceptance: 6 units tested, each ≥Q + 5% (i.e., ≥85%); Stage 2: 12 units, avg ≥Q, none \u003cQ-15%; Stage 3: 24 units, avg ≥Q, max 2 units \u003cQ-15%, none \u003cQ-25%."},{"id":"pt-36","topic":"Manufacturing","question":"Thailand is in ICH Stability Zone IVb. For product approval, stability data is required at:","options":["25°C/60% RH (Zone I/II conditions)","30°C/65% RH for long-term studies; 40°C/75% RH for accelerated studies","37°C/80% RH","40°C/75% RH for long-term studies only"],"answer":1,"explanation":"ICH Q1A stability zones: Zone IVb (tropical, includes Thailand, South/Southeast Asia, most of Asia) = 30°C/65% RH for long-term storage. For registration in Zone IVb countries: long-term data at 30°C/65% RH (or 30°C/75% RH for Zone IVb specifically) and accelerated data at 40°C/75% RH for 6 months. Significant change in accelerated study = cannot extrapolate shelf life from accelerated data."},{"id":"pt-37","topic":"Manufacturing","question":"Content uniformity (CU) testing is required when tablet drug content is:","options":["Greater than 500 mg","Less than 25 mg or less than 25% of tablet weight","When tablets are extended-release","Only for controlled substances"],"answer":1,"explanation":"USP \u003c905> / Ph.Eur. 2.9.40 content uniformity: required for tablets with drug content \u003c25 mg OR \u003c25% of tablet weight, whichever is less. Low-dose drugs risk significant variation in content between tablets. For higher-dose products where drug is the majority of tablet weight, weight variation alone is sufficient proxy for content uniformity. CU tests individual units (10 tablets), not composite (unlike assay testing)."},{"id":"pt-38","topic":"Manufacturing","question":"During tablet compression, \"picking\" refers to:","options":["Selecting tablets for rejection","Material from tablet surface adhering to the punch face, creating pits in the tablet surface","Increasing compression force","Verifying tablet thickness with calipers"],"answer":1,"explanation":"Picking: fragments of tablet surface adhere to (are \"picked\" up by) the punch face → pitted, rough tablet surface. Usually affects upper punch. Causes: punch surface rough/damaged, excess moisture in granules, film coating sticking to punch, insufficient lubricant. Solutions: polish punches, reduce moisture, increase lubricant, use anti-adherent (talc). Distinguish from sticking (entire tablet surface adhesion) and filming (thin film on punch face)."},{"id":"pt-39","topic":"Manufacturing","question":"The Q₁₀ rule states that for every 10°C increase in temperature, the chemical degradation rate approximately:","options":["Doubles","Triples","Increases by 10%","Is halved"],"answer":0,"explanation":"The Q₁₀ = 2 rule (van't Hoff): a 10°C increase in temperature approximately doubles the rate of most chemical reactions (degradation). This is derived from the Arrhenius equation. This is why accelerated stability studies at 40°C can predict behavior at storage conditions (25°C or 30°C). In practice: if a drug degrades with rate k at 30°C, then at 40°C the rate ≈ 2k (twice as fast). Shelf life at 40°C ≈ half of shelf life at 30°C."},{"id":"pt-40","topic":"Manufacturing","question":"Ethylene oxide (EtO) sterilization of medical devices requires aeration after sterilization because:","options":["EtO is not effective without aeration","Residual EtO (toxic, carcinogenic) must be removed from device before patient use","EtO reacts with device material during aeration","Aeration reactivates the device's sterility indicator"],"answer":1,"explanation":"EtO is an alkylating agent (IARC Group 1 carcinogen) that reacts with DNA → kills microorganisms. However, EtO and its metabolites (ethylene chlorohydrin, ethylene glycol) are toxic and may remain in device materials (especially plastics). After sterilization, devices must undergo aeration (ambient or elevated temp, 50–60°C) to allow EtO off-gassing to safe residual levels (per ISO 10993-7). FDA/ISO specify residual limits: e.g., \u003c25 mg EtO for implants."},{"id":"pt-41","topic":"Preformulation","question":"Lipinski's Rule of Five predicts poor oral bioavailability if a drug violates which criteria?","options":["MW > 1000 Da, log P > 10","MW > 500 Da, log P > 5, H-bond donors > 5, H-bond acceptors > 10","MW > 300 Da, log P > 3","Any MW, if the drug is charged"],"answer":1,"explanation":"Lipinski's Rule of Five (Ro5): poor oral absorption likely if MW > 500 Da, log P (Clog P) > 5, H-bond donors (NH + OH) > 5, H-bond acceptors (N + O) > 10. Drugs violating ≥2 rules are likely to have poor oral bioavailability. Exceptions: substrates of active transporters (e.g., many antibiotics), natural products (cyclosporine violates Ro5 but is orally bioavailable via lymphatic absorption). Named after Chris Lipinski at Pfizer."},{"id":"pt-42","topic":"Biopharmaceutics","question":"An extended-release (ER) formulation of metformin XR is preferred over immediate-release (IR) because:","options":["ER has higher bioavailability","ER has faster onset of action","ER reduces GI side effects (nausea, diarrhea) by providing slower, more controlled drug release to the upper GI","ER contains a larger dose per tablet"],"answer":2,"explanation":"Metformin IR causes GI adverse effects (nausea, diarrhea, bloating) in ~30% of patients due to high local drug concentrations in the upper GI. Metformin XR (extended-release, using HPMC matrix or GI therapeutic system) releases drug slowly over 24 hours → lower peak concentrations in GI → fewer GI side effects → better adherence. Bioavailability of XR is slightly lower (AUC ~75% of IR) but efficacy equivalent when total daily dose is similar."},{"id":"pt-43","topic":"Solutions","question":"Benzalkonium chloride (BAC) is commonly used as a preservative in eye drops. It belongs to which chemical class?","options":["Paraben (alkyl ester of para-hydroxybenzoic acid)","Quaternary ammonium compound (QAC)","Organic mercurial","Alcohol"],"answer":1,"explanation":"Benzalkonium chloride (BAC) is a quaternary ammonium compound (QAC) — it has a positively charged nitrogen with four alkyl/aryl groups. Mechanism: disrupts bacterial membranes. Effective against Gram(+) bacteria, many Gram(−) bacteria, some fungi. Used in ophthalmic drops as preservative at 0.004–0.01%. Long-term BAC use can cause corneal epithelial toxicity — concern for glaucoma patients using multiple BAC-preserved drops. BAC-free formulations available for sensitive patients."},{"id":"pt-44","topic":"Parenterals","question":"Lactated Ringer's solution (LR) is preferred over 0.9% NaCl for large-volume resuscitation because:","options":["LR has higher sodium content, providing better volume replacement","LR is more physiological (contains lactate, K, Ca) and avoids hyperchloremic metabolic acidosis associated with large NS infusions","LR is cheaper than NS","LR is hypertonic and provides faster fluid redistribution"],"answer":1,"explanation":"Large volume NS (0.9% NaCl) infusion → hyperchloremia (NS has 154 mEq/L Cl, higher than plasma 103 mEq/L) → dilutional/hyperchloremic metabolic acidosis (non-anion gap). LR: Na 130, K 4, Ca 3, Cl 109, lactate 28 mEq/L — more physiological; the chloride is balanced. Lactate is metabolized to HCO₃⁻ by liver → mild alkalinizing effect. Current evidence (SMART, SALT-ED trials) suggests balanced crystalloids (LR, PlasmaLyte) may reduce major adverse kidney events compared to NS in ICU patients."},{"id":"pt-45","topic":"Tablets","question":"A drug that requires enteric coating to protect the gastric mucosa (not the drug) would be:","options":["Omeprazole (acid-labile)","Enteric-coated aspirin (to reduce gastric irritation/bleeding)","Pancreatin (enzyme, acid-labile)","Bisacodyl (stimulant laxative acting in colon, avoid gastric irritation)"],"answer":1,"explanation":"Enteric coating serves TWO different purposes depending on the drug: (1) Protect acid-labile DRUG from gastric acid (omeprazole, pancreatin, erythromycin — if not in acid-stable form, proton pump inhibitors). (2) Protect gastric MUCOSA from irritating DRUG (enteric-coated aspirin, enteric-coated NSAID, bisacodyl). EC aspirin reaches the intestine before dissolving → less gastric irritation and GI bleeding compared to uncoated aspirin (though systemic anti-platelet effect is the same once absorbed)."},{"id":"pt-46","topic":"Powders","question":"Wet granulation with a high-shear granulator typically takes how long for the granulation step?","options":["5–10 seconds","2–10 minutes","30–60 minutes","4–8 hours"],"answer":1,"explanation":"High-shear mixers (Diosna, Fielder) use a main impeller and a high-speed chopper. Granulation liquid is added while mixing. The actual granulation phase (after liquid addition) typically takes 2–10 minutes in high-shear granulators. This is much faster than traditional fluid bed granulation (15–30+ minutes) or bowl mixers. Endpoint is typically determined by current drawn by impeller motor or by granule characteristics (end-point determination critical)."},{"id":"pt-47","topic":"Routes","question":"The rectal route provides approximately what fraction of first-pass avoidance compared to oral?","options":["None — rectal drugs all go through portal circulation","Approximately 50% avoidance — superior rectal veins drain to portal; middle and inferior rectal veins drain to systemic","100% avoidance like IV","Only 10% avoidance"],"answer":1,"explanation":"The rectum has three hemorrhoidal (rectal) veins. The SUPERIOR rectal vein drains into the inferior mesenteric vein → portal vein → liver (FIRST-PASS). The MIDDLE and INFERIOR rectal veins drain directly into the internal iliac vein → systemic circulation (BYPASSES liver). Drugs absorbed in lower rectum avoid first-pass; those absorbed higher do not. Net result: approximately 50% first-pass avoidance. Compare to sublingual (>90% bypass) and oral (0% bypass)."},{"id":"pt-48","topic":"Manufacturing","question":"GMP requires all pharmaceutical manufacturing processes to be \"validated.\" What does process validation mean?","options":["Testing finished product quality only","Documented evidence that a process consistently produces a product meeting predetermined specifications and quality attributes","Validation of cost-efficiency of manufacturing","Certification of individual operators"],"answer":1,"explanation":"Process validation (ICH Q8): documented evidence providing high degree of assurance that a specific process consistently produces a product that meets its predetermined specifications and quality attributes. Three stages: Stage 1 (Process Design — development), Stage 2 (Process Qualification — formal validation, 3 commercial-scale batches traditionally), Stage 3 (Continued Process Verification — ongoing monitoring). Cannot rely on finished product testing alone — must build quality into the process (QbD — Quality by Design principle)."},{"id":"pt-49","topic":"Suspensions","question":"The term \"Ostwald ripening\" in suspension stability refers to:","options":["Crystal growth where small particles dissolve and recrystallize on larger particles → increasing average particle size over time","Separation of oil and water phases","Microbial growth in suspension","pH change during storage"],"answer":0,"explanation":"Ostwald ripening (crystal growth): small particles have higher solubility (Kelvin equation/Gibbs-Thomson effect) than larger ones → they dissolve preferentially → the dissolved drug recrystallizes on larger particles → particles grow over time → changed dissolution rate and bioavailability. Prevention: narrow initial particle size distribution (minimizes size difference driving force), surface-active agents (reduce surface energy), polymer coating (Ostwald ripening inhibitors: HPMC, PVP), storage at consistent temperature."},{"id":"pt-50","topic":"Biopharmaceutics","question":"A drug's volume of distribution (Vd) is 700 L in a 70-kg patient. This indicates:","options":["The drug is mostly in plasma (Vd matches plasma volume ~5 L)","The drug is extensively distributed to peripheral tissues (Vd >> actual body volume → high tissue binding)","The drug has zero distribution beyond blood","Vd of 700L means the drug is toxic"],"answer":1,"explanation":"Vd is a mathematical (apparent) volume, not a real compartment. Total body volume of a 70-kg person ≈ 42 L. Vd = 700 L >> 42 L → the drug cannot all be in plasma or body water → it must be extensively bound to peripheral tissues (adipose, muscle, deep organs). High Vd drugs: lipophilic, highly tissue-bound (chloroquine Vd ~400 L/kg = 28,000 L in 70-kg person!; amiodarone ~60 L/kg). High Vd drugs: difficult to dialyze, long t½, large loading doses needed."}],"eq":[{"id":"pt-1","topic":"Routes","question":"Which route of administration provides 100% bioavailability by definition?","options":["Oral (PO)","Intramuscular (IM)","Intravenous (IV)","Transdermal (TD)"],"answer":2,"explanation":"Intravenous (IV) administration delivers drug directly into systemic circulation, bypassing all absorption barriers and first-pass metabolism. Therefore, by definition, bioavailability = 100%. Bioavailability of all other routes is compared to IV as the reference."},{"id":"pt-2","topic":"Routes","question":"Nitroglycerin for acute angina is given sublingually rather than orally because:","options":["Oral nitroglycerin has no pharmacological effect","Oral nitroglycerin has nearly 0% bioavailability due to extensive first-pass hepatic metabolism","Nitroglycerin is destroyed by saliva","Sublingual route gives more sustained release"],"answer":1,"explanation":"Nitroglycerin (GTN) is so extensively metabolized on first-pass through the liver that oral bioavailability is approximately 1%. Sublingual administration allows absorption into sublingual veins → SVC → systemic circulation, completely bypassing the portal circulation and liver. Onset is 1–2 minutes, and the drug begins working immediately."},{"id":"pt-3","topic":"Routes","question":"A BCS Class II drug has:","options":["High solubility, High permeability","High solubility, Low permeability","Low solubility, High permeability","Low solubility, Low permeability"],"answer":2,"explanation":"BCS Class II: Low Solubility, High Permeability. These drugs dissolve slowly (rate-limiting step = dissolution) but once dissolved, permeate the gut wall well. Examples: ibuprofen, carbamazepine, griseofulvin, nifedipine. Formulation strategies focus on improving dissolution: nanosizing, amorphous solid dispersions, hot-melt extrusion, lipid-based formulations."},{"id":"pt-4","topic":"Routes","question":"Depot IM injections (e.g., haloperidol decanoate, medroxyprogesterone acetate IM) are useful because:","options":["They have 100% bioavailability like IV","They provide sustained drug release over weeks to months from the injection site","They avoid first-pass metabolism more than oral","They have faster onset than IV"],"answer":1,"explanation":"Depot formulations (oil-based or microsphere suspensions) form a drug reservoir at the IM injection site → slow absorption into systemic circulation over weeks to months. Benefits: improved compliance (no daily doses), stable drug levels, useful for patients who cannot take oral medications reliably. Examples: fluphenazine decanoate (2–4 weeks), haloperidol decanoate (4 weeks), DMPA (Depo-Provera, 3 months)."},{"id":"pt-5","topic":"Biopharmaceutics","question":"Two generic drug products are declared bioequivalent if the 90% confidence interval of the test/reference ratio for AUC and Cmax falls within:","options":["70–130%","80–125%","90–110%","75–133%"],"answer":1,"explanation":"The regulatory standard for bioequivalence (BE) is that the 90% CI of the geometric mean ratio (test/reference) for AUC∞ and Cmax must fall within 80.00–125.00%. This applies to standard oral drug products. Narrow therapeutic index drugs (warfarin, cyclosporine, digoxin, phenytoin, lithium) typically have tighter acceptance criteria of 90–111%."},{"id":"pt-6","topic":"Biopharmaceutics","question":"Which pharmacokinetic parameter directly reflects the rate of drug absorption after oral dosing?","options":["AUC","Cmax","Tmax","t½"],"answer":2,"explanation":"Tmax (time to maximum concentration) reflects how quickly drug is absorbed. Faster absorption → shorter Tmax → earlier Cmax. While AUC measures total exposure (reflecting F) and Cmax measures peak concentration (reflecting exposure peak), Tmax specifically indicates the rate of the absorption process. Note: Tmax is NOT used as a BE criterion because it is a discrete variable and has high variability."},{"id":"pt-7","topic":"Biopharmaceutics","question":"A drug has a half-life of 6 hours. Approximately how long does it take to reach steady state with multiple dosing?","options":["6 hours","12 hours","30 hours (5 half-lives)","72 hours"],"answer":2,"explanation":"Steady state is reached after approximately 5 half-lives (~97% of steady state). For a drug with t½ = 6 hours: 5 × 6 = 30 hours. Steady state is where the rate of drug input equals rate of elimination → stable plasma concentration range. The same principle applies to drug washout — it takes ~5 half-lives to essentially eliminate all drug from the body."},{"id":"pt-8","topic":"Biopharmaceutics","question":"Morphine has low oral bioavailability (~25%). Which route would maximize bioavailability while being minimally invasive?","options":["Oral","Rectal (suppository)","Sublingual or buccal","Inhalation"],"answer":2,"explanation":"Sublingual buprenorphine (an opioid used in opioid use disorder treatment) bypasses first-pass metabolism → much higher bioavailability than oral. While morphine itself is not commonly given sublingually, the principle applies. Rectal route provides partial bypass (~50% first-pass avoided). For severe pain requiring morphine, IV or SC is preferred. Oral transmucosal fentanyl (Actiq) is an example of buccal opioid delivery with faster absorption and partial first-pass bypass."},{"id":"pt-9","topic":"Preformulation","question":"The Noyes-Whitney equation describes drug dissolution rate. Which modification would MOST effectively increase dissolution rate of a poorly water-soluble drug?","options":["Increase the diffusion layer thickness","Reduce particle size (increase surface area)","Decrease bulk drug concentration in solution","Decrease saturation solubility"],"answer":1,"explanation":"dC/dt = DA(Cs-C)/hV. Increasing surface area (A) by particle size reduction is the most practical and effective strategy. Micronization reduces particle size from ~100 μm to ~1–10 μm → dramatically increases A → faster dissolution. Nanosizing (nanoparticles, 100–1000 nm) provides even greater surface area increase. This is why griseofulvin, spironolactone, and danazol are micronized."},{"id":"pt-10","topic":"Preformulation","question":"The Ritonavir (Norvir) recall of 1998 was caused by:","options":["Manufacturing contamination","Discovery of a new stable polymorph with much lower solubility → capsules failed dissolution testing","Drug-excipient incompatibility with gelatin","Oxidative degradation during storage"],"answer":1,"explanation":"Ritonavir exists in multiple polymorphic forms. A new, more stable polymorph (Form II) spontaneously appeared in manufacturing, converting the original amorphous/Form I ritonavir to the more stable, much less soluble Form II. This caused the soft gelatin capsule formulation to crystallize and fail dissolution testing → the drug precipitated → no therapeutic effect. Abbott had to completely reformulate to Norvir capsules (heat-stable formulation). This case became the seminal example of polymorphism importance in pharmaceutical development."},{"id":"pt-11","topic":"Preformulation","question":"A new drug has pKa = 8.5 and is a weak base. At stomach pH of 1.5, what percentage is ionized?","options":["Nearly 0% ionized","About 50% ionized","Nearly 100% ionized","Cannot be determined from pKa alone"],"answer":2,"explanation":"For a weak base: pH = pKa + log([B]/[BH⁺]). At pH 1.5, pKa 8.5: 1.5 = 8.5 + log([B]/[BH⁺]) → log([B]/[BH⁺]) = -7 → [B]/[BH⁺] = 10⁻⁷ → drug is almost entirely protonated (ionized as BH⁺) in stomach. This means: (1) very water-soluble in stomach (ionized form dissolves well), (2) very poorly absorbed from stomach (ionized form cannot cross membranes well). Most absorption occurs in intestine where pH is higher."},{"id":"pt-12","topic":"Preformulation","question":"Primary amine-containing drugs should NOT be formulated with lactose because:","options":["Lactose increases drug solubility too much","Lactose undergoes Maillard reaction with primary amines → browning, loss of drug potency","Lactose is incompatible with all drugs","Lactose causes tablet hardness to be too high"],"answer":1,"explanation":"The Maillard (browning) reaction occurs between primary or secondary amines and reducing sugars (lactose, glucose). This reaction: discolors tablets (yellow/brown), forms new chemical entities, reduces drug content. Examples: amoxicillin + lactose, gabapentin + lactose, ranitidine + lactose. Solution: use non-reducing fillers (mannitol, microcrystalline cellulose, dicalcium phosphate, DCPD) instead of lactose."},{"id":"pt-13","topic":"Powders","question":"A powder blend has a Carr's Index of 30%. This indicates:","options":["Excellent flow — direct compression is possible","Good flow — minor issues","Very poor flow — granulation required before compression","The powder is too dense"],"answer":2,"explanation":"Carr's Index (CI) = (Tapped density - Bulk density) / Tapped density × 100. Interpretation: \u003c10% = excellent, 11-15% = good, 16-20% = fair, 21-25% = passable, 26-31% = poor, 32-37% = very poor, >38% = extremely poor. CI = 30% indicates poor/very poor flow → granulation (wet or dry) is needed before compression to improve flowability, compressibility, and content uniformity."},{"id":"pt-14","topic":"Powders","question":"Which of the following drugs is MOST likely to require dry granulation rather than wet granulation?","options":["Lactose tablets","Paracetamol tablets","Aspirin (moisture-sensitive) tablets","Metformin tablets"],"answer":2,"explanation":"Aspirin (acetylsalicylic acid) is an ester that undergoes hydrolysis in the presence of moisture → forms acetic acid and salicylic acid. Wet granulation adds water → would cause significant aspirin degradation. Dry granulation (roller compaction or slugging) or direct compression is used for aspirin. Similarly, effervescent tablets cannot be wet granulated (acid + base would react with water during granulation)."},{"id":"pt-15","topic":"Powders","question":"Magnesium stearate is added to tablet formulations at the end of blending and for the minimum time necessary because:","options":["It is chemically unstable and degrades with prolonged mixing","It is hydrophobic — over-mixing coats all particles with a hydrophobic layer, reducing tablet hardness and dissolution rate","It is expensive and should be used sparingly","Over-mixing causes it to react with the drug"],"answer":1,"explanation":"Magnesium stearate (MgSt) is a hydrophobic lubricant that forms a monomolecular film on particle surfaces during blending. Over-mixing → excessive hydrophobic coating → poor wetting in dissolution medium → reduced dissolution rate → potentially reduced bioavailability. Also reduces tablet hardness. Rule: add MgSt last; blend only 2–5 minutes. Sodium stearyl fumarate (Pruv) is a less lubrication-sensitive alternative less affected by over-mixing."},{"id":"pt-16","topic":"Powders","question":"Croscarmellose sodium (CCS), sodium starch glycolate (SSG), and crospovidone are classified as:","options":["Lubricants","Binders","Superdisintegrants","Glidants"],"answer":2,"explanation":"Superdisintegrants: wicking + swelling mechanism → rapidly absorb water and swell → break tablet apart quickly. SSG (Explotab) and CCS (Ac-Di-Sol) swell up to 300× their volume in water. Used at 2–5% concentration (versus 5–20% for traditional disintegrants). These are preferred in ODTs (orally disintegrating tablets) and wherever fast dissolution is required. Compare: lubricants (MgSt, stearic acid), binders (PVP, HPMC), glidants (Aerosil, colloidal SiO₂)."},{"id":"pt-17","topic":"Solutions","question":"An ophthalmic solution should ideally be isotonic with lacrimal fluid. Which concentration of NaCl is isotonic?","options":["0.45% NaCl","0.9% NaCl","3% NaCl","5% NaCl"],"answer":1,"explanation":"0.9% NaCl (normal saline) is isotonic with blood plasma and lacrimal fluid (~308 mOsm/L). Hypotonic solutions cause corneal cell swelling; hypertonic solutions cause shrinkage. Both cause discomfort and potential damage. Ophthalmic preparations must be isotonic (or within acceptable range). The NaCl equivalent method or cryoscopic data (freezing point depression) are used to adjust tonicity of ophthalmic solutions."},{"id":"pt-18","topic":"Solutions","question":"A syrup formulation uses 85% w/v sucrose solution. This high sucrose concentration:","options":["Acts as a preservative by reducing water activity and creating high osmotic pressure","Improves drug dissolution only","Prevents crystallization (graining) only","Is solely for taste masking"],"answer":0,"explanation":"85% w/v sucrose syrup (simple syrup) is self-preserving: the high sucrose concentration creates very high osmotic pressure and very low water activity (aw ≈ 0.80–0.85) → microorganisms cannot survive (need aw >0.90). At lower sucrose concentrations (\u003c65%), the syrup is NOT self-preserving and requires added antimicrobial preservatives (methylparaben + propylparaben, benzalkonium chloride, etc.)."},{"id":"pt-19","topic":"Solutions","question":"Sodium metabisulfite is added to an epinephrine injection formulation. Its function is:","options":["Preservative against microbial contamination","Antioxidant to prevent oxidative degradation of epinephrine","Chelating agent to remove trace metals","Buffering agent to maintain pH"],"answer":1,"explanation":"Epinephrine (adrenaline) is highly susceptible to oxidation — the catechol ring is easily oxidized → forms adrenochrome (pink/brown color). Sodium metabisulfite (Na₂S₂O₅) is an antioxidant: it preferentially oxidizes → sacrificially protects epinephrine. EDTA may also be added as a chelating agent to remove trace metal ions (Cu²⁺, Fe²⁺) that catalyze oxidation. Together they protect epinephrine formulations."},{"id":"pt-20","topic":"Suspensions","question":"Stokes' Law predicts sedimentation rate in a suspension. To minimize sedimentation, which approach is BEST?","options":["Increase particle size","Increase viscosity of the suspension vehicle","Increase the density difference between particle and vehicle","Decrease the surface area of particles"],"answer":1,"explanation":"Stokes' Law: v = d²(ρs - ρl)g / 18η. To reduce sedimentation velocity (v): decrease particle size (d²), reduce density difference (ρs - ρl), or increase viscosity (η). Increasing vehicle viscosity (adding suspending agents: CMC, xanthan gum, HPMC) is the most practical formulation strategy. The square relationship with particle size means halving particle size reduces sedimentation 4×."},{"id":"pt-21","topic":"Suspensions","question":"In an O/W emulsion, the external (continuous) phase is:","options":["Oil","Water","Emulsifier only","Both oil and water equally"],"answer":1,"explanation":"In O/W (oil-in-water) emulsion: oil droplets are dispersed WITHIN a continuous aqueous (water) external phase. This is why O/W creams are water-washable — the outer phase is water, so water easily removes the cream. O/W emulsions feel non-greasy, have good spread on skin, and are cosmetically preferred for most topical applications. W/O emulsions (e.g., cold cream) have oil as the continuous phase → oily, occlusive, water-in-oil."},{"id":"pt-22","topic":"Suspensions","question":"An emulsifier with HLB value of 4 would be most appropriate for forming:","options":["O/W emulsion (oil-in-water)","W/O emulsion (water-in-oil)","Microemulsion","Suspension"],"answer":1,"explanation":"HLB (Hydrophile-Lipophile Balance) system: HLB 1–6 = W/O emulsifiers (lipophilic), HLB 7–9 = wetting agents, HLB 8–18 = O/W emulsifiers (hydrophilic). HLB = 4 → lipophilic emulsifier → stabilizes W/O emulsions (water droplets in oil). Example: Span 80 (sorbitan monooleate) has HLB = 4.3 → W/O emulsifier. Polysorbate 80 (Tween 80) has HLB = 15 → O/W emulsifier."},{"id":"pt-23","topic":"Suspensions","question":"Creaming in an O/W emulsion is:","options":["Irreversible coalescence of oil droplets","Reversible migration of oil droplets to the top (cream layer); no coalescence","Precipitation of drug","Phase inversion from O/W to W/O"],"answer":1,"explanation":"Creaming = separation of emulsion droplets due to density difference (Stokes' Law). In O/W emulsion: oil droplets (less dense than water) rise to top → white cream layer. No coalescence occurs → simply shaking redistributes droplets → emulsion restored. Prevention: homogenization (reduce droplet size), increase viscosity. Coalescence (irreversible droplet merging) and cracking (complete phase separation) are more serious failures."},{"id":"pt-24","topic":"Tablets","question":"An enteric-coated omeprazole capsule resists dissolution in stomach (pH 1–2) but dissolves in the small intestine (pH 6–7). The coating polymer used is likely:","options":["HPMC (hydroxypropyl methylcellulose)","Ethylcellulose","Eudragit L100 (methacrylic acid copolymer, Type A)","PVA (polyvinyl alcohol)"],"answer":2,"explanation":"Eudragit L100 (methacrylic acid-methyl methacrylate copolymer, Type A) is insoluble at pH \u003c6 but dissolves at pH >6. This matches intestinal pH. Omeprazole is acid-labile (destroyed at pH \u003c4) → enteric coating prevents gastric degradation. Other enteric polymers: CAP (cellulose acetate phthalate, dissolves pH >6), HPMCP (HP-55, pH >5.5), PVAP (pH >5), shellac (pH >7). HPMC and PVA dissolve in stomach (used for immediate-release film coats)."},{"id":"pt-25","topic":"Tablets","question":"Tablet capping (separation of tablet cap or base) occurs most commonly due to:","options":["Too much lubricant","Air entrapment during compression or over-compression","Insufficient binder","Too rapid tablet press speed only"],"answer":1,"explanation":"Capping: horizontal splitting at the tablet top or bottom. Main causes: (1) Air entrapment during compression → expansion forces exceed tensile strength; (2) Over-compression → excess elastic recovery; (3) Punch wear/worn dies; (4) Insufficient binder or poor granule strength. Prevention: pre-compression step (tamps granules, expels air), reduce upper punch speed, increase binder, check punch geometry."},{"id":"pt-26","topic":"Tablets","question":"The USP friability test for tablets requires weight loss of less than:","options":["0.1%","0.5%","1.0%","5.0%"],"answer":2,"explanation":"USP \u003c1216> friability test: tablets are tumbled in a rotating
