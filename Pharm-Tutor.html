 drum (25 rpm, 4 min = 100 revolutions); weighed before and after. Weight loss must be ≤1.0% to pass. This simulates handling stresses during packaging, shipping, and dispensing. Tablets failing friability would chip or break during normal handling → unacceptable. Friability is particularly important for uncoated tablets; film-coated tablets typically have lower friability."},{"id":"pt-27","topic":"Tablets","question":"Hard gelatin capsules for vegetarians are replaced by:","options":["HPMC capsules (hydroxypropyl methylcellulose)","Polyethylene capsules","Starch capsules (Pullulan)","Silica capsules"],"answer":0,"explanation":"Gelatin is derived from bovine or porcine collagen → not acceptable for vegans/vegetarians and some religious groups (Muslims for porcine-derived; Hindus for bovine-derived). HPMC (Vcaps, Quali-V) capsules are plant-derived → vegetarian, vegan, halal, kosher. Also used for moisture-sensitive drugs (gelatin absorbs water). Starch (Pullulan) capsules are also available. HPMC capsules have different gelling behavior (gels at high temp rather than low)."},{"id":"pt-28","topic":"Semisolids","question":"A patient with dry, cracked hand eczema needs a highly occlusive moisturizing formulation. The BEST base is:","options":["O/W cream","Water-soluble (PEG) ointment","Oleaginous (petroleum jelly) ointment","Gel"],"answer":2,"explanation":"Oleaginous bases (white petrolatum, petroleum jelly, paraffin) are the most occlusive — they form an impermeable lipid film on skin, prevent transepidermal water loss (TEWL), and allow skin to hydrate itself. Best for dry/cracked skin, chronic eczema, psoriasis. Disadvantages: greasy, cosmetically unacceptable. O/W creams are less occlusive and wash off easily. Gels are water-based and non-occlusive. Water-soluble (PEG) ointments are actually hygroscopic and would not be appropriate for very dry skin."},{"id":"pt-29","topic":"Semisolids","question":"The displacement value (DV) for a drug in a cocoa butter suppository formulation is 1.5. If a suppository contains 0.3 g of drug, the amount of cocoa butter to use is:","options":["1.0 g","2.0 g per suppository (total weight 2.0 g) assuming 2.0 g mold","1.8 g cocoa butter (= 2 g mold - 0.3/1.5)","Equal to the drug weight (0.3 g)"],"answer":2,"explanation":"Displacement calculation: The drug displaces cocoa butter. 0.3 g drug / DV 1.5 = 0.2 g of cocoa butter displaced. If mold capacity = 2.0 g cocoa butter, then cocoa butter needed = 2.0 - 0.2 = 1.8 g. Total suppository weight = 1.8 + 0.3 = 2.1 g but the mold is calibrated for 2.0 g of cocoa butter equivalent."},{"id":"pt-30","topic":"Semisolids","question":"PEG (polyethylene glycol) suppository bases differ from cocoa butter by:","options":["Melting at body temperature like cocoa butter","Dissolving in rectal fluids rather than melting; require bowel moisture to work properly","Being opaque white solids only","Requiring refrigeration at all times"],"answer":1,"explanation":"PEG bases are water-soluble/water-dispersible → they dissolve in rectal fluids rather than melt. Advantages: no refrigeration needed, stable in warm climates, no polymorphism issues. Disadvantages: if the patient is dehydrated or stool is dry, PEG suppositories may not dissolve adequately; hygroscopic PEG can cause rectal irritation/discomfort by drawing water out of mucosa. Cocoa butter melts at 30–34°C (body temp) → releases drug by melting."},{"id":"pt-31","topic":"Parenterals","question":"A large volume parenteral (LVP) solution should NOT contain preservatives because:","options":["Preservatives are too expensive for LVP","The large volume administered would result in a toxic total dose of preservative","Preservatives prevent sterilization","Preservatives react with IV tubing"],"answer":1,"explanation":"Multi-dose vials of SVP (small volume parenterals) use preservatives (e.g., benzyl alcohol 0.9%) because the amount per dose is safe. However, LVPs (500–1000 mL) are given in their entirety — the same concentration of preservative × 1000 mL would deliver a potentially toxic cumulative dose. For example, benzyl alcohol is neurotoxic in neonates at high doses (\"gasping syndrome\"). LVPs are terminally sterilized → preservative not needed for sterility."},{"id":"pt-32","topic":"Parenterals","question":"The LAL (Limulus Amebocyte Lysate) test detects:","options":["Sterility (presence of any microorganism)","Bacterial endotoxins (pyrogens from Gram-negative bacteria)","Particulate matter in parenteral solutions","pH of parenteral solutions"],"answer":1,"explanation":"LAL test: lysate from blood cells (amebocytes) of horseshoe crabs (Limulus polyphemus) clots or forms a turbidity in the presence of endotoxins (LPS from Gram-negative bacteria). Replaces the in vivo rabbit pyrogen test. Fast, sensitive, inexpensive, specific for endotoxins. Three methods: gel-clot, turbidimetric, chromogenic. Endotoxin limit = 0.5 EU/mL for IV products (0.1 EU/mL for intrathecal). Pyrogens are not removed by 0.22 μm filtration — they are smaller than bacteria."},{"id":"pt-33","topic":"Parenterals","question":"Terminal sterilization by autoclave at 121°C for 15 minutes provides what sterility assurance level (SAL)?","options":["10⁻³ (1 in 1000 non-sterile)","10⁻⁶ (1 in 1 million non-sterile)","10⁻⁹","10⁻¹²"],"answer":1,"explanation":"Regulatory requirement for sterile products is SAL = 10⁻⁶ (probability of a non-sterile unit = 1 in 1,000,000). Standard autoclave conditions (121°C, 15 psi, 15 min) achieve this for products with bioburden ≤10 CFU/unit (worst-case spores). The F₀ value (equivalent sterilization time at 121°C) must be calculated and validated. For comparison, non-sterile products: SAL = 10⁻³ is sometimes used for \"reduced bioburden\" products."},{"id":"pt-34","topic":"Parenterals","question":"0.22 μm membrane filtration of a parenteral solution sterilizes by removing bacteria and fungi, but does NOT remove:","options":["Gram-positive bacteria","Gram-negative bacteria","Bacterial endotoxins (LPS) and prions","Fungal spores"],"answer":2,"explanation":"0.22 μm (200 nm) membrane filters remove all bacteria (0.5–5 μm) and fungi (2–10 μm) — including mycoplasma (if 0.1 μm filter used). However: endotoxins (LPS, ~1–50 nm molecular aggregates) pass through; prions (protein, ~30 nm) pass through; viruses (20–300 nm) may pass through (use 0.1 μm or nanofiltration for viruses). Aseptic filtration is preferred for heat-labile drugs (proteins, antibiotics like amphotericin B solutions, many biologics)."},{"id":"pt-35","topic":"Manufacturing","question":"The dissolution Q value for a tablet product is specified as \"Q = 80% in 30 minutes.\" This means:","options":["The tablet must release exactly 80% in 30 min","At least 80% of labeled drug content must dissolve within 30 minutes","No more than 80% should dissolve in 30 minutes (for extended release)","Q is the hardness specification"],"answer":1,"explanation":"Q in dissolution = the minimum amount (% of labeled claim) that must be dissolved in the specified time at the specified conditions. \"Q = 80% in 30 min\" → each tablet tested must dissolve ≥80% of its labeled drug content within 30 minutes. USP Stage 1 acceptance: 6 units tested, each ≥Q + 5% (i.e., ≥85%); Stage 2: 12 units, avg ≥Q, none \u003cQ-15%; Stage 3: 24 units, avg ≥Q, max 2 units \u003cQ-15%, none \u003cQ-25%."},{"id":"pt-36","topic":"Manufacturing","question":"Thailand is in ICH Stability Zone IVb. For product approval, stability data is required at:","options":["25°C/60% RH (Zone I/II conditions)","30°C/65% RH for long-term studies; 40°C/75% RH for accelerated studies","37°C/80% RH","40°C/75% RH for long-term studies only"],"answer":1,"explanation":"ICH Q1A stability zones: Zone IVb (tropical, includes Thailand, South/Southeast Asia, most of Asia) = 30°C/65% RH for long-term storage. For registration in Zone IVb countries: long-term data at 30°C/65% RH (or 30°C/75% RH for Zone IVb specifically) and accelerated data at 40°C/75% RH for 6 months. Significant change in accelerated study = cannot extrapolate shelf life from accelerated data."},{"id":"pt-37","topic":"Manufacturing","question":"Content uniformity (CU) testing is required when tablet drug content is:","options":["Greater than 500 mg","Less than 25 mg or less than 25% of tablet weight","When tablets are extended-release","Only for controlled substances"],"answer":1,"explanation":"USP \u003c905> / Ph.Eur. 2.9.40 content uniformity: required for tablets with drug content \u003c25 mg OR \u003c25% of tablet weight, whichever is less. Low-dose drugs risk significant variation in content between tablets. For higher-dose products where drug is the majority of tablet weight, weight variation alone is sufficient proxy for content uniformity. CU tests individual units (10 tablets), not composite (unlike assay testing)."},{"id":"pt-38","topic":"Manufacturing","question":"During tablet compression, \"picking\" refers to:","options":["Selecting tablets for rejection","Material from tablet surface adhering to the punch face, creating pits in the tablet surface","Increasing compression force","Verifying tablet thickness with calipers"],"answer":1,"explanation":"Picking: fragments of tablet surface adhere to (are \"picked\" up by) the punch face → pitted, rough tablet surface. Usually affects upper punch. Causes: punch surface rough/damaged, excess moisture in granules, film coating sticking to punch, insufficient lubricant. Solutions: polish punches, reduce moisture, increase lubricant, use anti-adherent (talc). Distinguish from sticking (entire tablet surface adhesion) and filming (thin film on punch face)."},{"id":"pt-39","topic":"Manufacturing","question":"The Q₁₀ rule states that for every 10°C increase in temperature, the chemical degradation rate approximately:","options":["Doubles","Triples","Increases by 10%","Is halved"],"answer":0,"explanation":"The Q₁₀ = 2 rule (van't Hoff): a 10°C increase in temperature approximately doubles the rate of most chemical reactions (degradation). This is derived from the Arrhenius equation. This is why accelerated stability studies at 40°C can predict behavior at storage conditions (25°C or 30°C). In practice: if a drug degrades with rate k at 30°C, then at 40°C the rate ≈ 2k (twice as fast). Shelf life at 40°C ≈ half of shelf life at 30°C."},{"id":"pt-40","topic":"Manufacturing","question":"Ethylene oxide (EtO) sterilization of medical devices requires aeration after sterilization because:","options":["EtO is not effective without aeration","Residual EtO (toxic, carcinogenic) must be removed from device before patient use","EtO reacts with device material during aeration","Aeration reactivates the device's sterility indicator"],"answer":1,"explanation":"EtO is an alkylating agent (IARC Group 1 carcinogen) that reacts with DNA → kills microorganisms. However, EtO and its metabolites (ethylene chlorohydrin, ethylene glycol) are toxic and may remain in device materials (especially plastics). After sterilization, devices must undergo aeration (ambient or elevated temp, 50–60°C) to allow EtO off-gassing to safe residual levels (per ISO 10993-7). FDA/ISO specify residual limits: e.g., \u003c25 mg EtO for implants."},{"id":"pt-41","topic":"Preformulation","question":"Lipinski's Rule of Five predicts poor oral bioavailability if a drug violates which criteria?","options":["MW > 1000 Da, log P > 10","MW > 500 Da, log P > 5, H-bond donors > 5, H-bond acceptors > 10","MW > 300 Da, log P > 3","Any MW, if the drug is charged"],"answer":1,"explanation":"Lipinski's Rule of Five (Ro5): poor oral absorption likely if MW > 500 Da, log P (Clog P) > 5, H-bond donors (NH + OH) > 5, H-bond acceptors (N + O) > 10. Drugs violating ≥2 rules are likely to have poor oral bioavailability. Exceptions: substrates of active transporters (e.g., many antibiotics), natural products (cyclosporine violates Ro5 but is orally bioavailable via lymphatic absorption). Named after Chris Lipinski at Pfizer."},{"id":"pt-42","topic":"Biopharmaceutics","question":"An extended-release (ER) formulation of metformin XR is preferred over immediate-release (IR) because:","options":["ER has higher bioavailability","ER has faster onset of action","ER reduces GI side effects (nausea, diarrhea) by providing slower, more controlled drug release to the upper GI","ER contains a larger dose per tablet"],"answer":2,"explanation":"Metformin IR causes GI adverse effects (nausea, diarrhea, bloating) in ~30% of patients due to high local drug concentrations in the upper GI. Metformin XR (extended-release, using HPMC matrix or GI therapeutic system) releases drug slowly over 24 hours → lower peak concentrations in GI → fewer GI side effects → better adherence. Bioavailability of XR is slightly lower (AUC ~75% of IR) but efficacy equivalent when total daily dose is similar."},{"id":"pt-43","topic":"Solutions","question":"Benzalkonium chloride (BAC) is commonly used as a preservative in eye drops. It belongs to which chemical class?","options":["Paraben (alkyl ester of para-hydroxybenzoic acid)","Quaternary ammonium compound (QAC)","Organic mercurial","Alcohol"],"answer":1,"explanation":"Benzalkonium chloride (BAC) is a quaternary ammonium compound (QAC) — it has a positively charged nitrogen with four alkyl/aryl groups. Mechanism: disrupts bacterial membranes. Effective against Gram(+) bacteria, many Gram(−) bacteria, some fungi. Used in ophthalmic drops as preservative at 0.004–0.01%. Long-term BAC use can cause corneal epithelial toxicity — concern for glaucoma patients using multiple BAC-preserved drops. BAC-free formulations available for sensitive patients."},{"id":"pt-44","topic":"Parenterals","question":"Lactated Ringer's solution (LR) is preferred over 0.9% NaCl for large-volume resuscitation because:","options":["LR has higher sodium content, providing better volume replacement","LR is more physiological (contains lactate, K, Ca) and avoids hyperchloremic metabolic acidosis associated with large NS infusions","LR is cheaper than NS","LR is hypertonic and provides faster fluid redistribution"],"answer":1,"explanation":"Large volume NS (0.9% NaCl) infusion → hyperchloremia (NS has 154 mEq/L Cl, higher than plasma 103 mEq/L) → dilutional/hyperchloremic metabolic acidosis (non-anion gap). LR: Na 130, K 4, Ca 3, Cl 109, lactate 28 mEq/L — more physiological; the chloride is balanced. Lactate is metabolized to HCO₃⁻ by liver → mild alkalinizing effect. Current evidence (SMART, SALT-ED trials) suggests balanced crystalloids (LR, PlasmaLyte) may reduce major adverse kidney events compared to NS in ICU patients."},{"id":"pt-45","topic":"Tablets","question":"A drug that requires enteric coating to protect the gastric mucosa (not the drug) would be:","options":["Omeprazole (acid-labile)","Enteric-coated aspirin (to reduce gastric irritation/bleeding)","Pancreatin (enzyme, acid-labile)","Bisacodyl (stimulant laxative acting in colon, avoid gastric irritation)"],"answer":1,"explanation":"Enteric coating serves TWO different purposes depending on the drug: (1) Protect acid-labile DRUG from gastric acid (omeprazole, pancreatin, erythromycin — if not in acid-stable form, proton pump inhibitors). (2) Protect gastric MUCOSA from irritating DRUG (enteric-coated aspirin, enteric-coated NSAID, bisacodyl). EC aspirin reaches the intestine before dissolving → less gastric irritation and GI bleeding compared to uncoated aspirin (though systemic anti-platelet effect is the same once absorbed)."},{"id":"pt-46","topic":"Powders","question":"Wet granulation with a high-shear granulator typically takes how long for the granulation step?","options":["5–10 seconds","2–10 minutes","30–60 minutes","4–8 hours"],"answer":1,"explanation":"High-shear mixers (Diosna, Fielder) use a main impeller and a high-speed chopper. Granulation liquid is added while mixing. The actual granulation phase (after liquid addition) typically takes 2–10 minutes in high-shear granulators. This is much faster than traditional fluid bed granulation (15–30+ minutes) or bowl mixers. Endpoint is typically determined by current drawn by impeller motor or by granule characteristics (end-point determination critical)."},{"id":"pt-47","topic":"Routes","question":"The rectal route provides approximately what fraction of first-pass avoidance compared to oral?","options":["None — rectal drugs all go through portal circulation","Approximately 50% avoidance — superior rectal veins drain to portal; middle and inferior rectal veins drain to systemic","100% avoidance like IV","Only 10% avoidance"],"answer":1,"explanation":"The rectum has three hemorrhoidal (rectal) veins. The SUPERIOR rectal vein drains into the inferior mesenteric vein → portal vein → liver (FIRST-PASS). The MIDDLE and INFERIOR rectal veins drain directly into the internal iliac vein → systemic circulation (BYPASSES liver). Drugs absorbed in lower rectum avoid first-pass; those absorbed higher do not. Net result: approximately 50% first-pass avoidance. Compare to sublingual (>90% bypass) and oral (0% bypass)."},{"id":"pt-48","topic":"Manufacturing","question":"GMP requires all pharmaceutical manufacturing processes to be \"validated.\" What does process validation mean?","options":["Testing finished product quality only","Documented evidence that a process consistently produces a product meeting predetermined specifications and quality attributes","Validation of cost-efficiency of manufacturing","Certification of individual operators"],"answer":1,"explanation":"Process validation (ICH Q8): documented evidence providing high degree of assurance that a specific process consistently produces a product that meets its predetermined specifications and quality attributes. Three stages: Stage 1 (Process Design — development), Stage 2 (Process Qualification — formal validation, 3 commercial-scale batches traditionally), Stage 3 (Continued Process Verification — ongoing monitoring). Cannot rely on finished product testing alone — must build quality into the process (QbD — Quality by Design principle)."},{"id":"pt-49","topic":"Suspensions","question":"The term \"Ostwald ripening\" in suspension stability refers to:","options":["Crystal growth where small particles dissolve and recrystallize on larger particles → increasing average particle size over time","Separation of oil and water phases","Microbial growth in suspension","pH change during storage"],"answer":0,"explanation":"Ostwald ripening (crystal growth): small particles have higher solubility (Kelvin equation/Gibbs-Thomson effect) than larger ones → they dissolve preferentially → the dissolved drug recrystallizes on larger particles → particles grow over time → changed dissolution rate and bioavailability. Prevention: narrow initial particle size distribution (minimizes size difference driving force), surface-active agents (reduce surface energy), polymer coating (Ostwald ripening inhibitors: HPMC, PVP), storage at consistent temperature."},{"id":"pt-50","topic":"Biopharmaceutics","question":"A drug's volume of distribution (Vd) is 700 L in a 70-kg patient. This indicates:","options":["The drug is mostly in plasma (Vd matches plasma volume ~5 L)","The drug is extensively distributed to peripheral tissues (Vd >> actual body volume → high tissue binding)","The drug has zero distribution beyond blood","Vd of 700L means the drug is toxic"],"answer":1,"explanation":"Vd is a mathematical (apparent) volume, not a real compartment. Total body volume of a 70-kg person ≈ 42 L. Vd = 700 L >> 42 L → the drug cannot all be in plasma or body water → it must be extensively bound to peripheral tissues (adipose, muscle, deep organs). High Vd drugs: lipophilic, highly tissue-bound (chloroquine Vd ~400 L/kg = 28,000 L in 70-kg person!; amiodarone ~60 L/kg). High Vd drugs: difficult to dialyze, long t½, large loading doses needed."}]}],"illustrations":{"cell-structure":"\u003cfigure class=\"chapter-figure\">\u003cdiv class=\"figure-svg\">\n  \u003csvg 003c!-- golgi -->\n    \u003cg transform=\"translate(300,225)\" stroke=\"#1a6b8a\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\">\n      \u003cpath d=\"M-28,0 q28,-14 56,0\"/>\u003cpath d=\"M-24,9 q24,-12 48,0\"/>\u003cpath d=\"M-20,18 q20,-10 40,0\"/>\n    \u003c/g>\n    \u003c!-- ribosomes -->\n    \u003cg fill=\"#922b21\">\u003ccircle cx=\"120\" cy=\"80\" r=\"3\"/>\u003ccircle cx=\"138\" cy=\"92\" r=\"3\"/>\u003ccircle cx=\"100\" cy=\"100\" r=\"3\"/>\u003ccircle cx=\"150\" cy=\"230\" r=\"3\"/>\u003ccircle cx=\"380\" cy=\"180\" r=\"3\"/>\u003c/g>\n    \u003c!-- labels -->\n    \u003cg style=\"font-family:Inter,system-ui,sans-serif;\" font-size=\"11\" fill=\"#1a1a1a\">\n      \u003ctext x=\"150\" y=\"153\" text-anchor=\"middle\" font-weight=\"600\">Nucleus\u003c/text>\n      \u003ctext x=\"335\" y=\"70\" text-anchor=\"middle\">Mitochondrion\u003c/text>\n      \u003ctext x=\"300\" y=\"150\" text-anchor=\"middle\" fill=\"#7d3c98\">Rough ER\u003c/text>\n      \u003ctext x=\"300\" y=\"262\" text-anchor=\"middle\" fill=\"#1a6b8a\">Golgi\u003c/text>\n      \u003ctext x=\"95\" y=\"73\" text-anchor=\"middle\" fill=\"#922b21\">Ribosomes\u003c/text>\n    \u003c/g>\n  \u003c/svg>\u003c/div>\u003cfigcaption>Eukaryotic (animal) cell — nucleus, mitochondria, rough ER, Golgi apparatus and ribosomes.\u003c/figcaption>\u003c/figure>","cell-membrane":"\u003cfigure class=\"chapter-figure\">\u003cdiv class=\"figure-svg\">\n  \u003csvg viewBox=\"0 0 460 240\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Phospholipid bilayer\">\n    \u003crect x=\"0\" y=\"0\" width=\"460\" height=\"240\" fill=\"#f7fbf9\"/>\n    \u003ctext x=\"230\" y=\"28\" text-anchor=\"middle\" style=\"font-family:Inter,system-ui,sans-serif;\" font-size=\"11\" fill=\"#6b6b6b\">Extracellular fluid\u003c/text>\n    \u003ctext x=\"230\" y=\"222\" text-anchor=\"middle\" style=\"font-family:Inter,system-ui,sans-serif;\" font-size=\"11\" fill=\"#6b6b6b\">Cytoplasm\u003c/text>\n    \u003c!-- t function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ── Study content renderer ── */
function renderStudyContent(chap, color = '#2d6a4f', illustration = '') {
  const sectionsHtml = (chap.sections || []).map(s => `
    <div class="study-section">
      <h3 class="section-heading" style="border-color:${color}">${s.title}</h3>
      <div class="section-body">${s.content}</div>
    </div>`).join('');

  const keyTermsHtml = chap.keyTerms && chap.keyTerms.length ? `
    <div class="key-terms">
      <h3 class="section-heading" style="border-color:${color}">Key Terms</h3>
      <dl class="term-list">
        ${chap.keyTerms.map(t => `<dt>${t.term}</dt><dd>${t.def}</dd>`).join('')}
      </dl>
    </div>` : '';

  return `
    <div class="chapter-header" style="--s-color:${color}">
      <span class="chap-tag">${chap.tag || ''}</span>
      <h1 class="chap-title-main">${chap.title}</h1>
      ${chap.overview ? `<p class="chap-overview">${chap.overview}</p>` : ''}
    </div>
    ${illustration || ''}
    ${sectionsHtml}
    ${keyTermsHtml}`;
}

/* ============================================================
   QuizEngine
   ============================================================ */
class QuizEngine {
  constructor({ container, questions, mode, timeLimit = 40 * 60, subjectColor = '#2d6a4f', onComplete, onBack }) {
    this.container    = container;
    this.allQuestions = questions;
    this.mode         = mode;
    this.timeLimit    = timeLimit;
    this.color        = subjectColor;
    this.onComplete   = onComplete || (() => {});
    this.onBack       = onBack || (() => {});

    if (mode === 'exam') {
      this.questions = shuffle(questions).slice(0, 30);
      this._startExam();
    } else {
      this.questions = shuffle(questions);
      this._startPractice();
    }
  }

  /* ── PRACTICE ─────────────────────────────────────────── */
  _startPractice() {
    this.pIdx   = 0;
    this.pScore = 0;
    this.pTotal = this.questions.length;
    this._renderPractice();
  }

  _renderPractice() {
    const q = this.questions[this.pIdx];

    this.container.innerHTML = `
      <div class="practice-wrap">
        <div class="quiz-topbar">
          <button class="btn-ghost quiz-back-btn">← Back</button>
          <span class="quiz-progress">${this.pIdx + 1} / ${this.pTotal}</span>
          <span class="quiz-score-live">Score: ${this.pScore} / ${this.pIdx}</span>
        </div>
        <div class="progress-bar quiz-prog-bar">
          <div class="progress-fill" style="width:${(this.pIdx / this.pTotal) * 100}%;background:${this.color}"></div>
        </div>
        <div class="quiz-card">
          <div class="q-topic" style="color:${this.color}">${q.topic || ''}</div>
          <p class="q-text">${q.question}</p>
          <ul class="option-list" id="opt-list">
            ${q.options.map((opt, i) => `
              <li class="option" data-idx="${i}">
                <span class="opt-letter">${'ABCD'[i]}</span>
                <span class="opt-text">${opt}</span>
              </li>`).join('')}
          </ul>
          <div class="q-explanation" id="q-expl" style="display:none"></div>
          <div class="quiz-actions" id="quiz-actions" style="display:none">
            ${this.pIdx < this.pTotal - 1
              ? `<button class="btn-primary" id="next-btn">Next Question →</button>`
              : `<button class="btn-primary" id="next-btn">See Results</button>`}
          </div>
        </div>
      </div>`;

    this.container.querySelector('.quiz-back-btn').onclick = () => this.onBack();
    this.container.querySelectorAll('.option').forEach(el => {
      el.addEventListener('click', () => this._answerPractice(parseInt(el.dataset.idx), q));
    });
  }

  _answerPractice(chosen, q) {
    const correct = q.answer;
    const opts = this.container.querySelectorAll('.option');
    opts.forEach((el, i) => {
      el.style.pointerEvents = 'none';
      if (i === correct) el.classList.add('correct');
      else if (i === chosen) el.classList.add('wrong');
    });

    if (chosen === correct) this.pScore++;

    const expl = this.container.querySelector('#q-expl');
    expl.innerHTML = `<div class="expl-header">${chosen === correct ? '✓ Correct!' : '✗ Incorrect'}</div><p>${q.explanation}</p>`;
    expl.style.display = 'block';
    expl.className = `q-explanation ${chosen === correct ? 'expl-correct' : 'expl-wrong'}`;

    const actions = this.container.querySelector('#quiz-actions');
    actions.style.display = 'flex';

    this.container.querySelector('#next-btn').onclick = () => {
      this.pIdx++;
      if (this.pIdx >= this.pTotal) this._finishPractice();
      else this._renderPractice();
    };
  }

  _finishPractice() {
    this.onComplete(this.pScore, this.pTotal);
    this._renderScore(this.pScore, this.pTotal, 'practice');
  }

  /* ── EXAM ──────────────────────────────────────────────── */
  _startExam() {
    this.eIdx      = 0;
    this.eTotal    = this.questions.length;
    this.eAnswers  = new Array(this.eTotal).fill(null);
    this.eTimeLeft = this.timeLimit;
    this._renderExamIntro();
  }

  _renderExamIntro() {
    const mins = Math.floor(this.timeLimit / 60);
    this.container.innerHTML = `
      <div class="exam-intro">
        <div class="exam-intro-icon">📝</div>
        <h2>Mock Exam</h2>
        <p>${this.eTotal} multiple-choice questions · ${mins} minute time limit</p>
        <ul class="exam-rules">
          <li>Choose one answer per question.</li>
          <li>Navigate freely using the dot panel.</li>
          <li>Submit when done or when time runs out.</li>
        </ul>
        <div class="exam-actions">
          <button class="btn-ghost" id="ei-back">← Back</button>
          <button class="btn-primary" id="ei-start">Start Exam</button>
        </div>
      </div>`;
    this.container.querySelector('#ei-back').onclick = () => this.onBack();
    this.container.querySelector('#ei-start').onclick = () => {
      this._renderExamShell();
      this._renderExamQuestion();
      this._renderDots();
      this._startTimer();
    };
  }

  _renderExamShell() {
    this.container.innerHTML = `
      <div class="exam-wrap">
        <div class="exam-topbar">
          <div class="exam-timer" id="exam-timer" style="color:${this.color}">⏱ ${String(Math.floor(this.eTimeLeft/60)).padStart(2,'0')}:${String(this.eTimeLeft%60).padStart(2,'0')}</div>
          <span class="quiz-progress" id="exam-prog">${this.eIdx + 1} / ${this.eTotal}</span>
          <button class="btn-submit" id="submit-exam">Submit</button>
        </div>
        <div class="exam-dots" id="exam-dots"></div>
        <div id="exam-q"></div>
      </div>`;
    this.container.querySelector('#submit-exam').onclick = () => this._submitExam();
  }

  _renderDots() {
    const dots = this.container.querySelector('#exam-dots');
    if (!dots) return;
    dots.innerHTML = this.questions.map((_, i) => {
      let cls = 'edot';
      if (i === this.eIdx) cls += ' edot-current';
      else if (this.eAnswers[i] !== null) cls += ' edot-answered';
      return `<span class="${cls}" data-i="${i}" title="Q${i+1}"></span>`;
    }).join('');
    dots.querySelectorAll('.edot').forEach(el => {
      el.onclick = () => { this.eIdx = parseInt(el.dataset.i); this._renderExamQuestion(); this._renderDots(); };
    });
  }

  _renderExamQuestion() {
    const q = this.questions[this.eIdx];
    const chosen = this.eAnswers[this.eIdx];
    const qWrap = this.container.querySelector('#exam-q');
    if (!qWrap) return;

    qWrap.innerHTML = `
      <div class="quiz-card exam-card">
        <div class="q-topic" style="color:${this.color}">${q.topic || ''}</div>
        <p class="q-text">${q.question}</p>
        <ul class="option-list">
          ${q.options.map((opt, i) => `
            <li class="option ${chosen === i ? 'selected' : ''}" data-idx="${i}">
              <span class="opt-letter">${'ABCD'[i]}</span>
              <span class="opt-text">${opt}</span>
            </li>`).join('')}
        </ul>
        <div class="exam-nav-row">
          ${this.eIdx > 0 ? `<button class="btn-outline" id="eprev">← Prev</button>` : '<span></span>'}
          ${this.eIdx < this.eTotal - 1 ? `<button class="btn-primary" id="enext">Next →</button>` : '<span></span>'}
        </div>
      </div>`;

    qWrap.querySelectorAll('.option').forEach(el => {
      el.onclick = () => {
        this.eAnswers[this.eIdx] = parseInt(el.dataset.idx);
        this._renderExamQuestion();
        this._renderDots();
      };
    });
    qWrap.querySelector('#eprev')?.addEventListener('click', () => { this.eIdx--; this._renderExamQuestion(); this._renderDots(); });
    qWrap.querySelector('#enext')?.addEventListener('click', () => { this.eIdx++; this._renderExamQuestion(); this._renderDots(); });

    const prog = this.container.querySelector('#exam-prog');
    if (prog) prog.textContent = `${this.eIdx + 1} / ${this.eTotal}`;
  }

  _startTimer() {
    this._timerInterval = setInterval(() => {
      this.eTimeLeft--;
      const timerEl = this.container.querySelector('#exam-timer');
      if (timerEl) {
        const m = String(Math.floor(this.eTimeLeft / 60)).padStart(2, '0');
        const s = String(this.eTimeLeft % 60).padStart(2, '0');
        timerEl.textContent = `⏱ ${m}:${s}`;
        if (this.eTimeLeft <= 60) timerEl.style.color = '#c0392b';
      }
      if (this.eTimeLeft <= 0) { clearInterval(this._timerInterval); this._submitExam(); }
    }, 1000);
  }

  _submitExam() {
    if (this._timerInterval) clearInterval(this._timerInterval);
    const unanswered = this.eAnswers.filter(a => a === null).length;
    if (unanswered > 0 && this.eTimeLeft > 0) {
      if (!confirm(`${unanswered} question(s) unanswered. Submit anyway?`)) return;
    }
    let score = 0;
    this.questions.forEach((q, i) => { if (this.eAnswers[i] === q.answer) score++; });
    this.onComplete(score, this.eTotal);
    this._renderScore(score, this.eTotal, 'exam');
  }

  /* ── SCORE SCREEN ─────────────────────────────────────── */
  _renderScore(correct, total, mode) {
    const pct = Math.round((correct / total) * 100);
    let grade, gradeClass;
    if (pct >= 90) { grade = 'Excellent!'; gradeClass = 'grade-a'; }
    else if (pct >= 75) { grade = 'Good Job!'; gradeClass = 'grade-b'; }
    else if (pct >= 60) { grade = 'Passing'; gradeClass = 'grade-c'; }
    else { grade = 'Needs Review'; gradeClass = 'grade-f'; }

    const wrongTopics = {};
    if (mode === 'exam') {
      this.questions.forEach((q, i) => {
        if (this.eAnswers[i] !== q.answer) {
          wrongTopics[q.topic] = (wrongTopics[q.topic] || 0) + 1;
        }
      });
    }
    const topicsHtml = Object.keys(wrongTopics).length ? `
      <div class="weak-topics"><h4>Topics to review:</h4><ul>
        ${Object.entries(wrongTopics).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`<li>${t} <span class="wrong-count">(${n} wrong)</span></li>`).join('')}
      </ul></div>` : '';

    this.container.innerHTML = `
      <div class="score-screen">
        <div class="score-circle ${gradeClass}">
          <span class="score-pct">${pct}%</span>
          <span class="score-raw">${correct} / ${total}</span>
        </div>
        <div class="score-grade">${grade}</div>
        <div class="progress-bar score-bar">
          <div class="progress-fill" style="width:${pct}%;background:${this.color}"></div>
        </div>
        ${topicsHtml}
        <div class="score-actions">
          <button class="btn-outline" id="score-back">← Back to Subject</button>
          <button class="btn-primary" id="score-retry">Try Again</button>
        </div>
      </div>`;

    this.container.querySelector('#score-back').onclick = () => this.onBack();
    this.container.querySelector('#score-retry').onclick = () => {
      if (this.mode === 'exam') { this.questions = shuffle(this.allQuestions).slice(0, 30); this._startExam(); }
      else { this.questions = shuffle(this.allQuestions); this._startPractice(); }
    };
  }
}

/* ============================================================
   PROGRESS HELPERS
   ============================================================ */
function progressKey(subId, type) { return `pharm_${subId}_${type}`; }

function markChapterRead(subId, chapId) {
  const key = progressKey(subId, 'read');
  const read = JSON.parse(localStorage.getItem(key) || '[]');
  if (!read.includes(chapId)) {
    read.push(chapId);
    localStorage.setItem(key, JSON.stringify(read));
  }
}

function getReadChapters(subId) {
  return JSON.parse(localStorage.getItem(progressKey(subId, 'read')) || '[]');
}

function savePracticeScore(subId, correct, total) {
  const key = progressKey(subId, 'practice');
  const prev = JSON.parse(localStorage.getItem(key) || '[]');
  prev.push({ correct, total, date: Date.now() });
  localStorage.setItem(key, JSON.stringify(prev.slice(-10)));
}

function saveExamScore(subId, correct, total) {
  const key = progressKey(subId, 'exam');
  const prev = JSON.parse(localStorage.getItem(key) || '[]');
  prev.push({ correct, total, date: Date.now() });
  localStorage.setItem(key, JSON.stringify(prev.slice(-5)));
}

function getBestScore(subId, type) {
  const arr = JSON.parse(localStorage.getItem(progressKey(subId, type)) || '[]');
  if (!arr.length) return null;
  return arr.reduce((b, s) => s.correct / s.total > b.correct / b.total ? s : b, arr[0]);
}

/* ============================================================
   SIDEBAR SUBJECT LIST
   ============================================================ */
function buildSidebar() {
  subjectList.innerHTML = '';
  SUBJECTS.forEach(({ meta }) => {
    const li = document.createElement('li');
    li.className = 'subject-item';
    li.dataset.id = meta.id;
    li.innerHTML = `<span class="subj-icon">${meta.icon}</span><span class="subj-name">${meta.title}</span>`;
    li.addEventListener('click', () => navigate(meta.id, null, 'home'));
    subjectList.appendChild(li);
  });
}

function setActiveSidebarItem(id) {
  document.querySelectorAll('.subject-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
}

/* ============================================================
   MODE TABS
   ============================================================ */
function showModeTabs(subjectId) {
  modeTabsEl.innerHTML = `
    <button class="mode-tab" data-mode="study">Study</button>
    <button class="mode-tab" data-mode="practice">Practice</button>
    <button class="mode-tab" data-mode="exam">Exam</button>
  `;
  modeTabsEl.querySelectorAll('.mode-tab').forEach(btn => {
    btn.addEventListener('click', () => navigate(subjectId, null, btn.dataset.mode));
  });
}

function setActiveModeTab(mode) {
  modeTabsEl.querySelectorAll('.mode-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
}

function hideModeTabs() {
  modeTabsEl.innerHTML = '';
}

/* ============================================================
   BREADCRUMB
   ============================================================ */
function setBreadcrumb(parts) {
  breadcrumbEl.innerHTML = parts.map((p, i) =>
    i < parts.length - 1
      ? `<span class="bc-link" data-nav='${JSON.stringify(p.nav)}'>${p.label}</span><span class="bc-sep">›</span>`
      : `<span class="bc-current">${p.label}</span>`
  ).join('');
  breadcrumbEl.querySelectorAll('.bc-link').forEach(el => {
    el.addEventListener('click', () => {
      const { subjectId, chapterId, mode } = JSON.parse(el.dataset.nav);
      navigate(subjectId, chapterId, mode);
    });
  });
}

/* ============================================================
   NAVIGATE
   ============================================================ */
function navigate(subjectId, chapterId, mode) {
  state = { subjectId, chapterId, mode };
  render();
}

function render() {
  const { subjectId, chapterId, mode } = state;

  if (!subjectId) {
    renderHome();
    return;
  }

  const subEntry = SUBJECTS.find(s => s.meta.id === subjectId);
  if (!subEntry) { renderHome(); return; }

  setActiveSidebarItem(subjectId);
  showModeTabs(subjectId);

  if (mode === 'study') {
    setActiveModeTab('study');
    if (chapterId) renderChapter(subEntry, chapterId);
    else renderSubjectStudy(subEntry);
  } else if (mode === 'practice') {
    setActiveModeTab('practice');
    renderPractice(subEntry);
  } else if (mode === 'exam') {
    setActiveModeTab('exam');
    renderExam(subEntry);
  } else {
    setActiveModeTab('');
    renderSubjectHome(subEntry);
  }
}

/* ============================================================
   HOME DASHBOARD
   ============================================================ */
function renderHome() {
  setActiveSidebarItem(null);
  hideModeTabs();
  sidebarTitle.textContent = 'Pharm CMU';
  setBreadcrumb([{ label: 'Home' }]);

  const cards = SUBJECTS.map(({ meta }) => {
    const readCount = getReadChapters(meta.id).length;
    const totalChaps = meta.chapters.length;
    const pct = Math.round((readCount / totalChaps) * 100);
    const bestPrac = getBestScore(meta.id, 'practice');
    const bestExam = getBestScore(meta.id, 'exam');
    return `
      <div class="subject-card" style="--s-color:${meta.color}" data-id="${meta.id}">
        <div class="sc-banner"><span class="sc-icon">${meta.icon}</span></div>
        <div class="sc-body">
          <div class="sc-title">${meta.title}</div>
          <p class="sc-desc">${meta.description}</p>
          <div class="sc-progress">
            <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${meta.color}"></div></div>
            <span class="progress-label">${readCount} / ${totalChaps} chapters · ${pct}%</span>
          </div>
          <div class="sc-scores">
            <span class="score-pill">${totalChaps} chapters</span>
            ${bestPrac ? `<span class="score-pill">Practice ${Math.round(bestPrac.correct/bestPrac.total*100)}%</span>` : ''}
            ${bestExam ? `<span class="score-pill">Exam ${Math.round(bestExam.correct/bestExam.total*100)}%</span>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');

  mainContent.innerHTML = `
    <div class="home-header">
      <h1>Pharmacy Year 1 — Study Hub</h1>
      <p>Illustrated study notes, practice questions, and timed mock exams. Pick a subject to begin.</p>
    </div>
    <div class="subject-grid">${cards}</div>`;

  mainContent.querySelectorAll('.subject-card').forEach(card => {
    card.addEventListener('click', () => navigate(card.dataset.id, null, 'home'));
  });
}

/* ============================================================
   SUBJECT HOME (overview + chapter list)
   ============================================================ */
function renderSubjectHome(subEntry) {
  const { meta } = subEntry;
  sidebarTitle.textContent = meta.title;
  setBreadcrumb([
    { label: 'Home', nav: { subjectId: null, chapterId: null, mode: 'home' } },
    { label: meta.title },
  ]);

  const read = getReadChapters(meta.id);
  const chapItems = meta.chapters.map((c, i) => {
    const done = read.includes(c.id);
    return `<li class="chapter-item ${done ? 'done' : ''}" data-cid="${c.id}">
      <span class="chap-num">${String(i + 1).padStart(2, '0')}</span>
      <span class="chap-title">${c.title}</span>
      <span class="chap-check">${done ? '✓' : '›'}</span>
    </li>`;
  }).join('');

  const pct = Math.round((read.length / meta.chapters.length) * 100);

  mainContent.innerHTML = `
    <div class="subject-hero" style="--s-color:${meta.color}">
      <div class="sh-icon">${meta.icon}</div>
      <div class="sh-text">
        <h1>${meta.title}</h1>
        <p>${meta.description}</p>
        <div class="sh-progress">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:#fff"></div></div>
          <span>${read.length} / ${meta.chapters.length} chapters read</span>
        </div>
      </div>
    </div>
    <div class="quick-actions">
      <button class="qa-btn" data-mode="practice">📝 Practice Questions</button>
      <button class="qa-btn" data-mode="exam">⏱ Mock Exam</button>
    </div>
    <div class="chapter-list-section">
      <h2>Chapters</h2>
      <ul class="chapter-list">${chapItems}</ul>
    </div>`;

  mainContent.querySelectorAll('.qa-btn').forEach(el => {
    el.addEventListener('click', () => navigate(meta.id, null, el.dataset.mode));
  });

  mainContent.querySelectorAll('.chapter-item').forEach(el => {
    el.addEventListener('click', () => navigate(meta.id, el.dataset.cid, 'study'));
  });
}

/* ============================================================
   SUBJECT STUDY VIEW (chapter index)
   ============================================================ */
function renderSubjectStudy(subEntry) {
  renderSubjectHome(subEntry);
}

/* ============================================================
   CHAPTER STUDY VIEW
   ============================================================ */
function renderChapter(subEntry, chapterId) {
  const { meta, chapters } = subEntry;
  const chap = chapters[chapterId];
  if (!chap) { renderSubjectHome(subEntry); return; }

  markChapterRead(meta.id, chapterId);

  const chapList = meta.chapters;
  const idx = chapList.findIndex(c => c.id === chapterId);
  const prev = idx > 0 ? chapList[idx - 1] : null;
  const next = idx < chapList.length - 1 ? chapList[idx + 1] : null;

  setBreadcrumb([
    { label: 'Home', nav: { subjectId: null, chapterId: null, mode: 'home' } },
    { label: meta.title, nav: { subjectId: meta.id, chapterId: null, mode: 'home' } },
    { label: 'Study', nav: { subjectId: meta.id, chapterId: null, mode: 'study' } },
    { label: chap.title },
  ]);

  mainContent.innerHTML = `
    <div class="chapter-view">
      ${renderStudyContent(chap, meta.color, illustrations[chapterId])}
      <div class="chap-nav">
        ${prev ? `<button class="btn-outline chap-prev" data-cid="${prev.id}">← ${prev.title}</button>` : '<span></span>'}
        ${next ? `<button class="btn-primary chap-next" data-cid="${next.id}">${next.title} →</button>` : '<span></span>'}
      </div>
    </div>`;

  mainContent.querySelector('.chap-prev')?.addEventListener('click', e => {
    navigate(meta.id, e.target.dataset.cid, 'study');
  });
  mainContent.querySelector('.chap-next')?.addEventListener('click', e => {
    navigate(meta.id, e.target.dataset.cid, 'study');
  });
}

/* ============================================================
   PRACTICE MODE
   ============================================================ */
function renderPractice(subEntry) {
  const { meta, pq } = subEntry;
  sidebarTitle.textContent = meta.title;
  setBreadcrumb([
    { label: 'Home', nav: { subjectId: null, chapterId: null, mode: 'home' } },
    { label: meta.title, nav: { subjectId: meta.id, chapterId: null, mode: 'home' } },
    { label: 'Practice' },
  ]);

  mainContent.innerHTML = `<div id="quiz-root"></div>`;

  new QuizEngine({
    container: document.getElementById('quiz-root'),
    questions: pq,
    mode: 'practice',
    subjectColor: meta.color,
    onComplete: (correct, total) => {
      savePracticeScore(meta.id, correct, total);
    },
    onBack: () => navigate(meta.id, null, 'home'),
  });
}

/* ============================================================
   EXAM MODE
   ============================================================ */
function renderExam(subEntry) {
  const { meta, eq } = subEntry;
  sidebarTitle.textContent = meta.title;
  setBreadcrumb([
    { label: 'Home', nav: { subjectId: null, chapterId: null, mode: 'home' } },
    { label: meta.title, nav: { subjectId: meta.id, chapterId: null, mode: 'home' } },
    { label: 'Exam' },
  ]);

  mainContent.innerHTML = `<div id="quiz-root"></div>`;

  new QuizEngine({
    container: document.getElementById('quiz-root'),
    questions: eq,
    mode: 'exam',
    timeLimit: 40 * 60,
    subjectColor: meta.color,
    onComplete: (correct, total) => {
      saveExamScore(meta.id, correct, total);
    },
    onBack: () => navigate(meta.id, null, 'home'),
  });
}

/* ============================================================
   INIT
   ============================================================ */
buildSidebar();

document.getElementById('home-btn').addEventListener('click', () => {
  state = { subjectId: null, chapterId: null, mode: 'home' };
  render();
});

render();


</script>
</body>
</html>
