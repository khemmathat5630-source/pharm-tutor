3ctr>\u003ctd>Acid chloride (acyl chloride)\u003c/td>\u003ctd>-COCl\u003c/td>\u003ctd>Most reactive; used in drug synthesis\u003c/td>\u003ctd>Synthesis intermediate\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Anhydride\u003c/td>\u003ctd>-CO-O-CO-\u003c/td>\u003ctd>Very reactive; reacts with nucleophiles\u003c/td>\u003ctd>Acetic anhydride → acetylates aspirin (synthesis)\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003ch4>Ester Hydrolysis — Clinical Importance\u003c/h4>\n          \u003cp>Many drugs are esters that undergo enzymatic hydrolysis (esterases in blood, liver, intestine) in vivo:\u003c/p>\n          \u003cul>\n            \u003cli>\u003cstrong>Aspirin:\u003c/strong> Ester hydrolysis → salicylate + acetic acid; responsible for drug degradation\u003c/li>\n            \u003cli>\u003cstrong>Prodrugs:\u003c/strong> Enalapril (ester) → enalaprilat (active acid) by plasma esterases; better oral bioavailability\u003c/li>\n            \u003cli>\u003cstrong>Cocaine:\u003c/strong> Ester hydrolysis → inactive metabolites\u003c/li>\n            \u003cli>\u003cstrong>Succinylcholine:\u003c/strong> Rapid hydrolysis by plasma pseudocholinesterase → short duration of action\u003c/li>\n          \u003c/ul>\n        "},{"title":"Nucleophilic Addition to Carbonyl","content":"\n          \u003cp>The carbonyl carbon (C=O) is electrophilic (δ+) due to the electronegative oxygen. Nucleophiles attack the carbonyl carbon.\u003c/p>\n          \u003ch4>Important Reactions\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Hydration of aldehyde/ketone:\u003c/strong> C=O + H₂O → gem-diol (hydrate)\u003c/li>\n            \u003cli>\u003cstrong>Acetal formation:\u003c/strong> Aldehyde + 2 ROH → acetal (acid catalyst; protects aldehyde)\u003c/li>\n            \u003cli>\u003cstrong>Imine (Schiff base) formation:\u003c/strong> Carbonyl + RNH₂ → imine (-C=NR) + H₂O. Relevant to: pyridoxal phosphate (vitamin B₆) enzyme mechanism; irreversible inhibition of enzymes\u003c/li>\n            \u003cli>\u003cstrong>Reduction:\u003c/strong> Aldehyde/Ketone + NaBH₄ → alcohol (biologically: NADH, NADPH reduce carbonyls)\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>Aldol condensation:\u003c/strong> Acid or base catalyzed condensation of carbonyl compounds — important in biosynthesis of fatty acids and polyketide natural products (many drugs derived from polyketide pathway: tetracyclines, macrolides, statins).\u003c/div>\n        "}],"keyTerms":[{"term":"Ester hydrolysis","def":"Reaction of ester with water → carboxylic acid + alcohol. Key to prodrug activation and drug degradation."},{"term":"Nucleophilic addition","def":"Mechanism where nucleophile attacks electrophilic carbonyl carbon; primary reaction of aldehydes and ketones."},{"term":"Prodrug","def":"Pharmacologically inactive compound that is metabolized in the body to the active drug. Esters are common prodrug strategies."},{"term":"Schiff base (imine)","def":"Product of carbonyl + amine condensation. Key to vitamin B₆ enzyme catalysis and some drug-enzyme interactions."},{"term":"Amide bond","def":"C-N bond adjacent to carbonyl; partial double bond character due to resonance → stable, planar; basis of peptide bonds."}]},"amines":{"tag":"Chapter 6 · Organic Chem","title":"Amines & Amino Acids","overview":"Most drugs contain an amine group. Amines are weak bases — their ionization determines absorption and distribution. Amino acids are the building blocks of proteins and enzyme targets.","sections":[{"title":"Amines — Classification & Properties","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Structure\u003c/th>\u003cth>pKa of conjugate acid\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Primary amine\u003c/td>\u003ctd>R-NH₂\u003c/td>\u003ctd>~10\u003c/td>\u003ctd>Amphetamine, dopamine\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Secondary amine\u003c/td>\u003ctd>R₂-NH\u003c/td>\u003ctd>~10\u003c/td>\u003ctd>Morphine (secondary amine)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Tertiary amine\u003c/td>\u003ctd>R₃-N\u003c/td>\u003ctd>~9–10\u003c/td>\u003ctd>Atropine, codeine\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Quaternary ammonium\u003c/td>\u003ctd>R₄-N⁺\u003c/td>\u003ctd>Always ionized (no pKa)\u003c/td>\u003ctd>Succinylcholine, vecuronium (neuromuscular blockers)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Aromatic amine\u003c/td>\u003ctd>Ar-NH₂\u003c/td>\u003ctd>~5 (less basic — lone pair in resonance with ring)\u003c/td>\u003ctd>Aniline, sulfonamides\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003ch4>Basicity of Amines\u003c/h4>\n          \u003cp>Amines are bases because the nitrogen lone pair accepts a proton: R-NH₂ + H₂O ⇌ R-NH₃⁺ + OH⁻\u003c/p>\n          \u003cul>\n            \u003cli>Aliphatic amines: pKa ~9–10 → mostly protonated (ionized) at physiological pH 7.4\u003c/li>\n            \u003cli>Aromatic amines: pKa ~5 → mostly unprotonated (neutral) at pH 7.4\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"info-box key\">\u003cstrong>Local anesthetics (lidocaine):\u003c/strong> Tertiary amine, pKa = 7.8. At pH 7.4 blood: ~72% ionized (BH⁺). To work, must enter nerve in neutral (B) form, then in acidic nerve cytoplasm → ionizes → blocks Na⁺ channel from inside. In infected tissue (acidic pH): more ionized → less neutral → reduced efficacy of local anesthetics.\u003c/div>\n        "},{"title":"Amino Acids","content":"\n          \u003cp>Amino acids have both -NH₂ and -COOH groups → amphoteric (can be acid or base). They exist as zwitterions at physiological pH.\u003c/p>\n          \u003cdiv class=\"formula-block\">+H₃N-CHR-COO⁻ &nbsp; (Zwitterion at pH = pI)\u003c/div>\n          \u003ch4>20 Essential Amino Acids — Categories\u003c/h4>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Category\u003c/th>\u003cth>Examples\u003c/th>\u003cth>Side chain\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Nonpolar aliphatic\u003c/td>\u003ctd>Glycine, Alanine, Valine, Leucine, Isoleucine, Methionine, Proline\u003c/td>\u003ctd>Hydrophobic; buried in protein core\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Aromatic\u003c/td>\u003ctd>Phenylalanine, Tyrosine, Tryptophan\u003c/td>\u003ctd>Aromatic rings; UV absorption (Tyr, Trp at 280 nm)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Polar uncharged\u003c/td>\u003ctd>Serine, Threonine, Asparagine, Glutamine, Cysteine\u003c/td>\u003ctd>H-bond donors/acceptors\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Positively charged\u003c/td>\u003ctd>Lysine (pKa ~10.5), Arginine (pKa ~12.5), Histidine (pKa ~6.0)\u003c/td>\u003ctd>Positive at pH 7.4 (except His, which is ~50% ionized)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Negatively charged\u003c/td>\u003ctd>Aspartate (pKa ~3.9), Glutamate (pKa ~4.1)\u003c/td>\u003ctd>Negative at pH 7.4\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>Histidine at active sites:\u003c/strong> pKa ~6 means histidine is partially protonated at pH 7.4 → can donate or accept protons → ideal for enzyme catalysis. Found at active sites of serine proteases, carbonic anhydrase, hemoglobin.\u003c/div>\n        "},{"title":"Peptide Bonds & Protein Structure","content":"\n          \u003cp>Amino acids link via \u003cstrong>peptide bonds\u003c/strong> (amide bonds) between -COOH and -NH₂ → release of water (condensation). The peptide bond is planar (partial double bond character → restricted rotation).\u003c/p>\n          \u003ch4>Protein Structure Levels\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Primary:\u003c/strong> Amino acid sequence (covalent peptide bonds)\u003c/li>\n            \u003cli>\u003cstrong>Secondary:\u003c/strong> Local folding (α-helix: H-bonds within strand; β-sheet: H-bonds between strands)\u003c/li>\n            \u003cli>\u003cstrong>Tertiary:\u003c/strong> 3D folding of entire polypeptide (H-bonds, ionic bonds, van der Waals, disulfide bonds)\u003c/li>\n            \u003cli>\u003cstrong>Quaternary:\u003c/strong> Multiple polypeptide chains (e.g., hemoglobin: 4 chains; insulin: A and B chains)\u003c/li>\n          \u003c/ul>\n        "}],"keyTerms":[{"term":"Quaternary ammonium salt","def":"Nitrogen with 4 carbon substituents; always positively charged; cannot cross membranes passively; long duration of action."},{"term":"Zwitterion","def":"Molecule carrying both positive and negative charges simultaneously; amino acids exist as zwitterions at pH = isoelectric point (pI)."},{"term":"pI (Isoelectric point)","def":"pH at which an amino acid (or protein) carries no net charge; equal to average of pKa values of its ionizable groups."},{"term":"Peptide bond","def":"Amide bond between carboxyl of one amino acid and amino group of the next; planar due to resonance."},{"term":"Disulfide bond","def":"Covalent bond between two cysteine thiol groups (-SH + HS- → -S-S-); stabilizes protein tertiary and quaternary structure."}]},"mechanisms":{"tag":"Chapter 7 · Organic Chem","title":"Reaction Mechanisms: SN1/SN2/E1/E2","overview":"Reaction mechanisms explain HOW reactions occur at a molecular level. Understanding these helps predict reaction conditions, stereochemistry of products, and drug metabolism pathways.","sections":[{"title":"Nucleophilic Substitution — SN2","content":"\n          \u003ch4>Mechanism\u003c/h4>\n          \u003cp>One-step, concerted backside attack. The nucleophile attacks from the back while the leaving group departs → \u003cstrong>inversion of configuration (Walden inversion)\u003c/strong> at the chiral center.\u003c/p>\n          \u003ch4>Favored by\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Substrate:\u003c/strong> Primary (1°) > Secondary (2°) >> Tertiary (3° — essentially no SN2)\u003c/li>\n            \u003cli>\u003cstrong>Nucleophile:\u003c/strong> Strong nucleophile (CN⁻, RS⁻, I⁻, HO⁻)\u003c/li>\n            \u003cli>\u003cstrong>Solvent:\u003c/strong> Polar aprotic (acetone, DMSO, DMF — dissolves cation, leaves anion reactive)\u003c/li>\n            \u003cli>\u003cstrong>Temperature:\u003c/strong> Room temperature\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"formula-block\">Rate = k[Substrate][Nucleophile] — bimolecular, 2nd order\u003c/div>\n        "},{"title":"Nucleophilic Substitution — SN1","content":"\n          \u003ch4>Mechanism\u003c/h4>\n          \u003cp>Two-step: (1) Substrate ionizes to form carbocation (rate-determining step); (2) Nucleophile attacks carbocation. \u003cstrong>Racemization\u003c/strong> occurs (nucleophile attacks either face of planar carbocation).\u003c/p>\n          \u003ch4>Favored by\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Substrate:\u003c/strong> Tertiary (3°) > Secondary (2°) >> Primary (1°) — tertiary carbocations are most stable (hyperconjugation)\u003c/li>\n            \u003cli>\u003cstrong>Nucleophile:\u003c/strong> Weak nucleophile acceptable (even water)\u003c/li>\n            \u003cli>\u003cstrong>Solvent:\u003c/strong> Polar protic (water, alcohols — stabilize carbocation by solvation)\u003c/li>\n            \u003cli>\u003cstrong>Temperature:\u003c/strong> Higher temperature\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"formula-block\">Rate = k[Substrate] — unimolecular, 1st order\u003c/div>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>Carbocation stability:\u003c/strong> 3° > 2° > 1° > methyl. Also stabilized by resonance (benzylic, allylic carbocations) and electron-donating groups.\u003c/div>\n        "},{"title":"Elimination Reactions — E1 and E2","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>E2 Elimination\u003c/th>\u003cth>E1 Elimination\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Mechanism\u003c/td>\u003ctd>One-step, concerted; base removes β-H as leaving group departs\u003c/td>\u003ctd>Two-step: carbocation forms, then base removes β-H\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Stereochemistry\u003c/td>\u003ctd>Anti periplanar geometry required (H and LG must be anti, 180°)\u003c/td>\u003ctd>No stereo requirement; more substituted alkene preferred (Zaitsev)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Order\u003c/td>\u003ctd>2nd order: Rate = k[base][substrate]\u003c/td>\u003ctd>1st order: Rate = k[substrate]\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Favored by\u003c/td>\u003ctd>Strong, bulky base; low temperature\u003c/td>\u003ctd>Weak base; tertiary substrate; high temperature\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Product\u003c/td>\u003ctd>More substituted (Zaitsev) or less substituted (Hofmann with bulky base)\u003c/td>\u003ctd>More substituted (Zaitsev) alkene\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003ch4>Competition: Substitution vs. Elimination\u003c/h4>\n          \u003cul>\n            \u003cli>Strong nucleophile + 1° substrate → SN2\u003c/li>\n            \u003cli>Strong, bulky base + 3° substrate → E2 (favored; SN2 too hindered)\u003c/li>\n            \u003cli>High temperature → favors elimination (ΔS > 0 for 1 substrate → 2 products)\u003c/li>\n            \u003cli>Polar aprotic solvent → SN2\u003c/li>\n            \u003cli>Polar protic solvent + 3° substrate → SN1/E1\u003c/li>\n          \u003c/ul>\n        "},{"title":"Free Radical Reactions","content":"\n          \u003cp>Important in drug oxidation, antioxidant mechanisms, and polymer chemistry of pharmaceutical excipients.\u003c/p>\n          \u003ch4>Chain Mechanism\u003c/h4>\n          \u003col style=\"font-size:14px;line-height:1.9;padding-left:18px;\">\n            \u003cli>\u003cstrong>Initiation:\u003c/strong> Homolytic bond cleavage → radicals (by UV light, heat, peroxides)\u003c/li>\n            \u003cli>\u003cstrong>Propagation:\u003c/strong> Radical reacts with substrate → new radical formed (chain reaction)\u003c/li>\n            \u003cli>\u003cstrong>Termination:\u003c/strong> Two radicals combine → stable product\u003c/li>\n          \u003c/ol>\n          \u003cdiv class=\"info-box key\">\u003cstrong>Antioxidants in pharmaceutical formulations:\u003c/strong> Ascorbic acid (vitamin C), tocopherol (vitamin E), BHA, BHT are added to prevent radical-mediated drug/excipient oxidation. They donate H• to reactive radicals → terminate chain reaction → protect drug stability.\u003c/div>\n        "}],"keyTerms":[{"term":"SN2","def":"Bimolecular nucleophilic substitution; one-step, backside attack; inversion of configuration; favored at 1° carbon."},{"term":"SN1","def":"Unimolecular nucleophilic substitution; carbocation intermediate; racemization; favored at 3° carbon."},{"term":"Leaving group","def":"Group that departs with bonding electrons in substitution reactions; best LGs are stable anions (I⁻, Br⁻, Cl⁻, TsO⁻)."},{"term":"Zaitsev's rule","def":"Elimination gives the more substituted (more stable) alkene as the major product."},{"term":"Walden inversion","def":"Inversion of stereochemistry at the carbon center during SN2 reaction (like umbrella flipping)."}]},"spectroscopy":{"tag":"Chapter 8 · Organic Chem","title":"Introduction to Spectroscopy","overview":"Spectroscopy is how chemists identify and characterize organic compounds — essential for drug quality control and structure elucidation.","sections":[{"title":"IR Spectroscopy","content":"\n          \u003cp>Infrared spectroscopy identifies functional groups by measuring molecular vibrations at characteristic frequencies.\u003c/p>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Functional Group\u003c/th>\u003cth>IR Absorption (cm⁻¹)\u003c/th>\u003cth>Characteristic\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>O-H (alcohol)\u003c/td>\u003ctd>3200–3550\u003c/td>\u003ctd>Broad, strong\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>N-H (amine/amide)\u003c/td>\u003ctd>3300–3500\u003c/td>\u003ctd>Medium, may be sharp or broad\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>C-H\u003c/td>\u003ctd>2850–3000\u003c/td>\u003ctd>Medium\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>C=O (carbonyl)\u003c/td>\u003ctd>1630–1850\u003c/td>\u003ctd>Strong, sharp (very diagnostic)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>C=C (alkene)\u003c/td>\u003ctd>1620–1680\u003c/td>\u003ctd>Variable\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>C≡N, C≡C\u003c/td>\u003ctd>2100–2260\u003c/td>\u003ctd>Sharp (diagnostic)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>C-O (ether/ester)\u003c/td>\u003ctd>1000–1300\u003c/td>\u003ctd>Strong\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>Diagnostic region:\u003c/strong> 1600–1850 cm⁻¹ (carbonyl stretch) and 2500–3300 cm⁻¹ (O-H, N-H, C-H) are the most diagnostic. Carboxylic acids show very broad O-H stretch 2500–3300 cm⁻¹.\u003c/div>\n        "},{"title":"¹H NMR Spectroscopy","content":"\n          \u003cp>Nuclear Magnetic Resonance spectroscopy reveals hydrogen environments in a molecule. Most powerful tool for structure determination.\u003c/p>\n          \u003ch4>Key Parameters\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Chemical shift (δ, ppm):\u003c/strong> Position of signal; reflects electron density. More electron-poor H → higher δ (downfield)\u003c/li>\n            \u003cli>\u003cstrong>Integration:\u003c/strong> Ratio of signal areas = ratio of protons in each environment\u003c/li>\n            \u003cli>\u003cstrong>Multiplicity (splitting):\u003c/strong> Signal is split into n+1 peaks by n equivalent neighboring H atoms (n+1 rule)\u003c/li>\n            \u003cli>\u003cstrong>Coupling constant (J):\u003c/strong> Distance between lines in multiplet; consistent for interacting protons\u003c/li>\n          \u003c/ul>\n          \u003ch4>Typical Chemical Shifts\u003c/h4>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Proton Type\u003c/th>\u003cth>δ (ppm)\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>TMS reference\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Alkane (R-CH₃, R-CH₂-)\u003c/td>\u003ctd>0.5–2.0\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Adjacent to C=O (α-carbonyl)\u003c/td>\u003ctd>2.0–2.5\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Alkene (=CH)\u003c/td>\u003ctd>4.5–6.5\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Aromatic (Ar-H)\u003c/td>\u003ctd>6.5–8.5\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Aldehyde (CHO)\u003c/td>\u003ctd>9.0–10.0\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Carboxylic acid (COOH)\u003c/td>\u003ctd>10–12\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "}],"keyTerms":[{"term":"Chemical shift (δ)","def":"NMR peak position in ppm; indicates electronic environment of nucleus."},{"term":"Multiplicity","def":"Splitting of NMR signal by adjacent protons; n+1 rule: split into n+1 lines by n equivalent neighbors."},{"term":"IR fingerprint region","def":"600–1500 cm⁻¹ region unique to each molecule; used to confirm identity by matching reference spectrum."},{"term":"Chromophore","def":"Part of molecule responsible for UV-Vis absorption; conjugated systems absorb at higher wavelength (longer λ)."},{"term":"Mass spectrometry (MS)","def":"Measures mass-to-charge ratio (m/z); molecular ion peak (M⁺) gives molecular mass."}]}},"pq":[{"id":"oc-1","topic":"Nomenclature","question":"What is the functional group present in aspirin (acetylsalicylic acid) that is hydrolyzed in vivo?","options":["Amide","Ether","Ester","Ketone"],"answer":2,"explanation":"Aspirin contains an ester bond (formed between the carboxylic acid of acetic acid and the hydroxyl group of salicylic acid). Esterases in plasma, gut, and liver hydrolyze this ester → salicylate (active) + acetate. Aspirin itself also irreversibly acetylates COX enzymes."},{"id":"oc-2","topic":"Nomenclature","question":"Paracetamol (acetaminophen) contains which functional group adjacent to the benzene ring?","options":["Ester","Amide (-CONH-)","Carboxylic acid","Aldehyde"],"answer":1,"explanation":"Paracetamol is 4-acetamidophenol. It contains an amide bond (-NH-CO-CH₃). The amide makes it more stable than aspirin's ester toward hydrolysis. Paracetamol is metabolized by CYP2E1 and CYP3A4 to NAPQI (toxic) → glutathione conjugation (normal); overdose depletes glutathione → hepatotoxicity."},{"id":"oc-3","topic":"Nomenclature","question":"Ethynyl estradiol (EE) in oral contraceptives contains which functional group that prevents first-pass hepatic metabolism?","options":["Ketone at C17","Ethynyl group (C≡C-H) at C17","Ester bond","Methyl at C10"],"answer":1,"explanation":"A C≡C (ethynyl) group at the C17 position of estradiol prevents oxidative metabolism by CYP3A4 in the liver → high oral bioavailability of EE compared to natural estradiol (which is rapidly metabolized). This steric bulk at C17 prevents the enzyme from accessing the C17 position."},{"id":"oc-4","topic":"Alkenes","question":"Which of the following obeys Markovnikov's rule?","options":["HBr addition to symmetrical alkene","Hydrogenation of alkene","Addition of HBr to propene → 2-bromopropane (major product)","Halogenation of benzene"],"answer":2,"explanation":"Markovnikov's rule: H adds to carbon with MORE H atoms. In propene (CH₂=CH-CH₃), propene's left carbon (CH₂=) has more H's. So H adds to CH₂ and Br adds to CH → 2-bromopropane (the more substituted carbon gets the halide). 1-bromopropane is the anti-Markovnikov product."},{"id":"oc-5","topic":"Alkanes","question":"Which chair conformation of cyclohexane is most stable?","options":["With large groups in axial positions","With large groups in equatorial positions","Boat conformation","Envelope conformation"],"answer":1,"explanation":"Equatorial positions in the chair conformation have less steric strain — large substituents in axial positions experience 1,3-diaxial interactions with other axial H atoms. Therefore, large groups preferentially occupy equatorial positions to minimize strain. This principle applies to steroid ring conformations in pharmacology."},{"id":"oc-6","topic":"Alkenes","question":"Br₂ added to an alkene under dark conditions undergoes which type of reaction?","options":["Free radical halogenation","Electrophilic addition (anti addition)","EAS","SN2 substitution"],"answer":1,"explanation":"Bromine (Br₂) adds to alkenes by electrophilic addition via a bromonium ion intermediate. Br⁻ attacks from the opposite face → anti addition (trans product). In DARK: electrophilic addition. In LIGHT or radical initiator: free radical mechanism gives ANTI-Markovnikov product."},{"id":"oc-7","topic":"Stereochemistry","question":"Thalidomide was administered as a racemate. The (R)-enantiomer had therapeutic effects. The (S)-enantiomer caused teratogenicity. Even when given as pure (R), it caused birth defects. This is because:","options":["(R) converted to (S) by the body (racemization in vivo)","(R)-thalidomide directly caused the teratogenicity","The (S) contaminated the (R) during manufacturing","Enantiomers have identical biological effects"],"answer":0,"explanation":"Thalidomide undergoes in vivo racemization — the (R) enantiomer spontaneously converts to (S) in physiological pH → even pure (R) eventually produces (S) → teratogenicity. This case established the need for chiral characterization of drugs and drove the \"chiral switch\" movement toward enantiopure drugs."},{"id":"oc-8","topic":"Stereochemistry","question":"A compound with 3 chiral centers (no meso form possible) has how many maximum stereoisomers?","options":["3","4","6","8"],"answer":3,"explanation":"Maximum stereoisomers = 2ⁿ where n = number of chiral centers. 2³ = 8 stereoisomers maximum (4 pairs of enantiomers = 4 pairs of diastereomers). Meso forms reduce this number, but none are possible here."},{"id":"oc-9","topic":"Stereochemistry","question":"A compound with an R configuration at the chiral center reacts by SN2. The product configuration is:","options":["R (retained)","S (inverted)","Mixture of R and S (racemized)","Neither R nor S"],"answer":1,"explanation":"SN2 proceeds via backside attack → Walden inversion → complete inversion of configuration at the stereocenter. R → S (or S → R). This stereospecific inversion is a defining feature of SN2 and is used to confirm mechanism."},{"id":"oc-10","topic":"Stereochemistry","question":"Ephedrine and pseudoephedrine are:","options":["Enantiomers — mirror images","Diastereomers — not mirror images, have two chiral centers","Constitutional isomers","Resonance structures"],"answer":1,"explanation":"Ephedrine and pseudoephedrine each have 2 chiral centers (at C1 and C2). Ephedrine is (1R,2S) and (1S,2R) enantiomers; pseudoephedrine is (1R,2R) and (1S,2S). Ephedrine and pseudoephedrine are diastereomers — they have different physical properties, different melting points, different biological activities (pseudoephedrine: decongestant; ephedrine: bronchodilator/vasopressor)."},{"id":"oc-11","topic":"Aromatic","question":"According to Hückel's Rule, which compound is aromatic?","options":["Cyclobutadiene (4 π electrons)","Cyclopentadienyl anion (6 π electrons)","Cyclohexadiene (4 π electrons)","Cyclooctatetraene (8 π electrons)"],"answer":1,"explanation":"Hückel's rule: 4n+2 π electrons. Cyclopentadienyl anion (C₅H₅⁻) has 6 π electrons (n=1, 4×1+2=6) → aromatic. Cyclobutadiene: 4 π electrons (4n with n=1 → antiaromatic). Cyclooctatetraene: 8 π electrons (4n with n=2 → antiaromatic; actually exists as tub shape, not planar). "},{"id":"oc-12","topic":"Aromatic","question":"The -OH group on phenol (hydroxybenzene) is an ortho/para director. When phenol reacts with Br₂, where does bromination preferentially occur?","options":["Meta position only","Ortho and para positions","Random positions","Does not react without Lewis acid"],"answer":1,"explanation":"-OH is an ortho/para director (strong activator) — it donates electron density to ortho and para positions via resonance → these positions are more nucleophilic → electrophile (Br+) attacks preferentially at ortho and para. Phenol is SO reactive that bromination occurs without a Lewis acid catalyst (three positions substituted simultaneously in excess Br₂)."},{"id":"oc-13","topic":"Aromatic","question":"Imidazole is a 5-membered heterocyclic ring with two nitrogen atoms. It is found in the side chain of:","options":["Serine","Lysine","Histidine","Arginine"],"answer":2,"explanation":"Histidine has an imidazole side chain (pKa ~6.0). This makes histidine uniquely suited for enzyme catalysis at physiological pH — it can act as either a proton donor or acceptor. Found at active sites of serine proteases (trypsin, chymotrypsin), carbonic anhydrase, hemoglobin. Proton shuttle in acid-base catalysis."},{"id":"oc-14","topic":"Carbonyl","question":"Enalapril is an ester prodrug that is hydrolyzed in vivo to enalaprilat (active ACE inhibitor). Which enzyme carries out this conversion?","options":["CYP450 (cytochrome P450)","Plasma and hepatic esterases","UGT (glucuronosyltransferase)","MAO (monoamine oxidase)"],"answer":1,"explanation":"Enalapril is an ethyl ester of enalaprilat. Esterases in plasma and liver hydrolyze the ester bond → enalaprilat (active diacid). Enalapril is used because enalaprilat has poor oral bioavailability (very polar). This is a classic prodrug strategy: esterification improves lipophilicity → better absorption → hydrolysis in vivo → active drug."},{"id":"oc-15","topic":"Carbonyl","question":"Disulfiram (Antabuse) treats alcoholism by inhibiting which enzyme?","options":["Alcohol dehydrogenase","Aldehyde dehydrogenase (ALDH)","CYP2E1","MAO-A"],"answer":1,"explanation":"Alcohol metabolism: Ethanol → Acetaldehyde (by alcohol dehydrogenase, ADH) → Acetic acid (by aldehyde dehydrogenase, ALDH). Disulfiram inhibits ALDH → acetaldehyde accumulates → flushing, nausea, vomiting, hypotension (the \"acetaldehyde reaction\" / \"disulfiram reaction\"). This aversion makes drinking unpleasant → abstinence."},{"id":"oc-16","topic":"Carbonyl","question":"The most stable/least reactive carbonyl derivative (hardest to hydrolyze) is:","options":["Acid chloride (R-COCl)","Anhydride (R-CO-O-CO-R)","Ester (R-COO-R)","Amide (R-CONH₂)"],"answer":3,"explanation":"Amides are the most stable carbonyl derivatives. The nitrogen lone pair participates in resonance with the carbonyl → partial double bond character → C-N bond is shorter and stronger than expected → rotation restricted → amide is less electrophilic → slowest to hydrolyze. Stability order: Amide > Ester > Anhydride > Acid chloride (most reactive)."},{"id":"oc-17","topic":"Amines","question":"Why do quaternary ammonium neuromuscular blockers (succinylcholine, vecuronium) NOT cross the blood-brain barrier?","options":["They are too large","They are always positively charged → cannot passively cross lipid bilayers","They are rapidly metabolized before reaching the brain","The BBB has specific efflux pumps for them"],"answer":1,"explanation":"Quaternary ammonium compounds have a permanent positive charge (R₄N⁺) — they cannot be neutral under any physiological conditions. Since passive membrane diffusion requires neutral (uncharged) species, they cannot cross lipid bilayers including the blood-brain barrier. This is why these neuromuscular blockers don't cause CNS effects — they only act at the peripheral neuromuscular junction."},{"id":"oc-18","topic":"Amines","question":"Local anesthetics work LESS effectively in infected (acidic) tissue. Why?","options":["Infection inhibits the drug from binding sodium channels","Acidic pH → more drug ionized (BH⁺) → less neutral form available to cross nerve membrane","Infection increases blood flow, washing drug away","Acidic pH denatures local anesthetics"],"answer":1,"explanation":"Local anesthetics (e.g., lidocaine, pKa ~7.8) must cross the nerve membrane in neutral (B) form, then ionize inside the nerve (at slightly acidic intracellular pH) to block Na⁺ channels. In infected tissue (pH ~6–7 vs normal 7.4): H-H equation → more drug is in the ionized (BH⁺) form → less neutral form to cross membrane → reduced efficacy. Clinical implication: higher doses or different anesthetic strategy needed for abscesses."},{"id":"oc-19","topic":"Amines","question":"Histidine has a pKa of ~6. At blood pH 7.4, histidine side chains are primarily:","options":["Protonated (positively charged, ~20% overall)","Deprotonated (neutral, ~96%)","Fully protonated","Fully deprotonated"],"answer":1,"explanation":"Using H-H: pH = pKa + log([A]/[HA]) → 7.4 = 6.0 + log(ratio) → log(ratio) = 1.4 → [neutral]/[protonated] ≈ 25:1. So ~96% neutral (imidazole), ~4% protonated (imidazolium). This partial protonation at physiological pH makes histidine a good buffer and proton shuttle in enzyme active sites."},{"id":"oc-20","topic":"Mechanisms","question":"SN2 reactions are favored at primary carbons rather than tertiary. Why?","options":["Primary carbons have more electrons","Tertiary carbons are too sterically hindered for backside attack","Tertiary carbons are more stable as cations","Primary carbons form better leaving groups"],"answer":1,"explanation":"SN2 requires the nucleophile to attack from the back of the C-leaving group bond (backside attack). Tertiary carbons have 3 bulky alkyl groups surrounding the carbon → severe steric hindrance → nucleophile cannot approach → no SN2. Tertiary carbons instead undergo SN1 or E2."},{"id":"oc-21","topic":"Mechanisms","question":"Which solvent promotes SN1 reactions?","options":["Acetone (polar aprotic)","DMSO (polar aprotic)","Water (polar protic)","Hexane (nonpolar)"],"answer":2,"explanation":"SN1 requires formation of a carbocation intermediate. Polar protic solvents (water, alcohols) stabilize the carbocation by solvation (hydrogen bonding with the cation). They also stabilize the leaving group anion. Polar aprotic solvents (DMSO, acetone) favor SN2 by leaving anions unsolvated and reactive."},{"id":"oc-22","topic":"Mechanisms","question":"In E2 elimination, the dihedral angle between H and leaving group must be:","options":["0° (syn-periplanar)","60° (gauche)","90° (perpendicular)","180° (anti-periplanar)"],"answer":3,"explanation":"E2 requires anti-periplanar arrangement — H and leaving group must be 180° to each other (both in the same plane, on opposite sides). This allows concerted, one-step elimination with simultaneous removal of H and departure of LG, forming the alkene. Anti-periplanar arrangement gives the best orbital overlap between the C-H and C-LG σ* orbitals."},{"id":"oc-23","topic":"Spectroscopy","question":"An IR spectrum shows a broad absorption at 3200–3550 cm⁻¹ and a sharp absorption at 1720 cm⁻¹. What functional groups are present?","options":["Alkene and aldehyde","Alcohol (-OH) and carbonyl (C=O)","Amine and ketone","Carboxylic acid only"],"answer":1,"explanation":"3200–3550 cm⁻¹ broad = O-H stretch (alcohol or carboxylic acid). 1720 cm⁻¹ = C=O stretch (ester ~1735, ketone ~1715, carboxylic acid ~1710–1725). Carboxylic acid O-H is much broader (2500–3300 cm⁻¹). The sharp O-H at 3200–3550 suggests alcohol, with the 1720 cm⁻¹ indicating a separate C=O (ketone or ester). Could be a hydroxy-ketone."},{"id":"oc-24","topic":"Spectroscopy","question":"In ¹H NMR, a signal at δ 7.2 ppm with 5H integration suggests:","options":["Five equivalent methyl groups","A monosubstituted benzene ring (phenyl group)","Five aldehyde protons","An OH proton at high concentration"],"answer":1,"explanation":"δ 6.5–8.5 ppm is the aromatic region. A signal at ~7.2 ppm integrating for 5H is characteristic of a monosubstituted benzene ring (phenyl group, C₆H₅-). All 5 aromatic protons appear as a cluster around 7.2 ppm. This pattern is very diagnostic."},{"id":"oc-25","topic":"Spectroscopy","question":"A ¹H NMR signal appears as a triplet (t). This means the proton has how many equivalent neighboring protons?","options":["0 (singlet)","1 (doublet)","2 (triplet)","3 (quartet)"],"answer":2,"explanation":"The n+1 rule: a proton with n equivalent neighbors gives n+1 lines. Triplet = 3 lines → n+1 = 3 → n = 2 neighboring protons. Example: CH₃-CH₂- (methylene between methyl and another group); the CH₂ appears as quartet (4 lines from 3 CH₃ neighbors), and CH₃ appears as triplet (3 lines from 2 CH₂ neighbors)."},{"id":"oc-26","topic":"Mechanisms","question":"Aspirin irreversibly inhibits COX enzymes by:","options":["Hydrogen bonding to the COX active site","Acetylating a serine residue in the COX active site (covalent bond)","Competitive inhibition at the arachidonic acid binding site","Chelating the heme iron of COX"],"answer":1,"explanation":"Aspirin is unique among NSAIDs because it COVALENTLY and IRREVERSIBLY acetylates Ser530 (COX-1) and Ser516 (COX-2) via nucleophilic acyl substitution — the serine hydroxyl acts as nucleophile attacking aspirin's ester carbonyl → acetylation. This irreversible inhibition means COX function is permanently blocked until new enzyme is synthesized (platelet lifespan ~7–10 days, explains aspirin's antiplatelet duration)."},{"id":"oc-27","topic":"Stereochemistry","question":"Ibuprofen is sold as a racemate. The active enantiomer is (S)-ibuprofen. Despite this, the racemate is clinically equivalent to the (S) form because:","options":["Both enantiomers are equally active as COX inhibitors","The (R) enantiomer is converted to (S) by isomerase enzymes in the body","(R)-ibuprofen has useful analgesic activity independent of COX inhibition","The racemate is 2× more potent than either single enantiomer"],"answer":1,"explanation":"Ibuprofen undergoes chiral inversion in vivo — (R)-ibuprofen is converted to (S)-ibuprofen by an isomerase (α-methylacyl-CoA racemase). This metabolic conversion means the racemate is therapeutically equivalent to pure (S)-ibuprofen. Dexibuprofen (S form) is available but offers no clear clinical advantage over racemate."},{"id":"oc-28","topic":"Nomenclature","question":"A drug has both a carboxylic acid group and an amine group. At physiological pH 7.4, this drug would most likely exist as:","options":["Cationic form (protonated amine, neutral acid)","Anionic form (neutral amine, ionized acid)","Zwitterion (protonated amine, ionized acid)","Neutral (un-ionized amine and acid)"],"answer":2,"explanation":"Amino acids and aminocarboxylic acid drugs are amphoteric. At pH 7.4: carboxylic acid (pKa ~4–5) is DEPROTONATED (ionized, -COO⁻), and amine (pKa ~9–10) is PROTONATED (ionized, -NH₃⁺). The molecule carries both charges = zwitterion. This is key to understanding zwitter-ionic drug distribution and formulation."},{"id":"oc-29","topic":"Alkenes","question":"Squalene (a linear triterpenoid) is converted to lanosterol (the first steroid) in cholesterol biosynthesis via an epoxide intermediate. Squalene contains mainly which type of bonds?","options":["C≡C triple bonds","C=C double bonds (six of them, a polyene)","C-C single bonds only","Aromatic rings"],"answer":1,"explanation":"Squalene (C₃₀H₅₀) is a linear polyene with six C=C double bonds (three E, three E/Z). Squalene epoxidase forms squalene-2,3-epoxide (the pharmacological target of terbinafine, which inhibits squalene epoxidase in fungi). In cholesterol biosynthesis, this epoxide undergoes cyclization to lanosterol → cholesterol. Statins target a later step (HMG-CoA reductase)."},{"id":"oc-30","topic":"Aromatic","question":"Why do sulfonamide antibiotics inhibit bacterial but not human folate synthesis?","options":["Bacteria are smaller so the drug enters them more easily","Bacteria synthesize their own folate from PABA (sulfonamides compete); humans obtain folate from diet and have transporters for pre-formed folate","Sulfonamides are too large to enter human cells","Human DHPS has a different pH optimum"],"answer":1,"explanation":"Bacteria must synthesize dihydrofolate from para-aminobenzoic acid (PABA) using dihydropteroate synthase (DHPS). Sulfonamides are structural analogs of PABA → competitive inhibition of DHPS → no folate → no nucleotide synthesis → bacteriostatic. Human cells cannot synthesize folate; they rely on dietary folate via specific transporters → no DHPS → sulfonamides have no direct effect on human folate metabolism."}],"eq":[{"id":"oc-1","topic":"Nomenclature","question":"What is the functional group present in aspirin (acetylsalicylic acid) that is hydrolyzed in vivo?","options":["Amide","Ether","Ester","Ketone"],"answer":2,"explanation":"Aspirin contains an ester bond (formed between the carboxylic acid of acetic acid and the hydroxyl group of salicylic acid). Esterases in plasma, gut, and liver hydrolyze this ester → salicylate (active) + acetate. Aspirin itself also irreversibly acetylates COX enzymes."},{"id":"oc-2","topic":"Nomenclature","question":"Paracetamol (acetaminophen) contains which functional group adjacent to the benzene ring?","options":["Ester","Amide (-CONH-)","Carboxylic acid","Aldehyde"],"answer":1,"explanation":"Paracetamol is 4-acetamidophenol. It contains an amide bond (-NH-CO-CH₃). The amide makes it more stable than aspirin's ester toward hydrolysis. Paracetamol is metabolized by CYP2E1 and CYP3A4 to NAPQI (toxic) → glutathione conjugation (normal); overdose depletes glutathione → hepatotoxicity."},{"id":"oc-3","topic":"Nomenclature","question":"Ethynyl estradiol (EE) in oral contraceptives contains which functional group that prevents first-pass hepatic metabolism?","options":["Ketone at C17","Ethynyl group (C≡C-H) at C17","Ester bond","Methyl at C10"],"answer":1,"explanation":"A C≡C (ethynyl) group at the C17 position of estradiol prevents oxidative metabolism by CYP3A4 in the liver → high oral bioavailability of EE compared to natural estradiol (which is rapidly metabolized). This steric bulk at C17 prevents the enzyme from accessing the C17 position."},{"id":"oc-4","topic":"Alkenes","question":"Which of the following obeys Markovnikov's rule?","options":["HBr addition to symmetrical alkene","Hydrogenation of alkene","Addition of HBr to propene → 2-bromopropane (major product)","Halogenation of benzene"],"answer":2,"explanation":"Markovnikov's rule: H adds to carbon with MORE H atoms. In propene (CH₂=CH-CH₃), propene's left carbon (CH₂=) has more H's. So H adds to CH₂ and Br adds to CH → 2-bromopropane (the more substituted carbon gets the halide). 1-bromopropane is the anti-Markovnikov product."},{"id":"oc-5","topic":"Alkanes","question":"Which chair conformation of cyclohexane is most stable?","options":["With large groups in axial positions","With large groups in equatorial positions","Boat conformation","Envelope conformation"],"answer":1,"explanation":"Equatorial positions in the chair conformation have less steric strain — large substituents in axial positions experience 1,3-diaxial interactions with other axial H atoms. Therefore, large groups preferentially occupy equatorial positions to minimize strain. This principle applies to steroid ring conformations in pharmacology."},{"id":"oc-6","topic":"Alkenes","question":"Br₂ added to an alkene under dark conditions undergoes which type of reaction?","options":["Free radical halogenation","Electrophilic addition (anti addition)","EAS","SN2 substitution"],"answer":1,"explanation":"Bromine (Br₂) adds to alkenes by electrophilic addition via a bromonium ion intermediate. Br⁻ attacks from the opposite face → anti addition (trans product). In DARK: electrophilic addition. In LIGHT or radical initiator: free radical mechanism gives ANTI-Markovnikov product."},{"id":"oc-7","topic":"Stereochemistry","question":"Thalidomide was administered as a racemate. The (R)-enantiomer had therapeutic effects. The (S)-enantiomer caused teratogenicity. Even when given as pure (R), it caused birth defects. This is because:","options":["(R) converted to (S) by the body (racemization in vivo)","(R)-thalidomide directly caused the teratogenicity","The (S) contaminated the (R) during manufacturing","Enantiomers have identical biological effects"],"answer":0,"explanation":"Thalidomide undergoes in vivo racemization — the (R) enantiomer spontaneously converts to (S) in physiological pH → even pure (R) eventually produces (S) → teratogenicity. This case established the need for chiral characterization of drugs and drove the \"chiral switch\" movement toward enantiopure drugs."},{"id":"oc-8","topic":"Stereochemistry","question":"A compound with 3 chiral centers (no meso form possible) has how many maximum stereoisomers?","options":["3","4","6","8"],"answer":3,"explanation":"Maximum stereoisomers = 2ⁿ where n = number of chiral centers. 2³ = 8 stereoisomers maximum (4 pairs of enantiomers = 4 pairs of diastereomers). Meso forms reduce this number, but none are possible here."},{"id":"oc-9","topic":"Stereochemistry","question":"A compound with an R configuration at the chiral center reacts by SN2. The product configuration is:","options":["R (retained)","S (inverted)","Mixture of R and S (racemized)","Neither R nor S"],"answer":1,"explanation":"SN2 proceeds via backside attack → Walden inversion → complete inversion of configuration at the stereocenter. R → S (or S → R). This stereospecific inversion is a defining feature of SN2 and is used to confirm mechanism."},{"id":"oc-10","topic":"Stereochemistry","question":"Ephedrine and pseudoephedrine are:","options":["Enantiomers — mirror images","Diastereomers — not mirror images, have two chiral centers","Constitutional isomers","Resonance structures"],"answer":1,"explanation":"Ephedrine and pseudoephedrine each have 2 chiral centers (at C1 and C2). Ephedrine is (1R,2S) and (1S,2R) enantiomers; pseudoephedrine is (1R,2R) and (1S,2S). Ephedrine and pseudoephedrine are diastereomers — they have different physical properties, different melting points, different biological activities (pseudoephedrine: decongestant; ephedrine: bronchodilator/vasopressor)."},{"id":"oc-11","topic":"Aromatic","question":"According to Hückel's Rule, which compound is aromatic?","options":["Cyclobutadiene (4 π electrons)","Cyclopentadienyl anion (6 π electrons)","Cyclohexadiene (4 π electrons)","Cyclooctatetraene (8 π electrons)"],"answer":1,"explanation":"Hückel's rule: 4n+2 π electrons. Cyclopentadienyl anion (C₅H₅⁻) has 6 π electrons (n=1, 4×1+2=6) → aromatic. Cyclobutadiene: 4 π electrons (4n with n=1 → antiaromatic). Cyclooctatetraene: 8 π electrons (4n with n=2 → antiaromatic; actually exists as tub shape, not planar). "},{"id":"oc-12","topic":"Aromatic","question":"The -OH group on phenol (hydroxybenzene) is an ortho/para director. When phenol reacts with Br₂, where does bromination preferentially occur?","options":["Meta position only","Ortho and para positions","Random positions","Does not react without Lewis acid"],"answer":1,"explanation":"-OH is an ortho/para director (strong activator) — it donates electron density to ortho and para positions via resonance → these positions are more nucleophilic → electrophile (Br+) attacks preferentially at ortho and para. Phenol is SO reactive that bromination occurs without a Lewis acid catalyst (three positions substituted simultaneously in excess Br₂)."},{"id":"oc-13","topic":"Aromatic","question":"Imidazole is a 5-membered heterocyclic ring with two nitrogen atoms. It is found in the side chain of:","options":["Serine","Lysine","Histidine","Arginine"],"answer":2,"explanation":"Histidine has an imidazole side chain (pKa ~6.0). This makes histidine uniquely suited for enzyme catalysis at physiological pH — it can act as either a proton donor or acceptor. Found at active sites of serine proteases (trypsin, chymotrypsin), carbonic anhydrase, hemoglobin. Proton shuttle in acid-base catalysis."},{"id":"oc-14","topic":"Carbonyl","question":"Enalapril is an ester prodrug that is hydrolyzed in vivo to enalaprilat (active ACE inhibitor). Which enzyme carries out this conversion?","options":["CYP450 (cytochrome P450)","Plasma and hepatic esterases","UGT (glucuronosyltransferase)","MAO (monoamine oxidase)"],"answer":1,"explanation":"Enalapril is an ethyl ester of enalaprilat. Esterases in plasma and liver hydrolyze the ester bond → enalaprilat (active diacid). Enalapril is used because enalaprilat has poor oral bioavailability (very polar). This is a classic prodrug strategy: esterification improves lipophilicity → better absorption → hydrolysis in vivo → active drug."},{"id":"oc-15","topic":"Carbonyl","question":"Disulfiram (Antabuse) treats alcoholism by inhibiting which enzyme?","options":["Alcohol dehydrogenase","Aldehyde dehydrogenase (ALDH)","CYP2E1","MAO-A"],"answer":1,"explanation":"Alcohol metabolism: Ethanol → Acetaldehyde (by alcohol dehydrogenase, ADH) → Acetic acid (by aldehyde dehydrogenase, ALDH). Disulfiram inhibits ALDH → acetaldehyde accumulates → flushing, nausea, vomiting, hypotension (the \"acetaldehyde reaction\" / \"disulfiram reaction\"). This aversion makes drinking unpleasant → abstinence."},{"id":"oc-16","topic":"Carbonyl","question":"The most stable/least reactive carbonyl derivative (hardest to hydrolyze) is:","options":["Acid chloride (R-COCl)","Anhydride (R-CO-O-CO-R)","Ester (R-COO-R)","Amide (R-CONH₂)"],"answer":3,"explanation":"Amides are the most stable carbonyl derivatives. The nitrogen lone pair participates in resonance with the carbonyl → partial double bond character → C-N bond is shorter and stronger than expected → rotation restricted → amide is less electrophilic → slowest to hydrolyze. Stability order: Amide > Ester > Anhydride > Acid chloride (most reactive)."},{"id":"oc-17","topic":"Amines","question":"Why do quaternary ammonium neuromuscular blockers (succinylcholine, vecuronium) NOT cross the blood-brain barrier?","options":["They are too large","They are always positively charged → cannot passively cross lipid bilayers","They are rapidly metabolized before reaching the brain","The BBB has specific efflux pumps for them"],"answer":1,"explanation":"Quaternary ammonium compounds have a permanent positive charge (R₄N⁺) — they cannot be neutral under any physiological conditions. Since passive membrane diffusion requires neutral (uncharged) species, they cannot cross lipid bilayers including the blood-brain barrier. This is why these neuromuscular blockers don't cause CNS effects — they only act at the peripheral neuromuscular junction."},{"id":"oc-18","topic":"Amines","question":"Local anesthetics work LESS effectively in infected (acidic) tissue. Why?","options":["Infection inhibits the drug from binding sodium channels","Acidic pH → more drug ionized (BH⁺) → less neutral form available to cross nerve membrane","Infection increases blood flow, washing drug away","Acidic pH denatures local anesthetics"],"answer":1,"explanation":"Local anesthetics (e.g., lidocaine, pKa ~7.8) must cross the nerve membrane in neutral (B) form, then ionize inside the nerve (at slightly acidic intracellular pH) to block Na⁺ channels. In infected tissue (pH ~6–7 vs normal 7.4): H-H equation → more drug is in the ionized (BH⁺) form → less neutral form to cross membrane → reduced efficacy. Clinical implication: higher doses or different anesthetic strategy needed for abscesses."},{"id":"oc-19","topic":"Amines","question":"Histidine has a pKa of ~6. At blood pH 7.4, histidine side chains are primarily:","options":["Protonated (positively charged, ~20% overall)","Deprotonated (neutral, ~96%)","Fully protonated","Fully deprotonated"],"answer":1,"explanation":"Using H-H: pH = pKa + log([A]/[HA]) → 7.4 = 6.0 + log(ratio) → log(ratio) = 1.4 → [neutral]/[protonated] ≈ 25:1. So ~96% neutral (imidazole), ~4% protonated (imidazolium). This partial protonation at physiological pH makes histidine a good buffer and proton shuttle in enzyme active sites."},{"id":"oc-20","topic":"Mechanisms","question":"SN2 reactions are favored at primary carbons rather than tertiary. Why?","options":["Primary carbons have more electrons","Tertiary carbons are too sterically hindered for backside attack","Tertiary carbons are more stable as cations","Primary carbons form better leaving groups"],"answer":1,"explanation":"SN2 requires the nucleophile to attack from the back of the C-leaving group bond (backside attack). Tertiary carbons have 3 bulky alkyl groups surrounding the carbon → severe steric hindrance → nucleophile cannot approach → no SN2. Tertiary carbons instead undergo SN1 or E2."},{"id":"oc-21","topic":"Mechanisms","question":"Which solvent promotes SN1 reactions?","options":["Acetone (polar aprotic)","DMSO (polar aprotic)","Water (polar protic)","Hexane (nonpolar)"],"answer":2,"explanation":"SN1 requires formation of a carbocation intermediate. Polar protic solvents (water, alcohols) stabilize the carbocation by solvation (hydrogen bonding with the cation). They also stabilize the leaving group anion. Polar aprotic solvents (DMSO, acetone) favor SN2 by leaving anions unsolvated and reactive."},{"id":"oc-22","topic":"Mechanisms","question":"In E2 elimination, the dihedral angle between H and leaving group must be:","options":["0° (syn-periplanar)","60° (gauche)","90° (perpendicular)","180° (anti-periplanar)"],"answer":3,"explanation":"E2 requires anti-periplanar arrangement — H and leaving group must be 180° to each other (both in the same plane, on opposite sides). This allows concerted, one-step elimination with simultaneous removal of H and departure of LG, forming the alkene. Anti-periplanar arrangement gives the best orbital overlap between the C-H and C-LG σ* orbitals."},{"id":"oc-23","topic":"Spectroscopy","question":"An IR spectrum shows a broad absorption at 3200–3550 cm⁻¹ and a sharp absorption at 1720 cm⁻¹. What functional groups are present?","options":["Alkene and aldehyde","Alcohol (-OH) and carbonyl (C=O)","Amine and ketone","Carboxylic acid only"],"answer":1,"explanation":"3200–3550 cm⁻¹ broad = O-H stretch (alcohol or carboxylic acid). 1720 cm⁻¹ = C=O stretch (ester ~1735, ketone ~1715, carboxylic acid ~1710–1725). Carboxylic acid O-H is much broader (2500–3300 cm⁻¹). The sharp O-H at 3200–3550 suggests alcohol, with the 1720 cm⁻¹ indicating a separate C=O (ketone or ester). Could be a hydroxy-ketone."},{"id":"oc-24","topic":"Spectroscopy","question":"In ¹H NMR, a signal at δ 7.2 ppm with 5H integration suggests:","options":["Five equivalent methyl groups","A monosubstituted benzene ring (phenyl group)","Five aldehyde protons","An OH proton at high concentration"],"answer":1,"explanation":"δ 6.5–8.5 ppm is the aromatic region. A signal at ~7.2 ppm integrating for 5H is characteristic of a monosubstituted benzene ring (phenyl group, C₆H₅-). All 5 aromatic protons appear as a cluster around 7.2 ppm. This pattern is very diagnostic."},{"id":"oc-25","topic":"Spectroscopy","question":"A ¹H NMR signal appears as a triplet (t). This means the proton has how many equivalent neighboring protons?","options":["0 (singlet)","1 (doublet)","2 (triplet)","3 (quartet)"],"answer":2,"explanation":"The n+1 rule: a proton with n equivalent neighbors gives n+1 lines. Triplet = 3 lines → n+1 = 3 → n = 2 neighboring protons. Example: CH₃-CH₂- (methylene between methyl and another group); the CH₂ appears as quartet (4 lines from 3 CH₃ neighbors), and CH₃ appears as triplet (3 lines from 2 CH₂ neighbors)."},{"id":"oc-26","topic":"Mechanisms","question":"Aspirin irreversibly inhibits COX enzymes by:","options":["Hydrogen bonding to the COX active site","Acetylating a serine residue in the COX active site (covalent bond)","Competitive inhibition at the arachidonic acid binding site","Chelating the heme iron of COX"],"answer":1,"explanation":"Aspirin is unique among NSAIDs because it COVALENTLY and IRREVERSIBLY acetylates Ser530 (COX-1) and Ser516 (COX-2) via nucleophilic acyl substitution — the serine hydroxyl acts as nucleophile attacking aspirin's ester carbonyl → acetylation. This irreversible inhibition means COX function is permanently blocked until new enzyme is synthesized (platelet lifespan ~7–10 days, explains aspirin's antiplatelet duration)."},{"id":"oc-27","topic":"Stereochemistry","question":"Ibuprofen is sold as a racemate. The active enantiomer is (S)-ibuprofen. Despite this, the racemate is clinically equivalent to the (S) form because:","options":["Both enantiomers are equally active as COX inhibitors","The (R) enantiomer is converted to (S) by isomerase enzymes in the body","(R)-ibuprofen has useful analgesic activity independent of COX inhibition","The racemate is 2× more potent than either single enantiomer"],"answer":1,"explanation":"Ibuprofen undergoes chiral inversion in vivo — (R)-ibuprofen is converted to (S)-ibuprofen by an isomerase (α-methylacyl-CoA racemase). This metabolic conversion means the racemate is therapeutically equivalent to pure (S)-ibuprofen. Dexibuprofen (S form) is available but offers no clear clinical advantage over racemate."},{"id":"oc-28","topic":"Nomenclature","question":"A drug has both a carboxylic acid group and an amine group. At physiological pH 7.4, this drug would most likely exist as:","options":["Cationic form (protonated amine, neutral acid)","Anionic form (neutral amine, ionized acid)","Zwitterion (protonated amine, ionized acid)","Neutral (un-ionized amine and acid)"],"answer":2,"explanation":"Amino acids and aminocarboxylic acid drugs are amphoteric. At pH 7.4: carboxylic acid (pKa ~4–5) is DEPROTONATED (ionized, -COO⁻), and amine (pKa ~9–10) is PROTONATED (ionized, -NH₃⁺). The molecule carries both charges = zwitterion. This is key to understanding zwitter-ionic drug distribution and formulation."},{"id":"oc-29","topic":"Alkenes","question":"Squalene (a linear triterpenoid) is converted to lanosterol (the first steroid) in cholesterol biosynthesis via an epoxide intermediate. Squalene contains mainly which type of bonds?","options":["C≡C triple bonds","C=C double bonds (six of them, a polyene)","C-C single bonds only","Aromatic rings"],"answer":1,"explanation":"Squalene (C₃₀H₅₀) is a linear polyene with six C=C double bonds (three E, three E/Z). Squalene epoxidase forms squalene-2,3-epoxide (the pharmacological target of terbinafine, which inhibits squalene epoxidase in fungi). In cholesterol biosynthesis, this epoxide undergoes cyclization to lanosterol → cholesterol. Statins target a later step (HMG-CoA reductase)."},{"id":"oc-30","topic":"Aromatic","question":"Why do sulfonamide antibiotics inhibit bacterial but not human folate synthesis?","options":["Bacteria are smaller so the drug enters them more easily","Bacteria synthesize their own folate from PABA (sulfonamides compete); humans obtain folate from diet and have transporters for pre-formed folate","Sulfonamides are too large to enter human cells","Human DHPS has a different pH optimum"],"answer":1,"explanation":"Bacteria must synthesize dihydrofolate from para-aminobenzoic acid (PABA) using dihydropteroate synthase (DHPS). Sulfonamides are structural analogs of PABA → competitive inhibition of DHPS → no folate → no nucleotide synthesis → bacteriostatic. Human cells cannot synthesize folate; they rely on dietary folate via specific transporters → no DHPS → sulfonamides have no direct effect on human folate metabolism."}]},{"meta":{"id":"microbiology","title":"General Microbiology","code":"261111","icon":"🧫","color":"#922b21","credits":"3 credits (3 lecture)","semester":"Semester 1, Year 1","description":"Bacteria, viruses, fungi, and antimicrobials. Essential for understanding infections, antibiotics, and pharmacological mechanisms of anti-infective drugs.","chapters":[{"id":"overview","title":"Overview of Microorganisms"},{"id":"bacteria-structure","title":"Bacterial Structure & Gram Staining"},{"id":"bacterial-growth","title":"Bacterial Growth & Sporulation"},{"id":"viruses","title":"Viruses & Replication"},{"id":"fungi","title":"Fungi & Fungal Diseases"},{"id":"antimicrobials","title":"Antimicrobial Mechanisms & Resistance"},{"id":"sterilization","title":"Sterilization & Disinfection"}]},"chapters":{"overview":{"tag":"Chapter 1 · Microbiology","title":"Overview of Microorganisms","overview":"Microorganisms are ubiquitous — most are harmless or beneficial, while pathogens cause infectious diseases. Classifying microbes guides treatment selection.","sections":[{"title":"Classification of Microorganisms","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Group\u003c/th>\u003cth>Cell Type\u003c/th>\u003cth>Key Features\u003c/th>\u003cth>Examples\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Bacteria\u003c/td>\u003ctd>Prokaryote\u003c/td>\u003ctd>Cell wall (peptidoglycan), 70S ribosomes, no membrane-bound organelles\u003c/td>\u003ctd>E. coli, S. aureus, M. tuberculosis\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Archaea\u003c/td>\u003ctd>Prokaryote\u003c/td>\u003ctd>No peptidoglycan; unique membrane lipids; extreme environments\u003c/td>\u003ctd>Methanogens, halophiles, thermophiles\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Fungi\u003c/td>\u003ctd>Eukaryote\u003c/td>\u003ctd>Ergosterol in membrane (not cholesterol); chitin cell wall\u003c/td>\u003ctd>Candida, Aspergillus, Cryptococcus\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Protozoa\u003c/td>\u003ctd>Eukaryote\u003c/td>\u003ctd>Single-celled; many are motile; intracellular or extracellular\u003c/td>\u003ctd>Plasmodium, Toxoplasma, Giardia\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Helminths (worms)\u003c/td>\u003ctd>Eukaryote\u003c/td>\u003ctd>Multicellular parasites\u003c/td>\u003ctd>Ascaris, Schistosoma, tapeworms\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Viruses\u003c/td>\u003ctd>Acellular\u003c/td>\u003ctd>Not cells; DNA or RNA genome + capsid; require host for replication\u003c/td>\u003ctd>HIV, influenza, SARS-CoV-2, HBV\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Prions\u003c/td>\u003ctd>—\u003c/td>\u003ctd>Misfolded proteins; no nucleic acid\u003c/td>\u003ctd>CJD, kuru, scrapie, BSE (\"mad cow\")\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>Why classification matters for treatment:\u003c/strong> Antibiotics (bacteria targets) ≠ Antivirals ≠ Antifungals ≠ Antiparasitics. Misidentifying the pathogen → wrong drug → treatment failure or toxicity.\u003c/div>\n        "},{"title":"Normal Flora (Microbiota)","content":"\n          \u003cp>The human body carries ~38 trillion bacteria (roughly equal to human cell count). Most are commensal or mutualistic — they do not cause disease in healthy individuals and provide benefits.\u003c/p>\n          \u003ch4>Benefits of Normal Flora\u003c/h4>\n          \u003cul>\n            \u003cli>Competitive exclusion of pathogens\u003c/li>\n            \u003cli>Production of vitamins (K, B₁₂ by gut bacteria)\u003c/li>\n            \u003cli>Stimulation of immune system development\u003c/li>\n            \u003cli>Metabolism of bile acids and xenobiotics\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"info-box warning\">\u003cstrong>Antibiotic disruption:\u003c/strong> Broad-spectrum antibiotics kill normal flora → overgrowth of resistant organisms. Classic example: \u003cem>Clostridioides difficile\u003c/em> (C. diff) colitis after antibiotic use — C. diff spores survive, normal flora are killed, C. diff proliferates → toxin production → pseudomembranous colitis → treated with vancomycin (oral) or fidaxomicin.\u003c/div>\n        "}],"keyTerms":[{"term":"Pathogen","def":"Microorganism capable of causing disease in a host."},{"term":"Commensal","def":"Organism benefiting from host without harming it; normal flora."},{"term":"Virulence","def":"Degree of pathogenicity — how effectively a pathogen causes disease."},{"term":"Normal microbiota (flora)","def":"Microorganisms normally residing in/on the body without causing disease."},{"term":"Opportunistic pathogen","def":"Normally harmless organism that causes disease in immunocompromised hosts."}]},"bacteria-structure":{"tag":"Chapter 2 · Microbiology","title":"Bacterial Structure & Gram Staining","overview":"Bacterial cell structure determines antibiotic targets. The Gram stain is one of the most important diagnostic tools in clinical microbiology, guiding initial empirical antibiotic therapy.","sections":[{"title":"Bacterial Cell Wall — Peptidoglycan","content":"\n          \u003cp>The bacterial cell wall is made of \u003cstrong>peptidoglycan (murein)\u003c/strong> — a polymer of N-acetylglucosamine (NAG) and N-acetylmuramic acid (NAM) cross-linked by peptide chains. This structure provides rigidity, shape, and osmotic protection.\u003c/p>\n          \u003cdiv class=\"info-box key\">\u003cstrong>Penicillin target:\u003c/strong> β-lactam antibiotics (penicillins, cephalosporins, carbapenems) inhibit transpeptidase (penicillin-binding protein, PBP) → prevent cross-linking of peptidoglycan → weak cell wall → osmotic lysis → bactericidal. They are effective ONLY against actively growing bacteria.\u003c/div>\n        "},{"title":"Gram Staining Procedure & Interpretation","content":"\n          \u003cp>The Gram stain differentiates bacteria based on cell wall structure. Result guides initial antibiotic selection within 1 hour of sample collection.\u003c/p>\n          \u003ch4>Procedure Steps\u003c/h4>\n          \u003col style=\"font-size:14px;line-height:1.8;padding-left:18px;\">\n            \u003cli>\u003cstrong>Crystal violet\u003c/strong> (primary stain) — stains ALL bacteria purple\u003c/li>\n            \u003cli>\u003cstrong>Gram's iodine\u003c/strong> (mordant) — forms crystal violet-iodine complex inside cells\u003c/li>\n            \u003cli>\u003cstrong>Acetone-alcohol\u003c/strong> (decolorizer) — washes away stain from Gram(−) cells (thin peptidoglycan + outer membrane allows escape); Gram(+) cells retain stain (thick peptidoglycan traps the complex)\u003c/li>\n            \u003cli>\u003cstrong>Safranin\u003c/strong> (counterstain) — stains decolorized Gram(−) cells PINK/red\u003c/li>\n          \u003c/ol>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Feature\u003c/th>\u003cth>Gram-Positive (+)\u003c/th>\u003cth>Gram-Negative (−)\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Color under microscope\u003c/td>\u003ctd>Purple/violet\u003c/td>\u003ctd>Pink/red\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Peptidoglycan layer\u003c/td>\u003ctd>Thick (20–80 nm)\u003c/td>\u003ctd>Thin (2–7 nm)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Outer membrane\u003c/td>\u003ctd>Absent\u003c/td>\u003ctd>Present (LPS, lipopolysaccharide)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Teichoic acids\u003c/td>\u003ctd>Present\u003c/td>\u003ctd>Absent\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Periplasmic space\u003c/td>\u003ctd>Small\u003c/td>\u003ctd>Larger (contains β-lactamases)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Antibiotic sensitivity\u003c/td>\u003ctd>Generally more susceptible\u003c/td>\u003ctd>Outer membrane barrier reduces permeability to antibiotics\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box warning\">\u003cstrong>LPS (Lipopolysaccharide / Endotoxin):\u003c/strong> Gram-negative cell wall outer membrane component. Released when bacteria die. Triggers immune response → cytokine storm → septic shock. Pyrogen testing of injectable drugs tests for LPS (LAL test — Limulus Amebocyte Lysate).\u003c/div>\n        "},{"title":"Other Bacterial Structures","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Structure\u003c/th>\u003cth>Function\u003c/th>\u003cth>Clinical Relevance\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Capsule\u003c/td>\u003ctd>Polysaccharide layer outside cell wall; protects from phagocytosis\u003c/td>\u003ctd>Virulence factor (S. pneumoniae, H. influenzae, N. meningitidis); vaccines target capsular polysaccharides\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Flagella\u003c/td>\u003ctd>Motility; composed of flagellin protein\u003c/td>\u003ctd>H antigens in serotyping (e.g., E. coli O157:H7)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Pili (fimbriae)\u003c/td>\u003ctd>Adhesion to host cells; sex pili for conjugation\u003c/td>\u003ctd>Virulence (N. gonorrhoeae uses pili to adhere to urethral epithelium); drug resistance transfer via conjugation\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Plasmids\u003c/td>\u003ctd>Circular extrachromosomal DNA; carries accessory genes\u003c/td>\u003ctd>Major mechanism of antibiotic resistance gene transfer (R-plasmids)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Biofilm\u003c/td>\u003ctd>Matrix-enclosed bacterial community on surfaces\u003c/td>\u003ctd>Extremely difficult to treat (100–1000× more resistant to antibiotics); catheter infections, dental plaque, CF lung\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003ch4>Gram-Positive Organisms to Know\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Staphylococci\u003c/strong> (clusters): S. aureus (MRSA), S. epidermidis\u003c/li>\n            \u003cli>\u003cstrong>Streptococci\u003c/strong> (chains): S. pyogenes (Group A strep), S. pneumoniae\u003c/li>\n            \u003cli>\u003cstrong>Enterococci:\u003c/strong> E. faecalis, E. faecium (VRE)\u003c/li>\n            \u003cli>\u003cstrong>Bacilli\u003c/strong> (spore-forming rods): Bacillus, Clostridium\u003c/li>\n          \u003c/ul>\n          \u003ch4>Gram-Negative Organisms to Know\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Enterobacteriaceae\u003c/strong> (rods): E. coli, Klebsiella, Salmonella, Shigella, Proteus\u003c/li>\n            \u003cli>\u003cstrong>Non-fermenters:\u003c/strong> Pseudomonas aeruginosa (intrinsically resistant)\u003c/li>\n            \u003cli>\u003cstrong>Cocci:\u003c/strong> N. gonorrhoeae, N. meningitidis\u003c/li>\n            \u003cli>\u003cstrong>HACEK group\u003c/strong> (endocarditis)\u003c/li>\n          \u003c/ul>\n          \u003ch4>Atypical Bacteria (No cell wall → Gram stain useless)\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Mycoplasma pneumoniae\u003c/strong> — walking pneumonia; no cell wall → β-lactams ineffective; treat with macrolides/doxycycline\u003c/li>\n            \u003cli>\u003cstrong>Chlamydia\u003c/strong> — intracellular; urethritis, PID, psittacosis; treat with doxycycline/azithromycin\u003c/li>\n            \u003cli>\u003cstrong>Rickettsia\u003c/strong> — intracellular; Rocky Mountain spotted fever, typhus; treat with doxycycline\u003c/li>\n          \u003c/ul>\n        "}],"keyTerms":[{"term":"Peptidoglycan","def":"Cross-linked polymer of NAG and NAM forming the bacterial cell wall; target of β-lactam antibiotics and vancomycin."},{"term":"LPS (Lipopolysaccharide)","def":"Endotoxin in Gram-negative outer membrane; triggers septic shock when released during bacterial death."},{"term":"Capsule","def":"Polysaccharide layer protecting bacteria from phagocytosis; major virulence factor."},{"term":"Biofilm","def":"Structured community of bacteria embedded in a self-produced matrix; highly antibiotic-resistant."},{"term":"Plasmid","def":"Extrachromosomal circular DNA carrying resistance genes; transferred between bacteria by conjugation."}]},"bacterial-growth":{"tag":"Chapter 3 · Microbiology","title":"Bacterial Growth & Sporulation","overview":"Understanding bacterial growth kinetics helps determine when antibiotics are most effective and how to control microbial growth in pharmaceutical manufacturing.","sections":[{"title":"Binary Fission & Growth Rate","content":"\n          \u003cp>Bacteria reproduce asexually by \u003cstrong>binary fission\u003c/strong> (one cell → two equal daughter cells). Under ideal conditions, doubling occurs at regular intervals (generation time).\u003c/p>\n          \u003cul>\n            \u003cli>\u003cstrong>E. coli:\u003c/strong> ~20 min generation time under optimal conditions\u003c/li>\n            \u003cli>\u003cstrong>M. tuberculosis:\u003c/strong> ~15–20 hours (explains slow response to treatment)\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"formula-block\">N = N₀ × 2ⁿ &nbsp; (N = final number, N₀ = initial, n = number of generations)\u003c/div>\n        "},{"title":"Growth Curve — Four Phases","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Phase\u003c/th>\u003cth>Description\u003c/th>\u003cth>Key Feature\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Lag phase\u003c/td>\u003ctd>Adaptation to new environment; synthesis of enzymes; no division\u003c/td>\u003ctd>Cells metabolically active but not dividing; target of metabolic disruptors\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Log (exponential) phase\u003c/td>\u003ctd>Rapid, constant doubling; most bacteria actively dividing\u003c/td>\u003ctd>Most susceptible to antibiotics (especially cell wall inhibitors, which work on dividing cells)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Stationary phase\u003c/td>\u003ctd>Growth rate = death rate; nutrients depleted; waste accumulates\u003c/td>\u003ctd>Spore formation begins; production of many virulence factors; reduced antibiotic susceptibility\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Death (decline) phase\u003c/td>\u003ctd>Death rate > growth rate; viable count decreases\u003c/td>\u003ctd>Bacteria releasing endotoxins as they die\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>MIC and MBC:\u003c/strong> Minimum Inhibitory Concentration (MIC) = lowest drug concentration that prevents visible growth. Minimum Bactericidal Concentration (MBC) = lowest concentration that kills ≥99.9% of bacteria. Bacteriostatic drugs: MBC >> MIC. Bactericidal drugs: MBC ≈ MIC.\u003c/div>\n        "},{"title":"Endospores (Bacterial Spores)","content":"\n          \u003cp>Some bacteria form dormant spores when nutrients are scarce. Spores are extremely resistant to heat, chemicals, UV, desiccation, and many disinfectants.\u003c/p>\n          \u003ch4>Spore-Forming Bacteria\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Bacillus anthracis\u003c/strong> — anthrax; spores survive decades in soil; potential bioterrorism agent\u003c/li>\n            \u003cli>\u003cstrong>Bacillus cereus\u003c/strong> — food poisoning (fried rice syndrome)\u003c/li>\n            \u003cli>\u003cstrong>Clostridium tetani\u003c/strong> — tetanus (rusty nails); toxin (tetanospasmin) blocks inhibitory neurotransmitter release → spastic paralysis\u003c/li>\n            \u003cli>\u003cstrong>Clostridium botulinum\u003c/strong> — botulism; toxin blocks acetylcholine release → flaccid paralysis; also used therapeutically (Botox)\u003c/li>\n            \u003cli>\u003cstrong>Clostridium perfringens\u003c/strong> — gas gangrene, food poisoning\u003c/li>\n            \u003cli>\u003cstrong>Clostridioides difficile\u003c/strong> — antibiotic-associated colitis; spores survive alcohol-based hand sanitizers (requires soap and water or sporicidal agents)\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"info-box warning\">\u003cstrong>Sterilization for spores:\u003c/strong> Regular boiling (100°C) does NOT kill spores. Must use autoclave: 121°C at 15 psi steam pressure for 15–20 min. This is why autoclaving is the gold standard for sterilizing pharmaceutical equipment and supplies.\u003c/div>\n        "},{"title":"Environmental Requirements for Growth","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Requirement\u003c/th>\u003cth>Categories\u003c/th>\u003cth>Examples\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Oxygen\u003c/td>\u003ctd>Aerobe (needs O₂), Anaerobe (no O₂), Facultative anaerobe (both), Microaerophile (low O₂)\u003c/td>\u003ctd>M. tuberculosis (strict aerobe); Clostridium (strict anaerobe); E. coli (facultative)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Temperature\u003c/td>\u003ctd>Psychrophile (cold), Mesophile (body temp), Thermophile (hot)\u003c/td>\u003ctd>Most pathogens = mesophiles (37°C optimal)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>pH\u003c/td>\u003ctd>Most bacteria prefer neutral pH 6.5–7.5\u003c/td>\u003ctd>H. pylori tolerates gastric acid (produces urease → NH₃)\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "}],"keyTerms":[{"term":"Generation time","def":"Time for a bacterial population to double; E. coli ~20 min; M. tuberculosis ~15–20 hr."},{"term":"MIC","def":"Minimum Inhibitory Concentration — lowest antibiotic concentration preventing visible bacterial growth."},{"term":"Endospore","def":"Dormant, extremely resistant structure formed by some Gram-positive bacteria; not killed by boiling."},{"term":"Bactericidal","def":"Kills bacteria (MBC ≈ MIC). Examples: β-lactams, aminoglycosides, fluoroquinolones, vancomycin."},{"term":"Bacteriostatic","def":"Inhibits bacterial growth without killing (MBC >> MIC). Examples: tetracyclines, macrolides, sulfonamides, chloramphenicol."}]},"viruses":{"tag":"Chapter 4 · Microbiology","title":"Viruses & Replication","overview":"Viruses are acellular obligate intracellular parasites. Understanding their structure and replication cycle is essential for developing antiviral drugs and vaccines.","sections":[{"title":"Viral Structure","content":"\n          \u003ch4>Basic Components\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Genome:\u003c/strong> DNA or RNA (single or double stranded, linear or circular). Never both DNA and RNA.\u003c/li>\n            \u003cli>\u003cstrong>Capsid:\u003c/strong> Protein shell surrounding genome; provides protection and host cell attachment. Made of \u003cstrong>capsomers\u003c/strong>. Shapes: icosahedral, helical, or complex.\u003c/li>\n            \u003cli>\u003cstrong>Envelope (some viruses):\u003c/strong> Lipid bilayer derived from host membrane; contains viral glycoproteins for cell attachment (e.g., HIV gp120, influenza hemagglutinin).\u003c/li>\n          \u003c/ul>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Enveloped\u003c/th>\u003cth>Non-enveloped (naked)\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Examples\u003c/td>\u003ctd>HIV, influenza, HSV, CMV, HBV, HCV, SARS-CoV-2\u003c/td>\u003ctd>HAV, poliovirus, rhinovirus, rotavirus, HPV\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Stability\u003c/td>\u003ctd>Fragile — envelope destroyed by detergents, alcohol, drying\u003c/td>\u003ctd>More stable — survive harsh environments, fecal-oral route\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Transmission\u003c/td>\u003ctd>Respiratory droplets, blood, sexual, vertical\u003c/td>\u003ctd>Often fecal-oral, airborne, contaminated surfaces\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Alcohol sensitivity\u003c/td>\u003ctd>Killed by 60–70% alcohol\u003c/td>\u003ctd>Resistant to some alcohols; need soap/water or higher concentrations\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box key\">\u003cstrong>COVID-19 (SARS-CoV-2):\u003c/strong> Enveloped (+)ssRNA virus. Spike protein (S) binds ACE2 receptor on host cells. Alcohol-based hand sanitizers are effective (envelope disrupted). Target of mRNA vaccines (mRNA encoding spike protein → immune response).\u003c/div>\n        "},{"title":"Viral Replication Cycle","content":"\n          \u003cp>All viruses follow the same basic replication steps:\u003c/p>\n          \u003col style=\"font-size:14px;line-height:1.9;padding-left:18px;\">\n            \u003cli>\u003cstrong>Attachment (Adsorption):\u003c/strong> Viral surface proteins bind specific host cell receptors (tropism). E.g., HIV gp120 → CD4/CCR5; influenza hemagglutinin → sialic acid; SARS-CoV-2 spike → ACE2.\u003c/li>\n            \u003cli>\u003cstrong>Penetration/Entry:\u003c/strong> Virus enters cell via membrane fusion (enveloped) or endocytosis.\u003c/li>\n            \u003cli>\u003cstrong>Uncoating:\u003c/strong> Capsid removed; viral genome released into cytoplasm or nucleus.\u003c/li>\n            \u003cli>\u003cstrong>Replication of genome:\u003c/strong> DNA viruses usually replicate in nucleus; RNA viruses usually in cytoplasm (exceptions: influenza in nucleus; retroviruses reverse-transcribe).\u003c/li>\n            \u003cli>\u003cstrong>Transcription & Translation:\u003c/strong> Viral mRNA produced → host ribosomes synthesize viral proteins.\u003c/li>\n            \u003cli>\u003cstrong>Assembly:\u003c/strong> New viral components assembled (capsid + genome).\u003c/li>\n            \u003cli>\u003cstrong>Release:\u003c/strong> Budding (enveloped viruses, gradual release) or lysis (non-enveloped, cell rupture).\u003c/li>\n          \u003c/ol>\n          \u003cdiv class=\"info-box tip\">\u003
