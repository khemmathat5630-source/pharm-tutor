ffect. Monitoring: INR (target 2–3 for most indications)."},{"id":"anat-43","topic":"Respiratory","question":"Pulmonary surfactant is important because it:","options":["Kills bacteria entering the lungs","Reduces alveolar surface tension (prevents alveolar collapse at end-expiration)","Provides oxygen to alveolar cells","Filters particles from inhaled air"],"answer":1,"explanation":"Surfactant (mainly dipalmitoylphosphatidylcholine, DPPC) reduces surface tension in alveoli. By Laplace's Law (P = 2T/r): without surfactant, small alveoli (small radius) would have very high pressure → collapse. Surfactant reduces T → allows small alveoli to remain open → prevents atelectasis at end-expiration → reduces work of breathing → efficient gas exchange."},{"id":"anat-44","topic":"Skeletal","question":"Which diuretic would be appropriate for a patient with calcium oxalate kidney stones?","options":["Loop diuretic (furosemide) — increases Ca²⁺ excretion","Thiazide diuretic (HCTZ) — decreases urinary Ca²⁺ excretion (hypocalciuria)","Potassium-sparing (spironolactone)","Carbonic anhydrase inhibitor (acetazolamide)"],"answer":1,"explanation":"Thiazides reduce urinary calcium excretion (see Q30 explanation). This is useful in hypercalciuric nephrolithiasis (most common type). By decreasing urinary Ca²⁺, thiazides reduce the supersaturation of calcium oxalate in urine → fewer stones. Additionally, alkalization of urine with potassium citrate reduces calcium oxalate crystallization."},{"id":"anat-45","topic":"Digestive","question":"Parietal cells in the stomach secrete both HCl and intrinsic factor. Damage to parietal cells can lead to:","options":["Only decreased acid production","Both decreased acid production AND vitamin B₁₂ deficiency (pernicious anemia) due to loss of intrinsic factor","Increased pepsin activity","Excessive gastrin secretion"],"answer":1,"explanation":"Parietal cells (in gastric body/fundus) secrete: (1) HCl via H⁺/K⁺ ATPase (PPIs target this), and (2) Intrinsic factor. Loss of parietal cells (autoimmune → pernicious anemia, or gastrectomy) → achlorhydria (↑ risk of infections, poor drug dissolution, loss of pepsin activation) AND loss of IF → malabsorption of B₁₂ at terminal ileum → macrocytic anemia + neurological damage. Long-term PPI use may slightly reduce B₁₂ absorption (acid needed to release B₁₂ from food protein)."}],"eq":[{"id":"anat-1","topic":"Terminology","question":"The heart is _______ to the lungs.","options":["Lateral","Medial","Superior","Inferior"],"answer":1,"explanation":"The heart is located in the mediastinum, between the two lungs. Medial means toward the midline of the body. The heart is medial to both left and right lungs."},{"id":"anat-2","topic":"Terminology","question":"The kidneys are described as retroperitoneal. This means they are located:","options":["Within the peritoneum","Behind the peritoneum (between peritoneum and posterior abdominal wall)","Superior to the peritoneum","Within the thoracic cavity"],"answer":1,"explanation":"Retroperitoneal structures lie posterior to the parietal peritoneum, between the peritoneum and the posterior abdominal wall. Retroperitoneal organs: kidneys, ureters, adrenal glands, aorta, IVC, pancreas (except tail), duodenum (2nd and 3rd parts), ascending and descending colon. Mnemonic: \"SAD PUCKER\" (Suprarenal/adrenal, Aorta/IVC, Duodenum parts 2-3, Pancreas body/tail, Ureters, Colon ascending/descending, Kidneys, Esophagus, Rectum)."},{"id":"anat-3","topic":"Integumentary","question":"Which layer of the skin is the PRIMARY barrier to transdermal drug absorption?","options":["Stratum basale (germinativum)","Stratum spinosum","Stratum corneum","Dermis"],"answer":2,"explanation":"The stratum corneum (outermost layer) is the main barrier to transdermal drug penetration. It consists of dead, flattened corneocytes embedded in lipid lamellae (mainly ceramides, fatty acids, cholesterol). This \"brick and mortar\" structure limits drug penetration. Hydration (occlusive dressings) increases permeability."},{"id":"anat-4","topic":"Integumentary","question":"A transdermal fentanyl patch provides analgesia for 72 hours. What is the main advantage of this route?","options":["Fastest onset of action compared to IV","Avoids first-pass hepatic metabolism; sustained drug release","No skin irritation","Requires patient cooperation"],"answer":1,"explanation":"Transdermal delivery avoids the first-pass effect (drug absorbed into systemic circulation, not portal vein → liver). Fentanyl is highly lipophilic (log P ~4.0) → excellent skin penetration. The patch provides controlled, sustained release → stable plasma levels → avoiding peaks (toxicity) and troughs (inadequate analgesia) seen with oral dosing."},{"id":"anat-5","topic":"Integumentary","question":"Melanoma is treated with pembrolizumab (anti-PD-1 checkpoint inhibitor). The malignant cell originates from:","options":["Keratinocytes in stratum spinosum","Melanocytes in stratum basale","Langerhans cells","Fibroblasts in the dermis"],"answer":1,"explanation":"Melanoma arises from malignant transformation of melanocytes — pigment-producing cells located in the stratum basale of the epidermis and hair follicles. Most melanomas are BRAF-mutated (BRAFV600E, 50%) → targeted by vemurafenib, dabrafenib. Immunotherapy (pembrolizumab, nivolumab) targets PD-1/PD-L1 checkpoint → effective regardless of BRAF status."},{"id":"anat-6","topic":"Skeletal","question":"Bisphosphonates (alendronate) treat osteoporosis by:","options":["Stimulating osteoblast bone formation","Inhibiting osteoclast bone resorption","Increasing calcium absorption from gut","Stimulating calcitonin release"],"answer":1,"explanation":"Bisphosphonates inhibit osteoclast function. They are incorporated into bone matrix → ingested by osteoclasts → inhibit farnesyl pyrophosphate synthase (in mevalonate pathway) → impair osteoclast cytoskeletal function and induce osteoclast apoptosis → decreased bone resorption → maintained bone density."},{"id":"anat-7","topic":"Skeletal","question":"Fluoroquinolone antibiotics should be used with caution in children because they may damage:","options":["The liver (hepatotoxicity)","Epiphyseal growth plates","The renal glomeruli","CNS development"],"answer":1,"explanation":"Fluoroquinolones can damage articular cartilage and epiphyseal growth plates in children and adolescents in animal studies → generally avoided in patients &lt;18 years (with exceptions: inhalational anthrax, some severe UTIs). Generally use alternatives when available in pediatric patients."},{"id":"anat-8","topic":"Skeletal","question":"Red blood cells are produced in which location?","options":["Liver and spleen (in adults)","Thymus","Red bone marrow (in flat bones and proximal epiphyses of long bones)","Lymph nodes"],"answer":2,"explanation":"Hematopoiesis (blood cell production) occurs in red bone marrow in adults, primarily in flat bones (sternum, ribs, ilium, skull) and proximal epiphyses of femur and humerus. The liver and spleen are hematopoietic in fetal life. Erythropoietin (EPO) from kidney stimulates RBC production → EPO analogs (darbepoetin, epoetin) used in anemia of CKD."},{"id":"anat-9","topic":"Nervous","question":"Dopaminergic neurons in the SUBSTANTIA NIGRA project to the STRIATUM. Degeneration of this pathway causes:","options":["Alzheimer's disease","Multiple sclerosis","Parkinson's disease","Myasthenia gravis"],"answer":2,"explanation":"Parkinson's disease results from degeneration of dopaminergic neurons in substantia nigra pars compacta (SNpc) → loss of dopamine in striatum (caudate nucleus + putamen) → imbalance between dopaminergic (inhibitory) and cholinergic (excitatory) pathways → bradykinesia, resting tremor, rigidity, postural instability. Treatment: Levodopa/carbidopa (dopamine precursor), dopamine agonists, MAO-B inhibitors."},{"id":"anat-10","topic":"Nervous","question":"The blood-brain barrier (BBB) is formed mainly by:","options":["Myelin sheaths around axons","Tight junctions between brain capillary endothelial cells + astrocyte foot processes","The blood-CSF barrier only at the choroid plexus","Microglial cells"],"answer":1,"explanation":"The BBB is formed by: (1) Tight junctions (claudins, occludins) between brain capillary endothelial cells — far more restrictive than peripheral capillaries; (2) Astrocyte foot processes surrounding the capillaries; (3) Pericytes. Additionally, efflux pumps (P-gp, MRP) actively expel drugs. This severely restricts CNS drug penetration and is a major challenge for CNS drug development."},{"id":"anat-11","topic":"Nervous","question":"Ondansetron (Zofran) blocks 5-HT₃ receptors in the chemoreceptor trigger zone (CTZ) to prevent nausea. The CTZ is located:","options":["Behind the BBB in the cerebral cortex","Outside the BBB in the area postrema of the medulla","In the hypothalamus","In the peripheral GI tract only"],"answer":1,"explanation":"The CTZ (area postrema) is located in the floor of the 4th ventricle of the medulla. It is OUTSIDE the BBB → directly exposed to drugs and toxins in blood and CSF. This allows it to detect emetic substances. Antiemetics targeting CTZ (metoclopramide — D₂; ondansetron — 5-HT₃; droperidol — D₂; aprepitant — NK1) need to reach CTZ, which is accessible from blood."},{"id":"anat-12","topic":"Nervous","question":"The parasympathetic nervous system uses acetylcholine as its neurotransmitter. Atropine treats organophosphate poisoning by:","options":["Reactivating acetylcholinesterase","Blocking muscarinic acetylcholine receptors → reducing cholinergic excess","Increasing acetylcholine release","Stimulating adrenergic receptors"],"answer":1,"explanation":"Organophosphates irreversibly inhibit AChE → ACh accumulates → cholinergic toxidrome (DUMBELS). Atropine is a competitive muscarinic (M) receptor antagonist → blocks excess ACh effects: reduces secretions (salivation, bronchorrhea, sweating), reverses bronchoconstriction and bradycardia, causes mydriasis. Atropine does NOT reverse NMJ effects (muscle fasciculations, weakness) — those require pralidoxime to reactivate AChE."},{"id":"anat-13","topic":"Cardiovascular","question":"The SA node is the primary cardiac pacemaker. β-Blockers (metoprolol) slow heart rate by:","options":["Directly blocking the SA node Na⁺ channels","Blocking β₁-adrenergic receptors on SA node → decreased sympathetic stimulation → slower automaticity","Blocking the AV node Ca²⁺ channels","Increasing vagal tone (via muscarinic receptors)"],"answer":1,"explanation":"β₁-adrenergic receptors on SA node respond to sympathetic NE/epinephrine → increase HR (positive chronotropy) and AV conduction (positive dromotropy). β-Blockers competitively block β₁ receptors → reduce sympathetic acceleration → lower resting and exercise HR. Cardioselective β-blockers (metoprolol, atenolol, bisoprolol) preferentially block β₁ vs β₂."},{"id":"anat-14","topic":"Cardiovascular","question":"Sublingual nitroglycerin rapidly relieves angina. It is given sublingually (not orally) because:","options":["It is too unstable for oral use","It is poorly absorbed from the gut","It undergoes extensive first-pass hepatic metabolism when swallowed → oral bioavailability ~1%","It irritates the gastric mucosa"],"answer":2,"explanation":"Nitroglycerin is extensively metabolized by liver during first-pass when swallowed → oral bioavailability ~1% → inadequate plasma levels. Sublingual route: absorbed through sublingual veins → jugular vein → superior vena cava → bypasses portal circulation → systemic levels achieved in 1–2 minutes. Similarly, buccal, transdermal, IV, and intracoronary routes are used to bypass first-pass."},{"id":"anat-15","topic":"Cardiovascular","question":"Digoxin is used in atrial fibrillation to slow ventricular rate. Its main mechanism in AF is:","options":["Blocking Na⁺ channels in SA node","Increasing vagal tone (parasympathetic) → slows AV conduction → fewer atrial impulses reach ventricles","Blocking β-adrenergic receptors in AV node","Decreasing SA node automaticity directly"],"answer":1,"explanation":"Digoxin has two mechanisms in AF: (1) Direct effect: inhibits Na⁺/K⁺ ATPase → slightly reduced AV conduction velocity; (2) Indirect/vagal: stimulates vagal (cholinergic) tone → ↑ ACh at AV node → slows AV conduction → blocks more atrial impulses from reaching ventricles → controls ventricular rate in AF. Effect is predominant via vagal mechanism."},{"id":"anat-16","topic":"Respiratory","question":"Type II pneumocytes (type II alveolar cells) produce surfactant. Deficiency of surfactant in premature infants causes:","options":["Pulmonary embolism","Neonatal respiratory distress syndrome (NRDS) — alveolar collapse","Pneumonia","Pulmonary hypertension"],"answer":1,"explanation":"Surfactant reduces alveolar surface tension (per Laplace's law: pressure = 2T/r — small alveoli without surfactant would collapse). In NRDS (also called hyaline membrane disease), deficient surfactant → high surface tension → alveolar collapse at end-expiration → severe respiratory failure. Treatment: exogenous surfactant (beractant/Survanta, poractant/Curosurf) administered via endotracheal tube; prevention: antenatal betamethasone to mother induces fetal surfactant production."},{"id":"anat-17","topic":"Respiratory","question":"For optimal bronchial drug deposition (asthma inhalers), the optimal aerosol particle size is:","options":["&gt; 10 μm","5–10 μm","1–5 μm","&lt; 0.1 μm"],"answer":2,"explanation":"1–5 μm particles are optimal for bronchial deposition. &gt;10 μm particles impact in the upper airway (nose/throat); 5–10 μm particles in trachea/main bronchi; 1–5 μm reach bronchioles and smaller airways (the therapeutic target in asthma); &lt;1 μm may reach alveoli or be exhaled. Inhaler technique is critical — improper technique increases oropharyngeal deposition."},{"id":"anat-18","topic":"Respiratory","question":"Inhaled corticosteroids (ICS) such as budesonide can cause oral candidiasis. This is prevented by:","options":["Taking ICS with food","Rinsing the mouth and gargling with water after each dose","Using the inhaler more frequently","Taking antifungal medications prophylactically"],"answer":1,"explanation":"ICS deposited in the oropharynx (especially with poor inhaler technique) → local immunosuppression → Candida albicans overgrowth → oral thrush. Prevention: use a spacer (reduces oropharyngeal deposition), rinse mouth and gargle after use, spit water out. Using a DPI (dry powder inhaler) may reduce oropharyngeal deposition compared to pMDI without spacer."},{"id":"anat-19","topic":"Digestive","question":"Proton pump inhibitors (omeprazole) reduce gastric acid by:","options":["Blocking H₂ receptors on parietal cells","Irreversibly inhibiting H⁺/K⁺ ATPase (proton pump) on parietal cell apical membrane","Neutralizing stomach acid directly (like antacids)","Blocking gastrin receptors"],"answer":1,"explanation":"PPIs (omeprazole, pantoprazole, lansoprazole) are pro-drugs activated in the acidic environment of parietal cell canaliculi → sulfenamide → irreversibly binds cysteine residues of H⁺/K⁺ ATPase (proton pump) → blocks the final step of H⁺ secretion regardless of stimulus. Most effective acid suppression. H₂ blockers (famotidine, ranitidine) block H₂ receptors — less potent."},{"id":"anat-20","topic":"Digestive","question":"Grapefruit juice significantly increases plasma levels of many drugs because it:","options":["Increases gastric emptying, improving drug absorption","Inhibits intestinal CYP3A4 AND OATP transporters → reduces first-pass metabolism and increases drug absorption","Increases bile acid secretion to dissolve lipophilic drugs","Alkalinizes intestinal pH, increasing weak acid absorption"],"answer":1,"explanation":"Grapefruit juice contains furanocoumarins (especially bergamottin) that irreversibly inhibit intestinal CYP3A4 and also inhibit OATP uptake transporters. This dramatically reduces first-pass metabolism of CYP3A4 substrates → much higher bioavailability → potential toxicity. Affects: calcium channel blockers (felodipine, amlodipine), statins (lovastatin, simvastatin, atorvastatin), immunosuppressants (cyclosporine, tacrolimus), benzodiazepines (midazolam, triazolam). Avoid grapefruit/Seville orange with these drugs."},{"id":"anat-21","topic":"Digestive","question":"P-glycoprotein (P-gp, MDR1) in intestinal enterocytes reduces drug bioavailability by:","options":["Metabolizing drugs before absorption","Pumping absorbed drug back into the gut lumen (efflux pump)","Preventing drug dissolution in the gut","Binding drugs irreversibly in enterocytes"],"answer":1,"explanation":"P-glycoprotein is an ATP-dependent efflux transporter on the apical (luminal) membrane of intestinal enterocytes. It captures drugs after passive absorption and pumps them back into the intestinal lumen → reduces net drug absorption → reduces bioavailability. Digoxin, vincristine, tacrolimus, some HIV drugs are P-gp substrates. P-gp inhibitors (verapamil, clarithromycin, grapefruit juice) increase bioavailability of substrates."},{"id":"anat-22","topic":"Renal","question":"Furosemide (Lasix) causes diuresis by inhibiting which transporter in the kidney?","options":["SGLT2 in proximal tubule","NCC in distal convoluted tubule","NKCC2 in thick ascending loop of Henle","ENaC in collecting duct"],"answer":2,"explanation":"Furosemide (a loop diuretic) inhibits NKCC2 (Na⁺-K⁺-2Cl⁻ cotransporter) in the thick ascending limb of the loop of Henle → prevents Na⁺, K⁺, Cl⁻ reabsorption → loss in urine → powerful osmotic diuresis. Also prevents establishment of medullary concentration gradient → loss of concentrating ability. Side effects: hypokalemia, hyponatremia, hypomagnesemia, hyperuricemia, ototoxicity (especially with high doses or combination with aminoglycosides)."},{"id":"anat-23","topic":"Renal","question":"A patient with chronic kidney disease (CKD) has reduced GFR. How should renally excreted drugs be dosed?","options":["No dose adjustment needed","Increased doses to compensate for reduced clearance","Reduced dose or extended dosing interval to prevent drug accumulation and toxicity","Switch entirely to hepatic metabolism routes"],"answer":2,"explanation":"Reduced GFR → reduced renal drug clearance → drugs accumulate → toxicity risk. Dose adjustment: reduce dose, extend dosing interval, or both. Critical drugs requiring adjustment: aminoglycosides, vancomycin, β-lactams, metformin (contraindicated if eGFR &lt;30), digoxin, lithium, methotrexate. Creatinine clearance (Cockcroft-Gault equation) used to guide dosing: CrCl = [(140-age) × weight] / (72 × Scr) × 0.85 for females."},{"id":"anat-24","topic":"Renal","question":"Spironolactone is a K⁺-sparing diuretic that works by:","options":["Inhibiting NKCC2 in the loop of Henle","Blocking aldosterone receptors (mineralocorticoid receptor) in collecting duct → decreased Na⁺ reabsorption and K⁺ secretion","Blocking ENaC sodium channels directly","Inhibiting carbonic anhydrase"],"answer":1,"explanation":"Spironolactone is an aldosterone receptor antagonist (mineralocorticoid receptor antagonist). Normally, aldosterone binds MR in principal cells of collecting duct → transcription of ENaC (Na⁺ channels) and Na⁺/K⁺ ATPase → Na⁺ reabsorption, K⁺ secretion. Spironolactone blocks MR → ↓ ENaC expression → less Na⁺ reabsorption + less K⁺ loss → mild diuresis + K⁺ retention. Used in heart failure (reduces mortality), aldosteronism, ascites from cirrhosis."},{"id":"anat-25","topic":"Renal","question":"Probenecid extends the action of penicillin by:","options":["Inhibiting hepatic CYP450 metabolism of penicillin","Inhibiting tubular secretion of penicillin via OAT transporters in proximal tubule","Increasing penicillin absorption from GI tract","Binding penicillin to plasma proteins"],"answer":1,"explanation":"Penicillin is actively secreted by OAT (organic anion transporters) in proximal tubule → rapid renal elimination (short t½). Probenecid inhibits OAT → blocks penicillin secretion → higher plasma levels + longer half-life → prolonged antibacterial effect. Historically used when penicillin was scarce; also used to increase levels of other OAT substrates (cephalosporins, some antivirals like oseltamivir carboxylate)."},{"id":"anat-26","topic":"Muscular","question":"Succinylcholine is contraindicated in burn patients because:","options":["Burns patients need faster-acting agents","It causes massive hyperkalemia in patients with burns, crush injuries, or denervation → cardiac arrest","It prolongs the block in burns patients","Burns patients lack plasma cholinesterase"],"answer":1,"explanation":"Normally, succinylcholine causes small, transient K⁺ release. After burns, crush injury, prolonged immobility, or denervation: there is up-regulation of extrajunctional nAChRs throughout the muscle → succinylcholine activates all these receptors → massive K⁺ efflux → hyperkalemia (K⁺ can rise by 5–10 mEq/L) → fatal arrhythmia. Use rocuronium + sugammadex reversal instead."},{"id":"anat-27","topic":"Cardiovascular","question":"After oral ingestion, aspirin absorbed from the gut travels via the portal vein to the liver before reaching systemic circulation. This is the anatomical basis of:","options":["Bioequivalence","First-pass metabolism","Enterohepatic recirculation","Zero-order kinetics"],"answer":1,"explanation":"The portal vein drains the GI tract → liver. All orally absorbed drugs must pass through the liver first before entering systemic circulation → hepatic enzymes metabolize drugs → reduced bioavailability. This is the \"first-pass effect.\" High first-pass drugs: nitroglycerin (~1%), lidocaine (35%), morphine (25%), propranolol (25%), testosterone (~99%). Routes avoiding first-pass: sublingual, IV, IM, SC, transdermal, rectal (partial)."},{"id":"anat-28","topic":"Nervous","question":"Malignant hyperthermia (MH) triggered by succinylcholine or volatile anesthetics is caused by:","options":["Overactivation of muscarinic receptors","Uncontrolled Ca²⁺ release from sarcoplasmic reticulum (RYR1 mutation) → sustained muscle contraction → hyperthermia","Overactivation of the sympathetic nervous system","Bacterial toxin contamination of the anesthetic"],"answer":1,"explanation":"MH is a pharmacogenetic disorder caused by mutations in the ryanodine receptor 1 (RYR1) gene. Triggering agents (halogenated anesthetics, succinylcholine) → uncontrolled Ca²⁺ release from SR → sustained muscle contraction → hyperthermia, hypercapnia, acidosis, hyperkalemia, rhabdomyolysis → fatal if untreated. Treatment: dantrolene (inhibits RYR1 → blocks Ca²⁺ release) + cooling + bicarbonate. Emergency!"},{"id":"anat-29","topic":"Digestive","question":"Vitamin B₁₂ deficiency leads to pernicious anemia because:","options":["Decreased dietary B₁₂ intake","Absent intrinsic factor (from parietal cells) → B₁₂ cannot be absorbed in terminal ileum","Renal wasting of B₁₂","Excessive B₁₂ destruction by stomach acid"],"answer":1,"explanation":"Vitamin B₁₂ requires binding to intrinsic factor (IF), a glycoprotein secreted by gastric parietal cells, to be absorbed by cubilin receptors in the terminal ileum. Pernicious anemia: autoimmune destruction of parietal cells → ↓ IF → ↓ B₁₂ absorption → macrocytic anemia + subacute combined degeneration of spinal cord (posterior and lateral columns). Treatment: IM or sublingual B₁₂ (hydroxocobalamin or cyanocobalamin) — bypasses need for IF."},{"id":"anat-30","topic":"Renal","question":"Thiazide diuretics INCREASE calcium reabsorption in the DCT. This property makes them useful for:","options":["Treating hypercalcemia","Treating calcium oxalate kidney stones (nephrolithiasis) — reducing urinary Ca²⁺","Treating hyperparathyroidism","Treating hypomagnesemia"],"answer":1,"explanation":"Thiazides (HCTZ, chlorthalidone, indapamide) inhibit NCC in DCT → Na⁺ loss into urine → decreased intracellular Na⁺ → Na⁺/Ca²⁺ exchanger on basolateral membrane becomes more active → more Ca²⁺ removed from cells → more Ca²⁺ reabsorbed from urine. Result: decreased urinary Ca²⁺ (hypocalciuria). Used to prevent recurrent calcium oxalate stones. Contrast with loop diuretics which increase urinary Ca²⁺ excretion."},{"id":"anat-31","topic":"Cardiovascular","question":"Calcium channel blockers (verapamil, diltiazem) are used in supraventricular tachycardia because:","options":["They increase SA node automaticity","They block L-type Ca²⁺ channels in SA/AV node → slow nodal conduction → terminate re-entry circuits and control ventricular rate in AF/flutter","They decrease myocardial contractility exclusively","They block β-adrenergic receptors in the AV node"],"answer":1,"explanation":"The SA and AV nodes depend on slow Ca²⁺ (L-type, phase 0 and 4) currents for depolarization (unlike ventricles which use fast Na⁺ channels). Verapamil and diltiazem (non-dihydropyridine CCBs) block L-type Ca²⁺ channels → slower SA automaticity (decreased HR) + slower AV conduction → useful in AF to control ventricular rate and to terminate AVNRT. Dihydropyridine CCBs (amlodipine, nifedipine) prefer vascular smooth muscle → vasodilators, minimal cardiac effects."},{"id":"anat-32","topic":"Respiratory","question":"β₂ agonists (salbutamol/albuterol) relax airway smooth muscle in asthma by:","options":["Blocking muscarinic M₃ receptors","Activating β₂ adrenergic receptors → Gs → adenylyl cyclase → ↑cAMP → PKA → myosin light chain kinase inhibition → smooth muscle relaxation + bronchodilation","Blocking inflammatory cytokines (like steroids)","Stabilizing mast cells"],"answer":1,"explanation":"β₂ agonists bind β₂ receptors on airway smooth muscle → Gs protein → adenylyl cyclase → ↑cAMP → activates PKA → phosphorylates myosin light chain kinase (MLCK, inactivating it) and opens BK channels → Ca²⁺ sequestration → smooth muscle relaxation → bronchodilation. SABAs (salbutamol) onset 3–5 min; LABAs (salmeterol, formoterol) last 12 hours. LABAs never used alone in asthma without ICS (increases asthma mortality — SMART trial)."},{"id":"anat-33","topic":"Skeletal","question":"Denosumab (Prolia) prevents bone loss by targeting RANKL. What is the mechanism?","options":["Denosumab inhibits osteoblast activity","Denosumab is a monoclonal antibody against RANKL → prevents osteoclast differentiation and activation → reduces bone resorption","Denosumab activates estrogen receptors to increase bone density","Denosumab stimulates parathyroid hormone secretion"],"answer":1,"explanation":"RANKL (receptor activator of NF-κB ligand) is expressed on osteoblasts and stromal cells. It binds RANK on osteoclast precursors → osteoclast differentiation and activation → bone resorption. Denosumab is a human monoclonal antibody (IgG2) that binds and neutralizes RANKL → prevents osteoclast formation → reduces bone resorption → increases bone density. SC injection every 6 months for osteoporosis. Unlike bisphosphonates: no jaw osteonecrosis risk (debated), can be used in renal failure."},{"id":"anat-34","topic":"Nervous","question":"Levodopa (L-DOPA) is used for Parkinson's disease, but dopamine itself is not. Why?","options":["Dopamine is more toxic than levodopa","Levodopa crosses the BBB via amino acid transporters; dopamine cannot cross the BBB","Dopamine is too rapidly metabolized in the plasma","Levodopa binds dopamine receptors more effectively"],"answer":1,"explanation":"Dopamine is hydrophilic (polar amine) → cannot passively cross BBB. Levodopa (L-DOPA) is an amino acid → transported across BBB by large neutral amino acid transporter (LAT1, L-type amino acid transporter). Once inside CNS, aromatic L-amino acid decarboxylase (AADC, DOPA decarboxylase) converts L-DOPA → dopamine. Carbidopa is given with L-DOPA (Sinemet) to inhibit peripheral AADC → reduces peripheral conversion → less side effects (nausea, vomiting) + more L-DOPA reaches brain."},{"id":"anat-35","topic":"Muscular","question":"Vecuronium is a non-depolarizing NMB. It can be reversed by administering:","options":["More succinylcholine","Sugammadex (directly encapsulates vecuronium) OR neostigmine + glycopyrrolate (AChE inhibitor)","Atropine alone","Calcium gluconate"],"answer":1,"explanation":"Non-depolarizing NMBs (vecuronium, rocuronium, cisatracurium) are competitive antagonists at nAChR. Reversal: (1) Neostigmine (AChE inhibitor) → ACh accumulates → outcompetes NMB for nAChR binding; given with glycopyrrolate or atropine to block muscarinic side effects of excess ACh (bradycardia, hypersalivation). (2) Sugammadex: cyclodextrin that encapsulates rocuronium/vecuronium → removes from NMJ → immediate reversal even from deep block."},{"id":"anat-36","topic":"Renal","question":"Metformin is contraindicated in patients with significant renal impairment (eGFR &lt; 30 mL/min/1.73m²) because:","options":["Metformin causes acute kidney injury","Metformin is renally excreted; accumulation in renal failure → lactic acidosis","Metformin reacts with creatinine","Metformin increases urinary glucose excretion, worsening renal function"],"answer":1,"explanation":"Metformin is excreted unchanged by kidneys via OCT2-mediated active tubular secretion. In renal failure → metformin accumulates → inhibits mitochondrial complex I in liver → impaired gluconeogenesis from lactate → lactate accumulates → potentially fatal metformin-associated lactic acidosis (MALA). Generally held when eGFR &lt;30, used with caution eGFR 30-45. Normal renal function metformin is safe and is first-line for T2DM."},{"id":"anat-37","topic":"Digestive","question":"Enterohepatic circulation prolongs the effects of some drugs (e.g., estrogens in OCPs). This cycle involves:","options":["Drug absorbed from gut → portal vein → liver → hepatic artery → gut → reabsorption","Drug conjugated in liver → excreted in bile → enters intestine → bacterial deconjugation → reabsorption → returns to portal vein → liver","Drug filtered in kidney → reabsorbed in tubule → returned to circulation","Drug distributed to adipose tissue → slowly released back into blood"],"answer":1,"explanation":"Enterohepatic circulation: drug glucuronidated/sulfated in liver → excreted in bile → reaches intestinal lumen → gut bacteria β-glucuronidase or sulfatase hydrolyzes conjugate → regenerates active drug → reabsorbed → portal vein → liver → cycle repeats. This extends the effective half-life. Broad-spectrum antibiotics can disrupt this (kill gut bacteria) → reduce enterohepatic recycling of some drugs (estrogens in OCP → potential OCP failure, though debated in current literature)."},{"id":"anat-38","topic":"Cardiovascular","question":"ACE inhibitors (lisinopril, enalapril) lower blood pressure primarily by:","options":["Blocking β₁ receptors in the SA node → lower HR","Inhibiting angiotensin-converting enzyme → decreased Angiotensin II → vasodilation + reduced aldosterone → lower blood volume","Blocking L-type Ca²⁺ channels in vascular smooth muscle","Increasing NO production from endothelium"],"answer":1,"explanation":"ACE (angiotensin-converting enzyme) converts Angiotensin I → Angiotensin II (potent vasoconstrictor) AND degrades bradykinin (vasodilator). ACE inhibitors block this → ↓ Ang II → ↓ vasoconstriction + ↓ aldosterone → ↓ Na⁺/water retention + ↑ bradykinin (→ vasodilation AND the annoying dry cough side effect, also angioedema risk). Used in hypertension, heart failure, CKD with proteinuria, post-MI."},{"id":"anat-39","topic":"Integumentary","question":"A pharmacist recommends a patient use a spacer (valved holding chamber) with their metered-dose inhaler. The main purpose is:","options":["To increase the drug dose per actuation","To reduce oropharyngeal deposition by slowing and settling large particles; allows better lung deposition","To prevent contamination of the inhaler","To make inhaler use easier for all patients"],"answer":1,"explanation":"Without a spacer: MDI releases fast-moving aerosol → most large particles deposit in oropharynx → swallowed → contributes to systemic side effects (ICS → oral/esophageal candidiasis; systemic absorption → adrenal suppression with high doses). With spacer: particles decelerate in spacer → large particles settle out → fine particles reach lungs. Especially important for ICS (reduces oropharyngeal Candida), children, and patients with poor coordination."},{"id":"anat-40","topic":"Renal","question":"SGLT2 inhibitors (empagliflozin, dapagliflozin) reduce cardiovascular mortality in heart failure independent of their glucose-lowering effect. One proposed mechanism involves:","options":["Direct positive inotropic effect","Osmotic diuresis and natriuresis → reduced preload and afterload on heart; anti-fibrotic and anti-inflammatory effects","Blocking β₁ receptors in heart failure","Improving cardiac perfusion by vasodilation"],"answer":1,"explanation":"SGLT2 inhibitors cause: (1) Osmotic diuresis and natriuresis (reduces volume overload → less cardiac preload), (2) Metabolic shift (ketogenesis → more efficient cardiac energy use), (3) Anti-inflammatory and anti-fibrotic effects, (4) Reduce cardiac afterload (vasodilation). Clinical evidence: EMPA-REG OUTCOME, DAPA-HF, EMPEROR-Reduced trials showed 20–30% reduction in cardiovascular death/HF hospitalization — now recommended in HFrEF and HFpEF regardless of diabetes status."},{"id":"anat-41","topic":"Nervous","question":"Benzodiazepines (diazepam, lorazepam) reduce anxiety by enhancing the effect of which neurotransmitter?","options":["Glutamate (NMDA receptor activation)","GABA (via GABA-A receptor, increasing Cl⁻ influx frequency)","Dopamine (D₂ receptor)","Serotonin (5-HT₁A receptor)"],"answer":1,"explanation":"Benzodiazepines bind to the benzodiazepine site on GABA-A receptors (allosteric modulator) → increases the FREQUENCY of Cl⁻ channel opening in response to GABA → hyperpolarization → neuronal inhibition → sedation, anxiolysis, muscle relaxation, anticonvulsant effect. Compare with barbiturates: increase duration of Cl⁻ channel opening (more dangerous — can open even without GABA → respiratory depression). Flumazenil reverses benzodiazepine effect (competitive antagonist at BZD site)."},{"id":"anat-42","topic":"Cardiovascular","question":"A 70-year-old patient with atrial fibrillation is prescribed warfarin for stroke prevention. Warfarin's target is in which organ?","options":["Heart (directly blocks clotting at the SA node)","Liver (inhibits hepatic synthesis of vitamin K-dependent clotting factors II, VII, IX, X)","Kidney (reduces thrombin excretion)","Spleen (inhibits platelet production)"],"answer":1,"explanation":"Warfarin inhibits vitamin K epoxide reductase (VKOR) in the liver → vitamin K cannot be recycled → depletes reduced vitamin K (cofactor for carboxylation of Glu residues in factors II, VII, IX, X, protein C, S, Z) → decreased functional clotting factors → anticoagulation. Factor VII (shortest half-life) depleted first → INR rises first. Takes 2–3 days to reach full effect. Monitoring: INR (target 2–3 for most indications)."},{"id":"anat-43","topic":"Respiratory","question":"Pulmonary surfactant is important because it:","options":["Kills bacteria entering the lungs","Reduces alveolar surface tension (prevents alveolar collapse at end-expiration)","Provides oxygen to alveolar cells","Filters particles from inhaled air"],"answer":1,"explanation":"Surfactant (mainly dipalmitoylphosphatidylcholine, DPPC) reduces surface tension in alveoli. By Laplace's Law (P = 2T/r): without surfactant, small alveoli (small radius) would have very high pressure → collapse. Surfactant reduces T → allows small alveoli to remain open → prevents atelectasis at end-expiration → reduces work of breathing → efficient gas exchange."},{"id":"anat-44","topic":"Skeletal","question":"Which diuretic would be appropriate for a patient with calcium oxalate kidney stones?","options":["Loop diuretic (furosemide) — increases Ca²⁺ excretion","Thiazide diuretic (HCTZ) — decreases urinary Ca²⁺ excretion (hypocalciuria)","Potassium-sparing (spironolactone)","Carbonic anhydrase inhibitor (acetazolamide)"],"answer":1,"explanation":"Thiazides reduce urinary calcium excretion (see Q30 explanation). This is useful in hypercalciuric nephrolithiasis (most common type). By decreasing urinary Ca²⁺, thiazides reduce the supersaturation of calcium oxalate in urine → fewer stones. Additionally, alkalization of urine with potassium citrate reduces calcium oxalate crystallization."},{"id":"anat-45","topic":"Digestive","question":"Parietal cells in the stomach secrete both HCl and intrinsic factor. Damage to parietal cells can lead to:","options":["Only decreased acid production","Both decreased acid production AND vitamin B₁₂ deficiency (pernicious anemia) due to loss of intrinsic factor","Increased pepsin activity","Excessive gastrin secretion"],"answer":1,"explanation":"Parietal cells (in gastric body/fundus) secrete: (1) HCl via H⁺/K⁺ ATPase (PPIs target this), and (2) Intrinsic factor. Loss of parietal cells (autoimmune → pernicious anemia, or gastrectomy) → achlorhydria (↑ risk of infections, poor drug dissolution, loss of pepsin activation) AND loss of IF → malabsorption of B₁₂ at terminal ileum → macrocytic anemia + neurological damage. Long-term PPI use may slightly reduce B₁₂ absorption (acid needed to release B₁₂ from food protein)."}]},{"meta":{"id":"pharmatech","title":"Pharmaceutical Technology","code":"466141 / 465120","icon":"💊","color":"#1a6b8a","credits":"4+4 credits","semester":"Year 1 (both semesters)","description":"Drug formulation, dosage forms, drug delivery systems, and pharmaceutical manufacturing. The science of turning active drugs into safe, stable, effective dosage forms.","chapters":[{"id":"routes","title":"Routes of Administration"},{"id":"biopharm","title":"Biopharmaceutics & Bioavailability"},{"id":"preformulation","title":"Preformulation"},{"id":"powders","title":"Powders & Granules"},{"id":"solutions","title":"Solutions & Liquid Dosage Forms"},{"id":"suspensions","title":"Suspensions & Emulsions"},{"id":"tablets","title":"Tablets & Capsules"},{"id":"semisolids","title":"Semisolid Dosage Forms"},{"id":"parenterals","title":"Parenteral Products"},{"id":"manufacturing","title":"Manufacturing & Quality Control"}]},"chapters":{"routes":{"tag":"Chapter 1 · Pharmatech","title":"Routes of Administration","overview":"The route of drug administration determines onset, duration, bioavailability, and appropriateness for a given clinical situation. Each route has unique advantages and limitations.","sections":[{"title":"Routes Overview","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Route\u003c/th>\u003cth>Abbreviation\u003c/th>\u003cth>Onset\u003c/th>\u003cth>First-pass?\u003c/th>\u003cth>Key Advantages\u003c/th>\u003cth>Key Disadvantages\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Oral\u003c/td>\u003ctd>PO\u003c/td>\u003ctd>30–90 min\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Convenient, safe, self-administered, cheapest\u003c/td>\u003ctd>First-pass effect, GI degradation, food interactions, vomiting\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Sublingual/Buccal\u003c/td>\u003ctd>SL/BUC\u003c/td>\u003ctd>1–5 min\u003c/td>\u003ctd>No (partial)\u003c/td>\u003ctd>Rapid, bypasses GI + liver, useful for GTN\u003c/td>\u003ctd>Drug must be small, non-irritating; unpleasant taste\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Rectal\u003c/td>\u003ctd>PR\u003c/td>\u003ctd>5–30 min\u003c/td>\u003ctd>Partial (~50%)\u003c/td>\u003ctd>Useful in vomiting, unconscious patients; no GI enzymes\u003c/td>\u003ctd>Incomplete/variable absorption; patient acceptability\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Transdermal\u003c/td>\u003ctd>TD\u003c/td>\u003ctd>30 min–hours\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Sustained release, no first-pass, patch removable\u003c/td>\u003ctd>Only potent lipophilic drugs (low dose, MW &lt;500 Da), skin irritation\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Intravenous\u003c/td>\u003ctd>IV\u003c/td>\u003ctd>Immediate\u003c/td>\u003ctd>No\u003c/td>\u003ctd>100% bioavailability, precise dose, large volumes, immediate effect\u003c/td>\u003ctd>Irreversible, risk of infection/air embolism, requires trained staff\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Intramuscular\u003c/td>\u003ctd>IM\u003c/td>\u003ctd>10–30 min\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Depot possible, suitable for irritants, no IV access needed\u003c/td>\u003ctd>Pain, limited volume (2–5 mL), not for anticoagulated patients\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Subcutaneous\u003c/td>\u003ctd>SC/SQ\u003c/td>\u003ctd>15–30 min\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Sustained absorption, self-injection possible (insulin, LMWH)\u003c/td>\u003ctd>Small volumes only (&lt;2 mL), not for irritants\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Inhalation\u003c/td>\u003ctd>INH\u003c/td>\u003ctd>3–5 min\u003c/td>\u003ctd>Minimal\u003c/td>\u003ctd>Direct to lung, high local concentration, low systemic dose\u003c/td>\u003ctd>Coordination needed, device technique, only potent drugs\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Intranasal\u003c/td>\u003ctd>IN\u003c/td>\u003ctd>10–15 min\u003c/td>\u003ctd>Partial\u003c/td>\u003ctd>Rapid CNS access (via olfactory), small volume convenient\u003c/td>\u003ctd>Local irritation, ciliotoxicity, limited volume (~0.1 mL/nostril)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Intrathecal\u003c/td>\u003ctd>IT\u003c/td>\u003ctd>Minutes\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Bypasses BBB entirely; very small doses needed\u003c/td>\u003ctd>Highly specialized procedure; CSF infection risk\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "},{"title":"Oral Drug Absorption — Key Factors","content":"\n          \u003ch4>The BCS (Biopharmaceutics Classification System)\u003c/h4>\n          \u003cp>BCS classifies drugs by aqueous solubility and intestinal permeability — the two critical factors for oral absorption:\u003c/p>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Class\u003c/th>\u003cth>Solubility\u003c/th>\u003cth>Permeability\u003c/th>\u003cth>Rate-limiting step\u003c/th>\u003cth>Examples\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>I\u003c/td>\u003ctd>High\u003c/td>\u003ctd>High\u003c/td>\u003ctd>Gastric emptying\u003c/td>\u003ctd>Metoprolol, verapamil, diltiazem, propranolol\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>II\u003c/td>\u003ctd>Low\u003c/td>\u003ctd>High\u003c/td>\u003ctd>Drug dissolution\u003c/td>\u003ctd>Ibuprofen, carbamazepine, glibenclamide, phenytoin, griseofulvin, naproxen\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>III\u003c/td>\u003ctd>High\u003c/td>\u003ctd>Low\u003c/td>\u003ctd>Permeation through membrane\u003c/td>\u003ctd>Cimetidine, ranitidine, acyclovir, atenolol, captopril\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>IV\u003c/td>\u003ctd>Low\u003c/td>\u003ctd>Low\u003c/td>\u003ctd>Both (challenging)\u003c/td>\u003ctd>Cyclosporine (original formulation), ritonavir, furosemide, taxol\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>BCS Regulatory Impact:\u003c/strong> BCS Class I drugs can receive Biowaiver (waiver of in vivo bioequivalence studies) — in vitro dissolution testing alone is acceptable for generic approval. BCS Class II drugs need formulation engineering (nanosizing, amorphous forms, solid dispersions) to improve dissolution. Class IV drugs are the hardest to formulate.\u003c/div>\n        "}],"keyTerms":[{"term":"First-pass effect","def":"Hepatic metabolism of absorbed drug before reaching systemic circulation; reduces bioavailability; avoided by non-oral routes."},{"term":"BCS","def":"Biopharmaceutics Classification System — classifies drugs by solubility and permeability to predict oral absorption and guide formulation."},{"term":"Bioavailability (F)","def":"Fraction of administered dose that reaches systemic circulation in active form. IV = 100% by definition."},{"term":"Depot formulation","def":"Long-acting formulation (IM or SC) that provides sustained drug release over days to weeks. Used for antipsychotics (haloperidol decanoate), contraceptives (medroxyprogesterone IM)."}]},"biopharm":{"tag":"Chapter 2 · Pharmatech","title":"Biopharmaceutics & Bioavailability","overview":"Biopharmaceutics explains how drug product properties affect drug release, absorption, and therapeutic effect. Bioavailability and bioequivalence are central concepts for generic drug regulation.","sections":[{"title":"Bioavailability (F)","content":"\n          \u003cp>Bioavailability is the fraction (F) of administered dose that reaches systemic circulation unchanged.\u003c/p>\n          \u003cdiv class=\"formula-block\">F = AUC\u003csub>oral\u003c/sub> / AUC\u003csub>IV\u003c/sub> × (Dose\u003csub>IV\u003c/sub> / Dose\u003csub>oral\u003c/sub>)\u003c/div>\n          \u003ch4>Factors Affecting Bioavailability\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Dissolution rate\u003c/strong> — drug must dissolve before absorption (rate-limiting for BCS II)\u003c/li>\n            \u003cli>\u003cstrong>Gut wall metabolism\u003c/strong> — CYP3A4 in enterocytes; P-gp efflux\u003c/li>\n            \u003cli>\u003cstrong>First-pass hepatic metabolism\u003c/strong> — liver CYP enzymes metabolize drug\u003c/li>\n            \u003cli>\u003cstrong>Formulation factors\u003c/strong> — particle size, salt form, polymorphic form, excipients\u003c/li>\n            \u003cli>\u003cstrong>Patient factors\u003c/strong> — GI motility, pH, food, disease state\u003c/li>\n          \u003c/ul>\n          \u003ch4>Absolute vs. Relative Bioavailability\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Absolute F:\u003c/strong> Compared to IV reference (100%). e.g., F\u003csub>oral morphine\u003c/sub> ≈ 25%\u003c/li>\n            \u003cli>\u003cstrong>Relative F:\u003c/strong> Compared to another non-IV formulation (e.g., oral solution vs. tablet)\u003c/li>\n          \u003c/ul>\n        "},{"title":"Bioequivalence (BE)","content":"\n          \u003cp>Two products are bioequivalent if they have similar bioavailability and do not differ significantly. Required for generic drug approval.\u003c/p>\n          \u003ch4>BE Study Design (Typical)\u003c/h4>\n          \u003cul>\n            \u003cli>2-way crossover design: subjects receive test (generic) and reference (innovator) in random order\u003c/li>\n            \u003cli>12–24 healthy volunteers\u003c/li>\n            \u003cli>Pharmacokinetic parameters compared: AUC (total exposure), C\u003csub>max\u003c/sub> (peak concentration), T\u003csub>max\u003c/sub> (time to peak)\u003c/li>\n            \u003cli>\u003cstrong>BE criterion:\u003c/strong> 90% CI of test/reference ratio for AUC and C\u003csub>max\u003c/sub> must fall within 80.00–125.00%\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"info-box key\">\u003cstrong>BE window 80–125%:\u003c/strong> This is a multiplicative criterion — 1/1.25 = 0.80. So if test drug is 80% of reference OR 125% of reference, it is at the limit. Generic drugs approved this way are therapeutically equivalent to innovator for the vast majority of patients. Narrow therapeutic index drugs (warfarin, digoxin, levothyroxine, phenytoin) may have tighter BE limits (90–111%).\u003c/div>\n        "},{"title":"Pharmacokinetic Parameters from Plasma Curve","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Parameter\u003c/th>\u003cth>Symbol\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Significance\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Area under curve\u003c/td>\u003ctd>AUC\u003c/td>\u003ctd>Total drug exposure; integral of plasma conc-time curve\u003c/td>\u003ctd>Reflects bioavailability (proportional to dose absorbed); target for BE studies\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Peak concentration\u003c/td>\u003ctd>C\u003csub>max\u003c/sub>\u003c/td>\u003ctd>Maximum plasma concentration achieved\u003c/td>\u003ctd>Relates to efficacy and toxicity; target for BE\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Time to peak\u003c/td>\u003ctd>T\u003csub>max\u003c/sub>\u003c/td>\u003ctd>Time from dosing to C\u003csub>max\u003c/sub>\u003c/td>\u003ctd>Reflects absorption rate; not a BE criterion but informative for onset\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Elimination half-life\u003c/td>\u003ctd>t\u003csub>½\u003c/sub>\u003c/td>\u003ctd>Time for plasma conc to fall by half\u003c/td>\u003ctd>t\u003csub>½\u003c/sub> = 0.693 / k\u003csub>el\u003c/sub>; determines dosing interval; ~5 t\u003csub>½\u003c/sub> to reach steady state\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Clearance\u003c/td>\u003ctd>CL\u003c/td>\u003ctd>Volume of plasma cleared per unit time\u003c/td>\u003ctd>CL = Dose / AUC; determines maintenance dose\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Volume of distribution\u003c/td>\u003ctd>V\u003csub>d\u003c/sub>\u003c/td>\u003ctd>Apparent volume in which drug distributes\u003c/td>\u003ctd>V\u003csub>d\u003c/sub> = Dose / C₀; large V\u003csub>d\u003c/sub> → extensive tissue distribution\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "}],"keyTerms":[{"term":"AUC (Area Under Curve)","def":"Total drug exposure over time. Integral of plasma concentration-time curve. Proportional to dose and bioavailability."},{"term":"Bioequivalence","def":"Two products with similar bioavailability (AUC and Cmax within 80–125%). Basis for generic drug approval."},{"term":"Cmax","def":"Maximum plasma concentration after a dose. Relates to drug efficacy and toxicity risk."},{"term":"Half-life (t½)","def":"t½ = 0.693/kel. Time for plasma concentration to fall 50%. Takes ~5 half-lives to reach steady state and to fully eliminate drug."},{"term":"Volume of distribution (Vd)","def":"Apparent volume in which drug distributes. Vd = Dose / C0. Large Vd → drug sequestered in tissues (lipophilic, highly bound)."}]},"preformulation":{"tag":"Chapter 3 · Pharmatech","title":"Preformulation","overview":"Preformulation is the systematic characterization of drug substance physical and chemical properties before dosage form development. Good preformulation data prevents formulation failures.","sections":[{"title":"Physical Properties","content":"\n          \u003ch4>Solubility\u003c/h4>\n          \u003cul>\n            \u003cli>Most important preformulation property — drug must dissolve before absorption\u003c/li>\n            \u003cli>Measured at different pH (pH 1, 4.5, 6.8, 7.4) to simulate GI tract\u003c/li>\n            \u003cli>Intrinsic solubility (S₀) = solubility of unionized form\u003c/li>\n            \u003cli>Solubility enhancement strategies: salt formation, particle size reduction, amorphous form, solid dispersion, cyclodextrin complexation, surfactants\u003c/li>\n          \u003c/ul>\n          \u003ch4>Dissolution Rate — Noyes-Whitney Equation\u003c/h4>\n          \u003cdiv class=\"formula-block\">dC/dt = DA(C\u003csub>s\u003c/sub> − C) / hV\u003c/div>\n          \u003cp>Where D = diffusion coefficient, A = surface area, C\u003csub>s\u003c/sub> = saturation solubility, C = concentration in bulk, h = diffusion layer thickness, V = volume. \u003cstrong>Increasing A (particle size reduction) or C\u003csub>s\u003c/sub> (solubility) speeds dissolution.\u003c/strong>\u003c/p>\n          \u003ch4>Polymorphism\u003c/h4>\n          \u003cul>\n            \u003cli>Same chemical compound existing in different crystal forms (polymorphs)\u003c/li>\n            \u003cli>Different polymorphs have different solubility, melting point, stability, and bioavailability\u003c/li>\n            \u003cli>Metastable polymorphs have higher solubility but may convert to stable form → ritonavir (Norvir) recall 1998 — new polymorph with much lower solubility caused treatment failures\u003c/li>\n            \u003cli>Amorphous form = highest energy (highest solubility) but least stable → may crystallize over time\u003c/li>\n          \u003c/ul>\n        "},{"title":"Chemical Properties & Stability","content":"\n          \u003ch4>pKa and Ionization\u003c/h4>\n          \u003cul>\n            \u003cli>pKa determines degree of ionization at given pH\u003c/li>\n            \u003cli>Henderson-Hasselbalch: pH = pKa + log([A⁻]/[HA]) for acids; pH = pKa + log([B]/[BH⁺]) for bases\u003c/li>\n            \u003cli>Ionized form: more water-soluble, less membrane-permeable\u003c/li>\n            \u003cli>Unionized form: more lipophilic, better membrane permeation, better absorption\u003c/li>\n            \u003cli>\u003cstrong>Ion trapping:\u003c/strong> weakly basic drugs (pKa ~8-10, e.g., morphine) concentrated in acidic compartments (stomach, lysosomes); weakly acidic drugs in alkaline compartments\u003c/li>\n          \u003c/ul>\n          \u003ch4>Chemical Degradation Pathways\u003c/h4>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Pathway\u003c/th>\u003cth>Mechanism\u003c/th>\u003cth>Drug Examples\u003c/th>\u003cth>Prevention\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Hydrolysis\u003c/td>\u003ctd>Water attacks ester, amide, lactam bonds → cleavage\u003c/td>\u003ctd>Aspirin (ester), penicillins (β-lactam), procaine (ester), atropine (ester)\u003c/td>\u003ctd>Avoid aqueous formulation; use anhydrous form; control pH; lyophilize; add chelating agents\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Oxidation\u003c/td>\u003ctd>Electron loss; often free radical chain reaction; catalyzed by light, trace metals\u003c/td>\u003ctd>Epinephrine, morphine, ascorbic acid, prednisolone, fats\u003c/td>\u003ctd>Antioxidants (BHA, BHT, ascorbic acid, Na metabisulfite, EDTA), nitrogen purge, amber containers, avoid light\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Photodegradation\u003c/td>\u003ctd>Light energy breaks chemical bonds\u003c/td>\u003ctd>Nifedipine, chlorpromazine, riboflavin, furosemide\u003c/td>\u003ctd>Amber/light-resistant containers, store in dark, foil packaging\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Racemization\u003c/td>\u003ctd>Chiral center interconverts → loss of stereochemical purity\u003c/td>\u003ctd>Adrenaline, pilocarpine, thalidomide\u003c/td>\u003ctd>pH control, temperature control\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003ch4>Drug-Excipient Compatibility\u003c/h4>\n          \u003cp>Before formulation, drug is mixed with each excipient (binary mixtures) and stored under stress conditions (40°C/75% RH, 60°C) for 2–4 weeks → analyzed by DSC, HPLC, visual inspection. Incompatible combinations: primary amine drugs + lactose → Maillard reaction (browning). Calcium + tetracycline → chelation, reduced absorption.\u003c/p>\n        "},{"title":"Salt Selection","content":"\n          \u003cp>Most drugs are weak acids or bases — forming salts improves solubility and stability.\u003c/p>\n          \u003cul>\n            \u003cli>Basic drugs: form HCl salts, sulfate salts, maleate salts, succinate salts, etc.\u003c/li>\n            \u003cli>Acidic drugs: form Na salts, K salts, Ca salts, etc.\u003c/li>\n            \u003cli>Salt improves dissolution rate due to microenvironmental pH modification\u003c/li>\n            \u003cli>Different salts have different crystal forms, hygroscopicity, and stability\u003c/li>\n            \u003cli>Example: Atorvastatin calcium (not free acid) — calcium salt is more stable and has better dissolution\u003c/li>\n          \u003c/ul>\n          \u003ch4>log P and Drug-likeness\u003c/h4>\n          \u003cdiv class=\"formula-block\">log P = log([drug]\u003csub>octanol\u003c/sub> / [drug]\u003csub>water\u003c/sub>)\u003c/div>\n          \u003cp>Lipinski's Rule of Five (Ro5) for oral drug-like molecules: MW ≤ 500 Da, log P ≤ 5, H-bond donors ≤ 5, H-bond acceptors ≤ 10. Violations suggest poor oral absorption.\u003c/p>\n        "}],"keyTerms":[{"term":"Polymorphism","def":"Same drug substance existing in multiple crystal forms with different physicochemical properties. Critical quality attribute — must be controlled during manufacture."},{"term":"Hydrolysis","def":"Most common drug degradation pathway — water cleaves ester/amide/lactam bonds. Accelerated by heat, extreme pH, and metal catalysts."},{"term":"pKa","def":"Negative log of acid dissociation constant. Determines ionization state at a given pH. Critical for predicting absorption, distribution, and formulation compatibility."},{"term":"Noyes-Whitney equation","def":"dC/dt = DA(Cs-C)/hV. Describes dissolution rate; key variables are surface area (A) and solubility (Cs). Basis for particle size reduction strategies."},{"term":"Salt form","def":"Ionic form of drug (e.g., HCl salt, sodium salt) that improves solubility and dissolution compared to free acid/base. Most APIs are formulated as salts."}]},"powders":{"tag":"Chapter 4 · Pharmatech","title":"Powders & Granules","overview":"Powders and granules are intermediate dosage forms used in tablet manufacturing. Good powder properties are essential for tablet quality.","sections":[{"title":"Powder Properties","content":"\n          \u003ch4>Particle Size\u003c/h4>\n          \u003cul>\n            \u003cli>Measured by sieve analysis (coarse → medium → fine → superfine), laser diffraction, Coulter counter\u003c/li>\n            \u003cli>D10, D50, D90 used to describe particle size distribution\u003c/li>\n            \u003cli>Affects: dissolution, absorption, content uniformity, flowability, segregation\u003c/li>\n          \u003c/ul>\n          \u003ch4>Flowability\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Angle of repose (θ):\u003c/strong> Angle of conical powder heap. &lt;25° = excellent, 25–30° = good, 30–40° = passable, &gt;40° = poor flow → granulation needed\u003c/li>\n            \u003cli>\u003cstrong>Carr's Index (Compressibility Index):\u003c/strong> (Tapped density - Bulk density) / Tapped density × 100. &lt;15% = excellent, 16–20% = good, &gt;25% = poor\u003c/li>\n            \u003cli>\u003cstrong>Hausner Ratio:\u003c/strong> Tapped density / Bulk density. &lt;1.25 = good flow\u003c/li>\n          \u003c/ul>\n          \u003ch4>Bulk Density & Tapped Density\u003c/h4>\n          \u003cp>Bulk density = mass / untapped volume. Tapped density = mass / volume after standardized tapping. Used to predict flowability and select appropriate equipment.\u003c/p>\n        "},{"title":"Granulation","content":"\n          \u003cp>Granulation converts powder blend into granules — larger, denser, free-flowing aggregates. Improves flowability, compressibility, content uniformity, and reduces dust.\u003c/p>\n          \u003ch4>Wet Granulation\u003c/h4>\n          \u003col style=\"font-size:14px;line-height:1.9;padding-left:18px;\">\n            \u003cli>Mix API + excipients (filler, binder)\u003c/li>\n            \u003cli>Add granulating liquid (water, ethanol) to form wet mass\u003c/li>\n            \u003cli>Granulate (pass through screen or high-shear mixer)\u003c/li>\n            \u003cli>Dry (tray oven or fluid bed dryer)\u003c/li>\n            \u003cli>Size/mill to desired granule size\u003c/li>\n            \u003cli>Blend with extragranular excipients (lubricant, disintegrant)\u003c/li>\n          \u003c/ol>\n          \u003cp>Advantages: best for cohesive powders, creates strong granules. Disadvantages: heat and water → not suitable for moisture-sensitive or heat-labile drugs (aspirin, effervescent tablets).\u003c/p>\n          \u003ch4>Dry Granulation\u003c/h4>\n          \u003cp>No liquid added. Compress powder into slugs (slugging) or roll between rollers (roller compaction → ribbons → mill into granules). Used for: moisture-sensitive drugs (aspirin), heat-sensitive drugs. No drying step needed.\u003c/p>\n          \u003ch4>Direct Compression (DC)\u003c/h4>\n          \u003cp>No granulation step — compress powder blend directly. Requires: good flowability, compressibility, and content uniformity. Need DC-grade excipients (e.g., DC-grade lactose, MCC PH-102). Fastest, cheapest — used when drug has good compression properties or with DC excipients.\u003c/p>\n        "},{"title":"Granule Excipients","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Excipient Type\u003c/th>\u003cth>Function\u003c/th>\u003cth>Examples\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Binder\u003c/td>\u003ctd>Hold granules together during granulation and in tablet\u003c/td>\u003ctd>PVP (povidone), HPMC, HPC, starch paste, gelatin, acacia, pregelatinized starch\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Filler/Diluent\u003c/td>\u003ctd>Add bulk to bring tablet to handleable size\u003c/td>\u003ctd>Lactose, microcrystalline cellulose (MCC/Avicel), DCPD (dicalcium phosphate), mannitol, sorbitol\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Disintegrant\u003c/td>\u003ctd>Facilitate tablet breakup on contact with water in GI tract\u003c/td>\u003ctd>Sodium starch glycolate (SSG, Explotab), croscarmellose sodium (CCS, Ac-Di-Sol), crospovidone (PVPP, Polyplasdone), starch\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Lubricant\u003c/td>\u003ctd>Reduce friction between tablet and die wall during compression; prevent sticking; facilitate tablet ejection\u003c/td>\u003ctd>Magnesium stearate (most common, 0.25–1%), stearic acid, talc, PEG 4000/6000, sodium stearyl fumarate\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Glidant\u003c/td>\u003ctd>Improve powder flow\u003c/td>\u003ctd>Colloidal silicon dioxide (Aerosil, Cab-O-Sil), talc, starch\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Wetting agent\u003c/td>\u003ctd>Improve wettability of hydrophobic drug\u003c/td>\u003ctd>Sodium lauryl sulfate (SLS), polysorbate 80 (Tween 80), HPC\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box warning\">\u003cstrong>Magnesium stearate:\u003c/strong> Most widely used lubricant. Hydrophobic — overmixing reduces dissolution and hardness. Optimal blend time: 1–5 minutes. Mix lubricant LAST and for minimal time. Magnesium stearate is incompatible with aspirin (some formulations).\u003c/div>\n        "}],"keyTerms":[{"term":"Angle of repose","def":"Angle of conical powder heap; measures flowability. \u003c25° = excellent flow; >40° = poor flow (granulation needed)."},{"term":"Carr's Index","def":"(Tapped density - Bulk density) / Tapped density × 100. \u003c15% = excellent flow. Also called Compressibility Index."},{"term":"Wet granulation","def":"Most common granulation method; adds granulating liquid to form granules. Not suitable for moisture/heat-sensitive drugs."},{"term":"Disintegrant","def":"Excipient that helps tablets break apart in GI fluids (SSG, CCS, crospovidone). Added intragranularly and/or extragranularly."},{"term":"Magnesium stearate","def":"Most common tablet lubricant (0.25–1%); hydrophobic; reduces die wall friction; overmixing reduces dissolution. Mix last and briefly."}]},"solutions":{"tag":"Chapter 5 · Pharmatech","title":"Solutions & Liquid Dosage Forms","overview":"Solutions are homogeneous, single-phase liquid dosage forms. They offer rapid absorption, easy swallowing, and dose flexibility.","sections":[{"title":"Types of Solutions","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Route\u003c/th>\u003cth>Description\u003c/th>\u003cth>Examples\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Oral solution/syrup\u003c/td>\u003ctd>Oral\u003c/td>\u003ctd>Drug dissolved in water ± sucrose (syrup). High sucrose preserves and enhances palatability\u003c/td>\u003ctd>Paracetamol syrup, amoxicillin for reconstitution\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Elixir\u003c/td>\u003ctd>Oral\u003c/td>\u003ctd>Hydroalcoholic solution; sweetened; clear. 5–40% ethanol dissolves alcohol-soluble drugs\u003c/td>\u003ctd>Phenobarbital elixir, digoxin elixir\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Tincture\u003c/td>\u003ctd>Oral/topical\u003c/td>\u003ctd>Alcoholic or hydroalcoholic extraction of vegetable/animal drugs. 15–80% ethanol\u003c/td>\u003ctd>Belladonna tincture, iodine tincture (topical antiseptic)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Aromatic water\u003c/td>\u003ctd>Oral\u003c/td>\u003ctd>Saturated solution of volatile oil in water\u003c/td>\u003ctd>Peppermint water (flavoring/carminative)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Mouthwash/Gargle\u003c/td>\u003ctd>Oral cavity\u003c/td>\u003ctd>Aqueous solution for oral hygiene\u003c/td>\u003ctd>Chlorhexidine mouthwash, benzydamine gargle\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Eye drops/Ear drops\u003c/td>\u003ctd>Ophthalmic/otic\u003c/td>\u003ctd>Sterile solutions for eye/ear; must be sterile; specific tonicity for eye\u003c/td>\u003ctd>Timolol eye drops, ciprofloxacin eye drops\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Nasal drops/spray\u003c/td>\u003ctd>Intranasal\u003c/td>\u003ctd>Aqueous solutions; isotonic preferred; pH 4.5–7.5\u003c/td>\u003ctd>Oxymetazoline nasal spray, intranasal fluticasone\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "},{"title":"Formulation of Solutions","content":"\n          \u003ch4>Key Formulation Components\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Solubility enhancement:\u003c/strong> Cosolvents (ethanol, PEG 400, propylene glycol), surfactants, pH adjustment, cyclodextrin complexation\u003c/li>\n            \u003cli>\u003cstrong>Preservation:\u003c/strong> Antimicrobial preservatives needed for multi-dose preparations. Benzalkonium chloride (BKC), benzyl alcohol, parabens (methylparaben + propylparaben), chlorocresol\u003c/li>\n            \u003cli>\u003cstrong>Stability:\u003c/strong> Antioxidants (sodium metabisulfite, ascorbic acid, BHA, BHT), chelating agents (EDTA), pH control, nitrogen atmosphere\u003c/li>\n            \u003cli>\u003cstrong>Tonicity:\u003c/strong> Isotonic solutions have same osmotic pressure as body fluids (~285–310 mOsm/kg, equivalent to 0.9% NaCl). Hypotonic → cell swelling; hypertonic → cell shrinkage. Tonicity adjusters: NaCl, KCl, mannitol, dextrose, boric acid\u003c/li>\n          \u003c/ul>\n          \u003ch4>Isotonicity Calculation\u003c/h4>\n          \u003cdiv class=\"formula-block\">W (g of NaCl needed) = 0.52 − (a × C) / 0.52 × V/100\u003c/div>\n          \u003cp>Where a = freezing point depression of 1% drug, C = drug concentration (%), V = volume (mL). Or use sodium chloride equivalents (E values).\u003c/p>\n        "},{"title":"Syrup Formulation","content":"\n          \u003cul>\n            \u003cli>Simple syrup: 85% w/v sucrose in water (or 66.7% w/w). This concentration is self-preserving — high osmotic pressure inhibits microbial growth\u003c/li>\n            \u003cli>Lower sucrose concentrations (&lt;65%) require additional preservatives\u003c/li>\n            \u003cli>Flavorings, colorants, viscosity agents (xanthan gum, CMC) often added\u003c/li>\n            \u003cli>Sorbitol, glycerin: humectants; also prevent crystallization (\"graining\") of sucrose\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>Sucrose-free syrups:\u003c/strong> For diabetics, sucrose-free syrups use sorbitol or xylitol as sweeteners. However, large amounts of sorbitol → osmotic diarrhea (especially in children). Check total sorbitol content in multi-drug prescriptions.\u003c/div>\n        "}],"keyTerms":[{"term":"Elixir","def":"Sweetened hydroalcoholic oral solution. Contains 5–40% ethanol to dissolve poorly water-soluble drugs."},{"term":"Isotonic","def":"Solution with same osmotic pressure as body fluids (~285–310 mOsm/kg). 0.9% NaCl = isotonic. Important for ophthalmic, parenteral, and nasal preparations."},{"term":"Preservative","def":"Antimicrobial agent added to multi-dose liquid preparations to prevent microbial contamination. Benzalkonium chloride, parabens, benzyl alcohol, chlorocresol."},{"term":"Cosolvents","def":"Water-miscible solvents (ethanol, PEG 400, propylene glycol) used to increase drug solubility in aqueous preparations."},{"term":"Simple syrup","def":"85% w/v (66.7% w/w) sucrose solution. Self-preserving due to high osmotic pressure. Vehicle for oral liquid preparations."}]},"suspensions":{"tag":"Chapter 6 · Pharmatech","title":"Suspensions & Emulsions","overview":"Suspensions and emulsions are heterogeneous (multi-phase) systems requiring careful formulation to ensure stability, uniformity, and bioavailability.","sections":[{"title":"Suspensions","content":"\n          \u003cp>A suspension is a coarse dispersion of solid particles in a liquid vehicle where solid particles are not soluble in the vehicle.\u003c/p>\n          \u003ch4>Advantages of Suspensions\u003c/h4>\n          \u003cul>\n            \u003cli>Suitable for insoluble or poorly soluble drugs\u003c/li>\n            \u003cli>Taste masking (drug in solid form → less perceived taste)\u003c/li>\n            \u003cli>Better chemical stability than solution (less degradation at solid-liquid interface)\u003c/li>\n            \u003cli>Sustained release possible (depot injections)\u003c/li>\n          \u003c/ul>\n          \u003ch4>Key Stability Concerns\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Sedimentation:\u003c/strong> Particles settle by gravity. Rate described by Stokes' Law: v = d²(ρ\u003csub>s\u003c/sub>−ρ\u003csub>l\u003c/sub>)g / 18η. Reduce sedimentation: ↓ particle size, ↑ viscosity of medium, ↑ density of medium\u003c/li>\n            \u003cli>\u003cstrong>Caking (hard sediment):\u003c/strong> Settled particles pack tightly → cannot redisperse by shaking → formulation failure. Prevent by: flocculated suspensions (loose, easily redispersible flocs)\u003c/li>\n            \u003cli>\u003cstrong>Crystal growth (Ostwald ripening):\u003c/strong> Small particles dissolve and recrystallize on large particles → particle size increases → slower dissolution → changed bioavailability\u003c/li>\n          \u003c/ul>\n          \u003ch4>Formulation Agents\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Suspending agents (viscosity enhancers):\u003c/strong> CMC (sodium carboxymethylcellulose), HPMC, xanthan gum, bentonite, veegum, PVP — slow sedimentation\u003c/li>\n            \u003cli>\u003cstrong>Wetting agents:\u003c/strong> Surfactants (SLS, Tween 80, Span) — prevent aggregation; help liquid wet hydrophobic particles\u003c/li>\n            \u003cli>\u003cstrong>Flocculating agents:\u003c/strong> Electrolytes at controlled concentration → controlled flocculation → loose, easily redispersible sediment\u003c/li>\n          \u003c/ul>\n        "},{"title":"Emulsions","content":"\n          \u003cp>An emulsion is a two-phase system of immiscible liquids (oil and water), one dispersed in the other as droplets, stabilized by an emulsifier.\u003c/p>\n          \u003ch4>Types\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>O/W (oil in water):\u003c/strong> Oil droplets in water continuous phase. Aqueous external phase → water-washable, less greasy, preferred for oral and topical. Examples: most creams, some lotions\u003c/li>\n            \u003cli>\u003cstrong>W/O (water in oil):\u003c/strong> Water droplets in oil continuous phase. Oily feel → occlusive, better skin hydration, good for dry skin. Examples: cold cream, ointment\u003c/li>\n            \u003cli>\u003cstrong>Multiple (W/O/W or O/W/O):\u003c/strong> Complex systems for controlled release and targeted delivery\u003c/li>\n          \u003c/ul>\n          \u003ch4>Emulsifiers (Emulsifying Agents)\u003c/h4>\n          \u003cp>Emulsifiers stabilize emulsions by forming interfacial film and reducing interfacial tension:\u003c/p>\n          \u003cul>\n            \u003cli>\u003cstrong>Anionic:\u003c/strong> Sodium lauryl sulfate, sodium oleate, soaps → O/W emulsions\u003c/li>\n            \u003cli>\u003cstrong>Cationic:\u003c/strong> Benzalkonium chloride, cetrimide → O/W; also antimicrobial\u003c/li>\n            \u003cli>\u003cstrong>Nonionic:\u003c/strong> Polysorbates (Tween), Spans (sorbitol esters), PEGs → used for O/W and W/O depending on HLB\u003c/li>\n            \u003cli>\u003cstrong>Amphoteric:\u003c/strong> Lecithin, egg yolk — used in IV emulsions (parenteral nutrition)\u003c/li>\n          \u003c/ul>\n          \u003ch4>HLB (Hydrophile-Lipophile Balance) System\u003c/h4>\n          \u003cdiv class=\"formula-block\">HLB = (% hydrophilic portion) / 5\u003c/div>\n          \u003cp>HLB scale 0–20. Low HLB (1–6): W/O emulsifiers (lipophilic). High HLB (8–18): O/W emulsifiers (hydrophilic). HLB 6–8: wetting agents. Blend surfactants to achieve required HLB for oil.\u003c/p>\n        "},{"title":"Emulsion Instability","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Problem\u003c/th>\u003cth>Description\u003c/th>\u003cth>Reversible?\u003c/th>\u003cth>Prevention\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Creaming\u003c/td>\u003ctd>Droplets migrate upward (O/W) or downward (W/O) → concentration gradient but no coalescence\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Homogenize to ↓ droplet size; ↑ viscosity\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Flocculation\u003c/td>\u003ctd>Droplets aggregate but maintain individual identity (reversible aggregates)\u003c/td>\u003ctd>Yes (usually)\u003c/td>\u003ctd>Electrolyte concentration control, steric stabilizers\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Coalescence\u003c/td>\u003ctd>Droplets merge → larger droplets → phase separation\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Strong interfacial film; use polymeric emulsifiers; avoid stress\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Cracking/Breaking\u003c/td>\u003ctd>Complete phase separation → irreversible failure\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Stable emulsifier; avoid heat, freeze-thaw, contamination\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Phase inversion\u003c/td>\u003ctd>O/W converts to W/O or vice versa; temperature change or adding too much dispersed phase\u003c/td>\u003ctd>Partial\u003c/td>\u003ctd>Temperature control; phase volume ratio &lt;74%\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "}],"keyTerms":[{"term":"Stokes' Law","def":"v = d²(ρs-ρl)g/18η. Describes sedimentation velocity. Reduce particle size, increase viscosity, or match densities to reduce settling."},{"term":"Flocculated suspension","def":"Suspension where particles form loose, easily redispersible aggregates. Preferred over deflocculated (caking) suspensions."},{"term":"HLB value","def":"Hydrophile-Lipophile Balance. Number indicating emulsifier polarity. Low HLB (1–6): W/O emulsifier; high HLB (8–18): O/W emulsifier."},{"term":"Creaming","def":"Reversible separation of emulsion droplets due to gravity (rise for O/W, settle for W/O). No droplet coalescence. Reversed by shaking."},{"term":"Coalescence","def":"Irreversible merging of emulsion droplets → phase separation. Represents critical emulsion failure."}]},"tablets":{"tag":"Chapter 7 · Pharmatech","title":"Tablets & Capsules","overview":"Tablets and capsules are the most common oral dosage forms. Understanding their manufacture, quality control, and types is essential for pharmacists.","sections":[{"title":"Tablet Types","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Description\u003c/th>\u003cth>Release Pattern\u003c/th>\u003cth>Examples\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Conventional (immediate-release)\u003c/td>\u003ctd>Disintegrate rapidly in GI tract → conventional absorption\u003c/td>\u003ctd>Immediate\u003c/td>\u003ctd>Paracetamol 500 mg, aspirin 81 mg\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Enteric-coated (EC)\u003c/td>\u003ctd>Polymer coat resists gastric acid (pH &lt;5); dissolves in intestine (pH &gt;6)\u003c/td>\u003ctd>Delayed\u003c/td>\u003ctd>Omeprazole (acid-labile PPI), enteric aspirin (reduce gastric bleeding), bisacodyl, pancreatin\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Extended/controlled release (ER/CR)\u003c/td>\u003ctd>Matrix or membrane system provides drug over 8–24 hours\u003c/td>\u003ctd>Sustained\u003c/td>\u003ctd>Metformin XR, nifedipine GITS, metoprolol succinate ER, oxycodone CR\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Chewable\u003c/td>\u003ctd>Designed to be chewed before swallowing; usually pleasant taste; no water needed\u003c/td>\u003ctd>Immediate (after chewing)\u003c/td>\u003ctd>Antacids (CaCO₃), children's vitamins, antifungals\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Effervescent\u003c/td>\u003ctd>Contains citric acid + NaHCO₃ → fizzes in water → solution\u003c/td>\u003ctd>Immediate (as solution)\u003c/td>\u003ctd>Aspirin effervescent, vitamin C effervescent\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Sublingual/buccal\u003c/td>\u003ctd>Placed under tongue or in buccal pouch; dissolves rapidly → absorption via oral mucosa\u003c/td>\u003ctd>Rapid, bypasses first-pass\u003c/td>\u003ctd>Nitroglycerin SL, buprenorphine SL, apomorphine SL\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Orally disintegrating (ODT)\u003c/td>\u003ctd>Rapidly disintegrate in mouth (&lt;30 sec) with saliva; no water needed\u003c/td>\u003ctd>Immediate\u003c/td>\u003ctd>Ondansetron ODT, rizatriptan, lorazepam ODT\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "},{"title":"Tablet Manufacturing","content":"\n          \u003ch4>Compression\u003c/h4>\n          \u003cp>Powder/granule blend is compressed between two punches in a die. Forces: upper punch + lower punch → tablet. Single-punch (eccentric) or rotary tablet press (multi-punch).\u003c/p>\n          \u003ch4>Compression Quality Problems\u003c/h4>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Problem\u003c/th>\u003cth>Cause\u003c/th>\u003cth>Solution\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Capping\u003c/td>\u003ctd>Top or bottom of tablet separates (air entrapped, over-compression, granule too hard)\u003c/td>\u003ctd>Reduce compression force; use less binder; pre-compression step\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Lamination\u003c/td>\u003ctd>Tablet splits into layers (poor granule bonding, over-compression)\u003c/td>\u003ctd>Improve granule quality; reduce punch speed\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Sticking/Picking\u003c/td>\u003ctd>Material adheres to punch face (punch damage, excess moisture, insufficient lubricant)\u003c/td>\u003ctd>Increase lubricant; dry granules; polish punches\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Mottling\u003c/td>\u003ctd>Uneven color distribution\u003c/td>\u003ctd>Change solvent system; improve mixing; grinding colorant\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Weight variation\u003c/td>\u003ctd>Poor powder flow → inconsistent die fill\u003c/td>\u003ctd>Improve flowability; granulate; check feeder\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "},{"title":"Tablet Coating","conten
