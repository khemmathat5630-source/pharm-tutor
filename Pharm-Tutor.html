:"8.2 Mutagens","content":"\n          \u003cul>\n            \u003cli>\u003cstrong>Physical:\u003c/strong> UV light (thymine dimers), ionising radiation (double-strand breaks).\u003c/li>\n            \u003cli>\u003cstrong>Chemical:\u003c/strong> base analogues, alkylating agents, intercalators, reactive oxygen species.\u003c/li>\n            \u003cli>\u003cstrong>Biological:\u003c/strong> some viruses and transposons.\u003c/li>\n          \u003c/ul>\n          \u003cp>Many \u003cem>anticancer\u003c/em> drugs are deliberate mutagens (alkylators, platinum agents) — which is also why they are themselves carcinogenic and can cause secondary malignancies.\u003c/p>\n        "},{"title":"8.3 DNA Repair Pathways","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Pathway\u003c/th>\u003cth>Fixes\u003c/th>\u003cth>Disease when defective\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Mismatch repair (MMR)\u003c/td>\u003ctd>Replication base-pair mismatches\u003c/td>\u003ctd>\u003cstrong>Lynch syndrome\u003c/strong> (HNPCC) — MLH1/MSH2\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Nucleotide excision repair (NER)\u003c/td>\u003ctd>Bulky lesions, UV thymine dimers\u003c/td>\u003ctd>\u003cstrong>Xeroderma pigmentosum\u003c/strong>\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Base excision repair (BER)\u003c/td>\u003ctd>Single damaged bases\u003c/td>\u003ctd>(PARP participates here)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Homologous recombination (HR)\u003c/td>\u003ctd>Double-strand breaks (accurate)\u003c/td>\u003ctd>\u003cstrong>BRCA1/2\u003c/strong> breast/ovarian cancer\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Non-homologous end joining (NHEJ)\u003c/td>\u003ctd>Double-strand breaks (error-prone)\u003c/td>\u003ctd>SCID (some forms)\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "},{"title":"8.4 Repair Defects as Drug Targets","content":"\n          \u003cdiv class=\"info-box key\">\u003cstrong>PARP inhibitors & synthetic lethality (high-yield):\u003c/strong> BRCA-mutant cells cannot repair double-strand breaks by HR. They lean on PARP-mediated base-excision repair to survive. \u003cem>PARP inhibitors\u003c/em> (olaparib, niraparib) remove that backup → unrepaired breaks accumulate → BRCA-deficient cancer cells die, while normal cells (with working HR) survive. Two individually survivable defects are lethal together = \u003cstrong>synthetic lethality\u003c/strong>.\u003c/div>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>MMR deficiency & immunotherapy:\u003c/strong> MMR-deficient (MSI-high) tumours accumulate huge numbers of mutations → many neoantigens → excellent responses to \u003cem>immune checkpoint inhibitors\u003c/em> (pembrolizumab). MSI/MMR status is now a tumour-agnostic biomarker for immunotherapy.\u003c/div>\n        "}],"keyTerms":[{"term":"Missense mutation","def":"Single base change → one different amino acid (e.g. sickle cell Glu→Val)."},{"term":"Nonsense mutation","def":"Creates a premature stop codon → truncated, usually non-functional protein."},{"term":"Frameshift","def":"Insertion/deletion not divisible by 3 → reading frame shifted → garbled protein."},{"term":"Mismatch repair (MMR)","def":"Corrects replication mismatches; defective in Lynch syndrome; MSI-high tumours respond to immunotherapy."},{"term":"Nucleotide excision repair (NER)","def":"Removes bulky/UV lesions; defective in xeroderma pigmentosum."},{"term":"Homologous recombination / BRCA","def":"Accurate double-strand-break repair; BRCA1/2 loss → cancer and PARP-inhibitor sensitivity."},{"term":"Synthetic lethality","def":"Two individually tolerable defects are lethal together — the basis of PARP-inhibitor therapy in BRCA cancers."}]}},"pq":[{"id":"bio-1","topic":"Cell Structure","question":"Which organelle is primarily responsible for drug metabolism via cytochrome P450 enzymes?","options":["Rough endoplasmic reticulum","Smooth endoplasmic reticulum","Golgi apparatus","Mitochondria"],"answer":1,"explanation":"Cytochrome P450 enzymes are located in the smooth ER (SER). The SER also synthesizes lipids and steroid hormones. Rough ER is involved in secretory protein synthesis (studded with ribosomes)."},{"id":"bio-2","topic":"Cell Structure","question":"A drug targets the 30S ribosomal subunit. Which type of cells will be primarily affected?","options":["Human liver cells (hepatocytes)","Bacterial cells","Both bacterial and eukaryotic cells equally","Plant cells only"],"answer":1,"explanation":"30S is a subunit of the 70S prokaryotic ribosome. Human cells have 80S ribosomes (40S + 60S). This selectivity is exploited by antibiotics like tetracyclines and aminoglycosides, which target the 30S subunit of bacteria."},{"id":"bio-3","topic":"Cell Structure","question":"What is the function of the Golgi apparatus in the secretory pathway?","options":["Synthesizes proteins on ribosomes","Packages and modifies proteins for secretion","Generates ATP via oxidative phosphorylation","Digests engulfed bacteria"],"answer":1,"explanation":"The Golgi apparatus receives vesicles from the rough ER, modifies proteins (glycosylation, phosphorylation, sulfation), and packages them into vesicles for delivery to the cell surface, lysosomes, or secretion."},{"id":"bio-4","topic":"Cell Structure","question":"Which of the following features is UNIQUE to eukaryotic cells?","options":["Ribosomes","Cell membrane","Membrane-bound nucleus","Circular DNA"],"answer":2,"explanation":"Membrane-bound nucleus is the defining feature of eukaryotic cells. Both prokaryotes and eukaryotes have ribosomes and cell membranes. Circular DNA is found in prokaryotes (and also in mitochondria), but linear chromosomal DNA in the nucleus is unique to eukaryotes."},{"id":"bio-5","topic":"Cell Structure","question":"Paclitaxel (taxol) exerts its anti-cancer effect by:","options":["Inhibiting DNA replication","Stabilizing microtubules, preventing spindle disassembly","Blocking protein synthesis at the ribosome","Inhibiting topoisomerase II"],"answer":1,"explanation":"Paclitaxel stabilizes microtubule polymers (prevents depolymerization), locking the cell in mitosis. The spindle cannot disassemble properly, triggering the spindle assembly checkpoint and leading to apoptosis. This is the opposite mechanism to vinca alkaloids, which prevent microtubule polymerization."},{"id":"bio-6","topic":"Transport","question":"A red blood cell placed in a 0.45% NaCl solution will:","options":["Undergo crenation (shrink)","Remain unchanged","Swell and potentially lyse","Immediately die"],"answer":2,"explanation":"0.45% NaCl is hypotonic (normal is 0.9%). Water moves by osmosis into the cell (from lower solute concentration outside to higher solute inside) → cell swells → hemolysis. This is relevant to IV fluid administration."},{"id":"bio-7","topic":"Transport","question":"Which transport mechanism requires both a concentration gradient AND a carrier protein, but NO energy?","options":["Simple diffusion","Facilitated diffusion","Active transport","Endocytosis"],"answer":1,"explanation":"Facilitated diffusion uses carrier proteins or channel proteins to transport molecules down their concentration gradient — no ATP required. Examples include glucose transport via GLUT transporters."},{"id":"bio-8","topic":"Transport","question":"Digoxin treats heart failure by inhibiting Na⁺/K⁺ ATPase. What is the DIRECT consequence of this inhibition?","options":["Decreased intracellular Ca²⁺","Increased intracellular Na⁺","Decreased heart rate","Increased K⁺ uptake"],"answer":1,"explanation":"Inhibiting Na⁺/K⁺ ATPase prevents pumping 3 Na⁺ out of the cell → intracellular Na⁺ rises. This then reduces the Na⁺/Ca²⁺ exchanger efficiency → intracellular Ca²⁺ rises → stronger cardiac contraction (positive inotropy)."},{"id":"bio-9","topic":"Transport","question":"The Henderson-Hasselbalch equation predicts that a weak acid drug (pKa = 4) will be mostly _______ at physiologic pH 7.4.","options":["Un-ionized (neutral)","Ionized (negatively charged)","Ionized (positively charged)","Equally ionized and un-ionized"],"answer":1,"explanation":"pH > pKa → the acid is predominantly in its ionized (deprotonated, A⁻) form. At pH 7.4 with pKa 4, the ratio [A⁻]/[HA] = 10^(7.4−4) = 10^3.4 → vastly more ionized. Ionized drugs do not cross membranes well → decreased absorption/penetration."},{"id":"bio-10","topic":"Transport","question":"Which of the following is an example of secondary active transport?","options":["Na⁺/K⁺ ATPase","Na⁺-glucose cotransporter (SGLT)","Osmosis of water","Receptor-mediated endocytosis of LDL"],"answer":1,"explanation":"SGLT (sodium-glucose linked transporter) moves glucose against its gradient using the energy stored in the Na⁺ electrochemical gradient (established by Na⁺/K⁺ ATPase — primary active transport). This is secondary active transport (symport). SGLT2 inhibitors (gliflozins) block this in the kidney → glucose excreted in urine → lower blood glucose in diabetes."},{"id":"bio-11","topic":"Cell Division","question":"During which phase of mitosis do sister chromatids separate and move to opposite poles?","options":["Prophase","Metaphase","Anaphase","Telophase"],"answer":2,"explanation":"In Anaphase, the centromere splits and sister chromatids (now individual chromosomes) are pulled to opposite poles by shortening spindle fibers. Metaphase = alignment at equator. Telophase = nuclear envelope reforms."},{"id":"bio-12","topic":"Cell Division","question":"Meiosis II is most similar to which process?","options":["Meiosis I","Mitosis","DNA replication","Transcription"],"answer":1,"explanation":"Meiosis II separates sister chromatids (like mitosis), without prior DNA replication. Meiosis I separates homologous chromosomes (the reductional division), which is unique to meiosis."},{"id":"bio-13","topic":"Cell Division","question":"A cell has 46 chromosomes at the start of meiosis. How many chromosomes are in each daughter cell after meiosis II?","options":["92","46","23","12"],"answer":2,"explanation":"Meiosis I halves the chromosome number (46 → 23 per cell). Meiosis II separates sister chromatids but does NOT change the chromosome number. Result: 4 haploid (n = 23) cells."},{"id":"bio-14","topic":"Cell Division","question":"Vincristine (a vinca alkaloid) prevents mitosis by:","options":["Stabilizing microtubules","Inhibiting DNA synthesis","Preventing tubulin polymerization → no spindle formation","Blocking the G₁ checkpoint"],"answer":2,"explanation":"Vinca alkaloids (vincristine, vinblastine) bind tubulin dimers and prevent polymerization → no functional spindle → cells arrested in M phase → apoptosis. Used in leukemia and lymphoma treatment."},{"id":"bio-15","topic":"Cell Division","question":"Trisomy 21 (Down syndrome) most commonly results from:","options":["A gene mutation in chromosome 21","Nondisjunction during meiosis I","A chromosomal translocation","X-linked inheritance"],"answer":1,"explanation":"About 95% of Down syndrome cases are due to nondisjunction during maternal Meiosis I, when homologous chromosomes 21 fail to separate properly. The resulting egg has two copies of chromosome 21, and fertilization adds a third."},{"id":"bio-16","topic":"DNA Replication","question":"Which enzyme synthesizes short RNA primers during DNA replication?","options":["DNA polymerase I","DNA ligase","Primase","Helicase"],"answer":2,"explanation":"Primase (an RNA polymerase) synthesizes short RNA primers complementary to the template strand. These primers provide the 3′-OH needed by DNA polymerase III to start synthesis. DNA polymerase I later removes primers and fills gaps with DNA."},{"id":"bio-17","topic":"DNA Replication","question":"Fluoroquinolones (e.g., ciprofloxacin) kill bacteria by inhibiting:","options":["Cell wall synthesis","Protein synthesis at the 30S ribosome","DNA gyrase (topoisomerase II)","RNA polymerase"],"answer":2,"explanation":"Fluoroquinolones inhibit bacterial DNA gyrase and topoisomerase IV → cannot relieve supercoiling ahead of the replication fork → DNA replication and transcription fail → bactericidal. Human topoisomerase II has low affinity for fluoroquinolones."},{"id":"bio-18","topic":"DNA Replication","question":"On which strand of DNA are Okazaki fragments synthesized?","options":["Leading strand","Lagging strand","Both strands equally","Template strand only"],"answer":1,"explanation":"Okazaki fragments are synthesized on the lagging strand. Because DNA polymerase can only synthesize 5→3 (5' to 3') and the lagging strand runs antiparallel to the fork direction, synthesis must occur discontinuously in short fragments, each requiring its own primer."},{"id":"bio-19","topic":"DNA Replication","question":"In Chargaff's rules, if a DNA molecule contains 30% adenine, what percentage is guanine?","options":["30%","20%","70%","10%"],"answer":1,"explanation":"Chargaff: %A = %T and %G = %C. If %A = 30%, then %T = 30%, so %A + %T = 60%. Remaining for G + C = 40%, so %G = %C = 20%."},{"id":"bio-20","topic":"Gene Expression","question":"Which antibiotic inhibits bacterial RNA polymerase and is used to treat tuberculosis?","options":["Tetracycline","Rifampicin","Erythromycin","Ampicillin"],"answer":1,"explanation":"Rifampicin (rifampin) specifically inhibits the β-subunit of bacterial RNA polymerase → blocks transcription. It does not affect eukaryotic RNA polymerase. Used for TB, leprosy, and meningococcal prophylaxis."},{"id":"bio-21","topic":"Gene Expression","question":"Which of the following is NOT a stop codon?","options":["UAA","UAG","UGA","UGG"],"answer":3,"explanation":"Stop codons are UAA, UAG, UGA. UGG encodes tryptophan (Trp/W) — the only codon that does. This makes tryptophan unique as the amino acid with the fewest codons (only 1)."},{"id":"bio-22","topic":"Gene Expression","question":"Erythromycin, a macrolide antibiotic, inhibits bacterial protein synthesis by:","options":["Binding to 30S ribosome and causing misreading","Binding to 50S ribosome and blocking translocation","Inhibiting RNA polymerase","Preventing aminoacyl-tRNA from entering A site"],"answer":1,"explanation":"Macrolides (erythromycin, azithromycin, clarithromycin) bind to the 23S rRNA of the 50S subunit and block the ribosome exit tunnel, preventing translocation and elongation of the peptide chain."},{"id":"bio-23","topic":"Gene Expression","question":"Post-transcriptional modifications of eukaryotic pre-mRNA include all EXCEPT:","options":["5' cap addition","3' poly-A tail addition","Intron splicing","Codon editing at the ribosome"],"answer":3,"explanation":"5' capping, 3' polyadenylation, and splicing are all post-transcriptional modifications in the nucleus before the mRNA is exported. Codon editing does not occur at the ribosome — ribosomes read codons but do not modify them."},{"id":"bio-24","topic":"Genetics","question":"Two phenotypically normal parents have a child with cystic fibrosis (autosomal recessive). What is the probability that their next child will be affected?","options":["0%","25%","50%","75%"],"answer":1,"explanation":"Both parents must be carriers (Aa × Aa). Each pregnancy: 1/4 AA (normal), 1/2 Aa (carrier), 1/4 aa (affected). So 25% probability per child, regardless of previous children's phenotypes."},{"id":"bio-25","topic":"Genetics","question":"Which inheritance pattern shows no father-to-son transmission?","options":["Autosomal dominant","Autosomal recessive","X-linked recessive","Mitochondrial"],"answer":2,"explanation":"In X-linked recessive inheritance, fathers pass their X chromosome only to daughters (XY → X to daughters, Y to sons). Sons inherit Y from father and X from mother. Therefore, no father-to-son transmission of X-linked traits."},{"id":"bio-26","topic":"Genetics","question":"A patient with G6PD deficiency (X-linked recessive) takes primaquine for malaria prophylaxis. What is the likely complication?","options":["Nephrotoxicity","Hemolytic anemia","Serotonin syndrome","QT prolongation"],"answer":1,"explanation":"G6PD (glucose-6-phosphate dehydrogenase) deficiency impairs the hexose monophosphate shunt → decreased NADPH → decreased glutathione → RBCs vulnerable to oxidative stress. Oxidizing drugs like primaquine, dapsone, and nitrofurantoin trigger hemolysis in these patients."},{"id":"bio-27","topic":"Genetics","question":"Which of the following is an example of codominance?","options":["Pink flowers in snapdragons (red × white)","ABO blood type (AB individual)","Height being influenced by many genes","Albinism in recessive homozygotes"],"answer":1,"explanation":"Blood type AB shows codominance — both A and B antigens are expressed on red blood cells. Incomplete dominance (pink snapdragons) shows blending. Height is polygenic. Albinism is simple recessive."},{"id":"bio-28","topic":"Mutations","question":"Sickle cell disease results from a missense mutation. What type of mutation causes this?","options":["A single base insertion","Deletion of 3 nucleotides","A single base substitution (GAG → GTG)","A splice site mutation"],"answer":2,"explanation":"Sickle cell anemia is caused by a point mutation: codon 6 of β-globin gene changes from GAG (glutamate) to GTG (valine). This is a missense mutation — single base substitution causing an amino acid change. The resulting HbS polymerizes under low oxygen conditions."},{"id":"bio-29","topic":"Mutations","question":"Which DNA repair system is defective in Xeroderma Pigmentosum (XP)?","options":["Base excision repair","Mismatch repair","Nucleotide excision repair","Homologous recombination"],"answer":2,"explanation":"XP patients have defective nucleotide excision repair (NER), which normally removes bulky DNA adducts and UV-induced thymine dimers. Without NER, UV lesions accumulate → mutations in tumor suppressor genes (especially p53) → extremely high skin cancer risk."},{"id":"bio-30","topic":"Mutations","question":"BRCA1/BRCA2 mutations increase cancer risk because they impair:","options":["Base excision repair (BER)","Mismatch repair (MMR)","Non-homologous end joining (NHEJ)","Homologous recombination (HR)"],"answer":3,"explanation":"BRCA1 and BRCA2 proteins are essential for homologous recombination (HR) — the accurate repair of double-strand breaks. When HR is defective, cells rely on error-prone NHEJ → mutations accumulate → cancer. PARP inhibitors (olaparib) exploit this by preventing BER, creating synthetic lethality."},{"id":"bio-31","topic":"Cell Structure","question":"Which statement about mitochondria is CORRECT?","options":["They contain 80S ribosomes","They have a single membrane","They contain their own circular DNA","They are found only in animal cells"],"answer":2,"explanation":"Mitochondria have their own circular DNA and 70S ribosomes (not 80S), supporting the endosymbiotic theory. They have a double membrane (outer membrane and inner membrane with cristae). Both plant and animal cells contain mitochondria."},{"id":"bio-32","topic":"Gene Regulation","question":"Patisiran is approved for treatment of hereditary transthyretin amyloidosis. It works by:","options":["Inhibiting DNA methyltransferase","Activating histone deacetylase","siRNA-mediated degradation of TTR mRNA","Blocking the lac operon"],"answer":2,"explanation":"Patisiran is the first FDA-approved siRNA drug. It delivers siRNA that targets and degrades TTR (transthyretin) mRNA in liver cells → reduced TTR protein → less amyloid deposition in nerves and heart."},{"id":"bio-33","topic":"Cell Division","question":"The spindle assembly checkpoint ensures that:","options":["DNA is fully replicated before S phase ends","All chromosomes are attached to spindle fibers before anaphase","Cytokinesis occurs after nuclear division","Growth factors are present in G₁"],"answer":1,"explanation":"The spindle assembly checkpoint (SAC) prevents anaphase onset until every kinetochore is properly attached to spindle fibers from opposite poles (amphitelic attachment). This prevents aneuploidy. Anti-cancer drugs targeting spindle (paclitaxel, vincristine) trigger this checkpoint."},{"id":"bio-34","topic":"Transport","question":"SGLT2 inhibitors (e.g., empagliflozin) lower blood glucose in type 2 diabetes by:","options":["Stimulating insulin secretion from pancreatic β-cells","Increasing glucose uptake by muscle cells","Blocking glucose reabsorption in proximal tubule of kidney","Inhibiting hepatic glucose production"],"answer":2,"explanation":"SGLT2 (sodium-glucose cotransporter 2) is responsible for reabsorbing ~90% of filtered glucose in the proximal convoluted tubule. SGLT2 inhibitors block this → glucosuria (glucose excreted in urine) → lower plasma glucose. They also have cardiovascular and renal protective effects."},{"id":"bio-35","topic":"Genetics","question":"A pharmacist screens a patient for HLA-B*57:01 before prescribing which drug?","options":["Warfarin","Abacavir","Codeine","Azathioprine"],"answer":1,"explanation":"HLA-B*57:01 allele is strongly associated with a severe hypersensitivity reaction (HSR) to abacavir (an NRTI antiretroviral). Screening before prescribing is mandatory — positive patients must NOT receive abacavir. This is a landmark example of pharmacogenetic screening in HIV therapy."},{"id":"bio-36","topic":"Gene Expression","question":"HDAC inhibitors (e.g., vorinostat) are used in cancer treatment because they:","options":["Cause histone deacetylation → compact chromatin → silence oncogenes","Prevent histone deacetylation → open chromatin → re-express silenced tumor suppressor genes","Block RNA polymerase transcription","Inhibit the spliceosome"],"answer":1,"explanation":"Histone deacetylase (HDAC) removes acetyl groups from histones → DNA wraps tightly (heterochromatin) → gene silencing. HDAC inhibitors prevent this → hyperacetylation → open chromatin (euchromatin) → tumor suppressor genes (silenced by aberrant HDAC activity in cancer) are re-expressed."},{"id":"bio-37","topic":"Mutations","question":"The \"synthetic lethality\" concept underlies the clinical use of PARP inhibitors. This means:","options":["PARP inhibitors kill all cells including normal ones","BRCA-mutated cells die when PARP is also inhibited, while normal cells survive","Two drugs are combined to kill cancer cells","PARP inhibitors cause DNA mutations"],"answer":1,"explanation":"BRCA1/2-mutated cells cannot repair double-strand breaks by HR. Normal BER (via PARP) becomes essential. PARP inhibitors block BER → DSBs accumulate → BRCA-deficient cancer cells die. Normal cells survive because they use HR as backup. This selective killing is synthetic lethality."},{"id":"bio-38","topic":"Cell Division","question":"Cyclins are regulatory proteins that control cell cycle progression. Which cyclin-CDK complex is responsible for the G₁ → S transition?","options":["Cyclin B - CDK1","Cyclin D - CDK4/6","Cyclin A - CDK2","Cyclin E - CDK1"],"answer":1,"explanation":"Cyclin D/CDK4 and CDK6 phosphorylate Rb (retinoblastoma protein) → releases E2F transcription factors → S phase genes expressed. CDK4/6 inhibitors (palbociclib, ribociclib) are used in breast cancer. Cyclin B/CDK1 (MPF) drives G₂ → M."},{"id":"bio-39","topic":"Gene Regulation","question":"Lynch syndrome (hereditary nonpolyposis colorectal cancer, HNPCC) results from mutations in:","options":["BRCA1 or BRCA2","Mismatch repair genes (MLH1, MSH2, MSH6)","p53 tumor suppressor","NER genes"],"answer":1,"explanation":"Lynch syndrome is caused by germline mutations in mismatch repair (MMR) genes, most commonly MLH1, MSH2, MSH6, and PMS2. MMR deficiency → microsatellite instability (MSI-H) → accumulation of replication errors → colorectal, endometrial, and other cancers. MSI-H tumors respond well to immune checkpoint inhibitors (pembrolizumab)."},{"id":"bio-40","topic":"Cell Membrane","question":"Cholesterol's role in the plasma membrane includes:","options":["Acting as a transport protein for ions","Providing energy via oxidative phosphorylation","Modulating membrane fluidity at different temperatures","Providing structural rigidity like a cell wall"],"answer":2,"explanation":"Cholesterol is amphipathic and inserts between phospholipids. At high temperatures, it restrains phospholipid movement (reduces fluidity). At low temperatures, it prevents phospholipids from packing tightly (prevents crystallization/gel state). Overall, cholesterol buffers and stabilizes membrane fluidity."}],"eq":[{"id":"bio-1","topic":"Cell Structure","question":"Which organelle is primarily responsible for drug metabolism via cytochrome P450 enzymes?","options":["Rough endoplasmic reticulum","Smooth endoplasmic reticulum","Golgi apparatus","Mitochondria"],"answer":1,"explanation":"Cytochrome P450 enzymes are located in the smooth ER (SER). The SER also synthesizes lipids and steroid hormones. Rough ER is involved in secretory protein synthesis (studded with ribosomes)."},{"id":"bio-2","topic":"Cell Structure","question":"A drug targets the 30S ribosomal subunit. Which type of cells will be primarily affected?","options":["Human liver cells (hepatocytes)","Bacterial cells","Both bacterial and eukaryotic cells equally","Plant cells only"],"answer":1,"explanation":"30S is a subunit of the 70S prokaryotic ribosome. Human cells have 80S ribosomes (40S + 60S). This selectivity is exploited by antibiotics like tetracyclines and aminoglycosides, which target the 30S subunit of bacteria."},{"id":"bio-3","topic":"Cell Structure","question":"What is the function of the Golgi apparatus in the secretory pathway?","options":["Synthesizes proteins on ribosomes","Packages and modifies proteins for secretion","Generates ATP via oxidative phosphorylation","Digests engulfed bacteria"],"answer":1,"explanation":"The Golgi apparatus receives vesicles from the rough ER, modifies proteins (glycosylation, phosphorylation, sulfation), and packages them into vesicles for delivery to the cell surface, lysosomes, or secretion."},{"id":"bio-4","topic":"Cell Structure","question":"Which of the following features is UNIQUE to eukaryotic cells?","options":["Ribosomes","Cell membrane","Membrane-bound nucleus","Circular DNA"],"answer":2,"explanation":"Membrane-bound nucleus is the defining feature of eukaryotic cells. Both prokaryotes and eukaryotes have ribosomes and cell membranes. Circular DNA is found in prokaryotes (and also in mitochondria), but linear chromosomal DNA in the nucleus is unique to eukaryotes."},{"id":"bio-5","topic":"Cell Structure","question":"Paclitaxel (taxol) exerts its anti-cancer effect by:","options":["Inhibiting DNA replication","Stabilizing microtubules, preventing spindle disassembly","Blocking protein synthesis at the ribosome","Inhibiting topoisomerase II"],"answer":1,"explanation":"Paclitaxel stabilizes microtubule polymers (prevents depolymerization), locking the cell in mitosis. The spindle cannot disassemble properly, triggering the spindle assembly checkpoint and leading to apoptosis. This is the opposite mechanism to vinca alkaloids, which prevent microtubule polymerization."},{"id":"bio-6","topic":"Transport","question":"A red blood cell placed in a 0.45% NaCl solution will:","options":["Undergo crenation (shrink)","Remain unchanged","Swell and potentially lyse","Immediately die"],"answer":2,"explanation":"0.45% NaCl is hypotonic (normal is 0.9%). Water moves by osmosis into the cell (from lower solute concentration outside to higher solute inside) → cell swells → hemolysis. This is relevant to IV fluid administration."},{"id":"bio-7","topic":"Transport","question":"Which transport mechanism requires both a concentration gradient AND a carrier protein, but NO energy?","options":["Simple diffusion","Facilitated diffusion","Active transport","Endocytosis"],"answer":1,"explanation":"Facilitated diffusion uses carrier proteins or channel proteins to transport molecules down their concentration gradient — no ATP required. Examples include glucose transport via GLUT transporters."},{"id":"bio-8","topic":"Transport","question":"Digoxin treats heart failure by inhibiting Na⁺/K⁺ ATPase. What is the DIRECT consequence of this inhibition?","options":["Decreased intracellular Ca²⁺","Increased intracellular Na⁺","Decreased heart rate","Increased K⁺ uptake"],"answer":1,"explanation":"Inhibiting Na⁺/K⁺ ATPase prevents pumping 3 Na⁺ out of the cell → intracellular Na⁺ rises. This then reduces the Na⁺/Ca²⁺ exchanger efficiency → intracellular Ca²⁺ rises → stronger cardiac contraction (positive inotropy)."},{"id":"bio-9","topic":"Transport","question":"The Henderson-Hasselbalch equation predicts that a weak acid drug (pKa = 4) will be mostly _______ at physiologic pH 7.4.","options":["Un-ionized (neutral)","Ionized (negatively charged)","Ionized (positively charged)","Equally ionized and un-ionized"],"answer":1,"explanation":"pH > pKa → the acid is predominantly in its ionized (deprotonated, A⁻) form. At pH 7.4 with pKa 4, the ratio [A⁻]/[HA] = 10^(7.4−4) = 10^3.4 → vastly more ionized. Ionized drugs do not cross membranes well → decreased absorption/penetration."},{"id":"bio-10","topic":"Transport","question":"Which of the following is an example of secondary active transport?","options":["Na⁺/K⁺ ATPase","Na⁺-glucose cotransporter (SGLT)","Osmosis of water","Receptor-mediated endocytosis of LDL"],"answer":1,"explanation":"SGLT (sodium-glucose linked transporter) moves glucose against its gradient using the energy stored in the Na⁺ electrochemical gradient (established by Na⁺/K⁺ ATPase — primary active transport). This is secondary active transport (symport). SGLT2 inhibitors (gliflozins) block this in the kidney → glucose excreted in urine → lower blood glucose in diabetes."},{"id":"bio-11","topic":"Cell Division","question":"During which phase of mitosis do sister chromatids separate and move to opposite poles?","options":["Prophase","Metaphase","Anaphase","Telophase"],"answer":2,"explanation":"In Anaphase, the centromere splits and sister chromatids (now individual chromosomes) are pulled to opposite poles by shortening spindle fibers. Metaphase = alignment at equator. Telophase = nuclear envelope reforms."},{"id":"bio-12","topic":"Cell Division","question":"Meiosis II is most similar to which process?","options":["Meiosis I","Mitosis","DNA replication","Transcription"],"answer":1,"explanation":"Meiosis II separates sister chromatids (like mitosis), without prior DNA replication. Meiosis I separates homologous chromosomes (the reductional division), which is unique to meiosis."},{"id":"bio-13","topic":"Cell Division","question":"A cell has 46 chromosomes at the start of meiosis. How many chromosomes are in each daughter cell after meiosis II?","options":["92","46","23","12"],"answer":2,"explanation":"Meiosis I halves the chromosome number (46 → 23 per cell). Meiosis II separates sister chromatids but does NOT change the chromosome number. Result: 4 haploid (n = 23) cells."},{"id":"bio-14","topic":"Cell Division","question":"Vincristine (a vinca alkaloid) prevents mitosis by:","options":["Stabilizing microtubules","Inhibiting DNA synthesis","Preventing tubulin polymerization → no spindle formation","Blocking the G₁ checkpoint"],"answer":2,"explanation":"Vinca alkaloids (vincristine, vinblastine) bind tubulin dimers and prevent polymerization → no functional spindle → cells arrested in M phase → apoptosis. Used in leukemia and lymphoma treatment."},{"id":"bio-15","topic":"Cell Division","question":"Trisomy 21 (Down syndrome) most commonly results from:","options":["A gene mutation in chromosome 21","Nondisjunction during meiosis I","A chromosomal translocation","X-linked inheritance"],"answer":1,"explanation":"About 95% of Down syndrome cases are due to nondisjunction during maternal Meiosis I, when homologous chromosomes 21 fail to separate properly. The resulting egg has two copies of chromosome 21, and fertilization adds a third."},{"id":"bio-16","topic":"DNA Replication","question":"Which enzyme synthesizes short RNA primers during DNA replication?","options":["DNA polymerase I","DNA ligase","Primase","Helicase"],"answer":2,"explanation":"Primase (an RNA polymerase) synthesizes short RNA primers complementary to the template strand. These primers provide the 3′-OH needed by DNA polymerase III to start synthesis. DNA polymerase I later removes primers and fills gaps with DNA."},{"id":"bio-17","topic":"DNA Replication","question":"Fluoroquinolones (e.g., ciprofloxacin) kill bacteria by inhibiting:","options":["Cell wall synthesis","Protein synthesis at the 30S ribosome","DNA gyrase (topoisomerase II)","RNA polymerase"],"answer":2,"explanation":"Fluoroquinolones inhibit bacterial DNA gyrase and topoisomerase IV → cannot relieve supercoiling ahead of the replication fork → DNA replication and transcription fail → bactericidal. Human topoisomerase II has low affinity for fluoroquinolones."},{"id":"bio-18","topic":"DNA Replication","question":"On which strand of DNA are Okazaki fragments synthesized?","options":["Leading strand","Lagging strand","Both strands equally","Template strand only"],"answer":1,"explanation":"Okazaki fragments are synthesized on the lagging strand. Because DNA polymerase can only synthesize 5→3 (5' to 3') and the lagging strand runs antiparallel to the fork direction, synthesis must occur discontinuously in short fragments, each requiring its own primer."},{"id":"bio-19","topic":"DNA Replication","question":"In Chargaff's rules, if a DNA molecule contains 30% adenine, what percentage is guanine?","options":["30%","20%","70%","10%"],"answer":1,"explanation":"Chargaff: %A = %T and %G = %C. If %A = 30%, then %T = 30%, so %A + %T = 60%. Remaining for G + C = 40%, so %G = %C = 20%."},{"id":"bio-20","topic":"Gene Expression","question":"Which antibiotic inhibits bacterial RNA polymerase and is used to treat tuberculosis?","options":["Tetracycline","Rifampicin","Erythromycin","Ampicillin"],"answer":1,"explanation":"Rifampicin (rifampin) specifically inhibits the β-subunit of bacterial RNA polymerase → blocks transcription. It does not affect eukaryotic RNA polymerase. Used for TB, leprosy, and meningococcal prophylaxis."},{"id":"bio-21","topic":"Gene Expression","question":"Which of the following is NOT a stop codon?","options":["UAA","UAG","UGA","UGG"],"answer":3,"explanation":"Stop codons are UAA, UAG, UGA. UGG encodes tryptophan (Trp/W) — the only codon that does. This makes tryptophan unique as the amino acid with the fewest codons (only 1)."},{"id":"bio-22","topic":"Gene Expression","question":"Erythromycin, a macrolide antibiotic, inhibits bacterial protein synthesis by:","options":["Binding to 30S ribosome and causing misreading","Binding to 50S ribosome and blocking translocation","Inhibiting RNA polymerase","Preventing aminoacyl-tRNA from entering A site"],"answer":1,"explanation":"Macrolides (erythromycin, azithromycin, clarithromycin) bind to the 23S rRNA of the 50S subunit and block the ribosome exit tunnel, preventing translocation and elongation of the peptide chain."},{"id":"bio-23","topic":"Gene Expression","question":"Post-transcriptional modifications of eukaryotic pre-mRNA include all EXCEPT:","options":["5' cap addition","3' poly-A tail addition","Intron splicing","Codon editing at the ribosome"],"answer":3,"explanation":"5' capping, 3' polyadenylation, and splicing are all post-transcriptional modifications in the nucleus before the mRNA is exported. Codon editing does not occur at the ribosome — ribosomes read codons but do not modify them."},{"id":"bio-24","topic":"Genetics","question":"Two phenotypically normal parents have a child with cystic fibrosis (autosomal recessive). What is the probability that their next child will be affected?","options":["0%","25%","50%","75%"],"answer":1,"explanation":"Both parents must be carriers (Aa × Aa). Each pregnancy: 1/4 AA (normal), 1/2 Aa (carrier), 1/4 aa (affected). So 25% probability per child, regardless of previous children's phenotypes."},{"id":"bio-25","topic":"Genetics","question":"Which inheritance pattern shows no father-to-son transmission?","options":["Autosomal dominant","Autosomal recessive","X-linked recessive","Mitochondrial"],"answer":2,"explanation":"In X-linked recessive inheritance, fathers pass their X chromosome only to daughters (XY → X to daughters, Y to sons). Sons inherit Y from father and X from mother. Therefore, no father-to-son transmission of X-linked traits."},{"id":"bio-26","topic":"Genetics","question":"A patient with G6PD deficiency (X-linked recessive) takes primaquine for malaria prophylaxis. What is the likely complication?","options":["Nephrotoxicity","Hemolytic anemia","Serotonin syndrome","QT prolongation"],"answer":1,"explanation":"G6PD (glucose-6-phosphate dehydrogenase) deficiency impairs the hexose monophosphate shunt → decreased NADPH → decreased glutathione → RBCs vulnerable to oxidative stress. Oxidizing drugs like primaquine, dapsone, and nitrofurantoin trigger hemolysis in these patients."},{"id":"bio-27","topic":"Genetics","question":"Which of the following is an example of codominance?","options":["Pink flowers in snapdragons (red × white)","ABO blood type (AB individual)","Height being influenced by many genes","Albinism in recessive homozygotes"],"answer":1,"explanation":"Blood type AB shows codominance — both A and B antigens are expressed on red blood cells. Incomplete dominance (pink snapdragons) shows blending. Height is polygenic. Albinism is simple recessive."},{"id":"bio-28","topic":"Mutations","question":"Sickle cell disease results from a missense mutation. What type of mutation causes this?","options":["A single base insertion","Deletion of 3 nucleotides","A single base substitution (GAG → GTG)","A splice site mutation"],"answer":2,"explanation":"Sickle cell anemia is caused by a point mutation: codon 6 of β-globin gene changes from GAG (glutamate) to GTG (valine). This is a missense mutation — single base substitution causing an amino acid change. The resulting HbS polymerizes under low oxygen conditions."},{"id":"bio-29","topic":"Mutations","question":"Which DNA repair system is defective in Xeroderma Pigmentosum (XP)?","options":["Base excision repair","Mismatch repair","Nucleotide excision repair","Homologous recombination"],"answer":2,"explanation":"XP patients have defective nucleotide excision repair (NER), which normally removes bulky DNA adducts and UV-induced thymine dimers. Without NER, UV lesions accumulate → mutations in tumor suppressor genes (especially p53) → extremely high skin cancer risk."},{"id":"bio-30","topic":"Mutations","question":"BRCA1/BRCA2 mutations increase cancer risk because they impair:","options":["Base excision repair (BER)","Mismatch repair (MMR)","Non-homologous end joining (NHEJ)","Homologous recombination (HR)"],"answer":3,"explanation":"BRCA1 and BRCA2 proteins are essential for homologous recombination (HR) — the accurate repair of double-strand breaks. When HR is defective, cells rely on error-prone NHEJ → mutations accumulate → cancer. PARP inhibitors (olaparib) exploit this by preventing BER, creating synthetic lethality."},{"id":"bio-31","topic":"Cell Structure","question":"Which statement about mitochondria is CORRECT?","options":["They contain 80S ribosomes","They have a single membrane","They contain their own circular DNA","They are found only in animal cells"],"answer":2,"explanation":"Mitochondria have their own circular DNA and 70S ribosomes (not 80S), supporting the endosymbiotic theory. They have a double membrane (outer membrane and inner membrane with cristae). Both plant and animal cells contain mitochondria."},{"id":"bio-32","topic":"Gene Regulation","question":"Patisiran is approved for treatment of hereditary transthyretin amyloidosis. It works by:","options":["Inhibiting DNA methyltransferase","Activating histone deacetylase","siRNA-mediated degradation of TTR mRNA","Blocking the lac operon"],"answer":2,"explanation":"Patisiran is the first FDA-approved siRNA drug. It delivers siRNA that targets and degrades TTR (transthyretin) mRNA in liver cells → reduced TTR protein → less amyloid deposition in nerves and heart."},{"id":"bio-33","topic":"Cell Division","question":"The spindle assembly checkpoint ensures that:","options":["DNA is fully replicated before S phase ends","All chromosomes are attached to spindle fibers before anaphase","Cytokinesis occurs after nuclear division","Growth factors are present in G₁"],"answer":1,"explanation":"The spindle assembly checkpoint (SAC) prevents anaphase onset until every kinetochore is properly attached to spindle fibers from opposite poles (amphitelic attachment). This prevents aneuploidy. Anti-cancer drugs targeting spindle (paclitaxel, vincristine) trigger this checkpoint."},{"id":"bio-34","topic":"Transport","question":"SGLT2 inhibitors (e.g., empagliflozin) lower blood glucose in type 2 diabetes by:","options":["Stimulating insulin secretion from pancreatic β-cells","Increasing glucose uptake by muscle cells","Blocking glucose reabsorption in proximal tubule of kidney","Inhibiting hepatic glucose production"],"answer":2,"explanation":"SGLT2 (sodium-glucose cotransporter 2) is responsible for reabsorbing ~90% of filtered glucose in the proximal convoluted tubule. SGLT2 inhibitors block this → glucosuria (glucose excreted in urine) → lower plasma glucose. They also have cardiovascular and renal protective effects."},{"id":"bio-35","topic":"Genetics","question":"A pharmacist screens a patient for HLA-B*57:01 before prescribing which drug?","options":["Warfarin","Abacavir","Codeine","Azathioprine"],"answer":1,"explanation":"HLA-B*57:01 allele is strongly associated with a severe hypersensitivity reaction (HSR) to abacavir (an NRTI antiretroviral). Screening before prescribing is mandatory — positive patients must NOT receive abacavir. This is a landmark example of pharmacogenetic screening in HIV therapy."},{"id":"bio-36","topic":"Gene Expression","question":"HDAC inhibitors (e.g., vorinostat) are used in cancer treatment because they:","options":["Cause histone deacetylation → compact chromatin → silence oncogenes","Prevent histone deacetylation → open chromatin → re-express silenced tumor suppressor genes","Block RNA polymerase transcription","Inhibit the spliceosome"],"answer":1,"explanation":"Histone deacetylase (HDAC) removes acetyl groups from histones → DNA wraps tightly (heterochromatin) → gene silencing. HDAC inhibitors prevent this → hyperacetylation → open chromatin (euchromatin) → tumor suppressor genes (silenced by aberrant HDAC activity in cancer) are re-expressed."},{"id":"bio-37","topic":"Mutations","question":"The \"synthetic lethality\" concept underlies the clinical use of PARP inhibitors. This means:","options":["PARP inhibitors kill all cells including normal ones","BRCA-mutated cells die when PARP is also inhibited, while normal cells survive","Two drugs are combined to kill cancer cells","PARP inhibitors cause DNA mutations"],"answer":1,"explanation":"BRCA1/2-mutated cells cannot repair double-strand breaks by HR. Normal BER (via PARP) becomes essential. PARP inhibitors block BER → DSBs accumulate → BRCA-deficient cancer cells die. Normal cells survive because they use HR as backup. This selective killing is synthetic lethality."},{"id":"bio-38","topic":"Cell Division","question":"Cyclins are regulatory proteins that control cell cycle progression. Which cyclin-CDK complex is responsible for the G₁ → S transition?","options":["Cyclin B - CDK1","Cyclin D - CDK4/6","Cyclin A - CDK2","Cyclin E - CDK1"],"answer":1,"explanation":"Cyclin D/CDK4 and CDK6 phosphorylate Rb (retinoblastoma protein) → releases E2F transcription factors → S phase genes expressed. CDK4/6 inhibitors (palbociclib, ribociclib) are used in breast cancer. Cyclin B/CDK1 (MPF) drives G₂ → M."},{"id":"bio-39","topic":"Gene Regulation","question":"Lynch syndrome (hereditary nonpolyposis colorectal cancer, HNPCC) results from mutations in:","options":["BRCA1 or BRCA2","Mismatch repair genes (MLH1, MSH2, MSH6)","p53 tumor suppressor","NER genes"],"answer":1,"explanation":"Lynch syndrome is caused by germline mutations in mismatch repair (MMR) genes, most commonly MLH1, MSH2, MSH6, and PMS2. MMR deficiency → microsatellite instability (MSI-H) → accumulation of replication errors → colorectal, endometrial, and other cancers. MSI-H tumors respond well to immune checkpoint inhibitors (pembrolizumab)."},{"id":"bio-40","topic":"Cell Membrane","question":"Cholesterol's role in the plasma membrane includes:","options":["Acting as a transport protein for ions","Providing energy via oxidative phosphorylation","Modulating membrane fluidity at different temperatures","Providing structural rigidity like a cell wall"],"answer":2,"explanation":"Cholesterol is amphipathic and inserts between phospholipids. At high temperatures, it restrains phospholipid movement (reduces fluidity). At low temperatures, it prevents phospholipids from packing tightly (prevents crystallization/gel state). Overall, cholesterol buffers and stabilizes membrane fluidity."}]},{"meta":{"id":"chemistry1","title":"General Chemistry 1","code":"203171 / 203173","icon":"⚗️","color":"#1a5276","credits":"3 credits (2 lecture + 1 lab)","semester":"Semester 1, Year 1","description":"Atomic structure, chemical bonding, thermodynamics, equilibrium, acid-base chemistry, and gas laws. Foundation for understanding drug stability and formulation.","chapters":[{"id":"atomic-structure","title":"Atomic Structure & Quantum Theory"},{"id":"bonding","title":"Chemical Bonding & VSEPR"},{"id":"thermodynamics","title":"Thermochemistry & Thermodynamics"},{"id":"equilibrium","title":"Chemical Equilibrium"},{"id":"acid-base","title":"Acid-Base Chemistry & Buffers"},{"id":"gas-laws","title":"Gases & Gas Laws"},{"id":"solutions","title":"Solutions & Concentration"}]},"chapters":{"atomic-structure":{"tag":"Chapter 1 · Chemistry 1","title":"Atomic Structure & Quantum Theory","overview":"Understanding atomic structure explains how elements behave, form bonds, and interact with radiation — essential for spectroscopy in drug analysis and understanding atomic absorption.","sections":[{"title":"Atomic Theory & Subatomic Particles","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Particle\u003c/th>\u003cth>Symbol\u003c/th>\u003cth>Charge\u003c/th>\u003cth>Mass (amu)\u003c/th>\u003cth>Location\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Proton\u003c/td>\u003ctd>p⁺\u003c/td>\u003ctd>+1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Nucleus\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Neutron\u003c/td>\u003ctd>n⁰\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Nucleus\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Electron\u003c/td>\u003ctd>e⁻\u003c/td>\u003ctd>−1\u003c/td>\u003ctd>≈ 0 (1/1836)\u003c/td>\u003ctd>Orbitals around nucleus\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cul>\n            \u003cli>\u003cstrong>Atomic number (Z):\u003c/strong> Number of protons — defines the element\u003c/li>\n            \u003cli>\u003cstrong>Mass number (A):\u003c/strong> Protons + neutrons\u003c/li>\n            \u003cli>\u003cstrong>Isotopes:\u003c/strong> Same Z, different A (e.g., ¹²C, ¹³C, ¹⁴C). Used in radio-isotope labeling in drug metabolism studies.\u003c/li>\n          \u003c/ul>\n        "},{"title":"Quantum Mechanical Model","content":"\n          \u003cp>Electrons exist in orbitals described by quantum numbers, not definite paths (Bohr model limitation).\u003c/p>\n          \u003ch4>Four Quantum Numbers\u003c/h4>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Quantum Number\u003c/th>\u003cth>Symbol\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Values\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Principal\u003c/td>\u003ctd>n\u003c/td>\u003ctd>Energy level (shell)\u003c/td>\u003ctd>1, 2, 3, 4...\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Angular momentum\u003c/td>\u003ctd>l\u003c/td>\u003ctd>Sublevel/shape of orbital\u003c/td>\u003ctd>0 to n−1 (s=0, p=1, d=2, f=3)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Magnetic\u003c/td>\u003ctd>mₗ\u003c/td>\u003ctd>Orientation of orbital\u003c/td>\u003ctd>−l to +l\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Spin\u003c/td>\u003ctd>mₛ\u003c/td>\u003ctd>Electron spin direction\u003c/td>\u003ctd>+½ or −½\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003ch4>Orbital Shapes\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>s orbital (l=0):\u003c/strong> Spherical, 1 per sublevel (max 2 electrons)\u003c/li>\n            \u003cli>\u003cstrong>p orbital (l=1):\u003c/strong> Dumbbell-shaped, 3 per sublevel (max 6 electrons)\u003c/li>\n            \u003cli>\u003cstrong>d orbital (l=2):\u003c/strong> 5 per sublevel (max 10 electrons)\u003c/li>\n            \u003cli>\u003cstrong>f orbital (l=3):\u003c/strong> 7 per sublevel (max 14 electrons)\u003c/li>\n          \u003c/ul>\n          \u003ch4>Rules for Electron Configuration\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Aufbau Principle:\u003c/strong> Fill lowest energy orbitals first (1s, 2s, 2p, 3s, 3p, 4s, 3d...)\u003c/li>\n            \u003cli>\u003cstrong>Pauli Exclusion Principle:\u003c/strong> No two electrons in the same atom can have identical quantum numbers\u003c/li>\n            \u003cli>\u003cstrong>Hund's Rule:\u003c/strong> One electron enters each degenerate orbital before any pairing occurs\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>Example:\u003c/strong> Iron (Fe, Z=26): [Ar] 3d⁶ 4s². Note: 4s fills before 3d. When Fe loses electrons: Fe²⁺ = [Ar] 3d⁶ (loses 4s electrons first)\u003c/div>\n        "},{"title":"Periodic Trends","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Property\u003c/th>\u003cth>Across Period (→)\u003c/th>\u003cth>Down Group (↓)\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Atomic radius\u003c/td>\u003ctd>Decreases (more protons, same shell)\u003c/td>\u003ctd>Increases (more shells)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Ionization energy (IE)\u003c/td>\u003ctd>Increases (harder to remove e⁻)\u003c/td>\u003ctd>Decreases\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Electron affinity\u003c/td>\u003ctd>Generally increases\u003c/td>\u003ctd>Decreases\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Electronegativity\u003c/td>\u003ctd>Increases (F highest: 4.0)\u003c/td>\u003ctd>Decreases\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Metallic character\u003c/td>\u003ctd>Decreases\u003c/td>\u003ctd>Increases\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box key\">\u003cstrong>Electronegativity matters in pharmacy:\u003c/strong> Large electronegativity differences between bonded atoms → polar bonds → polar molecules → water solubility. This affects drug formulation and absorption.\u003c/div>\n        "}],"keyTerms":[{"term":"Isotope","def":"Atoms of the same element with different neutron numbers (same Z, different A)."},{"term":"Orbital","def":"Region of space where there is high probability of finding an electron."},{"term":"Electronegativity","def":"Measure of an atom's tendency to attract electrons in a bond. Fluorine = 4.0 (highest)."},{"term":"Ionization energy","def":"Energy required to remove an electron from a neutral gaseous atom."},{"term":"Aufbau principle","def":"Electrons fill the lowest available energy orbitals first."}]},"bonding":{"tag":"Chapter 2 · Chemistry 1","title":"Chemical Bonding & VSEPR","overview":"Chemical bonds determine molecular shape, polarity, and reactivity. Molecular shape governs how drugs fit into receptor binding sites — key for pharmacology.","sections":[{"title":"Types of Chemical Bonds","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Bond Type\u003c/th>\u003cth>Formation\u003c/th>\u003cth>Electronegativity Difference\u003c/th>\u003cth>Examples\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Ionic\u003c/td>\u003ctd>Complete electron transfer from metal to nonmetal\u003c/td>\u003ctd>> 1.7\u003c/td>\u003ctd>NaCl, MgO, CaCl₂\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Polar covalent\u003c/td>\u003ctd>Unequal electron sharing\u003c/td>\u003ctd>0.5–1.7\u003c/td>\u003ctd>H₂O, HCl, NH₃\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Nonpolar covalent\u003c/td>\u003ctd>Equal electron sharing\u003c/td>\u003ctd>\u003c 0.5\u003c/td>\u003ctd>H₂, Cl₂, CH₄\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Metallic\u003c/td>\u003ctd>Electron sea (delocalized)\u003c/td>\u003ctd>—\u003c/td>\u003ctd>Cu, Fe, alloys\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "},{"title":"Intermolecular Forces (IMFs)","content":"\n          \u003cp>IMFs determine boiling point, melting point, solubility, and drug absorption. Stronger IMF = higher boiling point.\u003c/p>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>IMF\u003c/th>\u003cth>Present in\u003c/th>\u003cth>Relative Strength\u003c/th>\u003cth>Pharmacy Relevance\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Hydrogen bonding\u003c/td>\u003ctd>Molecules with N-H, O-H, or F-H bonds\u003c/td>\u003ctd>Strong\u003c/td>\u003ctd>Drug-receptor interactions; protein folding; DNA base pairing\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Dipole-dipole\u003c/td>\u003ctd>Polar molecules\u003c/td>\u003ctd>Moderate\u003c/td>\u003ctd>Solubility in polar solvents\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>London dispersion (van der Waals)\u003c/td>\u003ctd>All molecules; stronger in larger/heavier molecules\u003c/td>\u003ctd>Weak–moderate\u003c/td>\u003ctd>Binding in hydrophobic pockets of enzyme/receptor\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Ion-dipole\u003c/td>\u003ctd>Ions in polar solvents\u003c/td>\u003ctd>Strongest\u003c/td>\u003ctd>Drug dissolution; electrolyte solutions\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>\"Like dissolves like\":\u003c/strong> Polar/ionic solutes dissolve in polar solvents (water). Nonpolar solutes dissolve in nonpolar solvents. Lipophilic drugs dissolve in lipid membranes.\u003c/div>\n        "},{"title":"VSEPR Theory — Molecular Geometry","content":"\n          \u003cp>Valence Shell Electron Pair Repulsion (VSEPR) predicts molecular shape: electron pairs repel each other and adopt geometry that maximizes distance between them.\u003c/p>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Electron pairs (total)\u003c/th>\u003cth>Lone pairs\u003c/th>\u003cth>Shape\u003c/th>\u003cth>Bond Angle\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>2\u003c/td>\u003ctd>0\u003c/td>\u003ctd>Linear\u003c/td>\u003ctd>180°\u003c/td>\u003ctd>CO₂, BeCl₂\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>3\u003c/td>\u003ctd>0\u003c/td>\u003ctd>Trigonal planar\u003c/td>\u003ctd>120°\u003c/td>\u003ctd>BF₃, SO₃\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>3\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Bent/V-shaped\u003c/td>\u003ctd>~117°\u003c/td>\u003ctd>SO₂\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>4\u003c/td>\u003ctd>0\u003c/td>\u003ctd>Tetrahedral\u003c/td>\u003ctd>109.5°\u003c/td>\u003ctd>CH₄, CCl₄\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>4\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Trigonal pyramidal\u003c/td>\u003ctd>~107°\u003c/td>\u003ctd>NH₃\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>4\u003c/td>\u003ctd>2\u003c/td>\u003ctd>Bent/V-shaped\u003c/td>\u003ctd>~104.5°\u003c/td>\u003ctd>H₂O\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>5\u003c/td>\u003ctd>0\u003c/td>\u003ctd>Trigonal bipyramidal\u003c/td>\u003ctd>90°/120°\u003c/td>\u003ctd>PCl₅\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>6\u003c/td>\u003ctd>0\u003c/td>\u003ctd>Octahedral\u003c/td>\u003ctd>90°\u003c/td>\u003ctd>SF₆\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box key\">\u003cstrong>Drug-receptor geometry:\u003c/strong> The shape and polarity of a drug molecule must complement the receptor binding site (lock-and-key or induced fit). VSEPR explains molecular geometry that determines this complementarity.\u003c/div>\n        "},{"title":"Polarity & Dipole Moments","content":"\n          \u003cp>A molecule is polar if it has polar bonds AND the dipole moments do NOT cancel (asymmetric geometry).\u003c/p>\n          \u003cul>\n            \u003cli>\u003cstrong>H₂O:\u003c/strong> Polar bonds + bent shape → polar molecule (large dipole)\u003c/li>\n            \u003cli>\u003cstrong>CO₂:\u003c/strong> Polar bonds + linear shape → dipoles cancel → nonpolar molecule\u003c/li>\n            \u003cli>\u003cstrong>CCl₄:\u003c/strong> Polar bonds + tetrahedral (symmetric) → nonpolar molecule\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>Log P (octanol-water partition):\u003c/strong> Measures drug polarity. High log P = lipophilic (nonpolar) = good membrane permeability. Low log P = hydrophilic = poor membrane permeability. Optimal log P for oral drugs ≈ 0–3.\u003c/div>\n        "}],"keyTerms":[{"term":"Hydrogen bond","def":"Attractive force between a H bonded to electronegative atom (N, O, F) and a lone pair on another electronegative atom. Strongest IMF."},{"term":"VSEPR","def":"Valence Shell Electron Pair Repulsion — predicts molecular geometry based on electron pair repulsion."},{"term":"Dipole moment","def":"Measure of polarity; product of charge difference × bond length. Units: Debye (D)."},{"term":"London dispersion forces","def":"Temporary induced dipole forces between all molecules; stronger in larger/heavier molecules."},{"term":"Log P","def":"Octanol-water partition coefficient; measure of drug lipophilicity. Log P > 0 = more lipophilic."}]},"thermodynamics":{"tag":"Chapter 3 · Chemistry 1","title":"Thermochemistry & Thermodynamics","overview":"Thermodynamics determines whether reactions occur spontaneously — fundamental for understanding drug stability, reactions in formulation, and metabolic processes.","sections":[{"title":"Thermochemistry — Heat & Enthalpy","content":"\n          \u003ch4>Key Definitions\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>System:\u003c/strong> The reaction/substance being studied\u003c/li>\n            \u003cli>\u003cstrong>Surroundings:\u003c/strong> Everything else\u003c/li>\n            \u003cli>\u003cstrong>Endothermic:\u003c/strong> System absorbs heat → ΔH > 0\u003c/li>\n            \u003cli>\u003cstrong>Exothermic:\u003c/strong> System releases heat → ΔH \u003c 0\u003c/li>\n          \u003c/ul>\n          \u003ch4>Enthalpy (ΔH)\u003c/h4>\n          \u003cp>Heat content at constant pressure. Standard conditions: 25°C (298 K), 1 atm.\u003c/p>\n          \u003cdiv class=\"formula-block\">ΔH°rxn = Σ ΔH°f(products) − Σ ΔH°f(reactants)\u003c/div>\n          \u003cp>Hess's Law: Enthalpy is a state function — the path doesn't matter, only initial and final states. ΔH can be calculated by combining steps.\u003c/p>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>Bond energies:\u003c/strong> Breaking bonds = endothermic (+ΔH). Forming bonds = exothermic (−ΔH). Overall ΔH = energy to break bonds − energy released forming bonds.\u003c/div>\n        "},{"title":"Entropy (ΔS) — Disorder","content":"\n          \u003cp>Entropy is a measure of disorder/randomness in a system. The Second Law of Thermodynamics states that total entropy of the universe always increases in spontaneous processes.\u003c/p>\n          \u003cul>\n            \u003cli>Solid → Liquid → Gas: entropy increases (ΔS > 0)\u003c/li>\n            \u003cli>More moles of gas products than reactants: ΔS > 0\u003c/li>\n            \u003cli>Dissolution of ionic solids: usually ΔS > 0 (more disorder)\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"formula-block\">ΔS°rxn = Σ S°(products) − Σ S°(reactants)\u003c/div>\n        "},{"title":"Gibbs Free Energy & Spontaneity","content":"\n          \u003cp>Gibbs Free Energy (ΔG) combines enthalpy and entropy to predict spontaneity:\u003c/p>\n          \u003cdiv class=\"formula-block\">ΔG = ΔH − TΔS\u003c/div>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>ΔH\u003c/th>\u003cth>ΔS\u003c/th>\u003cth>ΔG\u003c/th>\u003cth>Spontaneous?\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>− (exothermic)\u003c/td>\u003ctd>+ (more disorder)\u003c/td>\u003ctd>Always −\u003c/td>\u003ctd>Always spontaneous ✓\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>+ (endothermic)\u003c/td>\u003ctd>− (more order)\u003c/td>\u003ctd>Always +\u003c/td>\u003ctd>Never spontaneous ✗\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>− (exothermic)\u003c/td>\u003ctd>− (less disorder)\u003c/td>\u003ctd>Depends on T\u003c/td>\u003ctd>Spontaneous at low T\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>+ (endothermic)\u003c/td>\u003ctd>+ (more disorder)\u003c/td>\u003ctd>Depends on T\u003c/td>\u003ctd>Spontaneous at high T\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cul>\n            \u003cli>\u003cstrong>ΔG \u003c 0:\u003c/strong> Spontaneous (forward reaction favored)\u003c/li>\n            \u003cli>\u003cstrong>ΔG > 0:\u003c/strong> Non-spontaneous (reverse reaction favored)\u003c/li>\n            \u003cli>\u003cstrong>ΔG = 0:\u003c/strong> Equilibrium\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"formula-block\">ΔG° = −RT ln K\u003c/div>\n          \u003cp>Where R = 8.314 J/(mol·K), T = temperature in Kelvin, K = equilibrium constant.\u003c/p>\n          \u003cdiv class=\"info-box warning\">\u003cstrong>Drug stability:\u003c/strong> Hydrolysis of ester bonds in drugs (e.g., aspirin → salicylic acid + acetic acid) has ΔG \u003c 0 under aqueous conditions — spontaneous degradation. This is why aspirin has a shelf life and formulation must minimize water exposure.\u003c/div>\n        "},{"title":"Calorimetry","content":"\n          \u003cp>Measurement of heat transfer in reactions.\u003c/p>\n          \u003cdiv class=\"formula-block\">q = mcΔT\u003c/div>\n          \u003cp>Where q = heat (J), m = mass (g), c = specific heat capacity (J/g·°C), ΔT = temperature change.\u003c/p>\n          \u003cp>Specific heat of water = 4.184 J/(g·°C) — high specific heat moderates temperature changes in biological systems.\u003c/p>\n        "}],"keyTerms":[{"term":"Enthalpy (ΔH)","def":"Heat content at constant pressure. ΔH \u003c 0 = exothermic; ΔH > 0 = endothermic."},{"term":"Entropy (ΔS)","def":"Measure of disorder/randomness in a system."},{"term":"Gibbs free energy (ΔG)","def":"ΔG = ΔH − TΔS. Predicts spontaneity: ΔG \u003c 0 = spontaneous."},{"term":"Hess's Law","def":"Total ΔH for a reaction is the sum of ΔH for each step, regardless of path taken."},{"term":"Spontaneous reaction","def":"Occurs without input of energy; ΔG \u003c 0 under given conditions."}]},"equilibrium":{"tag":"Chapter 4 · Chemistry 1","title":"Chemical Equilibrium","overview":"Equilibrium describes the balance between forward and reverse reactions. Understanding equilibrium is essential for acid-base chemistry, drug solubility, and receptor binding.","sections":[{"title":"The Equilibrium Constant (K)","content":"\n          \u003cp>For a reversible reaction: aA + bB ⇌ cC + dD\u003c/p>\n          \u003cdiv class=\"formula-block\">K = [C]ᶜ[D]ᵈ / [A]ᵃ[B]ᵇ\u003c/div>\n          \u003cp>At equilibrium, forward rate = reverse rate. K is constant at a given temperature.\u003c/p>\n          \u003cul>\n            \u003cli>\u003cstrong>K >> 1:\u003c/strong> Products favored at equilibrium (reaction goes mostly to completion)\u003c/li>\n            \u003cli>\u003cstrong>K \u003c\u003c 1:\u003c/strong> Reactants favored (reaction barely proceeds)\u003c/li>\n            \u003cli>\u003cstrong>K ≈ 1:\u003c/strong> Significant amounts of both reactants and products\u003c/li>\n          \u003c/ul>\n          \u003cp>Pure solids and pure liquids are NOT included in equilibrium expressions (activity = 1).\u003c/p>\n        "},{"title":"Le Châtelier's Principle","content":"\n          \u003cp>When a system at equilibrium is disturbed, it shifts to minimize the disturbance (restore equilibrium).\u003c/p>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Stress/Change\u003c/th>\u003cth>Equilibrium Shift\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Add reactant\u003c/td>\u003ctd>→ Toward products\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Remove reactant\u003c/td>\u003ctd>← Toward reactants\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Add product\u003c/td>\u003ctd>← Toward reactants\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Remove product\u003c/td>\u003ctd>→ Toward products\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Increase pressure (gas reactions)\u003c/td>\u003ctd>→ Side with fewer moles of gas\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Decrease pressure\u003c/td>\u003ctd>→ Side with more moles of gas\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Increase temperature (endothermic rxn)\u003c/td>\u003ctd>→ Toward products (K increases)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Increase temperature (exothermic rxn)\u003c/td>\u003ctd>← Toward reactants (K decreases)\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Add catalyst\u003c/td>\u003ctd>No shift (both forward and reverse rates increase equally)\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>Drug solubility:\u003c/strong> Common ion effect — adding an ion already present in the equilibrium decreases solubility. E.g., adding NaCl to NaCl-saturated solution. Pharmaceutical formulation exploits this to control drug release.\u003c/div>\n        "},{"title":"Reaction Quotient (Q)","content":"\n          \u003cp>Q has the same expression as K but uses initial concentrations (not equilibrium values).\u003c/p>\n          \u003cul>\n            \u003cli>\u003cstrong>Q \u003c K:\u003c/strong> Reaction proceeds forward (toward products)\u003c/li>\n            \u003cli>\u003cstrong>Q > K:\u003c/strong> Reaction proceeds in reverse (toward reactants)\u003c/li>\n            \u003cli>\u003cstrong>Q = K:\u003c/strong> System is at equilibrium\u003c/li>\n          \u003c/ul>\n        "},{"title":"Solubility Product (Ksp)","content":"\n          \u003cp>Special equilibrium constant for dissolution of sparingly soluble salts.\u003c/p>\n          \u003cdiv class=\"formula-block\">CaF₂(s) ⇌ Ca²⁺(aq) + 2F⁻(aq) &nbsp; Ksp = [Ca²⁺][F⁻]²\u003c/div>\n          \u003cp>A salt precipitates when Q > Ksp. Used in pharmaceutical formulation to predict drug precipitation in body fluids or IV solutions.\u003c/p>\n          \u003cdiv class=\"info-box warning\">\u003cstrong>IV compatibility:\u003c/strong> Calcium gluconate and sodium bicarbonate cannot be mixed in the same IV line because CaCO₃ (Ksp very small) will precipitate → embolism risk.\u003c/div>\n        "}],"keyTerms":[{"term":"Equilibrium constant (K)","def":"Ratio of product concentrations to reactant concentrations at equilibrium, each raised to the power of stoichiometric coefficient."},{"term":"Le Châtelier's Principle","def":"System at equilibrium shifts to counteract any stress applied to it."},{"term":"Reaction quotient (Q)","def":"Same expression as K but using current concentrations; predicts direction of shift."},{"term":"Ksp","def":"Solubility product constant — equilibrium constant for dissolution of a sparingly soluble salt."},{"term":"Common ion effect","def":"Decreased solubility of a salt when a common ion is added from another source."}]},"acid-base":{"tag":"Chapter 5 · Chemistry 1","title":"Acid-Base Chemistry & Buffers","overview":"Acid-base chemistry governs drug ionization, absorption, and excretion. Buffer systems maintain physiological pH — critical for drug formulation and clinical pharmacology.","sections":[{"title":"Acid-Base Definitions","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Theory\u003c/th>\u003cth>Acid\u003c/th>\u003cth>Base\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Arrhenius\u003c/td>\u003ctd>Produces H⁺ in water\u003c/td>\u003ctd>Produces OH⁻ in water\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Brønsted-Lowry\u003c/td>\u003ctd>Proton (H⁺) donor\u003c/td>\u003ctd>Proton (H⁺) acceptor\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Lewis\u003c/td>\u003ctd>Electron pair acceptor\u003c/td>\u003ctd>Electron pair donor\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003ch4>Strong vs. Weak Acids/Bases\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Strong acids:\u003c/strong> HCl, HBr, HI, HNO₃, H₂SO₄, HClO₄ → completely dissociate\u003c/li>\n            \u003cli>\u003cstrong>Strong bases:\u003c/strong> Group 1A and 2A hydroxides (NaOH, KOH, Ca(OH)₂) → completely dissociate\u003c/li>\n            \u003cli>\u003cstrong>Weak acids:\u003c/strong> Partially dissociate (e.g., acetic acid, aspirin, carbonic acid)\u003c/li>\n            \u003cli>\u003cstrong>Weak bases:\u003c/strong> Partially dissociate (e.g., ammonia, amines like drugs)\u003c/li>\n          \u003c/ul>\n        "},{"title":"pH, pOH, and Ka/Kb","content":"\n          \u003cdiv class=\"formula-block\">pH = −log[H⁺]\u003c/div>\n          \u003cdiv class=\"formula-block\">pOH = −log[OH⁻]\u003c/div>\n          \u003cdiv class=\"formula-block\">pH + pOH = 14 (at 25°C)\u003c/div>\n          \u003cdiv class=\"formula-block\">Ka = [H⁺][A⁻] / [HA]\u003c/div>\n          \u003cdiv class=\"formula-block\">pKa = −log(Ka)\u003c/div>\n          \u003cul>\n            \u003cli>Strong acid: Ka very large, pKa \u003c\u003c 0\u003c/li>\n            \u003cli>Weak acid (e.g., acetic acid Ka = 1.8×10⁻⁵, pKa = 4.74)\u003c/li>\n            \u003cli>Smaller pKa → stronger acid\u003c/li>\n          \u003c/ul>\n          \u003ch4>pH of Solutions\u003c/h4>\n          \u003cul>\n            \u003cli>Strong acid: pH = −log[HA] (since fully dissociated)\u003c/li>\n            \u003cli>Weak acid: pH = ½(pKa − log Ci) [approximation]\u003c/li>\n            \u003cli>Strong base: pOH = −log[Base], then pH = 14 − pOH\u003c/li>\n          \u003c/ul>\n        "},{"title":"Henderson-Hasselbalch Equation","content":"\n          \u003cp>Relates pH, pKa, and ratio of conjugate base to acid:\u003c/p>\n          \u003cdiv class=\"formula-block\">pH = pKa + log([A⁻]/[HA])\u003c/div>\n          \u003cp>For bases: pH = pKa + log([B]/[BH⁺])\u003c/p>\n          \u003ch4>Applications in Pharmacy\u003c/h4>\n          \u003cul>\n            \u003cli>\u003cstrong>Drug ionization:\u003c/strong> % ionization determines membrane permeability and absorption\u003c/li>\n            \u003cli>\u003cstrong>Urine pH manipulation:\u003c/strong> Alkalinize urine to trap weak acids (treat aspirin overdose); acidify urine to trap weak bases\u003c/li>\n            \u003cli>\u003cstrong>Buffer formulation:\u003c/strong> Choose buffer with pKa near desired pH (capacity is highest at pH = pKa)\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"info-box key\">\n            \u003cstrong>Example — Aspirin (pKa = 3.5):\u003c/strong>\u003cbr>\n            In stomach (pH 1.5): pH \u003c pKa → mostly un-ionized → absorbed across gastric mucosa\u003cbr>\n            In blood (pH 7.4): pH >> pKa → mostly ionized → distributed in blood, not easily back-diffused\u003cbr>\n            In alkaline urine (pH 8): mostly ionized → trapped → rapid excretion\n          \u003c/div>\n        "},{"title":"Buffer Systems","content":"\n          \u003cp>Buffers resist pH changes when acid or base is added. Contain a weak acid and its conjugate base (or weak base and its conjugate acid).\u003c/p>\n          \u003cp>\u003cstrong>Buffer capacity is maximum when pH = pKa (equal concentrations of acid and conjugate base).\u003c/strong>\u003c/p>\n          \u003ch4>Physiological Buffers\u003c/h4>\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Buffer System\u003c/th>\u003cth>pKa\u003c/th>\u003cth>Location\u003c/th>\u003cth>Components\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Carbonate/Bicarbonate\u003c/td>\u003ctd>6.1\u003c/td>\u003ctd>Blood (pH 7.4)\u003c/td>\u003ctd>CO₂/H₂CO₃ and HCO₃⁻\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Phosphate\u003c/td>\u003ctd>7.2\u003c/td>\u003ctd>Intracellular, urine\u003c/td>\u003ctd>H₂PO₄⁻ / HPO₄²⁻\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Protein/Histidine\u003c/td>\u003ctd>~6–8\u003c/td>\u003ctd>Blood, intracellular\u003c/td>\u003ctd>Hemoglobin, albumin\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv class=\"info-box warning\">\u003cstrong>Blood pH regulation:\u003c/strong> Normal blood pH = 7.35–7.45. Acidosis (pH \u003c 7.35): respiratory (↑CO₂) or metabolic (↓HCO₃⁻). Alkalosis (pH > 7.45): respiratory (↓CO₂) or metabolic (↑HCO₃⁻). Changes affect drug ionization and distribution.\u003c/div>\n        "}],"keyTerms":[{"term":"pKa","def":"Negative logarithm of acid dissociation constant; lower pKa = stronger acid."},{"term":"Henderson-Hasselbalch","def":"pH = pKa + log([A⁻]/[HA]); used to calculate drug ionization at a given pH."},{"term":"Buffer","def":"Solution that resists pH change; contains weak acid + conjugate base or weak base + conjugate acid."},{"term":"Conjugate acid-base pair","def":"Acid and the base formed when it donates a proton; e.g., acetic acid / acetate."},{"term":"Ion trapping","def":"Ionized drugs become trapped in a compartment (e.g., alkaline urine traps weak acids). Used in poisoning management."}]},"gas-laws":{"tag":"Chapter 6 · Chemistry 1","title":"Gases & Gas Laws","overview":"Gas laws describe behavior of anesthetic gases, respiratory gases, and aerosol drug delivery. Essential for understanding pulmonary drug delivery and anesthesia.","sections":[{"title":"Ideal Gas Laws","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Law\u003c/th>\u003cth>Relationship\u003c/th>\u003cth>Formula\u003c/th>\u003cth>Constant held\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Boyle's Law\u003c/td>\u003ctd>P ∝ 1/V\u003c/td>\u003ctd>P₁V₁ = P₂V₂\u003c/td>\u003ctd>T, n\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Charles's Law\u003c/td>\u003ctd>V ∝ T\u003c/td>\u003ctd>V₁/T₁ = V₂/T₂\u003c/td>\u003ctd>P, n\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Gay-Lussac's Law\u003c/td>\u003ctd>P ∝ T\u003c/td>\u003ctd>P₁/T₁ = P₂/T₂\u003c/td>\u003ctd>V, n\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Avogadro's Law\u003c/td>\u003ctd>V ∝ n\u003c/td>\u003ctd>V₁/n₁ = V₂/n₂\u003c/td>\u003ctd>P, T\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Ideal Gas Law\u003c/td>\u003ctd>PV = nRT\u003c/td>\u003ctd>PV = nRT\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cp>R = 0.08206 L·atm/(mol·K) = 8.314 J/(mol·K)\u003c/p>\n          \u003cdiv class=\"info-box key\">\u003cstrong>Note:\u003c/strong> T must always be in Kelvin (K = °C + 273.15)\u003c/div>\n        "},{"title":"Dalton's Law of Partial Pressures","content":"\n          \u003cdiv class=\"formula-block\">P_total = P₁ + P₂ + P₃ + ...\u003c/div>\n          \u003cp>Each gas in a mixture exerts a pressure independent of others. Partial pressure of gas A: P_A = X_A × P_total (where X_A = mole fraction of A).\u003c/p>\n          \u003cdiv class=\"info-box tip\">\u003cstrong>Respiratory gases:\u003c/strong> At sea level (P_total ≈ 760 mmHg): PO₂ ≈ 160 mmHg (21% O₂), PCO₂ ≈ 0.3 mmHg. Alveolar PO₂ ≈ 100 mmHg. Gas exchange driven by partial pressure gradients.\u003c/div>\n        "},{"title":"Real Gases & Deviations","content":"\n          \u003cp>Real gases deviate from ideal behavior at high pressure and low temperature (gas molecules have volume and intermolecular forces).\u003c/p>\n          \u003cdiv class=\"formula-block\">van der Waals equation: (P + a/V²)(V − b) = nRT\u003c/div>\n          \u003cp>Where a = correction for intermolecular attractions, b = correction for molecular volume.\u003c/p>\n          \u003ch4>Pharmacy Applications\u003c/h4>\n          \u003cul>\n            \u003cli>Aerosol inhalers use pressurized gas (CFC-free propellants) — gas laws govern spray behavior\u003c/li>\n            \u003cli>Medical gas cylinders (O₂, N₂O, CO₂) — PV = nRT used to calculate remaining amount\u003c/li>\n            \u003cli>Henry's Law: amount of gas dissolved ∝ partial pressure (explains anesthesia uptake, decompression sickness)\u003c/li>\n          \u003c/ul>\n        "}],"keyTerms":[{"term":"Ideal gas","def":"Theoretical gas with no intermolecular forces and negligible molecular volume; obeys PV = nRT."},{"term":"Partial pressure","def":"Pressure exerted by one gas component in a mixture (Dalton's Law)."},{"term":"STP","def":"Standard temperature and pressure: 0°C (273.15 K) and 1 atm; 1 mol ideal gas = 22.4 L."},{"term":"Henry's Law","def":"Concentration of dissolved gas ∝ its partial pressure above the solution. C = k·P."},{"term":"Mole fraction","def":"Fraction of total moles contributed by one component; X_A = n_A / n_total."}]},"solutions":{"tag":"Chapter 7 · Chemistry 1","title":"Solutions & Concentration","overview":"Pharmaceutical dosage forms are solutions or involve dissolution. Understanding concentration units, colligative properties, and solubility is essential for formulation.","sections":[{"title":"Concentration Units","content":"\n          \u003ctable class=\"styled-table\">\n            \u003cthead>\u003ctr>\u003cth>Unit\u003c/th>\u003cth>Formula\u003c/th>\u003cth>Usage\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Molarity (M)\u003c/td>\u003ctd>mol solute / L solution\u003c/td>\u003ctd>Most common in chemistry; temperature-dependent\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Molality (m)\u003c/td>\u003ctd>mol solute / kg solvent\u003c/td>\u003ctd>Colligative properties; temperature-independent\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Mole fraction (χ)\u003c/td>\u003ctd>mol A / total mol\u003c/td>\u003ctd>Raoult's Law, vapor pressure\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Mass percent (% w/w)\u003c/td>\u003ctd>(g solute / g solution) × 100\u003c/td>\u003ctd>Pharmaceutical solids\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Volume percent (% v/v)\u003c/td>\u003ctd>(mL solute / mL solution) × 100\u003c/td>\u003ctd>Alcohol solutions\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Normality (N)\u003c/td>\u003ctd>equivalents / L\u003c/td>\u003ctd>Acid-base titrations\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        "},{"title":"Colligative Properties","content":"\n          \u003cp>Colligative properties depen
